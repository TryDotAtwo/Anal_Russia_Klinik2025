const ROWS=[{"block_id":"block:5b612e300698ff16","document_id":"897_1","document_title":"Острые отравления неопиоидными анальгезирующими, жаропонижающими и противоревматическими средствами","document_link":"https://cr.minzdrav.gov.ru/view-cr/897_1","context_html":"массы тела. Как правило, интоксикации протекают доброкачественно, сопровождаются гастроэнтеритом, вялостью, заторможенностью, гепатопатией. Необходимо контролировать свободный гемоглобин у детей младшего возраста, у которых возможно развитие гемолиза. Несмотря на большую терапевтическую широту, описаны тяжелые отравления ибупрофеном**, что, возможно, связано с широким его употреблением. Интоксикация проявляется гастроэнтеритом и быстрым, в течение 2 часов, поражением ЦНС вплоть до развития комы. У детей могут быть судороги. Отмечается тенденция к гипотензии, брадикардии, метаболические расстройства проявляются ацидозом и гиперкалиемией. Описаны случаи ОПН. Лечение симптоматическое, антидотов нет. Другими представителями этой группы являются напроксен, его натриевая соль, флурбипрофен, кетопрофен**. Клиника передозировки и отравления сходна с ибупрофеном**. 25 1.6.13. Токсикология пиразолонов В настоящее время клинически значимые острые отравления НПВП встречаются крайне редко. Метамизол натрия обладают слабым противовоспалительным действием, но выраженным противоболевым и жаропонижающим эффектом. Метамизол натрия входит в состав многих комбинированных форм препаратов. Метамизол натрия быстро и практически полностью всасывается. Максимальная концентрация в крови развивается через 1-2 часа. Период полувыведения – 2,5 часа. Часто метамизол натрия является одним из составляющих при отравлениях смесью препаратов. Для нетяжелых отравлений характерны диспептические явления, умеренная заторможенность, токсическая гепатопатия. Особенностью действия препаратов этой группы является возможная задержка жидкости, связанная с влиянием на активность АДГ, в связи с чем у взрослых может быть артериальная гипертензия. Пиразолоны могут приводить к снижению активности петлевых диуретиков. Это необходимо помнить при назначении инфузионной терапии. Особенно следует обращать на это внимание при лечении больных с застойной сердечной недостаточностью. При приеме высоких токсических доз возможно развитие тяжелой интоксикации с угнетением сознания до уровня комы. Пиразолоны в высоких дозах, особенно на фоне отягощенного анамнеза, обладают кардиотоксичностью, приводя к нарушению проводимости и снижению сократительной способности миокарда. Потенциально вероятна гемолитическая анемия. Развитие гранулоцитопении вплоть до агранулоцитоза при острых отравлениях практически не встречается. Моча при отравлении пиразолонами окрашена в красный цвет различной интенсивности. Токсическая доза для <span class=\"block-mark word-mark\">метамизол<\/span>а натрия 100-200 мг/кг массы тела. Описаны случаи тяжелых интоксикаций фенилбутазоном при приеме 200 мг/кг массы тела с развитием судорог, комы с острой дыхательной недостаточностью. В качестве осложнений наблюдали случаи ОПН. Специфической антидотной терапии отравлений пиразолонами нет. Необходимы поддержание жизненно важных функций организма, коррекция ацидоза, который развивается в тяжелых вариантах течения, нарушений водно-электролитного баланса под контролем диуреза. 1.6.14. Отравления коксибами Представители этой группы – целекоксиб, нимесулид, – являются НПВП нового поколения, избирательными ингибиторами ЦОГ-2. Следовательно, препараты не влияют на почечный кровоток, обладают минимальной гастротоксичностью, а также не снижают агрегацию тромбоцитов, поскольку не нарушают синтез тромбоксана. Целекоксиб. Препарат не является кислотой. Хорошо всасывается в ЖКТ, максимум концентрации в крови развивается через 3 часа, прием пищи замедляет скорость резорбции. Метаболизируется в печени, Т05 –7-10 ч., при заболеваниях печени может увеличиваться. 26 Нимесулид. Быстро и полностью всасывается в ЖКТ, Максимальная концентрация в крови наблюдается через 1,5-3 часа после приема, связь с белками 99%. Объем распределения препарата 0,2-0,4 л/кг. В неизменном виде выделяется в ничтожных количествах, подвергается гидроксилированию и в виде метаболитов преимущественно, на 70% выводится с мочой, и только на 30% – кишечником. При отравлении нимесулидом наблюдаются достаточно часто центральные эффекты – заторможенность, сонливость. Отмечено также кардиотоксическое действие – замедление сердечной проводимости. 1.6.15. Отравления неклассифицированными НПВП Бензидамин хорошо всасывается в ЖКТ, а также хорошо резорбируется через кожу и слизистые. Используется в основном для местного применения. При пероральном применении выводится почками и кишечником в виде метаболитов. ПЭ такие же, как и у других НПВП, при передозировках наблюдаются центральные расстройства в виде нарушений восприятия, зрительных галлюцинаций. 27 2. ДИАГНОСТИКА ЗАБОЛЕВАНИЯ ИЛИ СОСТОЯНИЯ (ГРУППЫ ЗАБОЛЕВАНИЙ ИЛИ СОСТОЯНИЙ), МЕДИЦИНСКИЕ ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ МЕТОДОВ ДИАГНОСТИКИ При диагностике необходимо опираться на следующие диагностические критерии:  очевидность употребления лекарственных препаратов из группы НПВП;  наличие симптомов и признаков отравления НПВП, опасным для жизни и здоровья пациентов. 2.1. Жалобы и анамнез При тяжелых формах острых отравлений НПВП жалобы могут практическ","terms":[{"source":"blacklist","term_id":"blacklist:f999e9e4fb26","canonical":"Анальгин","search_word":"Метамизол","host_word":"метамизола","inside_word":true},{"source":"blacklist","term_id":"blacklist:fc7c02eeb9a7","canonical":"Метамизол","search_word":"Метамизол","host_word":"метамизола","inside_word":true},{"source":"mediq","term_id":"mediq:b95e243a5fcf","canonical":"ИЗ","search_word":"ИЗ","host_word":"метамизола","inside_word":true}],"cases":[{"case_id":"case:deb2b3f68ce2bb60","span":{"type":"match","case_id":"case:deb2b3f68ce2bb60","span_start":2500,"span_end":2509,"text":"метамизол"},"terms":[{"source":"blacklist","term_id":"blacklist:f999e9e4fb26","canonical":"Анальгин","search_word":"Метамизол","host_word":"метамизола","inside_word":true},{"source":"blacklist","term_id":"blacklist:fc7c02eeb9a7","canonical":"Метамизол","search_word":"Метамизол","host_word":"метамизола","inside_word":true}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «метамизола» здесь входит в раздел токсикологии/отравлений и описывает вещество в контексте интоксикации, а не рекомендацию к применению; это не литература и не противопоказание.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:0018582be33236f7","document_id":"897_1","document_title":"Острые отравления неопиоидными анальгезирующими, жаропонижающими и противоревматическими средствами","document_link":"https://cr.minzdrav.gov.ru/view-cr/897_1","context_html":"неза (гепатит В, С), печеночную недостаточность другой этиологии, при отсутствии положительной динамики на фоне проводимой терапии рекомендовано более углублен36 ное исследование, в том числе проведение судебно-химической и химико-токсикологической экспертизы (исследования) содержания в крови, моче и внутренних органах алкоголя, наркотических средств и психотропных веществ, отравляющих веществ, лекарственных средств с целью исключить наличие сочетанного приема веществ влияющих на функции кишечника, печени и почек или другого соматического или инфекционного заболевания [20, 43]. УДД – 5, УУР – С. 37 3. ЛЕЧЕНИЕ, ВКЛЮЧАЯ МЕДИКАМЕНТОЗНУЮ И НЕМЕДИКАМЕНТОЗНУЮ ТЕРАПИИ, ДИЕТОТЕРАПИЮ, ОБЕЗБОЛИВАНИЕ, МЕДИЦИНСКИЕ ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ МЕТОДОВ ЛЕЧЕНИЯ 3.1. Оказание скорой медицинской помощи вне медицинской организации  Рекомендовано всем пострадавшим с отравлением НПВП при оказании скорой медицинской помощи нормализовать функцию внешнего дыхания и восстановить или поддержать адекватную гемодинамику: назначение, проведение лечения и контроля эффективности, безопасности проводимых медицинских манипуляций, оценка состояния пациента и дисфункций органов и систем организма [20, 21, 43]. УДД – 5, УУР – С.  Рекомендуется всем пациентам с отравлением НПВП при оказании скорой медицинской помощи с респираторными нарушениями начинать лечение с восстановления адекватной легочной вентиляции в зависимости от форм нарушения дыхания: установка воздуховода, ингаляционное введение лекарственных препаратов и кислорода, интубация трахеи, ИВЛ [43]. УДД – 5, УУР – С.  Рекомендуется всем пострадавшим с отравлением НПВП при оказании скорой медицинской помощи после введения лекарственных средств оценивать состояние пациента на предмет развития анафилаксии и анафилактического шока с выполнением в случае их возникновения всех необходимых медицинских техник и комплекса введения лекарственных препаратов [35]. УДД – 5, УУР – С.  Рекомендовано всем больным с острыми отравлениями НПВП при оказании скорой медицинской помощи при тяжелых гемодинамических расстройствах проведение противошоковой терапии: введение кровезаменителей и препаратов плазмы крови и ирригационных растворов [21, 43]. УДД – 5, УУР – С.  Рекомендуется пациентам с отравлением НПВП при оказании скорой медицинской помощи после купирования нарушения транспорта кислорода и связанной с этим гипоксии, пациентам старше 1 года, в качестве антигипоксантного и дезинтоксикационного средства, применение инфузии раствора <span class=\"block-mark word-mark\">меглюмин<\/span><span class=\"block-mark word-mark\">а натрия сукцинат<\/span>а**. Взрослым – 1-4,5 мл/мин, курс терапии до 11 дней. Детям старше года – 6-10 мл/кг/сут., со скоростью 3-4 мл/мин, курс до 11 дней [48]. УДД – 5, УУР – С. 38 Комментарий: показанием к назначению являются инфузионная детоксикационная терапия при острых отравлениях. Взрослым назначают в составе инфузионной терапии 1,5% раствор по 400 мл 2 раза в сутки, (детям по 200 мл). Лечение курсовое: 3-610 дней [48].  Рекомендуется всем пациентам с отравлением НПВП при оказании скорой медицинской помощи с целью удаления яда из желудка в ранние сроки промывание желудка (ПЖ), как при клинической симптоматике острого отравления, так и при подозрении на острое отравление, когда в анамнезе заболевания имеется факт употребления препарата [1, 20, 21]. УДД – 5, УУР – С.  Рекомендуется всем пациентам с отравлением НПВП при оказании скорой медицинской помощи с целью снижения уровня экзотоксикоза после промывания желудка проведение энтеросорбции кишечными адсорбентами (активированный уголь) с фармакологической стимуляцией желудочно-кишечного тракта путем парентерального введения лекарственного препарата из группы А03F Стимуляторы моторики желудочно-кишечного тракта (Метоклопрамид**) [1, 20, 21].  [1, 20, 21, 48]. УДД – 5, УУР – С. Комментарии: способ применения #активированного угля – 1 таблетка 250 мг; используют взвесь таблеток – 25-40 г, разведенные в 50-100 мл воды в виде «кашицы». После одномоментного ведения указанной дозы вводят по 20-40 г с интервалом 2-4 часа в течение 12 часов [4]. После промывания желудка детям до 2 лет доза составляет – 0,5-1 г; до 3 лет – до 10 г; 3-7 лет – 10-15 г; 7-10 лет – 20-25 г; старше 10 лет – 30-40 г однократно [37]. Детям старше трех лет препарат назначают в среднем из расчета 0,05 г/кг массы тела. Максимальная разовая доза – до 0,2 г/кг массы тела. [1, 4, 8]. Может использоваться в конце зондового промывания желудка в дозе 50-60 г (0,5-1,0 г на кг массы тела) [54]. Раствор для внутривенного и внутримышечного введения для внутривенного и внутримышечного введения лекарственного препарата А03FА01 Метоклопрамид** применяется взрослым 10-20 мг с кратностью введения указанной дозы до 3 раз в сутки (максимальная суточная доза 60 мг); детям старше 6 лет до 5 мг 1 – 3 раза в сутки [98]  Рекомендуется у пациентов с отравлением НПВП при оказании скорой медицинской помощи проводить лечение, направленное на уменьшение рвоты: парентеральное введение лекарственного препарата из группы стимуляторов моторики желудочно-кишечного тракта, #Метоклопрамид*","terms":[{"source":"blacklist","term_id":"blacklist:3040f262b3a8","canonical":"Меглюмин","search_word":"Меглюмин","host_word":"меглюмина","inside_word":true},{"source":"blacklist","term_id":"blacklist:253dd4343aa5","canonical":"Реамберин","search_word":"Меглюмина натрия сукцинат","host_word":"меглюмина натрия сукцинат","inside_word":false}],"cases":[{"case_id":"case:af8ed62508c3426c","span":{"type":"match","case_id":"case:af8ed62508c3426c","span_start":2500,"span_end":2508,"text":"меглюмин"},"terms":[{"source":"blacklist","term_id":"blacklist:3040f262b3a8","canonical":"Меглюмин","search_word":"Меглюмин","host_word":"меглюмина","inside_word":true}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «меглюмина» входит в состав рекомендованного раствора меглюмина натрия сукцината, который прямо назначен пациентам как антигипоксантное и дезинтоксикационное средство.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}},{"case_id":"case:29d41a062aba7db0","span":{"type":"match","case_id":"case:29d41a062aba7db0","span_start":2500,"span_end":2525,"text":"меглюмина натрия сукцинат"},"terms":[{"source":"blacklist","term_id":"blacklist:253dd4343aa5","canonical":"Реамберин","search_word":"Меглюмина натрия сукцинат","host_word":"меглюмина натрия сукцинат","inside_word":false}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"«меглюмина натрия сукцинат» — прямо рекомендованная инфузия для пациентов с отравлением НПВП; это терапевтическое назначение в тексте.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}}]},{"block_id":"block:b2f1486e2e678fc0","document_id":"897_1","document_title":"Острые отравления неопиоидными анальгезирующими, жаропонижающими и противоревматическими средствами","document_link":"https://cr.minzdrav.gov.ru/view-cr/897_1","context_html":"ния и введение растворов. Для выполнения лаважа пациенту через нос вводят в желудок зонд кишечный двухканальный силиконовый для декомпрессии и энтерального питания. Принципы введения: раствор, подогретый до 40 °С, вводится со скоростью 100 мл/мин. Через 10-20 мин по аспирационному каналу оттекают промывные воды с кишечным содержимым. Через 0,5-1,5 ч по дренажу из прямой кишки появляется ее содержимое, одновременно отмечается усиление диуреза. Для очищения кишечника требуется введение 50 мл солевого раствора на 1 кг массы тела пациента (всего 4,55 л) [64].  Рекомендовано всем взрослым пациентам с отравлением НПВП с целью усиления естественной детоксикации (при отсутствии противопоказаний): пероральное введение лекарственных препаратов группы осмотические слабительные средства [20, 21]. УДД – 5, УУР – С.  Рекомендуется пациентам с отравлением НПВП при тяжелых гемодинамических расстройствах проведение противошоковой терапии: кровезаменители и препараты плазмы крови и ирригационные растворы внутривенно, растворы, влияющие на водно-электролитный баланс (B05 Кровезаменители и перфузионные растворы) [37, 64, 43]. УДД – 5, УУР – С.  Рекомендуется всем пациентам с отравлением НПВП, сопровождающимся нарушениями водно-электролитного баланса, коррекцию нарушений проводить растворами, влияющими на водно-электролитный баланс, кровезаменителями и препаратами плазмы крови и ирригационными растворами под контролем пульса, измерении частоты сердцебиения, измерении артериального давления на периферических артериях, измерении центрального венозного давления, оценки гематокрита, общего гемоглобина крови, исследовании уровня калия крови, исследовании уровня натрия крови, исследовании уровня кальция крови, а также определении объема мочи [20, 21, 43, 64, 65]. УДД – 5, УУР – С. 42 Комментарий. Подход к инфузионной терапии должен быть индивидуальным. Объем и состав инфузионной программы зависит от возраста, состояния пациента, наличия сопутствующей патологии и наличия осложнений. При отравлении салицилатами имеется высокий риск развития волемических расстройств, инфузионная терапия должна проводиться под строгим контролем волемии [20, 21, 43, 64, 65].  Рекомендуется всем пациентам с отравлением НПВП, после купирования нарушения транспорта кислорода и связанной с этим гипоксии, пациентам старше 1 года, в качестве антигипоксантного и дезинтоксикационного средства, применение инфузии раствора группы B05BB Растворы, влияющие на водно-электролитный баланс с действующим веществом – <span class=\"block-mark word-mark\">меглюмин<\/span><span class=\"block-mark word-mark\">а натрия сукцинат<\/span>** [35, 43, 66, 67]. УДД – 5, УУР – С. Комментарии. Показанием к назначению является необходимость проведения инфузионной детоксикационной и антигипоксантной терапии при острых отравлениях (можно использовать как инфузионную среду при проведении форсированного диуреза). Взрослым назначают внутривенно со скоростью 1-4,5 мл/мин (до 90 капель/мин). Средняя суточная доза у взрослых – 10 мл/кг, у детей с 1 года – 6-10 мл/кг/сут., скорость введения – 3-4 мл/мин. Продолжительность использования до 11 дней [66, 67].  Рекомендуется всем пациентам с отравлением НПВП с целью купирования метаболического ацидоза, ощелачивания мочи путем в/в инфузии натрия гидрокарбоната** [65, 68, 70]. УДД – 4, УУР – С. Комментарии. При отравлении салицилатами необходимо по возможности быстрее устранить ацидоз, т.к. он способствует проникновению производных салициловой кислоты (N02BA Салициловая кислота и ее производные) в ткани ЦНС. При рН ниже 7,2 доза натрия гидрокарбоната** составляет 1-2 мэкв на кг массы тела, который вводится в течение 1-2 ч. При рН выше 7,25 введение натрия гидрокарбоната** проводится с меньшей скоростью. Ощелачивание мочи способствует резкому увеличению элиминации производных салициловой кислоты (N02BA Салициловая кислота и ее производные) почками, поскольку создает ограничение их обратной реабсорбции. Необходимо помнить о потере электролитов, прежде всего калия, и их восполнении. Устранение гипокалиемии необходимо для ощелачивания мочи [68-70].  Рекомендовано пациентам с отравлением НПВП при наличии медицинских показаний проведение диализно-фильтрационных методов детоксикации – гемодиализ, гемодиафильтрация [52, 20, 21, 71]. УДД – 5, УУР – С. Комментарии. При отравлении салицилатами эффективно проведение гемодиализа, показаниями к этому методу лечения являются: изменение уровня сознания, психомоторное возбуждение, судороги, ацидоз (рН крови &lt; 7,2), отек мозга, отек легких, 43 ухудшение состояния пациента, несмотря на проводимую терапию, наличии ОПП или хронического заболевания почек, высокие концентрации производных салициловой кислоты (N02BA Салициловая кислота и ее производные) в крови при ХТИ. Во время проведения диализа необходимо прекратить введение натрия гидрокарбоната**. Поскольку в нашей стране возможность количественного определения в крови производных салициловой кислоты (N02BA Салициловая кислота и ее производные) практически отсутствует, при назначении гемодиализа необходимо ориентироваться на анамнестические данные и выраженность клинической ка","terms":[{"source":"blacklist","term_id":"blacklist:3040f262b3a8","canonical":"Меглюмин","search_word":"Меглюмин","host_word":"меглюмина","inside_word":true},{"source":"blacklist","term_id":"blacklist:253dd4343aa5","canonical":"Реамберин","search_word":"Меглюмина натрия сукцинат","host_word":"меглюмина натрия сукцинат","inside_word":false}],"cases":[{"case_id":"case:cd944106c3a7765c","span":{"type":"match","case_id":"case:cd944106c3a7765c","span_start":2500,"span_end":2508,"text":"меглюмин"},"terms":[{"source":"blacklist","term_id":"blacklist:3040f262b3a8","canonical":"Меглюмин","search_word":"Меглюмин","host_word":"меглюмина","inside_word":true}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «меглюмина» входит в рекомендованную инфузию раствора с действующим веществом меглюмина натрия сукцинат для пациентов с отравлением НПВП; это часть прямой рекомендации.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}},{"case_id":"case:abd6a5f9064fe766","span":{"type":"match","case_id":"case:abd6a5f9064fe766","span_start":2500,"span_end":2525,"text":"меглюмина натрия сукцинат"},"terms":[{"source":"blacklist","term_id":"blacklist:253dd4343aa5","canonical":"Реамберин","search_word":"Меглюмина натрия сукцинат","host_word":"меглюмина натрия сукцинат","inside_word":false}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «меглюмина натрия сукцинат» само является действующим веществом в прямо рекомендованной инфузии при отравлении НПВП.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}}]},{"block_id":"block:b49757513ece7ef5","document_id":"897_1","document_title":"Острые отравления неопиоидными анальгезирующими, жаропонижающими и противоревматическими средствами","document_link":"https://cr.minzdrav.gov.ru/view-cr/897_1","context_html":"44  Рекомендуется при отравлении НПВП средней и тяжелой степени с целью профилактики развития острых язв ЖКТ назначение лекарственных препаратов группы А02ВС – Ингибиторы протонного насоса - Омепразол** [72]. УДД – 5, УУР – С. Комментарии: в зависимости от клинической необходимости способ введения лекарственного препарата подбирается индивидуально. Взрослым рекомендуется назначать внутривенно 40 мг в сутки. Инфузионный раствор препарата вводится внутривенно капельно в течение 20-30 минут. Детям до 18 лет использование противопоказано [72].  Рекомендуется при отравлении НПВП с развитием нарушений функции желудочно-кишечного тракта использование симптоматической терапии [20, 21]. УДД – 5, УУР – С. 3.2.3. Лечение нарушений дыхания  Рекомендуется у пациентов с отравлением НПВП, осложненными развитием острой дыхательной недостаточности, проведение терапии, направленной на адекватное лечение основного и/или сопутствующего заболеваний, приведших к возникновению острой дыхательной недостаточности; восстановление и поддержание проходимости дыхательных путей (бронхоскопия, установка воздуховода, интубация трахеи и искусственная вентиляция легких); обеспечение адекватного газообмена (различные варианты респираторной поддержки, включая проведение искусственной вентиляции легких) [20, 21, 43]. УДД – 5, УУР – С. Комментарии: основной целью респираторной поддержки при вентиляционной ОДН является протезирование утраченного или резко ослабленного собственного дыхания, вследствие нарушения функции дыхательного центра и/или расстройства деятельности дыхательной мускулатуры (параличи, парезы). Нарушение функции дыхательного центра на фоне отека головного мозга и других патологических состояниях приводит к угнетению или ослаблению чувствительности центральных хеморецепторов, что вызывает гиповентиляцию, которая сопровождается гиперкапнией, гипоксемией. 3.2.4. Лечение нарушений гемодинамики  Рекомендуется у пациентов с отравлением НПВП, при тяжелых гемодинамических расстройствах проведение противошоковой терапии: растворами, влияющими на водно-электролитный баланс, кровезаменителями и препаратами плазмы крови и ирригационными растворами (B05 Кровезаменители и перфузионные растворы) [21, 43]. УДД – 5, УУР – С. 45  Рекомендуется, после купирования нарушения дыхания и связанной с этим гипоксии, пациентам старше 1 года применение в качестве антигипоксантного и дезинтоксикационного средства препаратов янтарной кислоты – В05ВВ Растворы, влияющие на водно-электролитный баланс – М<span class=\"block-mark word-mark\">еглюмина<\/span><span class=\"block-mark word-mark\"> натрия сукцинат*<\/span>* [21, 35, 48, 73]. УДД – 5, УУР – С. Комментарии: показанием к назначению является необходимость проведения инфузионной детоксикационной и антигипоксантной терапии при острых отравлениях (можно использовать как инфузионную среду при проведении форсированного диуреза). Взрослым назначают внутривенно со скоростью 1-4,5 мл/мин (до 90 капель/мин). Средняя суточная доза – 10 мл/кг. и. Используется у детей с 1 года из расчета 6–10 мл/кг/сут. со скоростью 3-4 мл/мин. Продолжительность использования до 11 дней [67, 73].  Рекомендуется при стойкой гипотонии, рефрактерной к инфузионной терапии использование инотропных и вазопрессорных средств (С01СА – адренергические и дофаминергические средства), внутривенно капельно (микроболюсно) на растворах электролитов (В05ХА Растворы электролитов – Натрия хлорид**) [20, 21, 43]. УДД – 5, УУР – С. 3.2.5. Коррекция нарушений гомеостаза  Рекомендуется при отравлении НПВП, сопровождающихся нарушениями водно-электролитного баланса, проводить коррекцию нарушений растворами, влияющими на водно-электролитный баланс, кровезаменителями и препаратами плазмы крови и ирригационными растворами (B05 Кровезаменители и перфузионные растворы) под контролем пульса, измерение частоты сердцебиения, измерение артериального давления на периферических артериях, оценка гематокрита, исследование уровня общего гемоглобина в крови, исследование уровня калия в крови, исследование уровня натрия в крови, исследование уровня кальция в крови и определения объема мочи [21, 43, 74]. УДД – 5, УУР – С.  Рекомендуется в случае развития метаболического ацидоза парентеральное применение лекарственного препарата фармакологической группы B05CB Солевые растворы – раствор Натрия гидрокарбоната** 4% или 8,4%, внутривенно, капельно. Доза инфузии или объем вводимого лекарственного препарата – натрия гидрокарбонат** определяется в зависимости от уровня ацидоза [40, 68-70]. УДД – 5, УУР – С. Комментарии. При отравлении салицилатами необходимо по возможности быстрее устранить ацидоз, т.к. он способствует проникновению производных салициловой 46 кислоты (N02BA Салициловая кислота и ее производные) в ткани ЦНС. При рН ниже 7,2 доза #натрия гидрокарбоната** составляет 1-2 мэкв на кг массы тела, который вводится в течение 1-2 часов. При рН выше 7,25 введение препарата проводится с меньшей скоростью [36, 43, 65]. Ощелачивание мочи способствует резкому увеличению элиминации производных салициловой кислоты (N02BA Салициловая (N02BA Салициловая кислота и ее производные) почками, поскольку создает ограничение их обратной реабсорбции. Необходимо помнить о потере электролитов, прежде всего калия, и их восполнении. Устранение гипокалиемии необходимо для ощелачивания мочи [68-70].  Рекомендуется при отравлении НПВП с целью нормализации энергетического обмена использовать парентеральное введение препаратов группы В05ВВ –Растворы, влияющие на водно-электролитный баланс <span class=\"block-mark word-mark\">Меглюмин<\/span><span class=\"block-mark word-mark\">а натрия сукцинат<\/span>** [21, 35, 67, 73]. УДД – 5, УУР – С. Комментарии: показанием к назначению является необходимость проведения инфузионной детоксикационной и антигипоксантной терапии при острых отравлениях. Взрослым назначают внутривенно со скоростью 1-4,5 мл/мин (до 90 капель/мин). Средняя суточная доза – 10 мл/кг. и. Используется у детей с 1 года из расчета 6-10 мл/кг/сут со скоростью 3-4 мл/мин. Продолжительность использования до 11 дней [67, 73].  Рекомендуется при отравлении НПВП с целью детоксикации и проведение инфузионно-детоксикационной терапии с парентеральным введением лекарственных препаратов группы В05ВА – Растворы для парентерального питания – Декстроза** 5%, 10% внутривенно капельно [21, 43, 75]. УДД – 5, УУР – С. Комментарии: Дозировка зависит от возраста, массы тела и состояния больного. В/в капельно вводят 5% раствор - с максимальной скоростью 500 мл/ч (150 капель/мин), 10% раствор - до 60 капель/мин (3 мл/кг/ч); 20% раствор - до 30–40 капель/мин (150 мл/ч); 40% раствор - до 30 капель/мин (1,5 мл/кг/ч). При нормальном состоянии обмена веществ максимальная скорость введения для взрослых составляет для 5% раствора декстрозы** 0,25-0,5 г/кг/ч, при снижении интенсивности обмена веществ, скорость введения снижают до 0,125-0,25 г/кг/ч. Детям для парентерального питания, наряду с жирами и аминокислотами, в первый день вводят 6 г декстрозы**/кг/сут., в последующем – до 15 г/кг/сут. При расчете дозы декстрозы** при введении 5% и 10% растворов нужно принимать во внимание допустимый объем вводимой жидкости: для детей с массой 2-10 кг – 100-165 мл/кг/сут., детям с массой 1040 кг – 45-100 мл/кг/сут. Скорость введения не должна превышать 0,75 г/кг/ч. Для более полного усвоения декстрозы**, вводимой в больших дозах, одновременно с декстрозой** назначают инсулин растворимый [человеческий генно-инженерный]** из расчета 1 ЕД «А10АВ инсулины короткого действия и их аналоги для инъекционного 47 введения» на 3-5 г декстрозы**. Пациентам с сахарным диабетом декстрозу** вводят под контролем уровня глюкозы в крови и моче [21, 43, 75].  Рекомендуется при отравлении НПВП с целью коррекции гипокалиемии проведение инфузионно-детоксикационной терапии с парентеральным введением препаратов группы В05ХА Растворы электролитов – #калия хлорид** в растворе декстрозы** 5%, 10% внутривенно капельно в виде поляризующей смеси: раствор #калия хлорида** в 5-10% растворе декстрозы** (добавляют А10АВ инсулин растворимый человеческий генно-инженерный для инъекционного введения из расчета 1 ЕД на","terms":[{"source":"blacklist","term_id":"blacklist:3040f262b3a8","canonical":"Меглюмин","search_word":"Меглюмин","host_word":"Меглюмина","inside_word":true},{"source":"blacklist","term_id":"blacklist:253dd4343aa5","canonical":"Реамберин","search_word":"Меглюмина натрия сукцинат","host_word":"Меглюмина натрия сукцинат","inside_word":false}],"cases":[{"case_id":"case:72484ad7cfd71c5b","span":{"type":"match","case_id":"case:72484ad7cfd71c5b","span_start":2500,"span_end":2508,"text":"Меглюмин"},"terms":[{"source":"blacklist","term_id":"blacklist:3040f262b3a8","canonical":"Меглюмин","search_word":"Меглюмин","host_word":"Меглюмина","inside_word":true}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «Меглюмина» входит в рекомендованный препарат «Меглюмина натрия сукцинат**» для парентерального введения при отравлении НПВП; это прямое назначение в разделе рекомендаций.","reco  медленно в дозе примерно 40 мг каждые 10 секунд до появления признаков анестезии. Для взрослых пациентов в возрасте до 55 лет используется средняя доза препарата - 1,5–2,5 мг/кг (необходимый эффект может быть достигнут при более низкой дозе – 20-50 мг/мин). Для седации (у пациентов старше 16 лет, находящихся на ИВЛ в отделении) доза препарата подбирается индивидуально и зависит от требуемой степени седации и составляет обычно 0,3-4,0 мг/кг/ч; скорость введения препарата методом инфузии не должна превышать 4,0 мг/кг/ч. Дети: Не рекомендуется применять Пропофол** в возрасте до 1 месяца. Для индукции общей анестезии детям от 1 месяца до 3 лет доза составляет 2,5-4 мг/кг, старше 8 лет - 2,5 мг/кг. Обеспечение седативного эффекта во время интенсивной терапии рекомендуется применять посредством постоянной инфузии. Скорость инфузии следует корректировать с учетом необходимой глубины седативного эффекта. Доза в пределах 0,3 до 4,0 мг/кг/ч должна обеспечить достижение удовлетворительного седативного эффекта [84, 85]; Для поддержания общей анестезии скорость инфузии в пределах 9-15 мг/кг/ч. 51 Натрия оксибутират** применяют в качестве противошокового средства с целью седативного и снотворного действия в дозе 50-100 мг/кг [21].  Рекомендуется пациентам при отравлении НПВП с нарушениями функций ЦНС при токсической и гипоксической энцефалопатии, психических функций (психомоторное возбуждение, делирий), после оценки статуса принять решение по назначению лекарственного препарата, оказывающего антигипоксическое и <span class=\"block-mark word-mark\">антиоксидант<\/span>ное действие из группы N07XX Прочие препараты для лечения заболеваний нервной системы (действующее вещество – инозин + никотинамид + рибофлавин + янтарная кислота**) [34, 86, 87]. УДД – 5, УУР – С. Комментарии: Препарат вводится только парентерально на 100-200 мл 5 или 10% раствора декстрозы или 0,9% раствора натрия хлорида. Скорость введения 3-4 мл/мин. Взрослым вводится: при острых отравлениях 10-20 мл внутривенн ром отмены алкоголя) (англ. – alcohol withdrawal) – это комплекс вегетативных, соматических, неврологических и психических нарушений, возникающих у больных с синдромом зависимости при полном прекращении приёма или снижении дозы алкоголя после неоднократного, обычно длительного и/или в высоких дозах его употребления. Алкогольная деградация личности (англ. – alcoholic deterioration) – психопатологический синдром, проявляющийся нарастанием эмоционального огрубления, интеллектуального и волевого снижения с сужением круга интересов и нивелировкой личностных особенностей. Антидепрессанты (греч. anti- «против» + лат. depressus «придавленный, подавленный») – группа лекарственных средств, улучшающих состояние больных при различных психических расстройствах, сопровождающихся депрессией. В соответствии с анатомо-терапевтическо-химической классификацией, рекомендованной ВОЗ, выделяют следующие группы антидепрессантов: неселективные ингибиторы обратного захвата моноаминов; селективные ингибиторы обратного захвата серотонина; неселективные ингибиторы моноаминоксидазы; ингибиторы моноаминоксидазы типа А; другие антидепрессанты. Противоэпилептические препараты (англ. – antiepileptics) – группа лекарственных средств, используемых для купирования судорог любого происхождения. В соответствии с анатомо-терапевтическо-химической классификацией, рекомендованной ВОЗ, выделяют следующие группы противоэпилептических препаратов: производные карбоксамида, производные жирных кислот, другие противоэпилептические препараты. Некоторые","terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"cases":[{"case_id":"case:201283bf7c1e1fb8","span":{"type":"match","case_id":"case:201283bf7c1e1fb8","span_start":2500,"span_end":2504,"text":"ГАМК"},"terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"ГАМК в этом месте находится в списке сокращений/терминов и обозначает гамма-аминомасляную кислоту, а не назначение или противопоказание препарата/метода.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:b9f0b7c9fabdb0a8","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/899_1","context_html":"ями, психической деградацией и наличием социальных проблем. Синонимы: алкоголизм, алкогольная зависимость, зависимость от алкоголя. 1.2. Этиология и патогенез заболевания или состояния (группы заболеваний или состояний) СЗА формируется под влиянием комплекса биологических (генетических, нейрофизиологических, биохимических), личностно-психологических (черты характера, расстройства личности) и социально-средовых (микро- и макросоциальных) факторов, удельный вес каждого из которых в генезе болезни уникален для отдельного клинического случая [1-3]. Высокий риск формирования СЗА связывают с мезолимбической дофаминовой нейромедиаторной системой, которую называют системой вознаграждения мозга (внутреннего подкрепления, награды, reward system) [2; 4]. Система вознаграждения мозга отвечает за субъективную оценку «удовольствия» и является нейробиологическим субстратом поведения, направленного на достижение цели. Способность алкоголя индуцировать немедленное и интенсивное высвобождение дофамина (далее – ДА) в системе вознаграждения приводит к сильному возбуждению последней и сопровождается положительно окрашенными эмоциональными переживаниями. Это определяет высокий гедонический потенциал алкоголя. Формирующаяся при этом положительная мотивация в отношении приема алкоголя способствует его дальнейшему употреблению и становлению патологического влечения к алкоголю (далее – ПВА). ПВА, являясь своеобразным «паразитом» системы подкрепления, использует мощные механизмы этой системы для собственного развития и поддержания. В 9 настоящее время именно описанная выше дофаминовая гипотеза является основной, объясняющей патогенез СЗА [4-6]. Согласно дофаминовой гипотезе, разовое потребление алкоголя значительно повышает концентрацию свободного ДА. Систематический прием алкоголя приводит к функциональному истощению дофаминовой нейромедиаторной системы: при хроническом употреблении высоких доз алкоголя концентрация ДА снижается. Последнее обстоятельство запускает механизм формирования нового, более высокого уровня активности дофаминовой нейромедиаторной системы и ускорения метаболического кругооборота ДА. Как результат – происходит разбалансировка систем синтеза и утилизации ДА, когда его избыток становится постоянным [4]. Новое дисфункциональное состояние обусловлено как нарушениями самой дофаминовой нейромедиаторной системы, так и возникающим дисбалансом в системах, ее модулирующих (пептидная модуляция), активирующих (глутамат) и тормозящих (гамма-аминомасляная кислота (далее – <span class=\"block-mark word-mark\">ГАМК<\/span>)), а также нарушением реактивности нейрогуморальных систем [2; 4; 7]. Так формируется «порочный круг» метаболизма ДА в системе подкрепления мозга. Это новое функциональное состояние (новый метаболический уровень) дофаминовой нейромедиаторной системы уже не зависит от приема алкоголя и обладает способностью к длительному существованию. При отсутствии приема алкоголя не только не происходит угасания патофизиологического «порочного круга», напротив, саморегуляция организма направлена на воссоздание этого круга. Это состояние и является биологическим проявлением сформированного СЗА. С развитием СЗА витальные потребности организма уступают место потребности в новых приемах алкоголя [2; 7-8]. Также существует иные гипотезы патогенеза СЗА, в которых ведущие роли играют эндогенная опиоидная и ГАМК-глутаматергическая системы мозга. Так, гипотеза опиоидной избыточности предполагает биологическую предрасположенность к избыточному потреблению алкоголя, а также зависимость данного феномена от повышенной активности эндогенной опиоидной системы. При приеме алкоголя происходит активация этой системы, что, в свою очередь, определяющим образом влияет на избыточное потребление алкоголя. Гипотеза опиоидной «компенсации» предполагает биологическую детерминированность СЗА, но уточняет, что связана она с недостаточной активностью эндогенной опиоидной системы. В результате этого алкоголь компенсирует дефицитарность системы эндогенных опиоидов, что также в конечном итоге приводит к чрезмерному потреблению алкоголя. Гипотеза опиоидной чувствительности к алкоголю предполагает, что исходно низкий или высокий уровень эндогенной опиоидной активности 10 не связан с потреблением алкоголя. Развитие СЗА происходит за счет повышения активности данной системы, возникающей при приеме алкоголя и формирования положительного подкрепляющего эффекта приема алкоголя, что опять же, в конечном итоге приводит к его чрезмерному потреблению [2; 7-8]. Для развития первичных эффектов алкоголя в центральной нервной системе и возможных механизмов формирования, развития и поддержания СЗА большое значение имеет и система ГАМК и глутамата. Предполагается, что влияние алкоголя на опосредованную глутаматом нейромедиацию и механизмы синаптической пластичности в структурах мезолимбической системы, имеют решающее значение для оценки новизны и важности стимула и могут являться основой молекулярного механизма развития СЗА [2; 7-8]. 1.3. Эпидемиология заболевания или состояния (группы заболеваний или состояний) СЗА я","terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"cases":[{"case_id":"case:8abd0a39477f21a2","span":{"type":"match","case_id":"case:8abd0a39477f21a2","span_start":2500,"span_end":2504,"text":"ГАМК"},"terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_ ению с 2021 г. данный диспансерный контингент сократился на 2,3%. Среди больных СЗА преобладала возрастная группа 40-59 лет, составив 51,8% как в 2021 г., так и в 2022 г. На долю возрастной группы 20-39 лет в 2022 г. приходилось 30,7% пациентов, на долю группы 60 лет и старше – 17,4%. В 2022 г. было зарегистрировано 9 больных СЗА детей в возрасте до 14 лет и 132 больных СЗА подростков в возрасте 15-17 лет, что составило 0,03% детского населения и 1,7%. подросткового населения, соответственно [10-11]. Больные с СЗА преобладают и среди контингента впервые обратившихся за специализированной помощью в сравнении с другими наркологическими расстройствами. Так, в 2022 г. в Российской Федерации впервые в жизни обратились за наркологической помощью 53347 больных СЗА (2021 г. – 53544). Показатель первичной заболеваемости СЗА в 2022 г. составил 36,4 на 100 тыс. населения (в 2021 г. – 36,8 на 100 тыс. населения). Сокращение первичной заболеваемости СЗА в 2022 г. по сравнению с уровнем 2021 г. составило 0,4% [10]. Показатель госпитализации больных СЗА в России в 2022 г. составил 218,2 на 100 тыс. населения, что на 4% выше, чем в 2021 г. (209,5 на 100 тыс. населения). По этому 11 показателю больные с СЗА существенно превышают другие наркологические расстройствами [10]. Несмотря на характерное преобладание в России среди наркологического контингента больных СЗА, в течение последних 10 лет отмечается снижение показателей, связанных с заболеваемостью и болезненностью СЗА [10]. 1.4. Особенности кодирования заболевания или состояния (группы заболеваний или состояний) по Международной статистической классификации болезней и проблем, связанных со здоровьем1 В Международ","terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"cases":[{"case_id":"case:a129f971bb06271a","span":{"type":"match","case_id":"case:a129f971bb06271a","span_start":2500,"span_end":2504,"text":"ГАМК"},"terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"ГАМК здесь упомянута только как элемент патогенеза и нейромедиаторной системы в теоретическом описании, а не как назначаемое/рекомендуемое лечение, запрет или объект литературной ссылки.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:c46c319cb8353862","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/899_1","context_html":"кардиомиопатия (алкогольное поражение сердца, алкогольное поражение миокарда, токсическая дилатационная кардиомиопатия), вторичная гипертензия, нарушения ритма при алкогольном поражении сердца, нарушения проводимости у пациентов с СЗА обусловливает необходимость тщательного контроля за сердечной деятельностью. 22 2.5. Иные диагностические исследования • Рекомендуется всем пациентам с диагнозом СЗА проведение патопсихологическогоэкспериментального-психологического (психодиагностического) исследования по показаниям с целью выявления особенностей, степени выраженности и оценки динамики нарушений психических функций [2; 13]. Уровень убедительности рекомендаций С (Уровень достоверности доказательств 5). Комментарии: Психодиагностическое исследование носит вспомогательный характер, его ценность повышается при сопоставлении с результатами клинического наблюдения и отдельных инструментальных исследований (например, электроэнцефалографии). Результаты психодиагностического исследования помогают определить оптимальный объем и форму последующих психотерапевтических вмешательств. Программа психодиагностического исследования зависит от клинической ситуации. Например, для пациентов с сопутствующими органическими заболеваниями центральной нервной системы или шизофренией основное внимание уделяется выявлению особенностей расстройств мышления, характеристикам работоспособности; при амнестическом синдроме или деменции – нейропсихологическим методикам и пробам, выявляющим нарушения навыков письма, счета, праксиса и т.д. Повторные обследования, проведенные в процессе лечения, позволяют объективно оценить влияние проводимой терапии и реабилитации [2; 13]. • Рекомендуется установить степень тяжести актуального состояния больного с учетом клинического, инструментального, лабораторного и психодиагностического исследований с целью определения терапевтической тактики [2; 13]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5). Комментарии: Оценка тяжести состояния больного дает возможность принять взвешенные и рациональные решения в отношении не только условий оказания медицинской помощи, но и терапевтических мероприятий [2; 13]. 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения Терапия СЗА – процесс многоэтапный, комплексный, индивидуальный и длительный. СЗА 23 является хроническим заболеванием с рецидивирующим характером, поэтому длительная п<span class=\"block-mark word-mark\">оддерживающая терапия <\/span>обязательна. Она может осуществляться в течение нескольких лет. Решение о коррекции поддерживающей терапии принимается индивидуально с учетом актуального состояния пациента, выраженности ПВА, а также коморбидной патологии (расстройства личности, эндогенное заболевание, экзогенно-органическое заболевание и пр.), если таковая имеется [2; 13; 17]. Любые терапевтические вмешательства должны преследовать четкие задачи, иметь определенную тактику и завершаться оценкой их эффективности [2; 30]. Задачи терапии: 1) профилактика рецидивов и поддержание ремиссии (трезвого состояния); 2) купирование синдрома ПВА для обеспечения возможности проведения психотерапии и реабилитации; 3) предотвращение развития осложнений употребления алкоголя (терапия соматоневрологической патологии, характерной для СЗА, проводится по показаниям); 4) купирование иных психопатологических расстройств, если таковые имеют место быть (например, наличие коморбидной патологии). Тактика терапии: проведение комплексного медикаментозного и психотерапевтического лечения. Критерий эффективности лечения: стабилизация психофизического состояния больного. 3.1. Медикаментозная терапия 3.1.1. Специфические лекарственные средства Дисульфирам • Рекомендуется взрослым пациентам с диагнозом СЗА назначение дисульфирама с целью медикаментозной стабилизации ремиссии при наличии показаний, отсутствии противопоказаний к конкретным препаратам в соответствии с инструкцией [31-40]. Уровень убедительности рекомендаций В (Уровень достоверности доказательств 1). Комментарии: Дисульфирам относят к так называемым сенсибилизирующим средствам. В терапии СЗА они являются препаратами выбора на этапе формирования ремиссии. Термин «сенсибилизирующая» применительно к терапии СЗА является условным. Сенсибилизация в узком смысле слова – это сверхчувствительность организма к веществу 24 чужеродного происхождения. При взаимодействии организма с этим веществом возникает определенная реакция, выраженность которой зависит от концентрации этого вещества. Суть сенсибилизирующей терапии СЗА основана на применении средств, резко повышающих чувствительность организма к спиртным напиткам. К ним относятся дисульфирам, цианамид и некоторые другие лекарственные средства (далее – ЛС). Все они в той или иной мере создают физическую непереносимость алкоголя, связанную с нарушением его метаболизма и с появлением в крови токсичных продуктов его неполного распада, образующих «химическое препятствие» («метаболическую блокаду») дальнейшему потреблению","terms":[{"source":"marker","term_id":"marker:1696a95c5213","canonical":"поддерживающая терапия","search_word":"поддерживающая терапия","host_word":"поддерживающая терапия","inside_word":false}],"cases":[{"case_id":"case:0c8bf7f3945cb584","span":{"type":"match","case_id":"case:0c8bf7f3945cb584","span_start":2500,"span_end":2522,"text":"поддерживающая терапия"},"terms":[{"source":"marker","term_id":"marker:1696a95c5213","canonical":"поддерживающая терапия","search_word":"поддерживающая терапия","host_word":"поддерживающая терапия","inside_word":false}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Термин «поддерживающая терапия» в контексте прямо описан как обязательная часть лечения СЗА, то есть является рекомендуемой лечебной тактикой. Рядом есть подходящие UUR/УДД для этого раздела: C и 5.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}}]},{"block_id":"block:9d4f566bdf25a972","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/899_1","context_html":"сутки; тразодона – 75-150 мг в сутки; миртазапина – 15-45 мг в сутки; амитриптилина** – 75-200 мг в сутки; миансерина – 60-90 мг в сутки [13; 59; 64; 78-84]. • Рекомендуется подросткам с диагнозом СЗА и коморбидными депрессивными и тревожными расстройствами неалкогольного генеза назначение препаратов группы «Антидепрессанты» с целью купирования проявлений депрессии и тревоги при отсутствии противопоказаний к конкретным препаратам в соответствии с инструкцией [85]. Уровень убедительности рекомендаций В (Уровень достоверности доказательств 2). Комментарии: В аналитическом обзоре на примере 15 исследований, в которых сообщалось о результатах лечения подростков с сопутствующей депрессией и расстройствами, связанными с употреблением ПАВ (в частности, алкоголя), было показано, что применение антидепрессантов может быть эффективным. Чаще всего у подростков (возраст 12-15 лет) использовался препарат #флуоксетин** в дозе 20 мг/сут [85]. Противоэпилептические препараты • Рекомендуется взрослым пациентам с диагнозом СЗА с целью коррекции аффективных расстройств (внутренней напряженности, раздражительности, дисфории, ангедонии) в структуре ПВА назначение препаратов группы «Противоэпилептические препараты» при отсутствии противопоказаний к конкретным препаратам и в соответствии с инструкцией [13; 60-61; 86-92]. Уровень убедительности рекомендаций А (Уровень достоверности доказательств 1). 33 Комментарии: Противоэпилептические препараты при СЗА, как правило, применяются на этапе противорецидивной и стабилизирующей терапии с целью купирования обострений ПВА, когда в клинической картине преобладают аффективные нарушения в виде внутренней напряженности, дисфории, раздражительности и ангедонии [13; 63-64; 86-92]. Патогенетическим обоснованием использования противоэпилептических препаратов для подавления первичного ПВА может служить концепция «киндлинга», которая сводится к возникновению эпилептиформной активности в лимбических структурах мозга после повторных алкогольных эксцессов; сначала эта активность имеет временный характер, а затем стабилизируется («хронический эпилептогенез») [63-64]. Сама ее локализация становится причиной разнообразной психической патологии, окрашенной эмоциональными и вегетативными нарушениями. Не противоречит данной теории также и еще одна, связанная с нормотимическим действием противоэпилептических препаратов. Нормотимический эффект этих средств связан с воздействием на ГАМК-ергическую систему: противоэпилептические препараты снижают метаболизм <span class=\"block-mark word-mark\">ГАМК<\/span><span class=\"block-mark\"> в головном мозге. <\/span><span class=\"block-mark word-mark\">ГАМК<\/span> же, в свою очередь, является пресинаптическим модулятором дофаминергических нейронов, вызывая снижение концентрации ДА в пресинаптических образованиях [13]. Исследования показали, что противоэпилептические препараты оказывают существенное влияние на снижение риска рецидива заболевания, а также уменьшают количество употребляемого алкоголя в случае возобновления его приема [87; 91]. Для подавления ПВА и связанной с ним аффективной патологии у взрослых пациентов чаще всего используются #карбамазепин** и #вальпроевая кислота** [63-64]. #Карбамазепин** показал свою эффективность в отношении снижения ПВА (удлинение периода воздержания, снижение дней «тяжелого пьянства», уменьшение количества употребляемого алкоголя) в дозе от 600-800 мг в сутки [86-87]. #Окскарбазепин** показал свою эффективность в отношении снижения ПВА (удлинение периода воздержания, уменьшение количества употребляемого алкоголя) у взрослых в дозе от 600-900 мг (низкая доза) до 1500-1800 мг в сутки (высокая доза) [87]. #Вальпроевая кислота** показала свою эффективность в отношении снижения ПВА и коррекции настроения (удлинение периода воздержания, снижение дней «тяжелого пьянства», уменьшение количества употребляемого алкоголя) в дозе 450-900 мг в сутки [88]. 34 Рекомендованные дозы #ламотриджина у взрослых – от 200 до 300 мг в сутки [87; 89]. В исследованиях на взрослой популяции также была показана эффективность #габапентина (600, 900 или 1800 мг) [87; 92] и #топирамата** (75-300 мг) [87; 89], хотя их использование при лечении СЗА до настоящего времени дискутабельно [17; 36; 64]. Противоэпилептические препараты во многих исследованиях показали свою эффективность в качестве средств, снижающих ПВА, удлиняющих ремиссию и уменьшающих количество употребляемого алкоголя в случае срыва у больных СЗА [87]. Тем не менее, до настоящего времени не существует неопровержимых доказательств эффективности использования данной группы препаратов в терапии СЗА [86]. Следует подчеркнуть, в связи с неоднозначностью результатов исследований, клиницистам необходимо в каждом конкретном случае оценивать назначение противоэпилептических препаратов по принципу «риск-польза» [91]. Антипсихотические средства • Рекомендуется взрослым пациентам с СЗА назначение препаратов группы «Антипсихотические средства» с целью устранения психомоторного возбуждения, ажитации, агрессивности, импульсивного поведения, присутствующих в структуре ПВА при отсутствии противопоказаний к конкретным препаратам в соответствии с инструкцией [13;","terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"cases":[{"case_id":"case:83f6cff9ebca0b99","span":{"type":"match","case_id":"case:83f6cff9ebca0b99","span_start":2500,"span_end":2504,"text":"ГАМК"},"terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"prediction":{"label":"literature_mention","target_kind":"other","evidence_quote":null,"reason":"ГАМК упомянута в патогенетическом комментарии о механизме действия противоэпилептических препаратов, а не как назначаемое или запрещаемое лечение.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}},{"case_id":"case:7d27077dcbb03057","span":{"type":"match","case_id":"case:7d27077dcbb03057","span_start":2523,"span_end":2527,"text":"ГАМК"},"terms":[{"source":"blacklist","term_id":"blacklist:9a1792cfa373","canonical":"ГАМК","search_word":"ГАМК","host_word":"ГАМК","inside_word":false}],"prediction":{"label":"literature_mention","target_kind":"other","evidence_quote":null,"reason":"ГАМК здесь используется как элемент описания нейрохимического механизма в тексте обзора, без прямой рекомендации или противопоказания.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:c09966be6bbb3a2f","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/899_1","context_html":", не более 4-6 недель) курсов терапии. По механизму действия антипсихотические средства оказывают блокирующее влияние на ДА рецепторы, с чем и связано их положительное терапевтическое влияние на психопатологическую симптоматику: «психотическую» заряженность, напряженность и стойкость аффекта, наблюдающиеся при актуализации ПВА. Использование антипсихотических средств в наркологической практике позволяет быстро купировать 35 состояния, сопровождающиеся психомоторным возбуждением, ажитацией, агрессивным поведением [13; 63-64]. Использование антипсихотических средств проводится только по строгим показаниям, так как они не являются базовыми средствами терапии СЗА [13]. Антипсихотические средства используются в качестве симптоматической терапии по соответствующим показаниям. При обострениях ПВА, когда в клинической картине присутствуют беспокойство, психомоторное возбуждение, ажитация, расстройства сна, ажитированная тревога, нарушения поведения, такие как агрессия, гиперактивность у взрослых пациентов используются: галоперидол** – 1,5-20 мг в сутки 2-3 раза в день внутрь или в/м [13; 93]; #зуклопентиксол** – 25-100 мг в сутки 1-2 раза в день внутрь или 50-150 мг в сутки однократно в/м [13-14]; хлорпротиксен – 15-150 мг в сутки внутрь на 23 приема в зависимости от конкретных показаний [13-14]; хлорпромазин** – 25-100 мг в сутки внутрь на 2-4 приема, или однократно в/м [13-14]; #рисперидон** – 2-4 мг в сутки внутрь на 1-2 приема [13-14]. При обострениях ПВА, когда в клинической картине у взрослых пациентов преобладают психомоторное возбуждение, ажитация, тревога, стойкая бессонница, используются левомепромазин** – 25-200 мг в сутки 1-3 раза в день внутрь или однократно в/м [13-14]; #кветиапин** – 25-50-200 мг в сутки внутрь [13; 95; 97]. При наличии в клинической картине обострения ПВА патологических мотиваций, кататимных образований, установочных форм поведения, сверхценных суждений о «пользе алкоголя» у взрослых пациентов эффективно используются: #перфеназин** – 8-30 мг в сутки внутрь на 2-4 приема [13-14]; #трифлуоперазин** – 10-15 мг в сутки внутрь [13-14]. При наличии неврозоподобных нарушений, нарушениях поведения, связанных с эксплозивностью, истеричностью, эмоциональной расторможенностью, у взрослых используют тиоридазин** – начиная с 50-150 мг в сутки [13-14]. При тревожных состояниях, психомоторном возбуждении, агрессивном или опасном импульсивном поведении в качестве дополнительного препарата для краткосрочного лечения у взрослых пациентов используют <span class=\"block-mark word-mark\">перициазин<\/span>** – 10-30 мг в сутки внутрь [13-14]. Следует отметить, что режим дозирования значительно варьирует в зависимости от состояния пациента. Дозы препарата должны подбираться индивидуально. Лечение должно начинаться с низких доз, которые затем могут 36 постепенно увеличиваться. Всегда следует использовать минимальную эффективную дозу. При тревожно-депрессивных состояниях, беспокойстве, возбуждении и других симптомах и признаках, относящихся к эмоциональному состоянию, нарушениях сна, неврозах и неврозоподобных состояниях с ипохондрическими, вегетативными, сенестопатическими, фобическими расстройствами у взрослых пациентов используют алимемазин. Для достижения вегетостабилизирующего эффекта – 15-60 мг в сутки; для достижения анксиолитического эффекта – 20-60 мг в сутки; для достижения снотворного эффекта – 5-10 мг однократно [13; 98]. Режим дозирования антипсихотических средств значительно варьирует в зависимости от показаний и состояния пациента [13]. Назначать антипсихотические средства следует на ограниченное время, поскольку их длительный прием ведет к возникновению тягостных состояний вялости и субдепрессии [2; 13; 64]. • Рекомендуется пациентам моложе 18 лет использовать медикаментозное лечение, соответствующее таковому для взрослого населения, при наличии показаний, отсутствии противопоказаний в соответствии с инструкцией с учетом коррекции доз ЛС, основанных на возрастных особенностях метаболизма, влияющих на фармакокинетику и фармакодинамику препаратов [13-14]. Уровень убедительности рекомендаций С (Уровень достоверности доказательств 5). Комментарии: Для определенной части подростков медикаментозное лечение является важным компонентом, несмотря на то, что большинство препаратов, использующихся для терапии СЗА, рекомендованы для лиц старше 18 лет. Любые ЛС назначаются только после оценки «риск/польза» [13-14]. • Рекомендуется пациентам моложе 18 лет с диагнозом СЗА и резидуальной органической церебральной недостаточностью назначение #карбамазепина** в дозах из расчета 15-20 мг/кг веса с целью коррекции церебрастенических и аффективных нарушений при отсутствии противопоказаний к конкретным препаратам в соответствии с инструкцией [99]. Уровень убедительности рекомендаций В (Уровень достоверности доказательств 3). • Рекомендуется пациентам моложе 18 лет с диагнозом СЗА и резидуальной органической церебральной недостаточностью назначение #вальпроевой кислоты** в дозах из расчета 37 20-30 мг/кг веса с целью коррекции церебрастенических и аффективных нарушен","terms":[{"source":"mediq","term_id":"mediq:97bd28887f29","canonical":"Перициазин","search_word":"Перициазин","host_word":"перициазин","inside_word":false}],"cases":[{"case_id":"case:b58179fd70153b19","span":{"type":"match","case_id":"case:b58179fd70153b19","span_start":2500,"span_end":2510,"text":"перициазин"},"terms":[{"source":"mediq","term_id":"mediq:97bd28887f29","canonical":"Перициазин","search_word":"Перициазин","host_word":"перициазин","inside_word":false}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Перициазин прямо указан как препарат, используемый у взрослых пациентов в качестве дополнительного препарата для краткосрочного лечения при тревожных состояниях, психомоторном возбуждении и агрессивном/опасном импульсивном поведении; рядом приведены УУР В и УДД 3.","recommendation_strength":"B","evidence_level":"3","confidence":null},"gold":{}}]},{"block_id":"block:f476d1d9e7c34101","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/8 ":{}}]},{"block_id":"block:8740c54f1fa930db","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/899_1","context_html":"ескими заболеваниями, тяжелой или сменной работой и т.д.). Вторая форма – перемежающееся пьянство – имеет следующий характер: на фоне многонедельного или многомесячного пьянства возникают периоды его резкого усиления. В конце такого «запоя» могут быть короткие (1-3 дня) перерывы, связанные, с истощением организма и непереносимостью спиртных напитков. Затем выраженность этих явлений вновь уменьшается. Наступает период, когда больной пьет относительно умеренно, после чего следует «запой», подобный описанному выше. Третья форма – запойное пьянство. Алкоголь употребляется регулярно на протяжении нескольких дней или недель. Потом следуют «светлые промежутки». Их длительность различна – от 7-10 дней до нескольких недель и даже месяцев. После окончания «запоя» наблюдается резко выраженный абстинентный синдром, часто отмечаются психические нарушения в виде бессонницы, пониженного фона настроения, чувства виновности, тревоги, немотивированных страхов и др. 69 В) Изменения личности (алкогольная деградация). Теперь уже, то есть во второй стадии, у зависимого человека проявляются черты «нравственного огрубения», «портится характер»: человек лжив, бахвалится несуществующими победами и подвигами, становится грубым, бесцеремонным, эгоистичным, циничным. Не считаясь с интересами семьи, больной проявляет чрезвычайное упорство при требовании и доставании денег на выпивку, утрачивает чувство такта. Эмоциональная сфера также страдает: появляются беспричинные колебания настроения – от беспричинной веселости, общительности, оптимистичности до мрачности, подавленности, злобности, гневливости. Появляется грубый юмор – склонность к плоским, пошлым шуткам. Причем самое печальное в этом то, что сам больной этого, как правило, не замечает. Страдают окружающие. Может быть и снижение интеллекта и памяти: ухудшается внимание, снижается способность запоминать, приобретение новых знаний и навыков также затруднительно и пр. Г) Возможно развитие алкогольных психозов (белой горячки). Присутствие этих признаков говорит о необходимости обращения к специалисту за лечением. 5. Конечная (третья) стадия алкоголизма. На этой, можно сказать, заключительной стадии алкоголизма, наступает выраженное истощение организма. Переносимость алкоголя резко снижается, опьянение возникает уже после небольшого количества спиртного (водки, вина, пива и пр.). Зависимый постоянно находится в опьянении и испытывает непреодолимое желание влечение к алкоголю – дрожащими руками тянется за очередной дозой алкоголя, попро<span class=\"block-mark word-mark\">шайн<\/span>ичает, унижается. «Трезвых дней» очень мало, они бывают, когда больной не в состоянии достать спиртные напитки. Развиваются резкие нарушения психики вплоть до психозов. Утрачивается способность к производительному труду. Больной уже не в состоянии работать, теряет свою квалификацию, ведет паразитический образ жизни. Не будем говорить о том, что утрачиваются духовные интересы, теряются семейные связи. Больной превращается в тяжелое бремя для окружающих. На этой последней стадии наиболее выражены поражения внутренних органов и нервной системы, обусловленные влиянием длительной алкогольной интоксикации, в т.ч. числе такие тяжелые заболевания как паралич, цирроз, слабоумие и другие. Описанное течение заболевания обусловлено действием алкоголя, прежде всего, на центральную нервную систему, в которой при алкоголизме постепенно возникает уменьшение головного мозга из-за поражения и гибели нервных клеток. Одновременно развиваются и постепенно нарастают болезненные изменения печени, желудочно70 кишечного тракта, сердца, половой системы. Распад личности, физическая немощность – неминуемые исходы алкоголизма. Больной человек нуждается в лечении, и чем раньше оно начато, тем лучше. Но очень многое зависит от того, насколько сам пациент понимает то, что он болен. Именно осознание и признание своей болезни является первым шагом к восстановлению. И этот первый шаг, как правило, всегда является самым трудным. Соматические осложнения алкоголизма Этиловый спирт – это универсальный яд. В организме человека нет ни одной клетки, которую бы спирт не повреждал, проникая в нее. Поражаются все органы, но некоторые ткани (например, нервная) разрушаются в большей степени, т.к. алкоголь легче в них проникает, и клетки этих систем не приспособлены для переработки вредных веществ. Поражение пищеварительной системы Изменения начинаются уже в полости рта, где алкоголь подавляет секрецию и повышает вязкость слюны. Зубы алкоголика разрушаются по многим причинам – это и угнетение иммунитета, и нарушение режима питания, и неряшливость. Из-за того, что угнетаются защитные механизмы, развивается воспаление пищевода. Нарушается процесс глотания – пища начинает забрасываться из желудка обратно в пищевод. Изжога, рвота – неизбежные спутники зависимого. Вены пищевода при длительном приеме этанолом расширяются, стенка их истончается и наступает момент, когда вены лопаются в момент рвоты и начинается сильное кровотечение. Только экстренная хирургическая операция спасает в этом случае больного. Но ча","terms":[{"source":"mediq","term_id":"mediq:ef28264b2daa","canonical":"Шайн","search_word":"Шайн","host_word":"попрошайничает","inside_word":true}],"cases":[{"case_id":"case:b801d21d750af1ad","span":{"type":"match","case_id":"case:b801d21d750af1ad","span_start":2500,"span_end":2504,"text":"шайн"},"terms":[{"source":"mediq","term_id":"mediq:ef28264b2daa","canonical":"Шайн","search_word":"Шайн","host_word":"попрошайничает","inside_word":true}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"Совпадение найдено внутри слова «попрошайничает», которое не является названием лекарства, метода или клинического объекта; это обычное слово из описания симптомов и не связано с «Шайн».","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:51a849d3921f99a4","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/899_1","context_html":"м алкоголя, прежде всего, на центральную нервную систему, в которой при алкоголизме постепенно возникает уменьшение головного мозга из-за поражения и гибели нервных клеток. Одновременно развиваются и постепенно нарастают болезненные изменения печени, желудочно70 кишечного тракта, сердца, половой системы. Распад личности, физическая немощность – неминуемые исходы алкоголизма. Больной человек нуждается в лечении, и чем раньше оно начато, тем лучше. Но очень многое зависит от того, насколько сам пациент понимает то, что он болен. Именно осознание и признание своей болезни является первым шагом к восстановлению. И этот первый шаг, как правило, всегда является самым трудным. Соматические осложнения алкоголизма Этиловый спирт – это универсальный яд. В организме человека нет ни одной клетки, которую бы спирт не повреждал, проникая в нее. Поражаются все органы, но некоторые ткани (например, нервная) разрушаются в большей степени, т.к. алкоголь легче в них проникает, и клетки этих систем не приспособлены для переработки вредных веществ. Поражение пищеварительной системы Изменения начинаются уже в полости рта, где алкоголь подавляет секрецию и повышает вязкость слюны. Зубы алкоголика разрушаются по многим причинам – это и угнетение иммунитета, и нарушение режима питания, и неряшливость. Из-за того, что угнетаются защитные механизмы, развивается воспаление пищевода. Нарушается процесс глотания – пища начинает забрасываться из желудка обратно в пищевод. Изжога, рвота – неизбежные спутники зависимого. Вены пищевода при длительном приеме этанолом расширяются, стенка их истончается и наступает момент, когда вены лопаются в момент рвоты и начинается сильное кровотечение. Только экстренная хирургическая операция спасает в этом случае больного. Но чаще смерть наступает раньше, чем больного доставляют к врачу-хирургу. При алкоголизме снижается секреция желудочного сока, претерпевает изменения защитный гель стенок желудка, развивается воспалительный процесс (гастрит). Итогом является гибель клеток желудка, нарушение переваривания пищи, усвоения пищевых веществ, желудочные кровотечения, развиваются язвы желудка, рак желудка. Изменения в желудке обнаруживаются у 95% больных алкоголизмом. При систематическом употреблении спиртного замедляется продвижение пищевых масс по кишечнику. На стенках кишечника образуются язвы. Нарушается всасывание полезных веществ и выделение вредных, нарушается обмен веществ. Погибают полезные микроорганизмы – обитатели кишечника, которые вырабатывают <span class=\"block-mark word-mark\">витамины<\/span> группы В. Т.е. постепенно, по истощении витаминного депо (запаса витаминов группы В) наступает авитаминоз. А именно авитаминоз является основной причиной 71 тяжелых нервных осложнений алкоголизма. Нарушается усвоение всех микроэлементов, в обмене которых задействованы витамины, происходит потеря белка. Одновременно размножаются вредные микроорганизмы – обитатели кишечника, использующие для питания полезные вещества пищи и отравляющие организм продуктами своей жизнедеятельности. Развивается алкогольный энтерит (воспаление кишечника), основным проявлением которого является диарея (послабление стула). Систематическое употребление алкоголя истощает секреторные процессы поджелудочной железы. Секреторные клетки замещаются опорными, все меньше остается клеток, способных функционировать. Развивается острый или подострый панкреатит. Как известно, поджелудочная железа вырабатывает инсулин – гормон, отвечающий за обмен сахаров в организме человека. Его выработка закономерно снижается при алкоголизме. Сначала возникает состояние, которое врачи называют «изменение толерантности к глюкозе» а затем – приобретенный сахарный диабет. Алкогольное поражение печени – процесс, имеющий несколько стадий. На первой стадии из-за того, что печень не справляется с переработкой токсинов, происходит ее компенсаторное увеличение. Затем клетки, постоянно нейтрализующие этанол и его метаболиты, погибают от чрезмерной работы и их место занимает жировая ткань (алкогольный жировой гепатоз). На фоне жирового перерождения печени развивается алкогольный гепатит (воспаление клеток печени). По изменениям тканей, проявлениям, последствиям алкогольный гепатит не отличим от вирусного гепатита. Постепенно в определенных областях печени происходят некрозы (гибель клеток). С этого момента заболевание печени приобретает необратимый характер, т.е. даже при прекращении приема алкоголя печеночные клетки не восстановятся. Алкогольный цирроз печени, 3-ю стадию алкогольного поражения печени, можно охарактеризовать так. После того, как основная часть клеток печени погибает, из оставшихся клеток начинают формироваться узлы, представляющие собой хаотично расположенные нефункционирующие клетки печени. Печень становится бугристой, уменьшается в размерах. Узлы сдавливают вены печени и кровообращение всего тела нарушается. Компенсаторно расширяются вены пищевода, желудка, кишечника. Алкоголики, у которых диагностирован цирроз печени, быстро умирают, так как происходит отравление вредными веществами, которые больше","terms":[{"source":"blacklist","term_id":"blacklist:842d13350002","canonical":"Витамины","search_word":"Витамины","host_word":"витамины","inside_word":false}],"cases":[{"case_id":"case:20f87a374877418a","span":{"type":"match","case_id":"case:20f87a374877418a","span_start":2500,"span_end":2508,"text":"витамины"},"terms":[{"source":"blacklist","term_id":"blacklist:842d13350002","canonical":"Витамины","search_word":"Витамины","host_word":"витамины","inside_word":false}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"Слово «в
