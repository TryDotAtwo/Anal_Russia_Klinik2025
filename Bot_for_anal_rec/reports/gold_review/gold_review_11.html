diction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"Слово «витамины» здесь употреблено в общем описании дефицита витаминов группы B при алкоголизме, а не как назначаемое лечение или рекомендованный препарат/комплекс.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:88ee026140fe582d","document_id":"899_1","document_title":"Психические и поведенческие расстройства, вызванные употреблением алкоголя Синдром зависимости от алкоголя","document_link":"https://cr.minzdrav.gov.ru/view-cr/899_1","context_html":"пищевода, желудка, кишечника. Алкоголики, у которых диагностирован цирроз печени, быстро умирают, так как происходит отравление вредными веществами, которые больше не утилизируются печенью; часто пациенты гибнут от кровотечений из расширенных вен. Из крупных узлов печени (если больной доживает до этого времени) образуются раковые опухоли 72 (гепатоцеллюлярная карцинома). Опухоли развиваются из-за прямого токсического действия алкоголя и из-за иммунодефицита. Поражение сердечно-сосудистой системы. Алкогольное поражение сердца развивается вследствие прямого действия алкоголя ацетальдегида (продукта переработки алкоголя), глубоких структурных перестроек и физико-химических нарушений. При систематическом приеме алкоголя снижаются сократимость и работоспособность миокарда (сердечной мышцы). Клетки сердца отекают, разрушаются, уменьшается количество клеточных ядер, нарушается структура мышечных волокон, разрыхляются и разрушаются клеточные оболочки, нарушается синтез белка в клетках сердца. Затем обнаруживается дистрофия и некрозы (гибель) клеток сердца. У больных алкоголизмом регистрируют весь спектр нарушений проводимости и возбудимости. Чаще всего встречается предсердно-желудочковая блокада, синдром преждевременного возбуждения желудочков и блокада проводящих путей сердца. Осложняется алкогольное поражение сердца гипертонической болезнью и атеросклерозом сосудов. Величина артериального давления у лиц, злоупотребляющих алкоголем, изначально выше (на 10-15%), чем у воздерживающихся от его приема. Это дополнительная нагрузка на сердце. Существует понятие «алкогольного сердца». Им обозначают наблюдающееся на вскрытии типичный вид сердца алкоголика. Размер сердца увеличен за счет увеличения полостей и разрастания соединительной (не функциональной, мышечной, а соединительной) ткани. Прекращение употребления алкоголя в состоянии компенсации приостанавливает токсическое поражение миокарда. Если воздействие повреждающего фактора остается, развивается декомпенсация. Уменьшается сила и скорость сердечных сокращений, развивается сердечная недостаточность: отеки всех органов. Выздоровление на этой стадии алкогольного поражения сердца невозможно. Поражение иммунной системы. Систематическое злоупотребление спиртными напитками вызывает снижение фагоцитоза. Фагоцитоз относится к числу важнейших защитных антиинфекционных механизмов организма. С его помощью уничтожаются микробы и измененные, опасные клетки организма. Угнетается защитная функция белков крови. Снижается уровень л<span class=\"block-mark word-mark\">изоцима<\/span>, белка, содержащегося во многих секретах человека (слюне, слезах, тканях различных органов, скелетных мышцах) и способного оказывать антимикробное действие, расщеплять оболочку микробов. Уменьшается количество лимфоцитов – клеток иммунитета. Это 73 обусловлено как прямым токсическим действием этанола на костный мозг, где вырабатываются лимфоциты, так и дисфункцией печени. Снижение иммунитета приводит к образованию стойких очагов хронической инфекции. Алкоголики чаще, чем люди, воздерживающиеся от спиртного, болеют инфекционными заболеваниями (пневмониями, абсцессами и пр.). Но основную опасность для организма представляют антитела к собственным нормальным клеткам (аутоантитела), которые начинают синтезироваться под влиянием алкоголя. В частности, у каждого второго больного обнаруживают аутоантитела к печени, у каждого четвертого к селезенке. Существуют аутоантитела к мозговой ткани. Поражение нервной системы Алкоголизм проявляется множеством неврологических симптомов, в основе которых лежат нарушения обмена в нервной ткани, гибель нервных клеток, увеличение внутричерепного давления, разрушение оболочек нервных стволов. Систематическое употребление алкоголя приводит к преждевременной старости и инвалидности. Продолжительность жизни лиц, склонных к пьянству, на 15-20 лет короче среднестатистической. Главными причинами смерти лиц, злоупотребляющих алкоголем, служат несчастные случаи и травмы. Больные алкоголизмом умирают, как правило, не от алкогольной болезни, а от сопутствующих заболеваний, развивающихся в связи со снижением иммунитета, поражения печени, сердца, сосудов. Алкогольная деградация развивается на поздних стадиях алкоголизма. Характеризуется стойким ухудшением памяти и интеллекта, эмоциональным огрубением, этическим снижением, утратой критики к своему злоупотреблению алкоголем и состоянию в целом, упадком способности к систематическому труду и обычно потерей прежнего положения в обществе. Существует 3 типа деградации. Рассмотрим их. Деградация с пассивностью – больной вял, пассивен, безынициативен, утрачивает прежние интересы. Даже в кругу собутыльников он остается пассивным свидетелем происходящего; какая-либо активность возникает только тогда, когда речь идет о приобретении спиртных напитков. Такие больные склонны к иждивенческому образу жизни. Деградация с психопатоподобными симптомами - у больного отмечается повышенная раздражительность, гневливость, склонность к истерикам и депрессиям. Такие больные откровенно циничны, не терпят возражений","terms":[{"source":"mediq","term_id":"mediq:b95e243a5fcf","canonical":"ИЗ","search_word":"ИЗ","host_word":"лизоцима","inside_word":true},{"source":"mediq","term_id":"mediq:2c12c189a7c6","canonical":"Лизоцим","search_word":"Лизоцим","host_word":"лизоцима","inside_word":true}],"cases":[{"case_id":"case:9aeea1477ea3f38a","span":{"type":"match","case_id":"case:9aeea1477ea3f38a","span_start":2500,"span_end":2507,"text":"лизоцим"},"terms":[{"source":"mediq","term_id":"mediq:2c12c189a7c6","canonical":"Лизоцим","search_word":"Лизоцим","host_word":"лизоцима","inside_word":true}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"«лизоцима» упомянут как компонент иммунной системы в описательном тексте, а не как назначаемое лечение или запрет; это не клиническая рекомендация.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:8e52223e2c483435","document_id":"8_2","document_title":"Недержание мочи","document_link":"https://cr.minzdrav.gov.ru/view-cr/8_2","context_html":"или обзорная урография (рентгенография мочевыделительной системы). По результатам исследований ультразвуковое исследование обладает большей диагностической ценностью, чем обзорная урография (рентгенография мочевыделительной системы). • Рекомендуется проведение ультразвукового исследования почек и мочеточников в конкретных клинических ситуациях: • при наличии гематурии; • при нейрогенном недержании мочи, например при миелодисплазии, травмах спинного мозга; • при недержании мочи в сочетании со значительным количеством остаточной мочи; • при сосуществующей боли в пояснице (в области почек); • при выявлении выраженного ПТО, ранее не леченного; • при подозрении на экстрауретральное НМ; • у детей с НМ и инфекцией мочевыводящих путей; • если полученные ранее результаты уродинамичеекого исследования указывают на низкую растяжимость (комплаентность) мочевого пузыря [88]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). • При недостаточной информативности ультразвукового исследования или обзорной урографии рекомендуется проведение компьютерной томографии почек и верхних мочевыводящих путей с внутривенным болюсным контрастированием, магнитно-резонансной томографии, урографии или сцинтиграфии почек и мочевыделительной системы [88]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). 20 КР 8 • Цистоскопия и/или уретроскопия не рекомендуются как рутинные исследования всем пациентам с НМ, и могут выполняться при наличии следующих показаний [3, 16,17]: • у пациентов с осложнённым и рецидивирующим НМ (например, после неудачной хирургической операции); • если при первоначальном обследовании выявлены другие патологические изменения, например гематурия; • при наличии боли или дискомфорта в области мочевого пузыря (у пациентов с симптомами со стороны мочевыводящих путей цистоскопия может выявить внутрипузырное поражение, например опухоль); • при подозрении на наличие урогенитальных свищей и экстрауретрального недержания мочи. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Комментарии. Сложность для диагностики (с целью выявления ложного недержания мочи) в основном представляют различные эктопии устья мочеточника, особенно при удвоении мочеточников. Эктопированное устье находят при инструментальном исследовании (уретроскопии, осмотре шейки матки в зеркалах, ректороманоскопии). Иногда целесообразно одновременное применение индигокарминовой пробы. Внутривенно вводят 5 мл 0,4% раствора и<span class=\"block-mark word-mark\">ндигок<\/span>армина и наблюдают за его выделением с мочой из эктопированного устья. При рецидивных формах недержания мочи следует исключить протрузии субуретралъных слингов в уретру и мочевой пузырь, урогенитальные свищи. Индигокармин рекомендуется для применения в соответствии с показаниями к применению и противопоказаниями, способами применения и дозами, содержащимися в инструкции по применению лекарственного препарата. Дата обращения к инструкции по медицинскому применению лекарственного препарата: 10.09.2023 г. • Не рекомендуется рутинное выполнение исследований по визуализации верхних мочевыводящих путей и цистоскопии у пациентов с НМ [15,16]. Уровень убедительности рекомендаций В (уровень достоверности доказательств - 2). Комментарии. Данные скания, гематурии, эктопии устья мочеточника или при тазовой боли. 21 КР 8 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения 3.1 Консервативные методы лечения Принимая во внимание тот факт, что недержание мочи в большинстве случаев не представляет собой угрозу жизни, в клинической практике принято начинать лечение с нехирургических методов лечения, поскольку они имеют менее значимые побочные эффекты. У пациентов пожилого и старческого возраста, у которых вследствие сопутствующих заболеваний имеются высокий риск оперативных вмешательств или противопоказания для медикаментозного и других видов консервативного лечения, важную роль в поддержании личной гигиены играют специальные средства для сбора мочи. 3.1.1. Лечение сопутствующих заболеваний • Рекомендуется пациентам с НМ лечение сопутствующих заболеваний для уменьшения выраженности симптомов нарушенного мочеиспускания [18,19]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 4). Комментарии. В клинической практике в отношении НМ принято вначале использовать нехирургические методы лечения, поскольку они обычно несут наименьший вред. Коррекция сопутствующих заболеваний, вероятно, позволяет уменьшить выраженность симптомов нарушенного мочеиспускания. Однако часто это трудно оценить, поскольку пациенты могут страдать более чем одним заболеванием. Кроме того, вмешательства могут быть комбинированными или индивидуализированными, что не дает возможности определить, как изменение сопутствующей патологии влияет на НМ [18, 89]. • Рекомендуется тщательно собирать лекарственный анамнез у всех пациентов с недержанием мочи с целью выявления препаратов, которые вызвали или усилили недержание мочи [18, 89]. Уровень убедительности рекомендац","terms":[{"source":"mediq","term_id":"mediq:629b59c92ac7","canonical":"Индиго","search_word":"Индиго","host_word":"Индигокармин","inside_word":true}],"cas нии повторной операции [68]. Уровень убедительности рекомендаций С (уровень достоверности доказательств — 4). 3.2.2.2. Пролапс тазовых органов и НМ Получены противоречивые данные по отдаленному преимуществу комбинированного лечения ПТО и стрессового недержания мочи над коррекцией только пролапса. В то же время комбинированное хирургическое лечение пролапса и стрессового недержания мочи связано с более высоким риском осложнений [69]. У женщин с ПТО без НМ после операции может развиться недержание. Одновременное выполнение антиинконтинентной операции снижает риск послеоперационного недержания мочи, но повышает риск осложнений [70]. • Рекомендуется проводить пациенткам женского пола одновременную коррекцию ПТО и стрессового недержания мочи при наличии и тех и других симптомов для повышения эффективности лечения, однако следует предупреждать о более высоком риске осложнений при комбинированном лечении по сравнению с поочередной коррекцией [71, 72]. 33 КР 8 Уровень убедительности рекомендаций А (уровень достоверности доказательств -1). • Пациентам, страдающим ПТО, но не предъявляющим жалобы на НМ, не рекомендуется выполнение профилактических операций для устранения возможного НМ при коррекции ПТО [73]. Уровень убедительности рекомендаций А (уровень достоверности доказательств -1). Комментарии. Следует информировать пациентов об отсутствии убедительных данных о преимуществе профилактической <span class=\"block-mark word-mark\">антистресс<\/span>овой операции, а также о том, что более высокий риск осложнений комбинированного лечения по сравнению только с коррекцией пролапса может перевешивать возможные преимущества антистрессовой операции. 3.2.3. Осложнения хирургического лечения недержания мочи Осложнения малоинвазивных операций можно разделить на несколько подгрупп: интраоперационные и ранние послеоперационные осложнения, а также поздние послеоперационные осложнения. Интраоперационные осложнения и осложнения в ближайшем послеоперационном периоде (до 24 ч) относятся к ран ь убедительности рекомендаций С (уровень достоверности доказательств — 4). 3.2.2.2. Пролапс тазовых органов и НМ Получены противоречивые данные по отдаленному преимуществу комбинированного лечения ПТО и стрессового недержания мочи над коррекцией только пролапса. В то же время комбинированное хирургическое лечение пролапса и стрессового недержания мочи связано с более высоким риском осложнений [69]. У женщин с ПТО без НМ после операции может развиться недержание. Одновременное выполнение антиинконтинентной операции снижает риск послеоперационного недержания мочи, но повышает риск осложнений [70]. • Рекомендуется проводить пациенткам женского пола одновременную коррекцию ПТО и стрессового недержания мочи при наличии и тех и других симптомов для повышения эффективности лечения, однако следует предупреждать о более высоком риске осложнений при комбинированном лечении по сравнению с поочередной коррекцией [71, 72]. 33 КР 8 Уровень убедительности рекомендаций А (уровень достоверности доказательств -1). • Пациентам, страдающим ПТО, но не предъявляющим жалобы на НМ, не рекомендуется выполнение профилактических операций для устранения возможного НМ при коррекции ПТО [73]. Уровень убедительности рекомендаций А (уровень достоверности доказательств -1). Комментарии. Следует информировать пациентов об отсутствии убедительных данных о преимуществе профилактической антистрессовой операции, а также о том, что более высокий риск осложнений комбинированного лечения по сравнению только с коррекцией пролапса может перевешивать возможные преимущества <span class=\"block-mark word-mark\">антистресс<\/span>овой операции. 3.2.3. Осложнения хирургического лечения недержания мочи Осложнения малоинвазивных операций можно разделить на несколько подгрупп: интраоперационные и ранние послеоперационные осложнения, а также поздние послеоперационные осложнения. Интраоперационные осложнения и осложнения в ближайшем послеоперационном периоде (до 24 ч) относятся к ранним: о кровотечение -0,9-1,9% ; о гематома -1,7-1,9%; о перфорация мочевого пузыря - 4,9-11,0%; о эрозии влагалища - 0,4-0,9%; о затруднённое мочеиспускание - 4,9%; о повреждение запирательного нерва - 0,9%. Осложнения, возникшие спустя сутки после операции, называются поздними: о вновь (йе похо) возникшийургентный синдром-15%; о постоянное ощущение дискомфорта в надлобковой области - 7,5%; о дискомфорт при половой жизни — 20%. • Рекомендуется до операции информировать пациента о рисках развития интраоперационных и послеоперационных осложнений хирургического лечения НМ [74]. 34 КР 8 Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Комментарии. Информация о возможных осложнениях должна быть включена в предоперационное информированное согласие для пациентов. 3.2.4. Недержание мочи у мужчин Наряду с наружными компрессионными устройствами и объемообразующими веществами для лечения НМ используют сфинктеропластику с имплантацией искусственного сфинктера уретры и уретропексию свободной синтетической петлей (мужские слинги). Согласно опубликованным данным, первичная имплантация искусственного мочевого сфинктера эффективна в лечении стрессового НМ у мужчин [75]. • Рекомендуется для лечения НМ у пациентов мужского пола применять субуретральную уретропексию свободной синтетической петлей (слинги) при отсутствии эффекта от консервативной терапии при ее продолжительности не менее 12 месяцев [76]. Уровень убедительности рекомендаций В (уровень достоверности доказательств - 3). • Рекомендуется для лечения НМ у пациентов мужского пола, а также у определенной категории женщин с рецидивным недержанием мочи применять сфинктеропластику с имплантацией искусственного сфинктера уретры при отсутствии эффекта от консервативной терапии при ее продолжительности не менее 12 месяцев [77]. Уровень убедительности рекомендаций В (уровень достоверности доказательств - 2). Комментарии. Хотя искусственный сфинктер можно использовать при любой степени НМ, мужские слинги рекомендуется устанавливать при недержании легкой/средней степени [78]. 35 КР 8 3.2.5. Хирургическое лечение ургентного недержания мочи З.2.5.1.","terms":[{"source":"mediq","term_id":"mediq:4909dde082c3","canonical":"Антистресс","search_word":"Антистресс","host_word":"антистрессовой","inside_word":true}],"cases":[{"case_id":"case:e5fc8c7c045ad958","span":{"type":"match","case_id":"case:e5fc8c7c045ad958","span_start":2500,"span_end":2510,"text":"антистресс"},"terms":[{"source":"mediq","term_id":"mediq:4909dde082c3","canonical":"Антистресс","search_word":"Антистресс","host_word":"антистрессовой","inside_word":true}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «антистрессовой» — это часть прилагательного в словосочетании «антистрессовой операции», а не самостоятельное наименование метода/препарата; здесь оно входит в описание профилактической операции и не является отдельно предписанным объектом.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:67233bb6495db770","document_id":"8_2","document_title":"Недержание мочи","document_link":"https://cr.minzdrav.gov.ru/view-cr/8_2","context_html":"а-апа1уз1з оР гапйогтгей сотгоИей Ша1з шЙг апйтизсапшс йга§з Рог оуегасйуе Ыаййег. Еиг Ш&gt;1. 2008;54:740. 3 3. М111агс1 К, е! а1. СКтса1 еШсасу апй заРе1у оР ЮЙегойте сотрагей Ю р1асеЬо т йеПизог оуегасЙу!1у. 1 1Гго1.1999; 161:1551. 34. СЬарр1е С, е! а1. 8 ирепоп1у оР РезоЮгойте 8 ю § у з 4 т § т гейиснг§ иг§епсу иппагу тсопйпепсе ер1зойез т райепЫ улШ оуегасйуе Ыаййег: гезиЙз оР Йге гапйонйзей, йоиЫе-Ытй, р1асеЪо-сотго11ей ЕЮНТ Ша1. ВЛ51т. 2014; 114:418. 35. БиВеаи СЕ, а\\. ЕШсасу апй ПйегаЪПйу оРРезоЮгойте уегзиз Юкегойте т оШег апй уоип§ег зи^есЫ шЙг оуегасйуе Ыаййег: а роз! Ьос, роо1ей апа1уз1з Ргот й у о р1асеЬосопйоИей Ша1з. Ыеигоиго! Шойуп. 2012;31:1258. 36. 8 апй РК, е! а1. Тгозршт сЫопйе опсе-йайу ех!епйей ге1еазе 1з еРйсаеюиз апй 1о1ега1ей т е1йег1у зиЪдеЫз (а§ей &gt;/=75 уеагз) шйг оуегасйуе Ыаййег зу мендаций: специалисты, имеющие высшее медицинское образование по следующим специальностям: • урология • гинекология • терапия • геронтология • общая врачебная практика (семейная медицина) • хирургия • акушерство и гинекология. В данных клинических рекомендациях все сведения ранжир","terms":[{"source":"mediq","term_id":"mediq:7e9d713a7dab","canonical":"Ваг","search_word":"Ваг","host_word":"Ваг","inside_word":false}],"cases":[{"case_id":"case:1dfba79e536d3e79","span":{"type":"match","case_id":"case:1dfba79e536d3e79","span_start":2500,"span_end":2503,"text":"Ваг"},"terms":[{"source":"mediq","term_id":"mediq:7e9d713a7dab","canonical":"Ваг","search_word":"Ваг","host_word":"Ваг","inside_word":false}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"«Ваг» здесь выглядит как фрагмент библиографической/списочной записи в блоке литературы, а не как самостоятельное назначение, противопоказание или обсуждаемый препарат/метод.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:566f926e82f664dc","document_id":"900_1","document_title":"Хронический вирусный гепатит B","document_link":"https://cr.minzdrav.gov.ru/view-cr/900_1","context_html":"илизационный ответ – исчезновение интегрированной в геном ДНК HBV (в рутинной клинической практике не оценивается). Сероконверсия — исчезновение из крови HBsAg и появление антител к нему. Серореверсия — повторное появление в крови HBsAg после ранее достигнутой сероконверсии. Стоп-правила - критерии прекращения терапии. Функциональный ответ – устойчивый клиренс HBsAg с HBs-сероконверсией или без нее и неопределяемая ДНК HBV в крови после курса лечения. Цитопатический эффект - гибель или иное повреждение инфицированных вирусом клеток. 5 1. Краткая информация по заболеванию или состоянию (группе заболеваний или состояний) 1.1 Определение заболевания или состояния (группы заболеваний или состояний) Хроническая инфекция, вызываемая вирусом гепатита B (HBV- hepatitis B virus), может протекать как с развитием воспаления в ткани печени (гепатита), так и без признаков некровоспалительных изменений. В связи с этим, в настоящее время в в международной классификации используется два термина: хроническая HBV-инфекции, при отсутствие клинико-лабороаторных признаков некровоспалителения в ткани печени, и хронический вирусный гепатит В (ХВГВ), при наличии таковых [1]. Учитывая, что данные состояния являются фазами единого патологического процесса, в статистической номенклатуре используется термин ХВГВ [2]. 1.2 Этиология и патогенез заболевания или состояния (группы заболеваний или состояний) Возбудителем ХВГВ является HBV, который представляет собой небольшой гепатотропный ДНК-вирус, относящийся к семейству Hepadnaviridae. Снаружи он покрыт липидной оболочкой, в которую встроен HBsAg (HBV surface antigen - поверхностный антиген вируса гепатита В). Оболочка окружает сердцевину-нуклеокапсид (core), включающую HBcAg (HBV core antigen - вирусный ядерный (сердцевинный) антиген). Внутри нуклеокапсида находится вирусная полимераза и вирусный геном, особенность которого состоит в том, что он представлен двойной цепью ДНК, одна из которых короче другой [3-5]. HBV способен интегрироваться в геном человека, что определяет его длительное персистирование и затрудняет эрадикацию данного инфекционного агента. Человек является единственным естественным хозяином для HBV [3-5]. В организме человека HBV сначала неспецифически прикрепляется к гепарансульфату, находящемуся на клеточной мембране гепатоцита, после чего создаются условия для взаимодействия HBsAg с трансмембранным белком гепатоцита NTCP (sodium-taurocholate cotransporting polypeptide — полипептид, совместно переносящий натрий и та<span class=\"block-mark word-mark\">урохол<\/span>ат), который является рецептором для вируса, определяя его гепатотропность. Далее происходит эндоцитоз вируса [8-11]. Мембрана эндосомы сливается с оболочкой вируса, освобождая в цитозоль нуклеокапсид, который далее траспортируется моторной системой микротрубочек гепатоцита к его ядру. Там нуклеокапсид освобождает вирусную ДНК, от которой отсоединяется ковалентно связанная с ней вирусная полимераза. Она достраивает меньшую из цепей ДНК вируса и ковалентно замыкает обе цепи, формируя ковалентно замкнутую 6 кольцевидную ДНК (кзкДНК), которая служит матрицей для образования вирусных белков и прегеномной РНК. КзкДНК покрывается гистонами и негистонными белками, становясь своеобразной дополнительной микрохромосомой в ядре гепатоцита, где их может быть несколько десятков копий. КзкДНК весьма стабильна и может существовать довольно долго, также обеспечивая персистирование инфекции [12]. Часть молекул ДНК вируса встраивается в хромосомы гепатоцита в виде интегрированной ДНК, что может способствовать канцерогенезу. РНК-полимераза II гепатоцита осуществляет транкрипцию информационных РНК белков HBV, а также прегеномной РНК вируса, которые переправляются в цитоплазму гепатоцита, где прегеномная РНК вируса связывается с вирусной полимеразой и HBcAg, формируя незрелый нуклеокапсид. Внутри незрелого нуклекапсида вирусная полимераза по матрице прегеномной РНК сначала образует полную (-) ДНК цепь, а затем, используя уже последнюю как матрицу, - неполную (+) ДНК цепь, формируя таким образом зрелый капсид, который возвращается в ядро для пополнения пула кзкДНК вируса или отправляется в эндоплазматическую сеть, чтобы, покрывшись липидной оболочкой с HBsAg, покинуть клетку [13]. При этом HBsAg образуется с большим избытком, его молекулы формируют агрегаты, которые также частично выделяются в кровь. HBsAg в виде указанных агрегатов и как компонент вирусной оболочки присутствует в крови пациентов с первых недель инфицирования (за несколько недель до появления клинических и биохимических признаков заболевания) и до полного угнетения транскрипции вирусного генома. При благоприятном течении острого гепатита В это наблюдается в течение не более 6 месяцев заболевания. Если HBsAg персистирует в крови более 6 месяцев, это свидетельствует о развитии хронической HBV-инфекции [14]. В отличие от HBsAg, HBcAg не секретируется гепатоцитами и практически отсутствует в крови пациентов, но, тем не менее, организм вырабатывает антитела против данного антигена. Анти-HBc являются самыми первыми а","terms":[{"source":"mediq","term_id":"mediq:271da2127788","canonical":"Урохол","search_word":"Урохол","host_word":"таурохолат","inside_word":true}],"cases":[{"case_id":"case:7b515e61b71199d7","span":{"type":"match","case_id":"case:7b515e61b71199d7","span_start":2500,"span_end":2506,"text":"урохол"},"terms":[{"source":"mediq","term_id":"mediq:271da2127788","canonical":"Урохол","search_word":"Урохол","host_word":"таурохолат","inside_word":true}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «таурохолат» — это компонент термина NTCP (совместно переносящий натрий и таурохолат), то есть часть биологического описания рецептора, а не назначаемое лечение или препарат. Совпадение с «Урохол» здесь не отражает клиническую рекомендацию.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:c7647d77972e1a8a","document_id":"900_1","document_title":"Хронический вирусный гепатит B","document_link":"https://cr.minzdrav.gov.ru/view-cr/900_1","context_html":"твия приводит к значительному снижению риска развития ГЦК, он все равно остается выше среднего по популяции, что требует проведения периодического скрининга в объеме, определяемом клиническими рекомендациями по профилактике и лечению ГЦК. • Проведение КТ и МРТ печени при начальном обследовании пациентов с HBVинфекцией не рекомендовано, но может быть проведено при обнаружении в печени очагового образования по результатам УЗИ для уточнения его природы [28, 29, 119]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: УЗИ печени в состоянии выявить признаки портальной гипертензии (асцит, расширение вен портальной с нт МТА – минеральный триоксид агрегат 5 Термины и определения  Перелом – полное или частичное нарушение целостности твердых тканей при нагрузке, превышающей прочность травмированного участка  Ушиб (лат. contusio) – закрытое повреждение тканей и органов без существенного нарушения их структуры  Полный вывих (авульсия) – это полный разрыв циркулярной и периодонтальной связки и выпадение зуба из альвеолы под действием значительной силы, направленной в сторону окклюзионной плоскости  Неполный вывих – травма, при которой происходит частичное повреждение периодонтальной связки, что ведет к смещению зуба, степень и направление которого зависит от характеристик действующей силы  Апексогенез – продолжение формирования корня зуба при частично сохраненной жизнеспособной пульпы  Апексификация – процесс окончательного формирования верхушки корня (<span class=\"block-mark word-mark\">апекса<\/span>) после гибели ростковой зоны  Интрузия зуба – вывих зуба, при котором происходит смещение зуба в сторону лунки, за счет внедрения корня зуба в костную ткань  Гипестезия – это полная или частичная потеря чувствительности в определенной части тела  Облитерация – патологический процесс, при котором происходит сужение или зарастание полого органа – полости или корневого канала зуба  Резорбция – это процесс разрушения (рассасывания, деградации) костной ткани или корня зуба под действием остеокластов. 6 1. Краткая информация по заболеванию или состоянию (группе заболеваний или состояний) 1.1 Определение заболевания или состояния (группы заболеваний или состояний) Острая травма зубов – результат однократного действия повреждающего фактора, приводящего к нарушению анатомической целостности и расстройству функции зуба. 1.2 Этиология и патогенез заболевания или состояния (группы заболеваний или состояний) Острая травма зубов (ОТЗ) у детей возникает в результате кратковременного воздействия механической силы, в результате чего может нарушаться целостность отдельно коронки, корня или пародонта поврежденного зуба. Наиболее же часто зуб повреждается вместе с окружающими его тканями. У детей раннего возраста ОТЗ чаще всего совпадает с периодом начала активной подвижности в возрасте 1-3 лет, которая сочетается со снижением охранительных рефлексов, любознательностью малыша и неустойчивостью нервно-мышечных рефлексов. Следующий период повышенного травматизма приходится на возраст 7-10 лет. Связано это с подвижностью детей, с началом активных занятий физкультурой и спортом при отсутствии необходимого контроля со стороны взрослых. Высокая распространенность травматических повреждений в детском возрасте приводит к тому, что лишь 15-20% пациентов получают квалифицированную медицинскую помощь. Поэтому в настоящее время особое значение приобретает детский стоматолог знакомый с особенностями клиники, диагностики и методами реабилитации подобных детей [1, 2]. 1.3 Эпидемиология заболевания или состояния (группы заболеваний или состояний) По данным, как отечественных, так и зарубежных исследователей каждый 3-4 ребенок подвержен в той или иной степени острой травме зубов (ОТЗ). В исследовании, проведенном в 2011 году, распространенность травмы зубов составила 9,75%, что стало вторым по частоте встречаемости заболеванием после кариеса зубов и его осложнений (69,02%). Таким образом, в среднем каждый 10-й ребенок сталкивается с клинически 7 значимой травмой зубов. Острая травма зуба","terms":[{"source":"mediq","term_id":"mediq:758a6b8d68af","canonical":"Апекса","search_word":"Апекса","host_word":"апекса","inside_word":false}],"cases":[{"case_id":"case:459063db595741ad","span":{"type":"match","case_id":"case:459063db595741ad","span_start":2500,"span_end":2506,"text":"апекса"},"terms":[{"source":"mediq","term_id":"mediq:758a6b8d68af","canonical":"Апекса","search_word":"Апекса","host_word":"апекса","inside_word":false}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"«апекса» здесь является частью термина в разделе определений (апексификация/апекс) и не выступает как назначаемый или запрещаемый лечебный метод/препарат.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:a1b3e459d13ecbd2","document_id":"901_1","document_title":"Лечение острой травмы зубов у пациентов детского возраста","document_link":"https://cr.minzdrav.gov.ru/view-cr/901_1","context_html":"обработанных поверхностей [1,12, 13]. 3.1.10. Шинирование Рекомендуется пациентам детского возраста с острой травмой постоянных зубов проводить шинирование (А16.07.019) с целью снижения подвижности при неполном вывихе с подвижностью зуба II-III степени; при переломе корня, полном вывихе зуба после осуществления реплантации [10,13,21,43,47,48,49,50,51]. Уровень убедительности рекомендаций – B (уровень достоверности доказательств – 2) Комментарии: при переломе корня постоянного зуба при первичном обращении рекомендована репозиция отломков зуба с точным сопоставлением коронкового и корневого фрагментов (при смещении) и иммобилизация с помощью шинирования. Рекомендуемый срок шинирования от 2 до 4 месяцев. Необходимо ограничить механическую нагрузку на зуб. С этой целью рекомендовано выведение зуба из окклюзии путем избирательного пришлифовывания и пациентам рекомендуется исключить откусывание пищи передними зубами. Так как есть возможность сохранения жизнеспособности пульпы, не рекомендуется проводить эндодонтическое лечение до того момента, когда будут выявлены признаки выраженного воспалительного процесса или некроза пульпы на основе данных ЭОМ и рентгенологических исследований. Выделяют несколько вариантов исхода лечения перелома корня:  образование кальцифицированной ткани, состоящей из дентина или цемента;  заживление с участием соединительной ткани из волокон периодонта;  заживление с образованием костеподобной ткани и участков соединительной ткани между фрагментами;  прорастание грануляционной ткани в линию перелома. Последний тип является самым неблагоприятным, так как сопровождается подвижностью отломков и гибелью сосудисто-нервного пучка, на слизистой оболочке в проекции перелома можно обнаружить свищевой ход. Такая клиническая ситуация требует эндодонтического вмешательства с рентгенологическим контролем качества пломбирования корневых каналов и динамическим наблюдением за отсутствием воспалительных изменений в периапикальных тканях зуба. При гибели пульпы рекомендовано эндодонтическое лечение с последующим пломбированием корневого канала материалом стоматологическим на основе гидроокиси 33 кальция для снятия воспаления и стимуляции остеопластических процессов. Окончательное пломбирование корневого канала рекомендуется проводить при подтверждении с помощью рентгенологических исследований признаков заживления перелома по первым трем типам, отсутствия воспалительных изменений в периапикальных тканях. В случае поперечного перелома корня в области а<span class=\"block-mark word-mark\">пекса <\/span>постоянного сформированного зуба, осложненного некрозом пульпы, после проведенного эндодонтического лечения рекомендовано в плановом порядке провести резекцию верхушки корня [56]. При полном вывихе постоянного зуба пациентам детского возраста целесообразно проводить реплантацию для восстановления анатомо-физиологической целостности зубного ряда [41-44, 53,54]. Реплантация временных зубов не эффективна, поэтому не рекомендуется [1,10,12,13]. Алгоритм проведения метода зависит от сроков обращения пациента после произошедшей травмы, способа доставки зуба и степени сформированности корня зуба. Общие рекомендации включают:  максимально свести время пребывания зуба вне жидкости (не высушивать);  промыть зуб изотоническим раствором;  осмотреть лунку и при необходимости произвести ревизию, промыть, провести репозицию стенки альвеолы;  произвести реплантацию зуба без выраженного давления;  при наличии разрывов десны осуществить ушивание;  провести шинирование;  проверить окклюзионное соотношение;  рентгенологическое исследование для того, чтобы убедиться в правильности положения зуба относительно лунки. В случае позднего обращения пациентов и нарушении способа доставки зуба возможно проведение отсроченной реплантации. Целью использования данного метода является сохранение формы альвеолярного отростка челюстных костей. Успех проведенного лечения постоянных зубов зависит в основном от времени, прошедшего с момента травмы до обращения к врачу, степени сформированности корня, состояния корня и лунки вывихнутого зуба, а также от способа доставки зуба. Наиболее благоприятен прогноз, когда реплантация зуба проведена в первые 30 минут после травмы. 34 Оптимальным условием для процессов заживления является доставка зуба с сохранением поверхности корня влажной. Для этого больше подходит собственная слюна пациента, пастеризованное молоко, изотонический раствор хлорида натрия. Вывихнутые зубы необходимо как можно скорее реплантировать в лунку. Если зуб не загрязнен, то врач может дать по телефону совет родителям о самостоятельной реплантации зуба в течение первых 30 минут после травмы до обращения к врачу. В остальных случаях зуб доставляется во влажной среде для оказания немедленной врачебной помощи. Одним из рекомендуемых способов транспортировать вывихнутый зуб в преддверии полости рта пациента, так как слюна является наиболее благоприятной биологической средой. Однако этот способ подходит не для всех пациентов, так как не исключена возможность проглатывания или ас","terms":[{"source":"mediq","term_id":"mediq:758a6b8d68af","canonical":"Апекса","search_word":"Апекса","host_word":"апекса","inside_word":false}],"cases":[{"case_id":"case:2bc0d97374cb39e8","span":{"type":"match","case_id":"case:2bc0d97374cb39e8","span_start":2500,"span_end":2506,"text":"апекса"},"terms":[{"source":"mediq","term_id":"mediq:758a6b8d68af","canonical":"Апекса","search_word":"Апекса","host_word":"апекса","inside_word":false}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"«апекса» — это часть анатомического термина «области апекса корня» в описании перелома корня, а не самостоятельное рекомендованное/запрещённое клиническое действие или препарат.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:103edbeb5c6b4598","document_id":"902_1","document_title":"Раны мягких тканей челюстно-лицевой области","document_link":"https://cr.minzdrav.gov.ru/view-cr/902_1","context_html":"рта раны, раны с повреждением подлежащих костных структур начинают обрабатывать из глубины раны. При наличии переломов костей лицевого черепа на первом этапе рекомендовано выполнять остеосинтез титановыми пластинами для фиксации для черепно-лицевой хирургии нерассасывающаяся***, затем послойно выполняют ушивание открытой раны (без кожной пересадки) до кожных покровов [36]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Сшивание кожи и подкожной клетчатки, восстановление мышц и сухожилий лица рекомендовано выполнять послойно [35, 36]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). 25 Комментарии: особенно тщательно следует сшивать края кожных покровов, устанавливая их в правильное соотношение. Это особенно важно при ПХО ран у естественных анатомических отверстий: ротовой полости, носа, в области век, ушной раковины. При сквозных ранах губ, щек, сообщающихся с полостью рта, раны должны быть ушиты послойно, отдельно слизистая полости рта, мышцы, кожные покровы. Особое внимание следует уделять сопоставлению краев раны по границе красной каймы губ, ресничного края век, крыльев носа. Пациентам с глубокими укушенными (прикушенными) ранами языка рекомендовано накладывать швы, толстой нитью нерезорбируемые П-образные швы, чередуя их с узловыми швами резорбируемым шовным материалом [36]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). У пациентов с ранами кожи лица рекомендовано накладывать швы тонкой нерезорбируемой мононитью на атравматичной игле для максимальн ца - через 48 ч, и даже через 72 ч. после травмы, обязательно с профилактикой осложнений гнойной инфекции (J01) Антибактериальными препаратами системного действия. При ушивании ран в области естественных отверстий глухой шов накладывают независимо от времени поступления пациента. При некоторых видах повреждений мягких тканей и условий развития раневого процесса первичный отсроченный шов может быть наложен на 3-4-й день. При хорошем состоянии репаративных процессов в ране можно накладывать ранний вторичный шов через 2-3 недели. Швы с раны снимают при полном заживлении раны в условиях стационара, при необходимости в условиях общего обезболивания ребенка. При укусах животных в челюстно-лицевую область рекомендуется провести курс прививок от бешенства, вводить противовирусные АТХ J07 вакцины для профилактики бешенств","terms":[{"source":"mediq","term_id":"mediq:2f5f9b8e853b","canonical":"Гидроксиметилхиноксалиндиоксид","search_word":"Гидроксиметилхиноксалиндиоксид","host_word":"гидроксиметилхиноксалиндиоксида","inside_word":true},{"source":"mediq","term_id":"mediq:adca9326e77f","canonical":"Диокс","search_word":"Диокс","host_word":"гидроксиметилхиноксалиндиоксида","inside_word":true},{"source":"mediq","term_id":"mediq:275b055a39df","canonical":"Окс","search_word":"Окс","host_word":"гидроксиметилхиноксалиндиоксида","inside_word":true}],"cases":[{"case_id":"case:d2b20f26d35e2f17","span":{"type":"match","case_id":"case:d2b20f26d35e2f17","span_start":2500,"span_end":2530,"text":"гидроксиметилхиноксалиндиоксид"},"terms":[{"source":"mediq","term_id":"mediq:2f5f9b8e853b","canonical":"Гидроксиметилхиноксалиндиоксид","search_word":"Гидроксиметилхиноксалиндиоксид","host_word":"гидроксиметилхиноксалиндиоксида","inside_word":true}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Хост-слово входит в перечень препаратов для ирригационных мероприятий/местного применения, которые рекомендованы в контексте хирургической обработки раны.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}},{"case_id":"case:a9701a8080e3eb11","span":{"type":"match","case_id":"case:a9701a8080e3eb11","span_start":2523,"span_end":2528,"text":"диокс"},"terms":[{"source":"mediq","term_id":"mediq:adca9326e77f","canonical":"Диокс","search_word":"Диокс","host_word":"гидроксиметилхиноксалиндиоксида","inside_word":true}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Это подстрока в названии того же рекомендованного препарата/компонента в списке местных антисептиков для обработки раны.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}}]},{"block_id":"block:12078359f2e2bdb9","document_id":"902_1","document_title":"Раны мягких тканей челюстно-лицевой области","document_link":"https://cr.minzdrav.gov.ru/view-cr/902_1","context_html":"нга. Всем пациентам с «инфицированной» раной целесообразно выполнять микробиологическое исследование. В учреждениях, оказывающих помощь пациентам с ранами мягких тканей челюстно-лицевой области целесообразно разрабатывать локальные протоколы антимикробной терапии. В качестве препаратов выбора рекомендовано использовать [110-116]: - J01CR АТХ - Комбинации пенициллинов, включая комбинации с ингибиторами бета-лактамаз - J01D Другие бета-лактамные антибактериальные препараты - J01EE Комбинированные препараты сульфаниламидов и триметоприма, включая 30 производные - J01FG Линкозамиды - J01GВ Другие аминогликозиды - J01M Антибактериальные препараты, производные хинолона - J01XA Антибиотики гликопептидной структуры - J01XD Производные имидазола - J01XX Прочие антибактериальные препараты. 3.4 Профилактика столбняка Рекомендуется, в виду загрязнения (контаминация) любой ожоговой раны микрофлорой, всем пострадавшим от ожогов пациентам проведение экстренной профилактики столбняка [3, 35]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Рекомендуется у пациентов с ранами мягких тканей лица постоянный контроль за общим состояниям больных, состоянием ран со стороны медицинского персонала для своевременного изменения тактики местного консервативного лечения [31]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств - 5). Рекомендуется в качестве основного способа оценки жизнеспособности тканей при раннем хирургическом лечении визуальная оценка раны [76]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств - 5). Комментарии: при неуверенности оперирующего хирурга в радикальности некрэктомии (иссечения) – аутодермопластику можно выполняеть отсрочено на 2-7 сутки. Для временного закрытия раневого дефекта после некрэктомии рекомендуется использование ксенотрансплантата кожного и/или других раневых покрытий, обеспечивающих антибактериальный эффект и создание оптимальной раневой среды [77, 78]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств - 4). Рекомендуется выполнение свободной кожной пластики дерматомным перфорированным лоскутом на 18 -21 сутки после получения изъяна кожи лица [79, 80]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств - 5). 31 Комментарии: Длительной консервативной подготовке гранулирующей раны следует предпочесть радикальное иссечение патологических грануляций с выполнением одномоментной кожной пластики. Иное лечение. <span class=\"block-mark word-mark\">Физиотерапия<\/span> Рекомендуется у пациентов с ожогами использование одного курса вакуумного воздействия (вакуумная окклюзирующая повязка), некрэктомии ультразвуковой и/или иссечения грануляции ультразвуковое и/или и ультрафиолетового облучения кожи [74, 79, 80, 83, 84, 85]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств - 3). Комментарии: Ультразвуковая обработка гранулирующих ран при подготовке к операции обеспечивает интенсивное удаление гнойного отделяемого, налета фибрина, участков отторгающегося струпа, некротизированной дермы и патологически измененных гипертрофических грануляций. Рекомендуется у пострадавших с глубокими ожогами лица проведение вакуумное воздействие после некрэктомии глубоких ожоговых ран и при подготовке длительно существующих, инфицированных гранулирующих ран к аутодермопластике для уменьшения отёка тканей, улучшения кровоснабжения, снижения бактериальной обсеменённости ран, ускорения их очищения от фокусов некроза, стимулирования формирования грануляционной ткани, что сокращает сроки восстановления целостности кожных покровов [50, 51]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств - 5). Комментарии: эффективность других физических методов местного воздействия на ожоговые раны требует доказательств. Рекомендуется у пострадавших с ожогами ЧЛО применение других дополнительных методов местного воздействия на раны для уменьшения отёка тканей, улучшения кровоснабжения, снижения их бактериальной обсеменённости, стимулирования формирования грануляционной ткани: комбинация механического очищения ран с их промыванием раствором натрия хлорида** или растворами с детергентами, в том числе с использованием «пульсирующей струи», лечебный душ (мытье пациентов в ванне или под душем) [79, 86]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств - 3). 32 4. Медицинская реабилитация и санаторно-курортное лечение, медицинские показания и противопоказания к применению методов медицинской реабилитации, в том числе основанных на использовании природных лечебных факторов Медицинская реабилитации – это комплекс лечебно-профилактических мероприятий, направленных на предотвращение и устранение патологических последствий ожоговой травмы [79]. Рекомендовано проведение реабилитационных мероприятий пациентам с ранами мягких тканей лица с целью их достижения их полного физического и социального восстановления [79]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств –5).","terms":[{"source":"marker","term_id":"marker:6c2be83d36aa"," еской нагрузки - 30-40 мл/кг массы тела, однако он может корректироваться с учетом возраста, наличия сердечно-сосудистой и/или почечной дисфункции, а также выраженности исходной дегидратации. Уровни гематокрита, лактата (молочной кислоты), мочевины и креатинина можно рассматривать в качестве лабораторных маркеров волемии и адекватной тканевой перфузии, поэтому их целесообразно мониторировать в динамике. Рандомизированные исследования не показали значительного преимущества Натрия хлорида раствора сложного [Калия хлорид+Кальция хлорид+Натрия хлорид]** по сравнению с 0,9%раствором натрия хлорида**. Следует, однако, иметь в виду, что при переливании больших объемов этих растворов имеется вероятность развития гиперхлоремического ацидоза, который может усугубить почечную дисфункцию. Целесообразно осуществлять контроль и при необходимости коррекцию уровня калия и хлора в крови. Преимущества проведения целеориентированной инфузионной терапии при остром панкреатите (снижение частоты сердечных сокращений ниже 120, достижение уровня среднего артериального давления 65 - 85 мм рт. ст., восстановление диуреза 0,5 - 1 мл/кг/ч) остаются недоказанными. [1, 5] При проведении инфузионной терапии у детей целесообразно использовать полиионные растворы: Калия хлорид + Натрия ацетат+Натрия хлорид**, Натрия лактата раствор сложный [Калия хлорид+Кальция хлорид+Натрия хлорид+Натрия лактат]** или Калия хлорид+Магния хлорид+Натрия ацетат+Натрия глюконат+Натрия хлорид. Также необходимо включать растворы декстрозы** (5%, 10%); это связано с высоким риском развития гипогликемии, кетоза и дегидратации особенно у детей раннего возраста. При сопутствующей гипергликемии растворы декстрозы** не переливаются. При развитии тяжелой гипопротеинемии показано перели","terms":[{"source":"blacklist","term_id":"blacklist:3040f262b3a8","canonical":"Меглюмин","search_word":"Меглюмин","host_word":"меглюмина","inside_word":true},{"source":"blacklist","term_id":"blacklist:253dd4343aa5","canonical":"Реамберин","sear тация при остром панкреатите должна начинаться максимально рано и проводиться одновременно с лечением. Реабилитация осуществляется в отделениях по профилю оказания специализированной помощи (I этап), в отделениях медицинской реабилитации стационара (II этап) и в реабилитационном отделении поликлиники, реабилитационном отделении дневного стационара, реабилитационном отделении санатория (III этап). При развитии функциональной недостаточности после завершения хирургического лечения или консервативной терапии (по завершению первого этапа реабилитации) пациент может быть направлен на реабилитацию на второй или на третий этап реабилитации в соответствии с оценкой его способности к самообслуживанию и его реабилитационного потенциала. Реабилитация организуется реабилитационной мультидисциплинарной бригадой, в состав которой входят: врач- реабилитолог (координатор реабилитационной команды), врач по лечебной физкультуре, медицинский психолог, специалист по эрготерапиии, специалист по физической реабилитации. На первом этапе лечащим врачом является врач-хирург и все мероприятия по реабилитации согласуются с врачом-хирургом и врачом-анестезиологомреаниматологом (при нахождении пациента в реанимации). При необходимости могут быть привлечены другие специалисты. К наиболее распространённым реабилитационным проблемам пациентов при остром панкреатите являются: • ПИТ-синдром, • Иммобилизационный синдром и моторная депривация, • Нутритивная недостаточность, • Коммуникативная и сенсорная деривация, • Психологические установки на смерть или болезнь, • Боли, • Стресс. Длительное пребывание в реанимации или больнице при тяжелом остром панкреатите может привести к двигательному дефициту (потере способности ходить), атрофии мышц, пролежням, истощению и другим проблемам, которые могут привести не только к функциональной недостаточности, но и к инвалидности. Действия реабилитационной команды должны быть направлены на предотвращение негативного влияния больничной среды на функционирование пациента. Нет данных о преимуществе тех или иных методов физиотерапии при остром панкреатите, <span class=\"block-mark word-mark\">физиотерапия<\/span> может быть рассмотрена как альтернативная и дополнительная методика в дополнении к базисной хирургической помощи, консервативной терапии и реабилитации. Пациентам с болевым синдромом следует обеспечить противоболевые мероприятия. При отсутствии каких-либо специфических противопоказаний для пациента рекомендуется мультимодальный анальгетический режим (организуется совместно с медицинским психологом и специалистом по эрготерапии), включающий наркотические анальгетики 2 (опиоидные анальгетики), нестероидные противовоспалительные препараты (нестероидные противовоспалительные и противоревматические препараты) и парацетамол**. Пациентам с острым панкреатитом среда окружения в палате или реанимации должна быть устроена таким образом, чтобы снизить негативное влияние па пациента, уменьшить стресс и страдания, что обеспечивает специалист по эрготерапия. Пациент с тяжелым течением панкреатита должен быть позиционирован для профилактики пролежней и развития контрактур. Физиотерапия (с учетом отсутствия доказательств эффективности - см. выше: • Ультрафиолетовое облучение (УФО) общее по основной схеме в сочетании с электрофорезом лекарственных препаратов при заболеваниях поджелудочной железы, через день. На курс лечения 15 - 20 облучений. • УФО области живота, 2 - 3 биодозы, через 2 - 3 дня. На курс лечения 5 - 6 процедур; соллюкс на область живота, длительность процедуры 10 мин, ежедневно: • Индуктотермию области живота, доза 200 мА, длительность процедуры 15 - 20 мин, через день. На курс лечения -10 - 15 процедур; 5) парафино-озокеритовые аппликации на область живота (температура 48 - 50°С, длительность процедуры 20 - 30 минут, через день, или: • Грязевые аппликации на область живота (температура 40 - 42°С), длительность процедуры 15 мин, через день: • Электрофорез лекарственных препаратов йода на область живота, длительность проце и неотложной форме, сформированной в субъекте Российской Федерации, в целях предоставления дифференцированного объема медицинского обследования и лечения в зависимости от тяжести острого панкреатита, степени риска возникновения осложнений с учетом структуры, коечной мощности, уровня оснащения и обеспеченности квалифицированными кадрами указанных медицинских организаций. В зависимости от коечной мощности, оснащения, кадрового обеспечения медицинские организации, оказывающие специализированную, в том числе высокотехнологичную, медицинскую помощь в экстренной и неотложной форме пациентам с острым панкреатитом, разделяются на три группы по возможности оказания данной медицинской помощи в рамках трёхуровневой системы оказания специализированной медицинской помощи в экстренной и неотложной форме: а) первый уровень - районные медицинские о","terms":[{"source":"marker","term_id":"marker:6c2be83d36aa","canonical":"физиотерапия","search_word":"физиотерапия","host_word":"Физиотерапия","inside_word":false},{"source":"mediq","term_id":"mediq:b95e243a5fcf","canonical":"ИЗ","search_word":"ИЗ","host_word":"Физиотерапия","inside_word":true}],"cases":[{"case_id":"case:db4690cbfded142e","span":{"type":"match","case_id":"case:db4690cbfded142e","span_start":2500,"span_end":2512,"text":"Физиотерапия"},"terms":[{"source":"marker","term_id":"marker:6c2be83d36aa","canonical":"физиотерапия","search_word":"физиотерапия","host_word":"Физиотерапия","inside_word":false}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Физиотерапия в контексте прямо указана как метод, который может быть рассмотрен и далее перечислен как вариант лечения/реабилитации; рядом есть уровень убедительности рекомендаций C и УДД 5 для этого блока.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}}]},{"block_id":"block:047221268e06069d","document_id":"903_1","document_title":"Острый панкреатит","document_link":"https://cr.minzdrav.gov.ru/view-cr/903_1","context_html":"о фонда ОМС от 30.12.14 г. № 6545/30-5 «О целевых экспертизах качества медицинской помощи»; • Приказ Министерства здравоохранения Российской Федерации от 28 февраля 2019 г. № 103н «Об утверждении порядка и сроков разработки клинических рекомендаций, их пересмотра, типовой формы клинических рекомендаций и требований к их структуре, составу и научной обоснованности включаемой в клинические рекомендации информации». 49 Приложение Б. Алгоритмы действий врача Приложение В. Информация для пациента Пациент должен придерживаться относительно простых и выполнимых ограничений. В выполнении они достаточно просты тем более, если учесть, что их игнорирование чревато достаточно неприятными и нежелательными последствиями. Еда в домашних условиях должна быть перетертой, кашеобразной. Разрешаются молоко и молочные кисели, жидкие каши (лучше на воде), куриный и овощной бульон, овощные пюре. Диетическое питание прописываются пациенту в первые 2-3 месяца. Рацион питания влияет на состав микрофлоры кишечника и на активность его функций. Необходимо следовать таким принципам: • дробное и частое питание, противопоказано одномоментное употребление крупных порций еды; • пища не должна быть горячей или холодной, а лишь немного подогретой; 50 • полноценное питание, обеспечивающее организм всем спектром питательных веществ, витаминов и минералов, поскольку в восстановительном периоде требуется стимуляция и укрепление иммунитета; • исключение продуктов, способствующих брожению и газообразованию в пищеварительном тракте; рацион питания не должен содержать бобовых, тяжелых животных жиров, любых сортов капусты, копченостей, маринадов и солений, исключается употребление алкогольных и газированных напитков. В первые две недели из рациона исключаются: • копченые, соленые, жирные, жареные и острые блюда, колбасы; • специи, майонез, кетчуп; хлебобулочные изделия; • алкоголь (вплоть до полного восстановления). Пациенту настоятельно рекомендуется следить за своим весом. Для восстановления нормальной микрофлоры организму полезны молочные и кисломолочные продукты, обильный питьевой режим. Лучше отказаться от хлеба и хлебобулочных изделий, отличной их альтернативой могут быть хлебцы, где есть минимум клетчатки и углеводов. Благоприятно организмом воспринимаются овощи (морковь, свекла), бананы, от цитрусовых фруктов лучше отказаться. В тоже время для иммунизации организму необходим витамин С, который можно черпать из других продуктов питания или потреблять в таблетированном виде, равно как и другие <span class=\"block-mark word-mark\">витамины<\/span> и витаминно-минеральные комплексы. Окончание диеты не должно быть резким. Рекомендуется постепенно расширять рацион. Приложение Г1 - TN. Шкалы оценки, вопросники и другие оценочные инструменты состояния пациента, приведенные в клинических рекомендациях Приложение Г1. Ш кала критериев первичной экспресс-оценки тяжести острого панкреатита (СПб НИИ СП имени И.И. Джанелидзе - 2006 г.): Название на русском языке: Шкала критериев первичной экспресс-оценки тяжести острого панкреатита Источник (официальный сайт разработчиков, публикация с валидацией): https://elibrary.ru/item.asp?id=11744367 Тип (подчеркнуть): - шкала оценки - индекс - вопросник Назначение: первичная оценка тяжести острого панкреатита 51 Содержание: • перитонеальный синдром; • олигурия (менее 250 мл за последние 12 часов); • кожные симптомы (гиперемия лица, «мраморность», цианоз); • систолическое артериальное давление менее 100 мм.рт.ст; энцефалопатия; • уровень гемоглобина более 160 г/л; количество лейкоцитов более 14 х109/л; • уровень глюкозы крови более 10 ммоль/л; • уровень мочевины более 12 ммоль/л; • метаболические нарушения по данным ЭКГ; • вишнёвый или коричнево-чёрный цвет ферментативного экссудата, полученного при лапароскопии (лапароцентезе); • выявление при лапароскопии распространённого ферментативного парапанкреатита, выходящего за границы сальниковой сумки и распространяющийся по фланкам; • наличие распространённых стеатонекрозов, выявленных при лапароскопии; отсутствие эффекта от базисной терапии. Ключ (интерпретация): Если у конкретного пациента имеется минимум 5 признаков из числа перечисленных, то с 95% вероятностью у него имеется тяжёлая форма ОП. Если имеется 2-4 признака - ОП средней степени. Если нет ни одного признака или имеется максимум один из них - лёгкая форма ОП. Приложение Г2. Ш кала SOFA Оригинальное название: Sequential Organ Failure Assessment (80ЕЛ) Русское название: шкала SOFA Источник (официальный сайт разработчиков, публикация с валидацией): https://pubmed.ncbi.nlm.nih.gov/29443733/ Tee Y.S., Fang H.Y., Kuo I.M., Lin Y.S., Huang S.F., Yu M.C. Serial evaluation of the SOFA score is reliable for predicting mortality in acute severe pancreatitis. Medicine (Baltimore). 2018 Feb; 97(7):e9654. doi: 10.1097/MD.0000000000009654. Тип (подчеркнуть): - шкала оценки - индекс - вопросник Назначение: определение органной недостаточности Содержание: Показатели Оценка 52 0 1 2 3 4 PaO2/FiO2 &gt;400 300-399 200-299 100-199 &lt;100 Количество тромбоцитов в мл &gt;150000 100000149000 50","terms":[{"source":"blacklist","term_id":"blacklist:842d13350002","canonical":"Витамины","search_word":"Витамины","host_word":"витамины","inside_word":false}],"cases":[{"case_id":"case:610f8818921efaf5","span":{"type":"match","case_id":"case:610f8818921efaf5","span_start":2500,"span_end":2508,"text":"витамины"},"terms":[{"source":"blacklist","term_id":"blacklist:842d13350002","canonical":"Витамины","search_word":"Витамины","host_word":"витамины","inside_word":false}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"В контексте раздела для пациента указано, что для иммунизации организму необходимы витамины и витаминно-минеральные комплексы; «витамины» здесь перечислены как рекомендованная часть питания/поддержки.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:0e7ef0328da53c82","document_id":"904_1","document_title":"Переломы бедренной кости (кроме проксимального отдела бедренной кости)","document_link":"https://cr.minzdrav.gov.ru/view-cr/904_1","context_html":"ного характера перелома перед вскрытием костномозгового канала и введением имплантата выполняется остеосинтез мыщелков бедренной кости стягивающими винтами с целью минимизации вторичных смещений отломков при проведении интрамедуллярного стержня [1, 10, 18].  Пациентам с переломами ДОБК рекомендуется применение ретроградного интрамедуллярного остеосинтеза с целью создания условий для костного сращения в случаях:  перелома ДОБК у пациента с политравмой;  ипсилатерального перелома проксимального отдела или диафиза бедренной кости;  флотирующего коленного сустава (ипсилатерального перелома костей нижней конечности);  перелома ДОБК у пациента с ожирением [1, 10, 98]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5). Комментарии: Малотравматичность интрамедуллярного остеосинтеза бедренной кости позволяет применять данную методику при стабилизации переломов у пациентов с политравмой. В случае сочетания перелома ДОБК с повреждением костей ипсилатеральной голени возможно выполнение одномоментного интрамедуллярного остеосинтеза переломов обоих локализаций из одного хирургического доступа [10, 98].  Взрослым пациентам с переломами ДОБК рекомендуется применение спиц или винтов, функционально сужающих костномозговой канал и способствующих управляемому расположению стержня (так называемых поллерных винтов или спиц или TMS) с целью более точного восстановления оси конечности с целью достижения 42 правильного положения интрамедуллярного стержня в широкой части дистального отломка при ретроградном или антеградном его введении [99, 100]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 4).  Комментарии: В качестве поллерных винтов применяются винт костный ортопедический, нерассасывающийся, нестерильный***, винт костный ортопедический, нерассасывающийся, стерильный***, спица***. Так как диаметр костномозгового канала в дистальной части бедренной кости намного больше диаметра имплантата, в ходе остеосинтеза нередко возникают трудности с позиционированием гвоздя. Использование поллерных винтов или спиц функционально сужает костномозговой канал, за счёт чего упрощает репозицию и улучшает рентгенологический результат лечения. Поллерные винты или спицы устанавливаются на вогнутой стороне деформации [100].  Пациентам с переломами ДОБК с целью облегчения репозиция костных отломков рекомендуется использование дополнительных средств репозиции, таких, как наружный фиксатор, большой дистрактор, стержни Шанца в качестве <span class=\"block-mark word-mark\">джой<\/span>стиков, различные репозиционные щипцы, ортопедический стол [18, 100]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: Дистальный отломок бедренной кости имеет небольшие размеры, а смещающие силы прикрепляющихся к нему мышц достаточно высоки. Поэтому в ряде случаев крайне сложно выполнение закрытой репозиции. Описанные выше техники призваны облегчить репозицию и повысить ее качество. 3.2.2.3 Накостный остеосинтез  Пациентам с переломами ДОБК рекомендуется использование накостных фиксаторов (95-градусной клинковой пластин, пластин DCS, или анатомически предызогнутых пластин с угловой стабильностью винтов или без нее, анатомически предызогнутых пластин с возможностью полиаксиального введения винтов) с целью создания условий для консолидации перелома [1, 10, 18, 87, 89, 100]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: При накостном остеосинтезе ДОБК применяются пластина накостная для фиксации переломов винтами, нерассасывающаяся, стерильная***, пластина накостной для фиксации переломов винтами, нерассасывающаяся, нестерильная***, винт костный ортопедический, нерассасывающийся, нестерильный***, винт костный ортопедический, нерассасывающийся, стерильный***. 43 Мыщелковая опорная пластина представляет собой анатомически предызогнутую пластину и может быть как с угловой стабильностью винтов, так и без угловой стабильности винтов. Ее конструкция позволяет провести в мыщелки бедренной кости несколько винтов, что расширяет возможности хирурга при фиксации отломков и способствует созданию абсолютной стабильности в зоне внутрисуставного перелома. Однако стоит отметить, что отсутствие угловой стабильности винтов может привести к несостоятельности фиксации при циклических нагрузках и потере репозиции, проявляющейся в варусной деформации ДОБК. Анатомически предызогнутые металлоконструкции с угловой стабильностью винтов, а также с возможностью полиаксиального введения винтов предпочтительнее при лечении пациентов с переломами ДОБК. Блокируемые винты, вводимые в метафизарную часть пластины, обеспечивают полноценную фиксацию отломков, а при введении в диафизарную часть пластины они позволяют выполнить фиксацию по малоинвазивной технологии. При необходимости создания межфрагментарной компрессии суставного компонента перелома она достигается предварительным введением стягивающих винтов вне пластины. Кроме того, одним из преимуществ пластин с угловой стабильностью винтов является от","terms":[{"source":"mediq","term_id":"mediq:218d0204557f","canonical":"Джой","search_word":"Джой","host_word":"джойстиков","inside_word":true}],"cases":[{"case_id":"case:7a19bb6db47d7dde","span":{"type":"match","case_id":"case:7a19bb6db47d7dde","span_start":2500,"span_end":2504,"text":"джой"},"terms":[{"source":"mediq","term_id":"mediq:218d0204557f","canonical":"Джой","search_word":"Джой","host_word":"джойстиков","inside_word":true}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"«джойстиков» — это часть рекомендованного способа репозиции: стержни Шанца используются в качестве джойстиков; контекст прямо предлагает этот прием пациентам с переломами ДОБК.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{} г  Обширное оперативное вмешательство  Беременность  Критически болен Хронические заболевания  Аутоиммунные нарушения, связанные с тромбозом  Тромбофильное состояние  Активное злокачественное новообразование  Активное воспалительное состояние  Курение  Эстрогенная терапия  Ожирение Анамнестические факторы  Аспарагиназа** в течение предыдущих 30 дней  Недавняя операция в течение последних 30 дней  История тромбоза  Семейный анамнез ВТЭО у родственника 1-й степени родства &lt; 40 лет на момент образования тромба Примечания: − Снижением подвижности считается снижение подвижности по сравнению с исходным уровнем или не может участвовать в лечебной физкультуре. − Устройство центрального венозного доступа определяется как нетуннельный катетер, туннельный катетер, или центральный венозный катетер. − Под обширным ожогом понимается ожог более 50% поверхности тела. − К обширным хирургическим вмешательствам относятся операции продолжительностью более 45 минут. − Критически больные определяются как пациенты, находящиеся в отделении интенсивной терапии или отделении интенсивной терапии (инотропная поддержка, с механической вентиляцией). − Тромбофильные состояния включают дефекты <span class=\"block-mark word-mark\">антитромбин<\/span>а, дефицит протеина C или S, фактор V Лейдена, или мутация гена протромбина. − Активное злокачественное новообразование определяется как получение химиотерапии/лучевой терапии в течение предшествующих 6 месяцев. − Активное воспалительное заболевание включает болезнь Кавасаки, воспалительное заболевание кишечника, системная красная волчанка или нефротический синдром. 75 − Терапия эстрогенами включает пероральные контрацептивы или заместительную терапию эстрогенами или в течение последних 2 недель. − Ожирение определяется как ИМТ выше 95-го процентиля для данного возраста. Ключ: Низкий риск ВТЭО: • Нет измененной подвижности и факторов риска 0-1 Умеренный риск ВТЭО: • Отсутствие нарушений подвижности и наличие 2-3 факторов риска • Изменен ch","case_id":"case:7c9b0e52b9b7f1ca","span_start":2500,"span_end":2511,"text":"антитромбин"},"terms":[{"source":"mediq","term_id":"mediq:c8fd1c13c0d6","canonical":"Антитромбин","search_word":"Антитромбин","host_word":"антитромбина","inside_word":true}],"prediction":{"label":"error","target_kind":"other","evidence_quote":null,"reason":"Хост-слово «антитромбина» находится в пояснении к термину «тромбофильные состояния» и представляет собой элемент перечня/определения, а не назначение, противопоказание или литературное упоминание самого антитромбина.","recommendation_strength":null,"evidence_level":null,"confidence":null},"gold":{}}]},{"block_id":"block:7c11292ab1a65fd1","document_id":"92_2","document_title":"Аномалия Эбштейна","document_link":"https://cr.minzdrav.gov.ru/view-cr/92_2","context_html":"тепени выраженности метаболических нарушений [4,30,31,32,34]. ЕОК\\РКО I C (УУР С, УДД 5) Всем пациентам с АЭ рекомендуется проведение общего (клинического) анализа мочи и общего (клинического) анализа крови развернутого с оценкой уровня гемоглобина и гематокрита, количества эритроцитов, лейкоцитов, тромбоцитов, скорости оседания эритроцитов у всех пациентов с АЭ в рамках первичного обследования, в процессе динамического наблюдения не менее 1 раза в год и при поступлении в стационар, а также в случае оперативного лечения при необходимости в пред- и/или послеоперационном периоде всех пациентов с АЭ [4,23,30,31,35]. ЕОК\\РКО I C (УУР С УУД 5) Всем пациентам, особенно старшего возраста, с АЭ (в рамках первичного осмотра, при поступлении в стационар, в случае оперативного лечения при необходимости в пред- и /или послеоперационном периоде, а также не менее 1 раз в год на контрольном визите при динамическом наблюдении) с целью оценки функции печени и почек рекомендуется проведение анализа крови биохимического общетерапевтического (исследование уровня калия, натрия, хлоридов, глюкозы, креатинина, общего белка, альбумина, мочевины, общего билирубина в крови, свободного и связанного билирубина, определение активности лактатдегидрогеназы, аспартатаминотрансферазы и аланинаминотрансферазы в крови) [30, 31,33,35,36]. ЕОК\\РКО I C (УУР С УУД 5) Комментарии: У взрослых пациентов дополнительно проводится исследование уровня общего холестерина крови, уровня липопротеидов низкой (ХсЛНП) и высокой (ХсЛВП) плотности, триглицеридов (ТГ), с целью выявления фактора риска сопутствующего атеросклероза и, при необходимости, коррекции терапии у всех пациентов с АЭ [30, 31,33,35,36]. Биохимический анализ крови позволяет получить информацию о работе внутренних органов о метаболизме и уровне микроэлементов [112]. У пациентов с АЭ необходимо контролировать функцию печени, которая страдает при наличии значимой недостаточности ТК (уровень билирубина, активность аспартатаминотрансферазы и аланинаминотрансферазы). Пациентам с АЭ с сердечной недостаточностью и нарушениями ритма сердца необходим контроль функции печени, почек, электролитного баланса и тиреоидного статуса [35- 37]. Всем пациентам с АЭ, поступающим в стационар для оперативного лечения, рекомендуется выполнение коагулограммы (ориентировочное исследование системы гемостаза) (активированное частичное тромбопластиновое время, протромбиновое время, протромбиновый индекс, исследование уровня фибриногена в крови, определение активности <span class=\"block-mark word-mark\">антитромбин<\/span>а III в крови, а также международного нормализованного отношения (МНО). Определение основных групп по системе AB0. Определение антигена D системы Резус (резус-фактор). Определение фенотипа по антигенам C, c, E, e, Cw, K, k и определение антиэритроцитарных антител. Определение антигена (HbsAg) вируса гепатита B (Hepatitis B virus) в крови. Определение антител к вирусу гепатита C (Hepatitis C virus) в крови. Определение антител к бледной трепонеме (Treponema pallidum) в крови. Определение антител классов M, G (IgM, IgG) к вирусу иммунодефицита человека ВИЧ-1 (Human immunodeficiency virus HIV 1) в крови, Определение антител классов M, G (IgM, IgG) к вирусу иммунодефицита человека ВИЧ-2 (Human immunodeficiency virus HIV 2) в крови для исключения ассоциации с ВИЧ-инфекцией, гепатитом, а также в случае хирургического лечения при необходимости в пред- и/или послеоперационном периоде [4,23,30,31-37]. ЕОК\\РКО I C (УУР С УУД 5) 2.4 Инструментальные диагностические исследования Рекомендуется всем пациентам с подозрением на АЭ и при диспансерном наблюдении для выявления нарушений ритма и проводимости, гипертрофии ПЖ проведение регистрации электрокардиограммы (ЭКГ) в покое, расшифровка, описание и интерпретация электрокардиографических данных (ЭКГ 12-канальная), а также при необходимости в случае оперативного лечения в пред- и послеоперационном периоде [1,4,31,34,39,41] ЕОК\\РКО I C (УУР С УДД 4) Комментарии: Весьма характерным только для классических форм аномалии Эбштейна можно считать снижение вольтажа желудочковых комплексов QRS и деформацию их в правых грудных отведениях. Подобные изменения желудочковых комплексов служат достаточно веским основанием для постановки предварительного диагноза, так как при любом другом врожденном пороке сердца не наблюдаются столь сложные деформации комплекса QRS. Зубец Р обычно высокий и заострен (так называемый Гималайский зубец Р) [27]. У пациентов с сопутствующим синдромом WPW выявляется на ЭКГ дельта волна. Также у пациентов с АЭ часто выявляется удлинение PQ интервала, блокада правой ножки пучка Гиса, желудочковые и нажелудочковые нарушения ритма. Рекомендуется выполнение холтеровского мониторирования сердечного ритма пациентам с АЭ и подозрением на нарушения ритма или для наблюдения за пациентами с уже диагностированной аритмией (пароксизмальные суправентрикулярные тахиаритмии, фибрилляция и трепетание предсердий) или для оценки эффективности антиаритмической терапии [4,34,41,42,43,44,45]. ЕОК\\РКО I C (УУР С УДД 4) Рекомендуется","terms":[{"source":"mediq","term_id":"mediq:c8fd1c13c0d6","canonical":"Антитромбин","search_word":"Антитромбин","host_word":"антитромбина","inside_word":true}],"cases":[{"case_id":"case:cff4f9fcc45cca8b","span":{"type":"match","case_id":"case:cff4f9fcc45cca8b","span_start":2500,"span_end":2511,"text":"антитромбин"},"terms":[{"source":"mediq","term_id":"mediq:c8fd1c13c0d6","canonical":"Антитромбин","search_word":"Антитромбин","host_word":"антитромбина","inside_word":true}],"prediction":{"label":"recommendation","target_kind":"other","evidence_quote":null,"reason":"Термин «антитромбина III» входит в перечень лабораторных исследований, которые рекомендуется выполнить пациентам перед оперативным лечением; это прямое назначение обследования.","recommendation_strength":"C","evidence_level":"5","confidence":null},"gold":{}}]},{"block_id":"block:0f8950286fd83de7","document_id":"96_2","document_title":"Глаукома первичная открытоугольная","document_link":"https://cr.minzdrav.gov.ru/view-cr/96_2","context_html":"уровень ВГД: прямо коррелирует с увеличением распространенности и заболеваемости ПОУГ. Риск развития глаукомы возрастает на 10% на каждый 1 мм рт. ст. повышения уровня ВГД выше среднестатистической нормы [32-40]. • псевдоэксфо л нативный синдром: наличие псевдоэксфолиаций увеличивает риск ПОУГ в 9-11 раз. В течение 10 лет глаукома развивается у каждого третьего пациента с ПЭС [41-45]. • синдром пигментной дисперсии: риск развития пигментной глаукомы у пациентов с синдромом пигментной дисперсии составил около 10% за 5 лет и 15% за 15 лет [46-49]. • толщина роговицы в центральной оптической зоне (ЦТР): установлено увеличение риска развития ПОУГ на 30-41% на каждые 40 мкм истончения ЦТР ниже среднестатистической нормы [50-53]. • миопия: миопия высокой степени (&gt;6,0 диоптрий) увеличивает частоту возникновения ПОУГ * [54-59]. • перфузионное глазное давление: обнаружена связь низкого перфузионного глазного давления с увеличением частоты возникновения ПОУГ. Поскольку перфузионное давление представляет разность между уровнем диастолического артериального давления и величиной ВГД, лечение артериальной гипертензии у больных с ПОУГ может приводить к развитию системной гипотензии, и как следствие - ухудшению кровоснабжения ДЗН [60-65]. • кровоизлияния на ДЗН: В Международном исследовании по глаукоме нормального давления (СоНаЪогаЦуе Ыогта1 Тепзюп Окисоша 81иёу, С1ЧТС8) наличие кровоизлияний в зоне ДЗН достоверно коррелировало с прогрессированием глаукомы [66]. • другие факторы: имеются сообщения о других факторах, которые могут быть связаны с повышенным риском возникновения и прогрессирования ПОУГ (кардиоваскулярная патология, в ^ том числе системная артериальная гипотензия, системный атеросклероз; вазоспастический синдром, в том числе болезнь Рейно, мигрень и мигренеподобные состояния; апноэ во сне и синкопальные состояния неясного генеза; сахарный диабет (95% ДИ 1,20-1,57)). Вместе с тем, литературные данные остаются противоречивыми [67-81]. Патогенез глаукомной оптической нейропатии изучен не полностью. Среди многочисленных теорий глаукомного повреждения наиболее распространены следующие: механическая, сосудистая и метаболическая [4-7, 68, 82-87]. Комментарий: Многофакторный каскад патогенеза ПОУГвкчючает [4-5. 82-91]: 9 • развитие ретенции и нарушение оттока внутриглазной жидкости вследствие трабекулопатии; • неустойчивость и повышение уровня ВГД выше индивидуальной нормы; • прогрессирующую деформацию и частичный коллапс глиальной части решетчатой структуры в прел<span class=\"block-mark word-mark\">аминарн<\/span>ом отделе ГЗН; • смещение кзади решетчатой пластинки склеры с деформацией в ней канальцев, по которым проходят пучки нервных волокон, что приводит к компрессии выходящих через них пучков нервных волокон и нарушению аксоплазматического тока. Кроме этого, прогибу могут способствовать изменения биомеханических свойств решетчатой пластинки, которые ухудшаются из-за возрастной дистрофической перестройки матрикса самой пластинки и окружающей ее склеры на почве изменения состава коллагена и/или строения коллагеновых структур; • высвобождение цитотоксическ
