ьств - 5) Комментарии: и современной антиглаукоматозной хирургии более предпочтительно применение лазерных методов циклодеструкции, чем криоциклодеструкцж (см. раздел 3.2). В связи с рисками развития осложнений, таких как послеоперационное воспаление, снижение зрения, ижчодестоукция показана при невозможности гипотония и субатрофия глазного яблока циклооеетрукци» выполнения гипотензивной операции из-за тяжести общего состояния, выраженных изиснешш переднего отрезка г,аза либо отказа пациента о т хирургического лечения /2731. 3-4 71 иртптепапия. 0б^&quot;™**ние и другие методы лечения _ „ ППУГ не существует. Методы обезболивания применяются на этапе Специальной диеты при ПО У» не у гггуог « ис используются в качестве самостоятельной терапии, хирургического лечения ПОУГ и не испо у До настоящего времени не проведено надежных клинических исследований, подтверждающих эффективность диетотерапии и применения биологически активных добавок к пище при глаукоме [274]. Альтернативные стратегии лечения ГОН (нейропротекция) являются предметом исследований и обсуждений [275]. По данным многоцентровых исследований СЫТ05, 1998; А018, 2000; ЕМОТ, 2002; ОНТ8, 2002 гарантировать многолетнюю полную стабилизацию глаукомного процесса крайне сложно даже при тщательном соблюдении врачебных рекомендаций. Очевидно, что стратегия лечения, направленная исключительно на нормализацию уровня офтальмотонуса, не в состоянии полностью обеспечить желаемое действие, что привело к поиску новых направлений лекарственной терапии глаукомы. Наиболее перспективным из них оказалась нейроретинопротекция, призванная обеспечить защиту нейронов сетчатки и нервных волокон зрительного нерва от повреждающего действия различных факторов [276-278]. В настоящее время принято выделять два направления нейропротекции - прямую и непрямую. Нейропротекция прямого действия за счет блокирования прямых факторов повреждения клеток, непосредственно защищает нейроны сетчатки и волокна зрительного нерва. Нейропротекция непрямого д  рекомендаций C (уровень достоверности доказательств – 2) Комментарии: Выполнение УЗИ не позднее 2 часов от момента поступления в стационар позволяет диагностировать отёк паренхимы почки и её очаговые изменения, а допплерография — оценить степень нарушения кровотока. Расширение чашечнолоханочной системы свидетельствует о нарушении оттока мочи из почки и вторичном характере заболевания.  Рекомендуется пациентам с подозрением или наличием мочекаменной болезни, выраженными клиническими признаками системного воспаления (лихорадка &gt;38°, озноб, рвота), снижением диуреза (скорость гломерулярной фильтрации &lt;40мл/мин) выполнение компьютерной томографии (КТ) почек и верхних мочевыводящих путей с внутривенным болюсным контрастированием или обзорной урографии (рентгенографии мочевыделительной системы) и внутривенной урографии (экскреторной) с целью определения анатомо-функционального состояния верхних мочевыводящих путей, выявления <span class=\"block-mark word-mark\">уролит<\/span>иаза, абсцесса или инфаркта почки [11, 14, 15, 28, 56]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: выполнение обзорной урографии позволяет диагностировать калькулёзный характер острого пиелонефрита, а внутривенной (экскреторной) урографии - состояния почек и мочевыводящих путей, а также пассажа мочи. У длительно лихорадящих (72 часа) или при подозрении на конкремент в мочевыводящих путях следует обязательно выполнять КТ почек и верхних мочевыводящих путей с внутривенным болюсным контрастированием с целью выявления осложняющих факторов.  Рекомендуется выполнение магнитно-резонансной томографии (МРТ) почек беременным пациенткам с подозрением на острый пиелонефрит или же пациентам с КР9 12 высоким уровнем креатинина крови с целью выявления деструктивных процессов в почке. [14-21] Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: При помощи КТ и МРТ возможно выявление: деструктивного процесса в почке и вт function pick(row,caseId,field,value){saveCase(row,caseId,{[field]:value||null})}
function renderList(){$('status').textContent=`items=${filtered.length}; labeled=${Object.keys(answers).length}`; $('list').innerHTML=filtered.map((r,i)=>`<div class="row ${i===active?'active':''}" onclick="active=${i};renderAll()"><div class="row-title">#${i+1} ${esc(r.document_title)}</div><div class="chips"><span class="chip">cases=${r.cases.length}</span>${r.terms.slice(0,3).map(t=>`<span class="chip">${esc(t.canonical||t.host_word)}</span>`).join('')}</div></div>`).join('')||'<div class="row">Нет записей</div>'}
function renderCenter(){const r=activeRow; $('center').innerHTML=`<div class="toolbar"><b>${esc(r.document_title)}</b>${r.document_link?`<a class="link-button" href="${esc(r.document_link)}" target="_blank" rel="noreferrer">Открыть клинреку</a>`:''}</div><div class="terms">${r.terms.map(t=>`<span class="chip">${esc(t.canonical)} <b>${esc(t.host_word)}</b>${t.inside_word?' inside':''}</span>`).join('')}</div><div class="doc">${r.context_html}</div>`}
function choice(row,caseId,field,label,values,current){return `<div class="choice"><div class="choice-label">${label}</div><div class="choice-buttons">${values.map(v=>`<button class="${String(current??'')===String(v)?'active':''}" onclick="pick(activeRow,'${caseId}','${field}','${v}')">${esc(v||'none')}</button>`).join('')}</div></div>`}
function renderReview(){const r=activeRow; $('review').innerHTML=r.cases.map(c=>{const g=caseAnswer(r,c.case_id),p=c.prediction||{},terms=c.terms.map(t=>`${t.canonical} [${t.host_word}]`).join(', '); return `<div class="card"><div class="card-head"><b>${esc(terms||c.case_id)}</b><br><small>${esc(c.case_id)} | "${esc(c.span?.text||'')}"</small></div><div class="card-body"><div class="kv"><span>LLM</span><b>${esc(p.label||'-')} / ${esc(p.target_kind||'-')} / ${esc(p.recommendation_strength||'-')}${esc(p.evidence_level||'')}</b><span>reason</span><b>${esc(p.reason||'-')}</b><span>gold</span><b>${esc(g.label||'-')} / ${esc(g.target_kind||'-')} / ${esc(g.recommendation_strength||'-')}${esc(g.evidence_level||'')}</b></div>${choice(r,c.case_id,'label','Label',CHOICES.label,g.label)}${choice(r,c.case_id,'target_kind','Target',CHOICES.target_kind,g.target_kind)}${choice(r,c.case_id,'recommendation_strength','UUR',CHOICES.recommendation_strength,g.recommendation_strength)}${choice(r,c.case_id,'evidence_level','UDD',CHOICES.evidence_level,g.evidence_level)}<button class="warn ${g.exclude_from_model_stats?'active':''}" onclick="saveCase(activeRow,'${c.case_id}',{exclude_from_model_stats:${!g.exclude_from_model_stats}})">Не учитывать в статистике модели</button><label class="choice"><span class="choice-label">Comment</span><textarea oninput="saveCase(activeRow,'${c.case_id}',{comment:this.value})">${esc(g.comment||'')}</textarea></label><label class="choice"><span class="choice-label">Quote</span><textarea oninput="saveCase(activeRow,'${c.case_id}',{evidence_quote:this.value})">${esc(g.evidence_quote||'')}</textarea></label></div></div>`}).join('')}
function renderAll(){activeRow=filtered[active]; renderList(); if(!activeRow){$('center').innerHTML='';$('review').innerHTML='';return} renderCenter(); renderReview()}
$('q').addEventListener('input',()=>{const q=$('q').value.toLowerCase(); filtered=ROWS.filter(r=>JSON.stringify([r.block_id,r.document_title,r.terms]).toLowerCase().includes(q)); active=0; renderAll()});
$('exportBtn').onclick=()=>{const items=Object.values(answers); const data={schema_version:1,unit:'llm_blocks',source_review_cases:SOURCE_REVIEW_CASES,exported_at:new Date().toISOString(),items}; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=PAGE_ID+'_gold.json'; a.click(); URL.revokeObjectURL(a.href)};
renderAll();
</script>
</body>
</html>
