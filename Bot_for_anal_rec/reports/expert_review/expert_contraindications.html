степень дегидратации и электролитного дисбаланса, провести коррекцию нарушений; 3. Перейти на парентеральный путь введения препарата или изменить режим приема: принимать на ночь, либо дробно в течение дня, с легким перекусом; 4. Провести симптоматическую терапию для купирования тошноты, рвоты; 5. Снизить дозу препарата; 6. При неэффективности всех мероприятий, тошноте с невозможностью адекватного приема жидкости и пищи, при появлении ацидоза, боли в животе с повышением панкреатических ферментов - отменить препарат Острый гастрит Этионамид**, протионамид**, аминосалициловая кислота**, #левофлоксацин**, #моксифлоксацин**, изониазид**, #этамбутол**, пиразинамид** 1.Назначить противотуберкулезные препараты парентерально (при наличии парентеральных форм); 2. Пероральный прием препаратов - после легкого перекуса, с разделением дозы на 2-3 приема или приемом на ночь; 3. Щадящая диета, терапия блокаторами H2-гистаминовых рецепторов, ингибиторами протонового насоса и/или антацидами (с интервалом 2 ч до или 3 ч после приема противотуберкулезных препаратов); 3. Снизить дозу соответствующего препарата; 4. При неэффективности всех мероприятий отменить препарат Неблагоприятная побочная реакция Наиболее вероятный препарат Рекомендуемая коррекция Диарея Аминосалициловая кислота**, этионамид**, протионамид**, #Левофлоксацин**, #моксифлоксацин**, #амоксициллин+клавулановая кислота**, #линезолид**, карбапенемы 1. Рекомендовать щадящую диету с учетом тяжести диареи. По возможности перейти на парентеральный путь введения препарата; 2. Определить степень дегидратации и электролитного дисбаланса, провести коррекцию нарушений; 3.Симптоматическая терапия диареи; 4. Культуральное исследование кала (по возможности); 5. При водянистой диарее чаще 4 раз в сутки – анализ кала на токсины Cl.difficile. Внеплановый контроль клинического анализа крови, альбумина, креатинина; 6. Отмена препарата при наличии «симптомов тревоги» (лихорадки, лейкоцитоза, крови в стуле), при водянистой диарее 7 раз в сутки и более, подтверждении Cl.difficileассоциированного колита Гепатит Пиразинамид**, изониазид**, этионамид**, протионамид**, аминосалициловая кислота** 1. При повышении уровня трансаминаз ≥ 3N в сочетании с по","terms":[{"source":"mediq","term_id":"mediq:82ee72459e47","canonical":"Протионамид","search_word":"Протионамид","host_word":"протионамид","inside_word":false,"mediq":{"name":"Протионамид","kind":["OTHER"],"type":"CHECKED","quality":"NOT_PROVED","atx":"J04AD01","atx_group":"J04AD Тиомочевины производные","mnn":"протионамид","description":"","criterions":[{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=protionamide&t=1","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/protionamide","points":0},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=protionamide&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":19}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:fbe5782fb773bbf9::case:6349ec86c40bebdb","block_id":"block:fbe5782fb773bbf9","case_id":"case:6349ec86c40bebdb","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"«лакрица» в тексте прямо указана как продукт, который усиливает минералокортикоидный эффект гидрокортизона и «должна исключаться из употребления», то есть это запрет/избегание.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"524_2","title":"Первичная надпочечниковая недостаточность","link":"https://cr.minzdrav.gov.ru/view-cr/524_2","metadata":{"Название клинической рекомендации":"Первичная надпочечниковая недостаточность","МКБ-10":"E27.1, E27.2, E27.3, E27.4, E35.1, E89.6","Возрастная группа":"Взрослые","Разработчик":"Российская ассоциация эндокринологов","Дата размещения":"01.07.2021","Статус применения КР":"Применяется"}},"context_html":"олее длительного времени, еще не проводились.  Назначение дексаметазона** пациентам с 1-НН не рекомендуется, в связи с высоким риском передозировки [95]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4) Комментарии: На фоне приема дексаметазона** наиболее часто проявляются побочные кушингоидные эффекты [95]. 3.2 Заместительная терапия МК  Всем пациентам с 1-НН рекомендуется минералокортикоидная терапия – #флудрокортизон** (стартовая суточная доза 50-100 мкг), потребление соли не ограничивать [27,87-88,96-105]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4) Комментарии: Синтетический МК #флудрокортизон** используется в заместительной терапии, но его использование при 1-НН не изучено в достаточной мере. #Флудрокортизон** обычно назначается однократно утром, так как уровень эндогенного А в норме является самым высоким в это время по аналогии с циркадным ритмом кортизола [96]. Суточная доза #флудрокортизона** зависит от потребления/потери жидкости и электролитов и обычно составляет 0,05-0,2 мг. При чрезмерном потоотделении, например, в условиях жаркого климата, может потребоваться временное увеличение дозы на 50 - 100 % или увеличение потребления соленых продуктов. На фоне терапии #преднизолоном** может потребоваться доза #флудрокортизона** больше, чем на фоне лечения 27 гидрокортизоном** и, тем более, на фоне приема дексаметазона**, который не обладает минералокортикоидной активностью [26]. Терапия #флудрокортизоном** при 1-НН может не назначаться в исключительных случаях (при семейном изолированном дефиците ГК и некоторых формах ВДКН).  Компенсацию недостаточности МК у пациентов с 1-НН рекомендуется оценивать по клиническим признакам (тяга к соленому, ортостатическая гипотензия, отеки, артериальная гипертензия) и результатам исследования уровней натрия и калия крови [26,98,99]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 4) Комментарии: Пациентов необходимо расспрашивать о наличии тяги к соленым и предобморочным состояниям, измерять АД в положении сидя и стоя, осматривать на наличие периферических отеков (имеет низкую чувствительность). Общее хорошее самочувствие, нормальный уровень электролитов и АД, отсутствие ортостатической гипотензии – признаки адекватной компенсации минералокортикоидной недостаточности. Кроме того, плазменная активность Р в верхнем референсном диапазоне, также, является полезным маркером компенсации [26,98,99]. Необходимо учитывать, что <mark class=\"hit\">лакрица<\/mark> и грейпфрутовый сок усиливают минералокортикоидный эффект гидрокортизона** и должны исключаться из употребления [100]. Фенитоин** усиливает метаболизм #флудрокортизона**, в связи с чем, дозу препарата приходится увеличивать [101].  Рекомендуется уменьшить дозу #флудрокортизона** у пациентов с 1-НН и артериальной гипертензией, так как повышение АД может свидетельствовать о передозировке препаратом. Если АД остается повышенным, рекомендуется назначить гипотензивную терапию, а лечение #флудрокортизоном** продолжить [102,103]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 4) Комментарии: 1-НН может сочетаться с эссенциальной артериальной гипертензией (АГ) [102]. У пациента с 1-НН и АГ необходимо оценивать адекватность и минералокортикоидной, и глюкокортикоидной терапии, так как передозировка любого из препаратов может повышать АД. Кроме того, пациенту 28 может быть рекомендовано ограничение чрезмерного потребления соленых продуктов и жидкости [61]. Если после коррекции заместительной терапии (уменьшение дозы #флудрокортизона**) АД не нормализуется, необходимо назначать антигипертензивные средства, преимущественно, средства, действующие на ренин-ангиотензиновую систему: антагонисты рецепторов ангиотензина II или ингибиторы ангиотензин-превращающего фермента [102]. Препаратами второго ряда являются селективные блокаторы кальциевых каналов с преимущественным действием на сосуды (производные дигидропиридина). Диуретики назначаются в исключительных случаях, а антагонисты альдостерона противопоказаны пациентам с 1-НН [26]. 3.3 Лечение во время беременности  Для всех беременных с 1-НН рекомендуется рассмотреть вопрос о повышении дозы гидрокортизона**, особенно в третьем триместре [26]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: Во время нормальной беременности уровень кортизола постепенно повышается (в 2-3 раза) начиная с первого триместра вследствие повышения уровня КСГ [59,106]. С 22-ой недели беременности начинает значительно увеличиваться уровень свободного кортизола [106,107]. Уровень кортизола возвращается к исходному сразу после родов [59]. Вследствие некорректной заместительной терапии во время беременности возможно развитие АК [103]. В настоящее время имеется мало доказательной базы оптимизации заместительной терапии 1-НН у беременных, однако большинство специалистов рекомендуют увеличение дозы гидрокортизона** на 20 - 40 % с 24-ой недели беременности в соответствии с физиоло","terms":[{"source":"mediq","term_id":"mediq:80d397697e24","canonical":"Лакрица","search_word":"Лакрица","host_word":"лакрица","inside_word":false,"mediq":{"name":"Лакрица","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:7ed5d4b9249d38f2::case:6fc5a1af91bb312e","block_id":"block:7ed5d4b9249d38f2","case_id":"case:6fc5a1af91bb312e","label":"contraindication","model":{"recommendation_strength":"B","evidence_level":"2","reason":"Термин «интерфероны» стоит в фразе про противопоказания: указано, что риск превосходит пользу от назначения терапии интерфероном и перечислены случаи, где его следует избегать; далее есть прямое исключение для интерферона альфа-2b в адъювантном режиме.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"546_3","title":"Меланома кожи и слизистых оболочек","link":"https://cr.minzdrav.gov.ru/view-cr/546_3","metadata":{"Название клинической рекомендации":"Меланома кожи и слизистых оболочек","МКБ-10":"C00, C01, C02, C03, C04, C05, C06, C07, C08, C09, C10, C11, C12, C13, C14, C15, C16, C17, C18, C19, C20, C21, C22, C23, C24, C25, C26, C30, C31, C32, C43, C51, C52, C53, C60.9, C63.2, C69.0, C77, C78, C79, D03.0, D03.1, D03.2, D03.3, D03.4, D03.5, D03.6, D03.7, D03.8, D03.9","Возрастная группа":"Взрослые","Разработчик":"Ассоциация онкологов России, Ассоциация специалистов по проблемам меланомы, Общероссийская общественная организация «Российское общество клинической онкологии»","Дата размещения":"06.12.2023","Статус применения КР":"Применяется"}},"context_html":"у о том, что риск превосходит пользу от назначения терапии интерфероном алъфа-2а** и интерфероном алъфа-2Ъ** в следующих случаях (но не ограничивается ими) [239, 250-252]: - Психические расстройства, в том числе тяжелая депрессия; - цирроз печени любой этиологии; - аутоиммунные болезни; - выраженная (Ш-1У степени по СТСАЕ V. 3.0 [253]) органная недостаточность (сердечная, печеночная, почечная и др.); - беременность или планируемая беременность; - псориаз; - неспособность пациента адекватно выполнять назначения врача. В связи с этим эксперты рекомендуют перед назначением адъювантной иммунотерапии интерфероном альфа 2Ь** исключить наличие у пациентов перечисленных противопоказаний, при необходимости прибегнув к консультации специалистов (врачатерапевта, врача-психиатра, врача-дерматовенеролога и т. д.). Следует также учесть противопоказания к назначению препарата, указанные производителем в инструкции по применению. Данные по безопасности и эффективности адъювантного применения интерферона альфа 2Ъ** при меланоме кожи у лиц моложе 18 лет ограничены единичными наблюдениями, поэтому эксперты не рекомендуют назначать интерферон альфа** данной категории пациентов. • Рекомендуется начинать адъювантную иммунотерапию пациентам в сроки не позже 3 месяцев с момента хирургического лечения после полного заживления послеоперационной раны. Не рекомендуется начинать адъювантное лечение в том случае, если с момента операции прошло более 3 месяцев, так как при начале адъювантной терапии в более отдаленные сроки ее эффективность не изучена [228-230, 240]. Уровень убедительности рекомендаций - В (уровень достоверности доказательств - 2) • В рандомизированных исследованиях не было показано преимуществ прерывистых режимов назначения интерферона альфа-2Ъ**, потому они не рекомендуются к использованию в рутинной практике [250,254]. Уровень убедительности рекомендаций - А (уровень достоверности доказательств - 2). • Не рекомендуется использовать химиотерапию в рутинной практике для адъювантного лечения меланомы кожи. По данным многочисленных международных исследований, применение химиотерапии в адъювантном режиме после радикального лечения меланомы кожи ПВ-Ш стадии не приносит клинической пользы и может снижать общую выживаемость [255-262]. Уровень убедительности рекомендаций — А (уровень достоверности доказательств - 2) • Не рекомендуется использовать иммуностимуляторы (класс АТХ - Л)5АХ (Прочие противовирусные препараты), в том числе индукторы эндогенного интерферона или другие <mark class=\"hit\">интерфероны<\/mark> (бета и гамма)), за исключением #интерферона альфа-2Ъ** в адъювантном режиме при меланоме кожи. [240, 245, 246]. Имеющиеся данные клинических исследований свидетельствуют об отсутствии эффективности интерферона гамма** в адъювантном режиме [263], относительно других препаратов имеющихся научных данных недостаточно для их безопасного применения [22]. Уровень убедительности рекомендаций — В (уровень достоверности доказательств — 2) 3.3.1 Рекомендации по проведению неоадъювантной терапии меланомы кожи III стадии и эквивалентом III стадии Данные недавно проведенных исследований демонстрируют весьма обнадеживающие результаты при проведении неоадъювантной иммунотерапии, у пациентов с меланомой с поражением регионарных лимфатических узлов. Судя по всему, такая тактика обладает преимуществом перед стандартным подходом. Вероятно, в ближайшее время, объемы хирургических вмешательств при эквиваленте ШВ-0 стадии меланомы также будут пересмотрены в сторону уменьшения травматичности и объема удаляемых тканей (удаление индексных узлов вместо полного удаления всего лимфоколлектора). Однако к настоящему времени у нас недостаточно данных, чтобы рекомендовать уменьшение объема хирургического вмешательства, тем не менее вполне достаточно данных, чтобы рекомендовать неоадъювантный подход для пациентов с резектабельными метастазами меланомы [264-269]. • Рекомендуется пациентам с поражением регионарных лимфоузлов (ШВ-О стадия заболевания или ее эквивалент) проведение предоперационной иммунотерапии с последующим выполнением регионарной лимфаденэктомии и последующей адъювантной терапией (вместе с неаодъювантной теарпией - общей длительностью до 12 мес.) 272]. Режимы применения приведены в табл. 9 Уровень убедительности рекомендаций - В (уровень достоверности доказательств - 2) Таблица 9. Режимы применения неоадъювантной терапии Лекарственный препарат Доза Путь введения Дни введения / приема Длительность цикла Монотерапия аРБ1 [270] Пембролизумаб* * 200 мг в/в кап 1 раз в 21 день, до 2 мес. ( 3 введения) перед лимфаденэктомией, с последующим продолжением суммарно до 12 мес. терапии • Рекомендуется пациентам, получающим предоперационную (неоадъювантную) иммунотерапию с поражением регионарных лимфоузлов (ШВ-0 стадия заболевания или ее эквивалент) провести оценку патоморфологического ответа после проведения регионарной лимфаденэктомии [268, 270-273]. Уровень убедительности рекомендаций — С (уровень достоверности доказательств — 4) • Рекомендуется пациентам с прогрессированием на фоне","terms":[{"source":"blacklist","term_id":"blacklist:bb962e3b8b71","canonical":"Интерфероны","search_word":"Интерфероны","host_word":"интерфероны","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Интерфероны","aliases":["рчИФН-α-2b","рчИФН-бета-1b"],"description":"рекомбинантный человеческий интерферон альфа-2b/бета-1b: реально действующая штука в инъекционной форме (только инъекционной) для лечения вирусных гепатитов, рассеянного склероза и рака. Капли/свечи/мази — псевдопрепараты, паразитирующие на славе вышеупомянутых двух единственно работающих настоящих препаратов, значимой эффективности не имеют и перечислены ниже, пруфы читать тут: [84], [85], [86]. Хотя некоторые единичные сведения об их возможной эффективности при ОРВИ есть: [87], [88]. Экспериментальный факт: необходимо четыре часа (!) прямого и непрерывного воздействия интерферона в высоких дозах на клетку, чтобы он оказал хоть какое-то действие, а эти препараты предлагают капельками капнуть в носик или суппозиториями вагинально/ректально засунуть — как бы для того, чтобы действующее вещество миновало первое прохождение печени и/или действовало прямо на место введения — показания любителей анального секса свечей разнятся, а данных исследований о необходимости такого введения нет [89]."}}]},{"id":"block:15f953e35278dfe0::case:8db8fbef09301fb0","block_id":"block:15f953e35278dfe0","case_id":"case:8db8fbef09301fb0","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «рисдиплама» находится в фразе «не рекомендуется ... одновременное применение ... рисдиплам»; это прямой запрет на его применение в комбинированной терапии.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"593_3","title":"Проксимальная спинальная мышечная атрофия 5q","link":"https://cr.minzdrav.gov.ru/view-cr/593_3","metadata":{"Название клинической рекомендации":"Проксимальная спинальная мышечная атрофия 5q","МКБ-10":"G12.0, G12.1","Возрастная группа":"Дети","Разработчик":"Всероссийское общество неврологов, Ассоциация профессиональных участников хосписной помощи, Ассоциация медицинских генетиков, Российская Ассоциация педиатрических центров","Дата размещения":"20.02.2023","Статус применения КР":"Применяется"}},"context_html":"та. Препарат онасемноген абепарвовек, применяемый однократно, представляет собой нереплицирующийся рекомбинантный аденоассоциированный вирусный (AAV) вектор, содержащий видоизмененную нуклеиновую кислоту с последовательностью гена SMN1. Трансген при попадании в ядро мотонейрона замещает потерянную из-за мутации функцию гена без встраивания в ДНК человека и восстанавливает продукцию белка SMN, который ответственен за сохранение и развитие мотонейронов [102-104]. Применение препарата онасемноген абепарвовек было изучено в завершённых клинических исследованиях START [104], STRIVE-EU [101] и STRIVE-US [106] у пациентов со СМА 1-го типа в возрасте до 9 мес. Продемонстрированы убедительная эффективность и безопасность препарата в этой возрастной группе. Результаты клинических исследований свидетельствуют, что применение онасемногена абепарвовека в терапевтической дозе обеспечивает быстрое развитие терапевтического эффекта, нарастающего в динамике, увеличение выживаемости и улучшение двигательной функции по шкале CHOP-INTEND по сравнению с естественным течением заболевания. Тестирование на наличие антител к аденоассоциированному вирусу 9 серотипа (ААV9) должно быть проведено пациентам для подтверждения возможности осуществления генозаместительной терапии. Препарат вводится внутривенно капельно. Введение генозаместительной терапии должно выполняться в условиях стационара, имеющего или отделения реанимации, или отделения интенсивной терапии. Наиболее частыми побочными эффектами применения онасемноген абепарвовека являются повышение активности печеночных трансаминаз, гепатотоксичность, рвота и пирексия. За 24 часа до и после инфузии онасемноген абепарвовека необходима иммуномодуляция глюкокортикоида (#преднизолон** перорально из расчета 1 мг/кг/сут или эквивалентная доза другого глюкокортикоида) [101,105-107].  Не рекомендуется применение комбинированной терапии (назначение патогенетической терапии после генозаместительной терапии) или одновременное применение 2 препаратов патогенетической терапии с одинаковой точкой приложения — ген SMN2 (например, 34 нусинерсен** и рисдиплам**), также не рекомендуется применение препаратов нусинерсен** и рисдиплам** на любой стадии СМА 5q пациентам с генетически подтвержденным диагнозом c 0 и 1 копией гена SMN2 в качестве патогенетической терапии заболевания. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: к комбинированной терапии также следует отнести назначение нусинерсена** или рис<mark class=\"hit\">диплам<\/mark>а** после применения онасемноген абепарвовека с учётом того, что оказываемый эффект после однократной инфузии, предположительно, сохраняется в течение всей жизни пациента [101]. На данный момент не существует доказательств эффективности и безопасности комбинированной терапии пациентов со СМА по сравнению с монотерапией, в связи с чем комбинированная терапия не должна применяться в рутинной клинической практике [104]. В настоящее время отсутствуют результаты клинических исследований, систематических обзоров, в которых изучается корреляция между уровнем экспрессии белка SMN и выраженностью клинического эффекта [101,104,108].  Рекомендуется применение препарата нусинерсен** на доклинической стадии СМА 5q пациентам с генетически подтвержденным диагнозом c 2 или 3 копиями гена SMN2 в качестве патогенетической терапии заболевания [66]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4)  Рекомендуется применение препарата онасемноген абепарвовек на доклинической стадии СМА 5q пациентам с генетически подтвержденным диагнозом c 2 или 3 копиями гена SMN2 в качестве патогенетической терапии заболевания. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4) Комментарии: применение препарата онасемногена абепарвовека было изучено в исследовании SPR1NT у пациентов в возрасте ≤6 недель со СМА и наличием 2 или 3 копий гена SMN2 без клинических симптомов. Промежуточные результаты этого исследования свидетельствуют о потенциальных преимуществах раннего назначения препарата младенцам сo СМА с досимптоматической стадией заболевания [109,110].  Рекомендуется в случае проведения неонатального скрининга и выявлении детей с 1 копией гена SMN2 назначение им онасемноген абепарвовека; в случае выявления детей с 2 или 3 копиями гена SMN2 назначение им онасемноген абепарвовека или нусинерсена** в качестве проведения патогенетической терапии заболевания [132, 133, 136]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4) 35  Рекомендуется в случае проведения неонатального скрининга при выявлении детей с 4 или более копиями гена SMN2 пристальное наблюдение за возникновением симптомов у пациентов с генетически подтвержденным диагнозом СМА 5q и применение терапии после манифестации первых признаков заболевания в качестве проведения патогенетической терапии [67, 135]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: применение препарата онасемноген абепарвовека","terms":[{"source":"mediq","term_id":"mediq:02dff6a3dd5a","canonical":"Диплам","search_word":"Диплам","host_word":"рисдиплама","inside_word":true,"mediq":{"name":"Диплам","kind":["OTHER"],"type":"CHECKED","quality":"NOT_PROVED","atx":"M09AX10","atx_group":"M09AX Препараты для лечения заболеваний опорно-двигательного аппарата прочие","mnn":"рисдиплам","description":"","criterions":[{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=risdiplam&t=1","points":0},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/risdiplam","points":1},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=risdiplam&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":7}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:d7e0787e10080335::case:90914d94defaf88a","block_id":"block:d7e0787e10080335","case_id":"case:90914d94defaf88a","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Хост-слово «ноотропные» в тексте прямо относится к препаратам, которые используются «широко и без надлежащего научного обоснования», при этом указано, что убедительных доказательств пользы нет; это контекст нежелательного/не рекомендуемого применения.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"594_3","title":"Расстройства аутистического спектра","link":"https://cr.minzdrav.gov.ru/view-cr/594_3","metadata":{"Название клинической рекомендации":"Расстройства аутистического спектра","МКБ-10":"F84.0, F84.1, F84.4, F84.5, F84.8, F84.9","Возрастная группа":"Дети","Разработчик":"Союз педиатров России, Ассоциация психиатров и психологов за научно-обоснованную практику","Дата размещения":"26.08.2024","Статус применения КР":"Применяется"}},"context_html":"кологические средства могут быть эффективными при лечении коморбидных расстройств, включая повышенную раздражительность, самоповреждающее поведение, агрессию, тревогу, депрессию, обсессивно-компульсивное расстройство (ОКР), кататонию, синдром дефицита внимания с гиперактивностью (СДВГ) или без нее (СДВ), расстройства сна. Фармакологическое лечение рекомендовано начинать только после того, как исключены иные, не относящиеся к психическим нарушениям, медицинские проблемы (болевые синдромы, эпилептические приступы и т.д.), а также влияние факторов окружающей среды. Применение лекарственных средств стоит рассматривать в тех случаях, когда поведенческие симптомы вызывают значительные нарушения функционирования и не поддаются немедикаментозной коррекции (см. Раздел 4.). В данном разделе рассматриваются те препараты, эффективность которых исследовалась при их использовании для лечения коморбидных расстройств у детей с РАС. Необходимо подчеркнуть, что при наличии коморбидных расстройств у детей с аутизмом должны выставляться дополнительные диагнозы этих расстройств, и только после этого возможно применение лекарственных средств, предусмотренных существующими рекомендациями и стандартами по каждому из выявленных расстройств. Несмотря на то, что отдельные селективные ингибиторы обратного захвата серотонина (СИОЗС) и Неселективные ингибиторы обратного захвата моноаминов (трициклические антидепрессанты, ТЦА) показаны детям и подросткам для лечения ОКР и депрессивных расстройств, данные об их применении и об их эффективности у пациентов с РАС ограничены. В профессиональной литературе подчеркивается необходимость исследования данных антидепрессантов у детей с РАС, но в настоящее время к лечению депрессии и ОКР у детей с РАС в мировой практике подходят так же, как и у детей с нейротипичным развитием. Из группы СИОЗС назначаются сертралин** и эсциталопрам в дозировках, одобренных для детей и подростков для лечения ОКР, а также антидепрессанты из группы Неселективные ингибиторы обратного захвата моноаминов (кломипрамин**). Широкое использование указанных лекарственных средств в педиатрической практике дает возможность экстраполировать результаты исследований их эффективности и безопасности на детей и подростков с РАС. Это особенно важно в связи с тем, что коморбидные расстройства встречаются у этих детей достоверно чаще, чем у детей с нейротипичным развитием. В российской неврологической и психиатрической практике широко и без надлежащего научного обоснования используются <mark class=\"hit\">ноотроп<\/mark>ные и пептидные препараты (N06B: Психостимуляторы, средства, применяемые при синдроме дефицита внимания с гиперактивностью, и ноотропные препараты), в том числе у детей с РАС, при том, что в настоящее время нет убедительных доказательств их способности повлиять на развитие когнитивных и речевых навыков. Более того, имеется достаточное количество сообщений о том, что они могут повышать двигательную активность, вызывать расторможенность и расстройства сна. Препараты с внутримышечным введением не рекомендовано применять также из-за риска развития постинъекционных абсцессов и болезненности инъекций. Контролируемые исследования безопасности и эффективности ноотропных средств (N06B: Психостимуляторы, средства, применяемые при синдроме дефицита внимания с гиперактивностью, и ноотропные препараты) в рецензируемых источниках медицинской информации отсутствуют. 3.1 Медикаментозное лечение коморбидных расстройств 1. Лечение депрессии, ОКР, тревожных расстройств Рекомендуется СИОЗС детям и подросткам с РАС для лечения коморбидных симптомов ОКР, тревожных расстройств, депрессии [107, 108,109]. Уровень убедительности рекомендаций В (уровень достоверности доказательств – 3) Комментарии: для лечения тревоги, депрессии, ОКР при аутизме изучалась эффективность циталопрама, эсциталопрама, флуоксетина**, флувоксамина и сертралина**. Хотя СИОЗС могут демонстрировать терапевтический эффект при расстройствах аутистического спектра, методологические недостатки многих клинических испытаний указывают на необходимость дополнительных исследований. Кроме того, учитывая возможные побочные эффекты СИОЗС, связанные с активацией и возбуждением, требуется более пристальное внимание к вопросам дозирования и оценки эффективности [107]. В России разрешен к применению сертралин** с 6 лет для лечения ОКР, флувоксамин с 8 лет для лечения ОКР. Остальные препараты разрешены с 18 лет. Сертралин** для детей с 6 до 12 лет начальная дозировка 25 мг/сут, с повышением через неделю до 50 мг/сут. Максимальная доза 200 мг/сут. Для подростков 13-17 лет - начальная доза 50 мг/сут [110]. Флувоксамин для детей с 8 лет и подростков: начальная доза 25 мг на один прием, предпочтительно перед сном. Дозу следует повышать на 25 мг с учетом переносимости каждые 4-7 дней до достижения эффективной суточной дозы. Эффективная суточная доза составляет 50-200 мг/сут, максимальная суточная доза - 200 мг. Суточную дозу выше 50 мг рекомендовано делить на два приема [111]. 2. Лечение раздражительности Рекомендуется #Рисперидон","terms":[{"source":"mediq","term_id":"mediq:df3ec7903a9b","canonical":"Ноотроп","search_word":"Ноотроп","host_word":"ноотропные","inside_word":true,"mediq":{"name":"Ноотроп","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:51249c2b8051196d::case:d1a633a065dd9156","block_id":"block:51249c2b8051196d","case_id":"case:d1a633a065dd9156","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Слово «безказеиновые» в контексте перечисления методов с не доказанной эффективностью относится к запрету/неиспользованию безказеиновой диеты при РАС (кроме оговоренных исключений).","evidence_quote":null,"confidence":null},"clinical":{"document_id":"594_3","title":"Расстройства аутистического спектра","link":"https://cr.minzdrav.gov.ru/view-cr/594_3","metadata":{"Название клинической рекомендации":"Расстройства аутистического спектра","МКБ-10":"F84.0, F84.1, F84.4, F84.5, F84.8, F84.9","Возрастная группа":"Дети","Разработчик":"Союз педиатров России, Ассоциация психиатров и психологов за научно-обоснованную практику","Дата размещения":"26.08.2024","Статус применения КР":"Применяется"}},"context_html":"Алгоритм ведения (дети) пациентов с РАС врачом-психиатром * Информация представлена в Разделе 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения Приложение В. Информация для пациента Родителям или законным представителям пациента с РАС необходимо в доступной форме объяснить природу, проявления, способы диагностики и методы вмешательств для данной группы расстройств. РАС - группа расстройств развития, характеризующаяся нарушениями в социальном взаимодействии и коммуникации, а также наличием ограниченного, стереотипного, повторяющегося поведения и/или интересов. Эти нарушения могут быть разной степени выраженности, при этом они могут как сопровождаться, так и не сопровождаться нарушениями речевого и интеллектуального развития. Причины возникновения РАС не до конца изучены, но ведущими в научном сообществе являются предположения о генетической природе РАС, однако есть исследования, подтверждающие влияние средовых факторов. Диагностика РАС включает в себя сбор анамнестических данных, а также оценку текущего (психиатрического) статуса и оценку уровня развития. Для уточнения диагноза и повышения точности клинической диагностики возможно использование дополнительных стандартизированных методик, относящихся к «золотому стандарту»: ADOS-II и ADI-R. Непосредственного лечения данной группы заболеваний на данный момент не существует, медикаментозное лечение направлено на решение различных неспецифических проблем, таких как нарушения сна и питания, приступы агрессии и аутоагрессии и др. К методам с доказанной эффективностью и безопасностью относится постоянная абилитация на основе поведенческих, психологических и образовательных подходов, описанных в разделе 4 настоящих клинических рекомендаций. Эти вмешательства эффективны для большинства детей с аутизмом, и ассоциированы с лучшими результатами. Использование интенсивных комплексных программ, начатых в раннем возрасте, в некоторых редких случаях может также приводить к оптимальному исходу, то есть нормализации развития и снятию диагноза. Чем раньше начинает оказываться помощь, тем лучше прогноз развития ребенка. Из-за существования большого количества методов лечения и помощи детям с РАС, не имеющих исследований, подтверждающих их эффективность и даже безопасность, очень важно предостеречь родителей от использования данных методов. Так, к методам с не доказанной эффективностью относятся безглютеновые и безк<mark class=\"hit\">азеино<\/mark>вые диеты (за исключением случаев наличия у ребенка подтвержденного диагноза целиакии, пищевой аллергии или непереносимости), микрополяризация мозга, метод Томатиса, биоакустическая коррекция, арт-терапия, иппо- и дельфинотерапия и многие другие. В случае, если родители настаивают на продолжении применения данных методов, важно подчеркнуть, что они не должны использоваться вместо основной программы абилитации, включающей методы и подходы с научно доказанной эффективностью. К методам, которые помимо не доказанной эффективности, могут приводить к разного рода негативным для здоровья ребенка последствиям, относятся: холдинг-терапия, оксигенация, хелирование и другие процедуры очищения от тяжелых металлов. Ноотропы (N068: Психостимуляторы, средства, применяемые при синдроме дефицита внимания с гиперактивностью, и ноотропные препараты) при лечении РАС также не оказывают положительного влияния на основные симптомы РАС, а их побочные эффекты слабо изучены. Важно информировать родителей об опасности данных методов. Для самостоятельной оценки риска РАС у ребенка и принятия решения об обследовании у психиатра родителям необходимо рекомендовать прохождение опросника M-CHAT-R на сайте: https://test.autism.help/. Дополнительную информацию о современном научном понимании проблематики РАС можно получить на сайтах: https://encyclopedia.autism.help/ (терминология, важные персоны, организации и так далее), https://research.autism.help/ (русскоязычные аннотации качественных исследований), https://autismjournal.help/ (научно-популярный журнал об аутизме, переводы статей, интервью и другие полезные материалы для родителей и специалистов). Приложение Г1-ГN. Шкалы оценки, вопросники и другие оценочные инструменты состояния пациента, приведенные в клинических рекомендациях Приложение Г1. Модифицированный скрининговый тест на аутизм для детей (пересмотренный, с дополнительным пошаговым интервью) Название на русском языке: Модифицированный скрининговый тест на аутизм для детей (пересмотренный, с дополнительным пошаговым интервью) Оригинальное название (если есть): Modified Checklist for Autism in Toddlers, Revised (M-CHATR/F) Источник (официальный сайт разработчиков, публикация с валидацией): https://mchatscreen.com; Robins D. L. et al. Validation of the modified checklist for autism in toddlers, revised with fol ения об обследовании у психиатра родителям необходимо рекомендовать прохождение опросника M-CHAT-R на сайте: https://test.autism.help/. Дополнительную информацию о современном научном понимании проблематики РАС можно получить на сайтах: https://encyclopedia.autism.help/ (терминология, важные персоны, организации и так далее), https://research.autism.help/ (русскоязычные аннотации качественных исследований), https://autismjournal.help/ (научно-популярный журнал об аутизме, переводы статей, интервью и другие полезные материалы для родителей и специалистов). Приложение Г1-ГN. Шкалы оценки, вопросники и другие оценочные инструменты состояния пациента, приведенные в клинических рекомендациях Приложение Г1. Модифицированный скрининговый тест на аутизм для детей (пересмотренный, с дополнительным пошаговым интервью) Название на русском языке: Модифицированный скрининговый тест на аутизм для детей (пересмотренный, с дополнительным пошаговым интервью) Оригинальное название (если есть): Modified Checklist for Autism in Toddlers, Revised (M-CHATR/F) Источник (официальный сайт разработчиков, публикация с валидацией): https://mchatscreen.com; Robins D. L. et al. Validation of the modified checklist for autism in toddlers, revised with follow-up (M-CHAT-R/F) //Pediatrics. – 2014. – Т. 133. – №. 1. – С. 37-45; Адаптированная версия перевода (прямая ссылка): https://mchatscreen.com/wpcontent/uploads/2019/12/M-CHAT-R_F_Russian_v3.pdf. Тип (подчеркнуть): - шкала оценки - индекс - вопросник - другое (уточнить): Назначение: Cкрининг симптомов расстройств аутистического спектра Содержание (шаблон): 20 вопросов о развитии и социально-коммуникативном поведении ребенка. Ключ (интерпретация): для всех вопросов за исключением вопросов 2, 5 и 12 ответ «Нет» указывает на риск РАС. Для вопросов 2, 5 и 12 ответ «Да» указывает на риск РАС. Результаты от 0 до 2 баллов по опроснику свидетельствуют о низком риске РАС. Никаких дальнейших действий не требуется, если наблюдение не указывает на риск РАС. Если ребенку меньше 24 месяцев, то после достижения двух лет возможно повторное тестирование. Результаты опросника от 3 до 7 баллов интерпретируются как средний риск. В этом случае специалисту рекомендуется провести дополнительное пошаговое ин","terms":[{"source":"mediq","term_id":"mediq:df3ec7903a9b","canonical":"Ноотроп","search_word":"Ноотроп","host_word":"ноотропные","inside_word":true,"mediq":{"name":"Ноотроп","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:0553e0911e16ce88::case:0a63b3bc9dca87bd","block_id":"block:0553e0911e16ce88","case_id":"case:0a63b3bc9dca87bd","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В контексте фразы «Не рекомендуется применять локально средства…, содержащие алоэ» алоэ прямо указано как нежелательное/запрещаемое средство.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"597_3","title":"Цервикальная интраэпителиальная неоплазия, эрозия и эктропион шейки матки","link":"https://cr.minzdrav.gov.ru/view-cr/597_3","metadata":{"Название клинической рекомендации":"Цервикальная интраэпителиальная неоплазия, эрозия и эктропион шейки матки","МКБ-10":"N86, N87, N88.0, N88.1, N88.2, N88.4, N88.8","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов, Общероссийская общественная организация «Российское общество специалистов по профилактике и лечению опухолей репродуктивной системы»","Дата размещения":"25.09.2024","Статус применения КР":"Применяется"}},"context_html":"[49]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: У молодых пациенток допустимо выполнение прицельной биопсии при условии полной визуализации ЗТ и отсутствия кольпоскопических признаков подозрения на инвазию [21], [30], [45], [49]. У женщин c HSIL старше 50 лет или при наличии ЗТ 3 типа показано проведение конусовидной эксцизии ЗТ (конизации) шейки матки с взятием ЭЦО. Рекомендуется для оценки риска наличия поражений высокой степени тяжести выполнить иммуноцитохимическое исследование биологического материала или патологоанатомическое исследование биопсийного (операционного) материала матки с применением иммуногистохимических методов – с определением коэкспрессии белков p16/Ki67 в ходе иммуноцитохимического (ИЦХ) исследования или белка р16 в ходе иммуногистохимического (ИГХ) исследования (при наличии возможности) [8], [50]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: Иммуноцитохимическое исследование биологического материала является дополнительным морфологическим методом. Положительная экспрессия р16 и Ki67 при ASCUS, ASC-H и LSIL предполагает большую вероятность наличия HSIL [50], [51], [52] 2.5 Иные диагностические исследования Рекомендовано использовать оптико-электронную диагностическую технологию в режиме реального времени для получения немедленного заключения о наличии цервикального поражения в условиях отсутствия лабораторной инфраструктуры при проведении скрининга рака шейки матки [53], [54], [55]. Уровень убедительности рекомендаций В (уровень достоверности доказательств – 2). Комментарии: Оптико-электронная технология обеспечивает чувствительность, сопоставимую с жидкостным цитологическим исследованием микропрепарата шейки матки и может использоваться как в качестве метода первичного скрининга, так и для сортировки пациенток с положительным результатом ВПЧ-тестирования [53], [54], [55]. 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения Диетотерапия не применяется. Рекомендуется проводить патогенетическое лечение истинной эрозии шейки матки в соответствии с причиной, вызвавшей десквамацию эпителия (воспалительные заболевания, травма, возрастная атрофия слизистых) [1], [3]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Не рекомендуется применять локально средства, влияющие на тканевой обмен, содержащие а<mark class=\"hit\">лоэ,<\/mark> облепихи масло, масло шиповника и др., в связи с возможным усилением пролиферативных процессов [1], [3]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Не рекомендуется лечить неосложненный эктропион шейки матки [47], [56]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: Врожденный эктропион (эктопия) у ВПЧ негативных женщин является неопасным состоянием в отношении развития предрака и РШМ [1], [3], [57]. Не рекомендуется проводить деструкцию эктопии, т.к. эктопия шейки матки является вариантом нормы и не требует лечения [47], [56]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5). Комментарии: Необоснованная деструкция эктопии и нормальной ЗТ в случае развития неоплазии не предупреждает прогрессию заболевания в скрытой части канала, но способствует трудностям в диагностике [1], [3], [12]. Не рекомендуется медикаментозное лечение плоскоклеточных интраэпителиальных поражений в качестве самостоятельного метода [12], [41], [49]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: Лечение иммуномодуляторами (по АТХ – L03 Иммуностимуляторы) продуктивного компонента ВПЧ-инфекции, инициирующей и поддерживающей прогрессию CIN, возможно лишь в дополнение к основно й тактике. В исследованиях с низким уровнем доказательности показан ряд положительных результатов в отношении препаратов на основе дииндолилметана, инозина пранобекса, гистидил-глицилвалил-серил-глицил-гистидил-глицил-глутаминил-гистидил-глицил-валил-гистидил-глицина и некоторых других препаратов [3], [12], [58], [59], [60], [61], [62]. Рекомендуется при LSIL динамическое наблюдение c использованием цитологического исследования микропрепарата шейки матки 1 раз в 6 месяцев в течение 18-24 месяцев (с целью раннего выявления прогрессирования) [49], [63], [64]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 2). Комментарии: У молодых пациенток с морфологически подтвержденным диагнозом LSIL (признаки ВПЧ инфекции, койлоцитоз, CIN I) и отсутствием АКК поражения высокой степени тяжести предпочтительна выжидательная тактика c динамическим наблюдением за состоянием шейки матки в течение 18-24 месяцев в виде цитологического контроля 1 раз в 6 месяцев и ВПЧ-тестирования 1 раз в 12 месяцев. Хирургическое лечение показано в случае отсутствия регрессии через 18-24 месяцев [1], [3], [12], [49], [64]. Рекомендуется деструктивное или эксцизионное лечение (в зависимости от","terms":[{"source":"mediq","term_id":"mediq:14b70d6dfff6","canonical":"Алоэ","search_word":"Алоэ","host_word":"алоэ","inside_word":false,"mediq":{"name":"Алоэ","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:0553e0911e16ce88::case:da9cfaccf02e99fc","block_id":"block:0553e0911e16ce88","case_id":"case:da9cfaccf02e99fc","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"«Масло шиповника» прямо входит в перечень локальных средств, которые не рекомендуется применять.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"597_3","title":"Цервикальная интраэпителиальная неоплазия, эрозия и эктропион шейки матки","link":"https://cr.minzdrav.gov.ru/view-cr/597_3","metadata":{"Название клинической рекомендации":"Цервикальная интраэпителиальная неоплазия, эрозия и эктропион шейки матки","МКБ-10":"N86, N87, N88.0, N88.1, N88.2, N88.4, N88.8","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов, Общероссийская общественная организация «Российское общество специалистов по профилактике и лечению опухолей репродуктивной системы»","Дата размещения":"25.09.2024","Статус применения КР":"Применяется"}},"context_html":"[49]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: У молодых пациенток допустимо выполнение прицельной биопсии при условии полной визуализации ЗТ и отсутствия кольпоскопических признаков подозрения на инвазию [21], [30], [45], [49]. У женщин c HSIL старше 50 лет или при наличии ЗТ 3 типа показано проведение конусов бор препарата осуществляется с учетом наличия у пациента сухого (непродуктивного) или влажного (продуктивного) кашля. • Рекомендуется пациентам с зависимостью от табака (никотина) при выявлении 20 гиперреактивности бронхов или обратимой бронхиальной обструкции (с показателем ОФВ1/ФЖЕЛ &gt;=0,7), а также с выраженной бронхиальной обструкцией с показателем ОФВ1/ФЖЕЛ &lt;0,7 назначение препаратов для лечения обструктивных заболеваний дыхательных путей, рекомендуемых врачами-пульмонологами или врачами-терапевтами, с целью уменьшения симптоматики ХОБЛ [30]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Комментарии: Препараты для лечения обструктивных заболеваний дыхательных путей (АТХ R03) - фармакологическая группа симптоматических лекарств, непосредственно снимающих бронхоспазм, блокируя его различными путями: Селективные бета2-адреномиметики (АТХ R03AC), Антихолинергические средства (АТХ R03BB). Адренергические средства в комбинации с антихолинергическими средствами (АТХ R03AL) Большое значение имеет быстрота начала и продолжительность бронхолитического действия препарата, а также выраженность и длительность бронхопротективного действия. Терапия назначается индивидуально в зависимости от выраженности нарушения. Если у пациента выявляется гиперреактивность бронхов или обратимая бронхиальная обструкция, то лечение начинается с монотерапии одним из препаратов группы селективных бета2-адреномиметиков или антихолинергических[ средств. Предпочтение отдается препаратам длительного (пролонгированного) действия. При выраженной бронхиальной обструкции или при неэффективности применения монотерапии целесообразно назначение комбинации адренергических средств в комбинации с антихолинергическими средствами. Предпочтение отдается фиксированным комбинациям препаратов. У лиц с ранее выявленной ХОБЛ и получавших бронхолитическую терапию в виде монотерапии стоит ее усилить за счет перевода на фиксированную комбинацию. Рекомендуемая продолжительность ле
