одится в три сеанса суммарной длительностью около часа. При этом сохраняется спазмолитический ответ оставшейся гладкой мускулатуры бронхов на применяемые бронходилататоры [311—316]. Использование БТ не означает, что пациент может отказаться от лекарственной терапии. Показано, что пациенты, получавшие БТ, демонстрируют 81 клинически значимый ответ и статистически значимое улучшение контроля БА. Проведение БТ приводило к сокращению числа серьезных обострений на 45%, после БТ с использованием системных ГКС [313]. 3.6 Методы нетрадиционной и альтернативной медицины В связи с отсутствием доказательств положительного клинического влияния на течение БА и улучшение функции легких у пациентов с БА не рекомендуется применение таких методов как иглоукалывание, китайская медицина, гомеопатия, фитотерапия, гипноз, техники релаксации, применение ионизаторов воздуха, ф<mark class=\"hit\">изиотерапия <\/mark>[21,317]. • Рекомендуется пациентам с БА дыхательная гимнастика (например, дыхание по методу Бутенко) как вспомогательное средство снижения уровня восприятия симптомов, преимущественно у пациентов с сочетанием БА и гипервентиляционным синдромом [318-325]. Уровень убедительности рекомендаций -В (уровень достоверности доказательств -2) Комментарии: В двух исследованиях [320,321] показана возможность некоторого уменьшения симптомов и потребности в КДБА при выполнении дыхательной гимнастики по Бутейко, но без влияния на функцию лёгких и воспаление. Обучение дыхательной гимнастике следует проводить под контролем специалиста. 3.7 Особенности лечения БА у беременных и в период г р у д н о г о вскармливания Физиологические изменения, происходящие при беременности, могут вызвать как ухудшение, так и улучшение течения БА. Беременность может влиять на течение БА, а сама астма может влиять на беременность. В период беременности под влиянием гормональных и механических факторов дыхательная система претерпевает существенные изменения: происходит перестройка механики дыхания, изменяются вентиляционно-перфузионные отношения [326]. В первом триместре беременности возможно развитие гипервентиляции вследствие гиперпрогестеронемии, изменения газового состава крови - повышения содержания РаС02. Появление одышки на поздних сроках беременности во многом обусловлено развитием механического фактора, который является следствием увеличения объема матки. В результате данных изменений усугубляются нарушения функции внешнего дыхания, снижаются жизненная емкость легких, форсированная жизненная емкость легких, ОФВ1. По мере увеличения срока гестации повышается сопротивление сосудов малого круга кровообращения, что также способствует развитию одышки. В связи с 82 этим одышка вызывает определенные трудности при проведении дифференциальной диагностики между физиологическими изменениями функции внешнего дыхания на фоне беременности и проявлениями бронхообструкции [326]. Нередко у беременных без соматической патологии развивается отек слизистых оболочек носоглотки, трахеи и крупных бронхов. Данные проявления у беременных с БА также могут усугублять симптоматику заболевания. Ухудшению течения БА способствует низкая комплаентностъ: многие пациентки пытаются отказаться от приема ингаляционных глюкокортикостероидов (ИГКС) из-за боязни их возможного побочного действия. В таких случаях врачу следует объяснить женщине необходимость проведения базисной противовоспалительной терапии в связи с отрицат","terms":[{"source":"marker","term_id":"marker:6c2be83d36aa","canonical":"физиотерапия","search_word":"физиотерапия","host_word":"физиотерапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:af1462838049ddd0::case:722323b78b8b9fcf","block_id":"block:af1462838049ddd0","case_id":"case:722323b78b8b9fcf","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте перечисления исключаемых из рациона продуктов указано: «Необходимо исключить из рациона чеснок», то есть чеснок прямо запрещён.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"369_2","title":"Пузырчатка","link":"https://cr.minzdrav.gov.ru/view-cr/369_2","metadata":{"Название клинической рекомендации":"Пузырчатка","МКБ-10":"L10","Возрастная группа":"Взрослые, дети","Разработчик":"Общероссийская общественная организация \"Российское общество дерматовенерологов и косметологов\"","Дата размещения":"07.08.2024","Статус применения КР":"Применяется"}},"context_html":"ироваться с врачом-гастроэнтерологом перед применением препарата ритуксимаб**; в отношении таких пациентов следует проводить соответствующий мониторинг и принимать меры по реактивации вируса гепатита В в соответствии со стандартами. Пациентам с пузырчаткой обыкновенной следует проводить премедикацию метилпреднизолоном** в дозе 100 мг внутривенно за 30 минут до начала каждой инфузии для уменьшения частоты и тяжести инфузионных реакций [73]. Ритуксимаб** вводят только внутривенно капельно, через отдельный катетер. Рекомендуемая начальная скорость первой инфузии 50 мг/час; после первых 30 минут скорость можно увеличивать на 50 мг/час каждые 30 минут, доводя до максмальной скорости 400 мг/час. Последующие инфузии препарата 21 ритуксимаб** можно начинать со скорости 100 мг/час и увеличивать скорость на 100 мг/час каждые 30 минут, доводя до максмальной скорости 400 мг/час. Во время инфузии следует постоянно наблюдать за пациентами с целью выявления первых признаков синдрома высвобождения цитокинов. Следует немедленно прекратить инфузию препарата пациентам, у которых развились симптомы тяжелых реакций, особенно тяжелой одышки, бронхоспазма или гипоксии. Последующие инфузии препарата ритуксимаб** следует назначать не ранее чем через 16 недель после предыдущего введения препарата. Поддерживающую терапию препаратом ритуксимаб** в дозе 500 мг внутривенно следует проводить на 12 и 18 месяц терапии, затем каждые 6 месяцев, основываясь на оценке клинической ситуации. В случае рецидива пациенты могут получить 1000 мг препарата ритуксимаб** внутривенно. В случае развития рецидива у пациента с пузырчаткой, получающего терапию ритуксимабом**, лечащему врачу следует рассмотреть возможность возобновления терапии кортикостероидами системного действия или увеличения их дозы на основании оценки клинической ситуации. Противопоказанием для назначения ритуксимаба** при пузырчатке является детский возраст до 18 лет. Тем не менее, описан случай назначения ритуксимаба** в комбинации с кортикостероидами системного действия 16-летнему пациенту с тяжелой пузырчаткой, в результате чего через 1,5 месяца был достигнут полный регресс высыпаний, а через 8 месяцев были отменены кортикостероиды системного действия [81]. 3.2 Хирургическое лечение Не применяется. 3.3 Иное лечение • Рекомендуется пациентам с пузырчаткой диетическое питание - частые и дробные приемы пищи [54]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Комментарии: Необходимо исключить из рациона <mark class=\"hit\">чеснок<\/mark>, лук, горчицу, хрен, брокколи, цветную капусту; маниоку, манго, гуарану, орех кола, черный грецкий орех, малину, вишню, клюкву, розмарин, ванилин, кофе, корни имбиря, женьшеня, чай, матэ, различные специи (кориандр, тмин, черный перец) [14, 54]. При поражении полости рта в рацион больного включают супы-пюре, а также слизистые каши с целью недопущения полного отказа от пищи. Диета должна предусматривать ограничение поваренной соли, углеводов и при этом содержать белки и витамины. Пищевые продукты, содержащие тиоловую группу и группу фенольных соединений - танины, могут провоцировать обострение пузырчатки. 22 Обезболивание не применяется. 4. Медицинская реабилитация и санаторно-курортное лечение, медицинские показания и противопоказания к применению методов реабилитации, в том числе основанных на использовании природных лечебных факторов Пациенты могут быть допущены к работе, не требующей чрезмерного физического и умственного перенапряжения, а также не связанной с переохлаждением и пребыванием на солнце. Больным со всеми формами пузырчатки противопоказана инсоляция, необходимо постоянно использовать солнцезащитные кремы с максимальной степенью защиты. Больным важно соблюдать режим труда, отдыха и сна. Не допускается лечение минеральными водами и грязями на курортах, лечебные и косметические массажи. 5. Профилактика и диспансерное наблюдение, медицинские показания и противопоказания к применению методов профилактики Профилактика не применяется. Для предупреждения обострений заболевания доза кортикостероидов системного действия снижается очень медленно до поддерживающей дозы строго под контролем врачадерматовенеролога. В летнее время и периоды эпидемий вирусных инфекций снижать дозу кортикостероидов системного действия нецелесообразно. Перед проведением хирургических вмешательств, зубного протезирования нецелесообразно снижать дозу кортикостероидов системного действия или возможно проведение инъекций бетаметазона (противопоказан детям до 3 лет) в дозе 1 мл в/м за 5 дней до планируемого хирургического вмешательства, перед операцией и через неделю после нее [77]. Обязательно проведение корригирующей терапии. После выписки из стационара такие больные должны постоянно находиться под наблюдением врача-дерматовенеролога и смежных специалистов [62, 63]. Диспансерному контролю подлежат все больные, страдающие пузырчаткой. Кратность посещения врачадерматовенеролога должна зависеть от степени тяжести пузырчатки и суточной дозы кортикостероидов системного действия . На","terms":[{"source":"mediq","term_id":"mediq:1cfb6cd6f5d1","canonical":"Чеснок","search_word":"Чеснок","host_word":"чеснок","inside_word":false,"mediq":{"name":"Чеснок","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:0a8b7190bdf87460::case:4fd4e46563f1aa28","block_id":"block:0a8b7190bdf87460","case_id":"case:4fd4e46563f1aa28","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Термин «атлетика» стоит в перечне особенно травматичных видов спорта, которыми пациентам с муковисцидозом не следует заниматься; это прямой запрет/избегание.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"372_2","title":"Кистозный фиброз (муковисцидоз)","link":"https://cr.minzdrav.gov.ru/view-cr/372_2","metadata":{"Название клинической рекомендации":"Кистозный фиброз (муковисцидоз)","МКБ-10":"E84","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков, Российское респираторное общество, Российское трансплантологическое общество , Ассоциация детских врачей Московской области","Дата размещения":"03.09.2021","Статус применения КР":"Применяется"}},"context_html":"ам с момента постановки диагноза, в любом возрасте, как с легочными проявлениями заболевания, так и с кишечными симптомами. У грудных детей обычно применяют пассивную технику кинезитерапии, включающую: o специальные дренажные положения, в которых улучшается эвакуация слизи из лёгких; o контактное дыхание; o массаж с лёгкой вибрацией и поглаживанием; o клопфмассаж (постукивание в 8-ми точках грудной клетки); o занятия на гимнастическом мяче; o дыхание с помощью маски, создающей положительное давление на выдохе; o дренаж с помощью специального вибрационного жилета: у пациентов с муковисцидозом в любом возрасте (от новорожденного до взрослого). Эффективность тех или иных методов КНТ варьирует в зависимости от индивидуальных особенностей пациентов с МВ. Чем младше ребёнок, тем более пассивные методики дренирования следует использовать. Новорождённым выполняют только перкуссию и 117 компрессию грудной клетки. По мере роста ребёнка следует постепенно вводить более активные методики, обучая пациентов технике контролируемого откашливания. Услуги по приказу Минздрава России от 13.10.2017 N 804н «Об утверждении номенклатуры медицинских услуг»: o Массаж при хронических неспецифических заболеваниях легких o Общий массаж и гимнастика у детей раннего возраста o Массаж грудной клетки медицинский  Рекомендуются пациентам с муковисцидозом регулярные занятия лечебной физкультурой с целью улучшения эвакуации мокроты, укрепления дыхательной мускулатуры, повышения эмоционального тонуса пациента [1,2,22,178]. (УУР – C, УДД – 5). Комментарии: занятия лечебной физкультурой позволяют: o эффективно лечить и предупреждать обострения хронического бронхолёгочного процесса; o формировать правильное дыхание; o тренировать дыхательную мускулатуру; o улучшать вентиляцию лёгких; o повышать эмоциональный тонус пациента. С раннего детства (начиная 3-х лет) необходимо стимулировать пациентов заниматься динамическими видами спорта, связанными с нагрузками средней интенсивности, особенно сопряжёнными с пребыванием на свежем воздухе. Физические упражнения облегчают очищение бронхов от вязкой мокроты и развивают дыхательную и общую мускулатуру. Некоторые упражнения укрепляют грудную клетку и исправляют осанку. В редких случаях тяжесть состояния пациента полностью исключает возможность занятия физическими упражнениями. Поэтому вопросы спортивной активности (выбор вида спорта и нагрузки) должен решать лечащий врач. Пациентам с МВ не следует заниматься особенно травматичными видами спорта (тяжёлая <mark class=\"hit\">атлетика<\/mark>, футбол, хоккей и т.п.), поскольку длительное ограничение физической активности, связанное с восстановлением после травмы, неблагоприятно сказывается на дренажной функции лёгких. Услуги по приказу Минздрава России от 13.10.2017 N 804н «Об утверждении номенклатуры медицинских услуг»: o Лечебная физкультура при заболеваниях бронхолегочной системы o Механотерапия при заболеваниях бронхолегочной системы 118 o Лечебная физкультура с использованием аппаратов и тренажеров при заболеваниях бронхолегочной системы o Дыхательные упражнения дренирующие o Лечебная физкультура с биологической обратной связью при заболеваниях бронхолегочной системы 3.3 Диетотерапия и витаминотерапия 3.3.1 Общие принципы диетотерапии у пациентов с МВ Диетотерапия составляет важную часть комплексной терапии при МВ [1,2,22].  Рекомендуется всем пациентам с муковисцидозом увеличение суточного потребления калорий до 120-150% по сравнению с нормами по возрасту, пропорциональное увеличение потребления высококачественного белка (20% от суточного калоража) и жира (35-40% от суточного калоража) с целью поддержания адекватного нутритивного статуса [62]. (УУР – C, УДД – 5). Комментарий: Пациентам с МВ необходима ранняя нутритивная поддержка. Установлена непосредственная связь между состоянием питания и функцией легких. Существует прямая корреляция между показателем индекса массы тела, функцией легких и продолжительностью жизни. Индекс массы тела (ИМТ) = масса тела (кг) / квадрат роста (м2). При ИМТ &gt;50 перцентиля (при ИМТ = 21 – 22 кг/м2 у взрослых) зарегистрировано существенное улучшение показателя ОФВ1. Высокий перцентиль показателя вес/возраст ассоциируется с лучшими показателями ОФВ1, линейного роста, снижением сроков госпитализации, снижением количества бронхолегочных обострений, а также увеличением продолжительности жизни. Белки Пациенты с МВ нуждаются в повышенном количестве белка из-за его потерь (мальабсорбции) и в дополнительном поступлении его в период катаболизма при легочных обострениях. Источниками полноценного белка являются натуральные продукты (мясо, птица, рыба, морепродукты, молоко, кисломолочные продукты, творог, сыры, яйца). Детям старше года рекомендуется включать в рацион высокобелковые продукты (яйца, рыба, творог, сыр) не реже 3 раз в день, молоко и кисломолочные продукты не менее 500 – 800 мл в день. Взрослым пациентам с муковисцидозом рекомендовано употреблять в день 2 – 3 порции продуктов, содержащих белок высокой биологической ценности (мясо, птица, рыба, яйца, творог,","terms":[{"source":"mediq","term_id":"mediq:747f26b04d20","canonical":"Атлетика","search_word":"Атлетика","host_word":"атлетика","inside_word":false,"mediq":{"name":"Атлетика","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx" cation","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте перечня природной резистентности указано, что S. aureus природно устойчив к полимиксину В/колистину, то есть полимиксин здесь относится к антибактериальным средствам, к которым возбудитель устойчив; для указанного фрагмента это соответствует запрету/нецелесообразности применения.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"372_2","title":"Кистозный фиброз (муковисцидоз)","link":"https://cr.minzdrav.gov.ru/view-cr/372_2","metadata":{"Название клинической рекомендации":"Кистозный фиброз (муковисцидоз)","МКБ-10":"E84","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков, Российское респираторное общество, Российское трансплантологическое общество , Ассоциация детских врачей Московской области","Дата размещения":"03.09.2021","Статус применения КР":"Применяется"}},"context_html":"сть жизни у пациентов класса А составляет 15—20 лет, послеоперационная летальность при полостном хирургическом вмешательстве - 10 %. Класс В является показанием для рассмотрения вопроса о пересадке печени; при этом послеоперационная летальность при полостном хирургическом вмешательстве достигает 30 %. У больных класса С ожидаемая продолжительность жизни достигает 1-3 года, а послеоперационная летальность при полостном вмешательстве - 82 %. На основании критериев Чайлда - Пью предложено оценивать необходимость в трансплантации печени: высокая необходимость у пациентов, относящихся к классу С, умеренная - у пациентов класса В и низкая - у пациентов класса А [336] Оценка выживаемости пациентов с циррозом печени [https://www.gastroscan.ru/handbook/117/7543]. Класс по Чайлд-Пью Баллы Годичная выживаемость, % Двухлетняя выживаемость, % A 5–6 100 85 214 B 7–9 81 57 C 10–15 45 35 215 Приложение Г4. Рентгеноденситометрия у пациентов с МВ Двуэнергетическая рентгеновская денситометрия (Рентгеноденситометрия) (DXA) является «золотым стандартом» количественного определения костной массы (минеральной плотности кости или МПК). В современной клинической практике индивидуальная МПК сравнивается с референсной базой данных. Наиболее приемлемым способом оценки МПК является оценка с помощью Т-и Zкритериев. Т-критерий представляет собой количество стандартных отклонений выше и ниже среднего показателя пика костной массы у молодых. Применим только у женщин в пери- и постменопаузе и у мужчин 50 лет и старше [127,337]. У детей, подростков, взрослых (мужчин младше 50 лет и женщин в пременопаузе) для оценки МПК используется Z-критерий (количество стандартных отклонений выше и ниже среднего показателя для лиц аналогичного возраста). Т-критерий никогда не используется (А). В случае, когда содержание костных минералов или МПК по Z-критерию соответствует уровню ≤ -2 SD, следует применять термин «низкое содержание минерала в кости или низкая МПК для данного хронологического возраста» [51,127,337]. 216 Приложение Г5. Алгоритм обследования и тактика решения вопроса репродукции у мужчин с МВ Алгоритм обследования и тактика решения вопроса репродукции, который зависит от трех составляющих: результатов генетического обследования, результатов спермиологического исследования и статуса фертильности супруги. 217 Приложение Г6. Данные о природной резистентности ведущих микроорганизмов при МВ [Error! Reference source not found.] S. aureus обладает природной устойчивостью к азтреонаму, темоциллину, <mark class=\"hit\">полимикс<\/mark>ину В/ колистину, налидиксовой кислоте и цефтазидиму**. Все НГОБ обладают природной устойчивостью к бензилпенициллину**, цефалоспоринам первого и второго поколения, гликопептидам, фузидовой кислоте, макролидам, линкозамидам, стрептограминам, рифампицину**, даптомицину** и линезолиду**. P.aeruginosa природно устойчива к ампициллину, амоксициллин/клавулановая кислоте, цефазолину**, цефалексину**, цефалотину, цефадроксилу, цефотаксиму**, цефтриаксону**, эртапенему**, хлорамфениколу**, канамицину**, неоми ms":[{"source":"mediq","term_id":"mediq:827029050210","canonical":"Полимикс","search_word":"Полимикс","host_word":"полимиксину","inside_word":true,"mediq":{"name":"Полимикс","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:18b1ddd4364171b6::case:8cd76eca3e76d2cc","block_id":"block:18b1ddd4364171b6","case_id":"case:8cd76eca3e76d2cc","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «гомеопатических» находится в явной фразе «Не рекомендуется применение ... гомеопатических препаратов» для пациентов с галактоземией; это прямой запрет, а не рекомендация. Уровень убедительности указан в той же строке.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"375_3","title":"Нарушения обмена галактозы (Галактоземия)","link":"https://cr.minzdrav.gov.ru/view-cr/375_3","metadata":{"Название клинической рекомендации":"Нарушения обмена галактозы (Галактоземия)","МКБ-10":"E74.2","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков, Общероссийская общественная организация содействия развитию неонатологии «Российское общество неонатологов»","Дата размещения":"21.08.2024","Статус применения КР":"Применяется"}},"context_html":"ится в период, начиная от 4 до 6 месяцев жизни. В питании используются только безмолочные продукты и блюда прикорма: безмолочные каши, желток, а также овощное, мясное и фруктовое пюре. Все молочные продукты, включая цельное коровье молоко, кисломолочные продукты, творог, запрещаются к использованию у пациентов с ГАЛ. Вид первого прикорма определяется состоянием желудочно-кишечного тракта и нутритивным статусом ребенка. Это может быть овощное пюре для детского питания без добавления молока (и не имеющих в составе бобовых) или безмолочные каши на основе кукурузной, рисовой или гречневой муки, для разведения которых 26 необходимо использовать ту специализированную смесь, которую получает ребенок. Мясной прикорм вводят в питание с 6 месяцев. Преимущество отдают специализированным детским мясным консервам промышленного выпуска, не содержащим молока и его производных, и субпродуктов (на основе мяса кролика, цыпленка, индейки и др.) Примерные сроки введения прикорма детям первого года жизни с ГАЛ приведены в Приложении Г4. У пациентов с GD активность ГАЛТ составляет 15-25% от нормальной и обычно протекает бессимптомно. Младенцы с GD, соблюдающие галактозосодержащую диету (например, грудное молоко или обычную смесь), имеют повышенные уровни Gal-1-P в эритроцитах. Эти биохимические нарушения нормализуются на диете с ограничением лактозы; однако даже при неограниченном питании уровни обычно нормализуются в течение первого года жизни. Несмотря на биохимические отклонения, пациенты не получавшие элиминационную диетотерапию с GD- не продемонстрировали неблагоприятных клинических исходов во всех исследованиях, проведенных на сегодняшний день. Последние клинические рекомендации по ведению пациентов с ГАЛ не рекомендуют лечение пациентов с вариантом GD, однако при появлении клинических симптомов, указывающих на поражение печени или при высоких уровнях тотальной галактозы превышающие 20 мг/% можно рассмотреть вопрос об ограничении поступления лактозы с пищей. Примерные сроки введения и продукты прикорма пациентам с галактоземией представлены в Приложении А3.3 Не рекомендуется применение лекарственных препаратов, содержащих лактозу/галактозу, а также гомеопатических препаратов, настоек и спиртовых лекарственных форм пациентам любого возраста, с целью предотвращения накопления галактозы и ее метаболитов [1, 3, 4]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств – 5) Комментарии: лактоза нередко используется в качестве вспомогательного вещества в <mark class=\"hit\">гомеопат<\/mark>ических лекарственных средствах. Этанол** тормозит элиминацию галактозы из печени. Рекомендуется включать в рацион при ГАЛ I любое количество и вид фруктов, овощей, бобовых, неферментированных продуктов на основе сои, зрелых сыров (с содержанием галактозы &lt;25 мг/100 г) и пищевых добавок с содержанием казеината натрия или кальция [1,3,4,13]. 27 Уровень убедительности рекомендаций - С (уровень достоверности доказательств – 5) Комментарии: хотя все продукты на основе ферментированной сои содержат больше галактозы, они могут быть разрешены в небольших количествах, в рационе у детей старше 1 года. Рекомендуется назначение диеты с ограничением галактозы/лактозы пациентам с генерализованной формой ГАЛ III с целью предотвращения поступления галактозы в организм, за исключением пациентов с промежуточной (доброкачественной) формой болезни [20]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств – 5) Комментарии: пациентам с этой формой ГАЛ требуются поступление следовых количеств галактозы с пищей: младенцев следует кормить смесью (например, соевой смесью), которая содержит небольшое количество галактозы или лактозы. В то время как необходимо диетическое ограничение молочных продуктов с высоким содержанием галактозы, не следует ограничивать немолочные источники галактозы (бобовые, некоторые фрукты и овощи, субпродукты). Рекомендуется постоянное диетическое ограничение молочных продуктов у детей старшего возраста. Рекомендуется инфузионная терапия пациентам, находящимся в состоянии метаболического криза, с целью коррекции водно-электролитного баланса, поддержания нормального уровня глюкозы в крови, лечения гемостазиологических нарушений, восстановления функций печени и почек [1, 3, 4, 29]. Уровень убедительности рекомендаций - С (уровень достоверности доказательств – 5) Комментарии: показанием к инфузионной терапии являются гипогликемия, гиповолемия, гипокоагуляция, лабораторные признаки печеночной и почечной недостаточности, недостаточность питания. Рекомендуется антибактериальная терапия в соответствии с данными по чувствительности/резистентности микроорганизмов и/или чувствительностью выделенной микрофлоры пациентам, имеющим очаги инфекции с целью предотвращения распространения инфекции и развития сепсиса [1, 3, 7]. 28 Уровень убедительности рекомендаций - С (уровень достоверности доказательств – 5) Комментарии: согласно рекомендациям по сепсису Рекомендуется прием в возрастных дозировках препаратов кальция и Колекальциферола** (код АТХ А","terms":[{"source":"marker","term_id":"marker:1317684c67c8","canonical":"гомеопат","search_word":"гомеопат","host_word":"гомеопатических","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:b9d7a7d02025fea9::case:2e5adedfa18c28a9","block_id":"block:b9d7a7d02025fea9","case_id":"case:2e5adedfa18c28a9","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «горчичников» находится в фразе «не рекомендуется применение горчичников…» и само является запрещаемым методом лечения; рядом есть прямые УУР/УДД для этой рекомендации.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"381_3","title":"Бронхит","link":"https://cr.minzdrav.gov.ru/view-cr/381_3","metadata":{"Название клинической рекомендации":"Бронхит","МКБ-10":"J20, J40, J41, J42","Возрастная группа":"Дети","Разработчик":"Союз педиатров России, Российское респираторное общество, Межрегиональная ассоциация по клинической микробиологии и антимикробной химиотерапии, Общероссийская общественная организация Педиатрическое респираторное общество","Дата размещения":"19.12.2024","Статус применения КР":"Применяется"}},"context_html":"тивной медицины при остром бронхите у детей показал, что назначение фитопрепаратов в виде монотерапии улучшало течение заболевания, уменьшало выраженность симптомов при достаточно хорошей переносимости. Учитывая имеющиеся данные о безопасности и вероятной эффективности, а также высокой приверженности к фитотерапии при ОБ, детям с признаками острого бронхита и наличием продуктивного кашля, в случае отсутствия противопоказаний, возможно селективное назначение фитопрепарато арабанные пальцы» и ногтевых пластин по типу «часовые стекла и др. – см. Приложение Г1. Затяжной бактериальный бронхит встречается у детей нечасто и применение антибактериальных препаратов системного действия даже в случае подозрения на бактериальную этиологию ОБ, должно быть обосновано тяжестью состояния и/или лабораторными маркерами бактериального воспаления. Выбор антибактериального препарата системного действия осуществляют в соответствии с выделенным патогеном и данными о локальной чувствительности возбудителя к антибиотикам. Пациента с подозрением на затяжной бактериальный бронхит, особенно при неоднократны","terms":[{"source":"mediq","term_id":"mediq:2458aa6c2d93","canonical":"Горчичник","search_word":"Горчичник","host_word":"горчичников","inside_word":true,"mediq":{"name":"Горчичник","kind":["OTHER"],"type":"MNN_NOT_FOUND","quality":"NOT_PROVED","atx":"M02AX10","atx_group":"M02AX Препараты для лечения заболеваний опорно-двигательного аппарата для местного назначения другие","mnn":"","description":"Мы не нашли действующее вещество у данного препарата, поэтому эффективность его не может быть доказанной.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:7711ca657cabe793::case:d7eb1f94a4ddc9bf","block_id":"block:7711ca657cabe793","case_id":"case:d7eb1f94a4ddc9bf","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В контексте прямо сказано, что введение менадиона натрия бисульфита для лечения острого кровотечения на фоне АВК не эффективно; это запрет/нецелесообразность именно для данного препарата.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"382_1","title":"Фибрилляция и трепетание предсердий у взрослых","link":"https://cr.minzdrav.gov.ru/view-cr/382_1","metadata":{"Название клинической рекомендации":"Фибрилляция и трепетание предсердий у взрослых","МКБ-10":"I48.0, I48.1, I48.2, I48.3, I48.4, I48.9","Возрастная группа":"Взрослые","Разработчик":"Ассоциация 6]. ЕОК — IIaB (УУР C, УДД 5) В случае развития кровотечения у пациентов, принимающих ПОАК, рекомендовано выяснить время приема последней дозы препарата [27, 75, 137]. ЕОК — IC (УУР C, УДД 5) Комментарии: Проведение лабораторных тестов, характеризующих антикоагулянтную активность ПОАК, целесообразно в том случае, если развилось тяжелое кровотечение и обсуждается введение препаратов, нейтрализующих действие ПОАК. При жизнеугрожающих кровотечениях потеря времени на проведение данных тестов нецелесообразна. Перечень соответствующих лабораторных показателей приведен в таблице П7 приложения Г2. Оптимальным способом нейтрализации действия АВК является парентеральное введение или пероральный прием витамина К1, который в РФ в настоящее время не зарегистрирован. Доступный на отечественном фармацевтическом рынке <mark class=\"hit\">Менадиона натрия бисульфит<\/mark>** является предшественником витамина К2, действие которого наступает очень медленно, поэтому введение Менадиона натрия бисульфита** для лечения острого кровотечения на фоне АВК не эффективно. Предпочтительным подходом является введение концентрата протромбиного комплекса, содержащего факторы свертывания, синтез которых блокируют АВК, а также протеины С и S. Пациентам с ФП, имеющим симптомы острого клинически значимого кровотечения, рекомендовано прервать терапию пероральными антикоагулянтами до устранения причины кровотечения [27, 75]. ЕОК — IC (УУР C, УДД 5) Принимающим дабигатрана этексилат** пациентам в случае жизнеугрожающего кровотечения или потребности в экстренном хирургическом вмешательстве рекомендовано ввести идаруцизумаб [135,137]. ЕОК — IIaB (УУР В, УДД 3) Комментарии: В случае отсутствия специфических антидотов может быть использован факторы свертывания крови II, VII, IX и X в комбинации [Протромбиновый комплекс], в качестве препарата второй линии может быть использован фактор свертывания крови VII**. Рекомендована оценка возможности возобновления антикоагулянтной терапии после эпизода кровотечения с участием всех заинтересованных специалистов [138-141]. ЕОК — IIa B (УУР А, УДД 3) Комментарии: Соответствующее решение должно приниматься мультидисциплинарной командой на основании сопоставления риска и предполагаемой тяжести повторного кровотечения с риском тромбоэмболии. Консилиуму следует оценить все возможности антикоагулянтного лечения и прочих вмешательств для профилактики инсульта, определить тактику максимальной коррекции факторов риска кровотечений и инсульта. Малые кровотечения требуют лишь временной отмены антикоагулянтов (АВК до снижения МНО &lt;2,0, а ПОАК на 1 день). Важно объяснить пациенту значение приверженности терапии и необоснованность отказа от приема АКТ даже в случае рецидивирования малых кровотечений. Всем пациентам с артериальной гипертонией и ФП рекомендован контроль уровня артериального давления, что позволяет снизить риск кровотечений [128]. ЕОК — IIaB (УУР С, УДД 4) Пациентам с высоким риском желудочно-кишечного кровотечения рекомендовано предпочесть АВК или другой ПОАК, а не дабигатрана этексилат** 150 мг 2 раза в сутки и ривароксабан** 20 мг в сутки [143–150]. ЕОК — IIaB (УУР А, УДД 1) Рекомендовано обсуждать отказ от употребления алкоголя с пациентами, получающими терапию пероральными антикоагулянтами [23]. ЕОК — IIa C (УУР С, УДД 5) Рутинное определение генетически обусловленной чувствительности к варфарину** не реко","terms":[{"source":"mediq","term_id":"mediq:d053fdac9d85","canonical":"Менадиона натрия бисульфит","search_word":"Менадиона натрия бисульфит","host_word":"Менадиона натрия бисульфит","inside_word":false,"mediq":{"name":"Менадиона натрия бисульфит","kind":["OTHER"],"type":"CHECKED","quality":"NOT_PROVED","atx":"B02BA02","atx_group":"B02BA Витамин K","mnn":"менадион","description":"","criterions":[{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=menadione&t=1","points":0},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/menadione","points":0},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=menadione&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":10}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:c4d1223a52be8673::case:fa96ac0a611b41ea","block_id":"block:c4d1223a52be8673","case_id":"case:fa96ac0a611b41ea","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Трифосаденин прямо входит в перечень препаратов, которые \"не рекомендуется\" применять пациентам с обструктивной болезнью легких и ФП.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"382_1","title":"Фибрилляция и трепетание предсердий у взрослых","link":"https://cr.minzdrav.gov.ru/view-cr/382_1","metadata":{"Название клинической рекомендации":"Фибрилляция и трепетание предсердий у взрослых","МКБ-10":"I48.0, I48.1, I48.2, I48.3, I48.4, I48.9","Возрастная группа":"Взрослые","Разработчик":"Ассоциация сердечно-сосудистых хирургов России, Общероссийская общественная организация «Российское кардиологическое общество», Всероссийское научное общество специалистов по клинической электрофизиологии, аритмологии и электростимуляции","Дата размещения":"12.11.2020","Статус применения КР":"Применяется"}},"context_html":"ендовано внутривенное введение селективных блокаторов кальциевых каналов с прямым влиянием на сердце (Верапамил**) [23]. ЕОК — IIaС (УУР C, УДД 5) У пациентов с ФП и ОКС, сопровождающихся клиникой сердечной недостаточности, рекомендуется внутривенное введение дигоксина** с целью снижения частоты желудочкового ритма [23]. ЕОК — IIbС (УУР C, УДД 5) Не рекомендуется применение пропафенона** у пациентов с ФП и ОКС [217, 224, 228, 232, 270, 274]. ЕОК — IIIB (УУР C, УДД 5) 3.3.12. Пациенты с сахарным диабетом Компенсация СД рекомендована пациентам с диагностированной ФП и СД для снижения риска тромбоэмболических осложнений и улучшения долгосрочного прогноза ФП [482–488]. ЕОК — нет (УУР B, УДД 3) Комментарии: У пациентов с ФП длительный анамнез диабета, по всей видимости, повышает вероятность тромбоэмболических событий, но не оказывает влияния на риск кровотечений на фоне приема OAК. К сожалению, интенсивный гликемический контроль не влияет на частоту возникновения новых случаев ФП, в то время как лечение метформином ассоциируется с уменьшением долгосрочного риска ФП у данной категории пациентов и, может быть, даже способствует снижению риска инсульта. В свою очередь наличие диабетической ретинопатии, которая отражает степень декомпенсации СД, не увеличивает вероятность внутриглазных кровоизлияний на фоне антикоагулянтной терапии [461–463]. У пациентов с СД и ФП рекомендуется контролировать все сердечно-сосудистые факторы риска, включая АД и уровень липидов крови [482, 484, 487-491]. ЕОК — IC (УУР В, УДД 3) 3.3.13. Пациенты с заболеваниями легких При возникновении ФП на фоне острого респираторного заболевания или обострения хронической легочной патологии в первую очередь рекомендовано провести коррекцию гипоксемии и ацидоза [28, 492-499, 547]. ЕОК — IC (УУР C, УДД 4) ЭИТ рекомендована пациентам с заболеваниями легких, если развившийся пароксизм ФП вызывает нарушение гемодинамики [28, 492-499]. ЕОК — IC (УУР C, УДД 5) Пациентам с обструктивной болезнью легких для контроля частоты желудочкового ритма рекомендовано использование селективных блокаторов кальциевых каналов с прямым влиянием на сердце (Верапамил**/ Дилтиазем), либо — в качестве альтернативы — применение селективных бета-адреноблокаторов [492-499]. ЕОК — IIaC (УУР C, УДД 5) Назначение бета-адреномиметиков и теофиллина** не рекомендуется пациентам с бронхоспастическим синдромом [28, 492-499]. ЕОК — IIIC (УУР C, УДД 5) Не рекомендуется прием неселективных бета-адреноблокаторов, соталола**, пропафенона** и <mark class=\"hit\">трифосаденин<\/mark>а пациентами с обструктивной болезнью легких и ФП [492-499]. ЕОК — IIIC (УУР C, УДД 5) У всех пациентов с ФП рекомендовано исключить синдром обструктивного ночного апноэ [492-499]. ЕОК — IIaB (УУР B, УДД 2) Комментарии: Aпноэ вызывает увеличение давления в предсердиях, их размера и изменение состояния вегетативной нервной системы. Своевременная коррекция факторов риска может улучшить отдаленные результаты лечения пациентов с ФП. С целью уменьшения частоты рецидивов ФП и улучшения контроля заболевания рекомендовано назначение оптимальной терапии, направленной на коррекцию обструктивного ночного апноэ [496–500]. ЕОК — IIaB (УУР B, УДД 3) 3.3.14. Пациенты с гипертиреозом Пациентам с ФП и активным заболеванием щитовидной железы рекомендуется антитромботическая терапия с учетом наличия других факторов риска инсульта [28]. ЕОК — IIaC (УУР C, УДД 5) Для контроля частоты желудочкового ритма пациентам с ФП на фоне тиреотоксикоза рекомендуется применение бета-адреноблокаторов, если нет противопоказаний [28]. ЕОК — IIaC (УУР C, УДД 5) Комментарии: В случае тиреотоксического криза возможно их внутривенное введение; при этом могут потребоваться высокие дозы препаратов. Если применение бета-адреноблокатора невозможно, для контроля ЧСС у пациентов с ФП и тиреотоксикозом рекомендуется назначение селективных блокаторов кальциевых каналов с прямым влиянием на сердце: дилтиазема или верапамила**[28]. ЕОК — IIaC (УУР C, УДД 5) Если желателен контроль ритма сердца, перед кардиоверсией рекомендовано нормализовать функцию щитовидной железы, иначе велика вероятность рецидива аритмии [28]. ЕОК — IIaC (УУР C, УДД 5) После нормализации функции щитовидной железы рекомендации по антитромботической профилактике соответствуют таковым у пациентов без гипертиреоза [28]. ЕОК — IIaC (УУР C, УДД 5) 3.3.15. Пациенты с заболеваниями почек Хроническая болезнь почек (ХБП) является часто встречающейся сопутствующей патологией у пациентов с ФП; частота ХБП во всем мире продолжает нарастать [501]. По данным регистра ORBIT-AF, у 30% пациентов с ФП отмечается ХБП III, IV или V стадии, а по данным отечественного регистра РЕКВАЗА, примерно половина пациентов с ФП имеют сопутствующую патологию почек [502, 503]. Существует двунаправленное взаимодействие между ФП и ХБП: ХБП предрасполагает к развитию ФП, а наличие ФП сопряжено с ухудшением внутрипочечной гемодинамики, риском дальнейшего снижения СКФ и нарастания альбуминурии [504]. Примерно у одного из пяти пациентов с ХБП имеется впервые диагностированна","terms":[{"source":"blacklist","term_id":"blacklist:480649743452","canonical":"Трифосаденин","search_word":"Трифосаденин","host_word":"трифосаденина","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Трифосаденин","aliases":["АТФ","Аденозинтрифосфат","Adenosine triphosphate"],"description":"в кардиологии АТФ используется только для купирования определенных нарушений ритма, что связано с его способностью кратковременно блокировать проводимость АВ-узла [160], [161]. При этом АТФ вводится внутривенно, а эффект ограничивается несколькими минутами. Во всех других случаях (в том числе распространенное ранее применение в/м курсами по следующим показаниям: мышечная дистрофия, хроническая коронарная недостаточность, дистрофия миокарда, постинфарктный кардиосклероз, спазм периферических сосудов, наследственная пигментная дегенерация сетчатки) АТФ бесполезен, потому что при введении в организм очень быстро распадается на составные свои части, поэтому единственный возможный результат — это абсцесс в месте введения. Таблеточное его применение тем более бессмысленно (в препаратах Кокарнит, АТФ-форте и пр.), пруфы здесь не нужны, достаточно базовых знаний по биохимии."}}]},{"id":"block:76c4b663b44730a4::case:3a08b83a6cbf27e6","block_id":"block:76c4b663b44730a4","case_id":"case:3a08b83a6cbf27e6","label":"contraindication","model":{"recommendation_strength":null,"evidence_leve //cr.minzdrav.gov.ru/view-cr/388_3","metadata":{"Название клинической рекомендации":"Язвенная болезнь желудка и/или двенадцатиперстной кишки","МКБ-10":"K25, K26","Возрастная группа":"Дети","Разработчик":"Союз педиатров России, Общероссийская общественная организация \"Российская ассоциация детских хирургов\", Автономная некоммерческая организация \"Общество детских гастроэнтерологов, гепатологов и нутрициологов\", Межрегиональная ассоциация по клинической микробиологии и антимикробной химиотерапии","Дата размещения":"30.09.2024","Статус применения КР":"Применяется"}},"context_html":"по сравнению с компьютерной томографией и во многом зависит от квалификации специалиста по ультразвуковой диагностике, однако данный метод является неинвазивным, не несет лучевую нагрузку и может применяться повторно [50]. При подозрении на перфорацию язвы с целью подтверждения диагноза рекомендуется проведение компьютерной томографии органов брюшной полости [47, 48]. (УУР С; УДД – 5). Комментарии: Компьютерная томография позволяет определить наличие и локализацию перфорационного отверстия, наличие свободного газа в брюшной полости, объем и характер выпота и других патологических изменений. Анестезиологическое пособие (включая раннее послеоперационное ведение) – по показаниям. 2.5 Иные диагностические исследования 2.5.1 Дифференциальная диагностика Дифференциальная диагностика язвенной болезни с функциональными нарушениями желудочно-кишечного тракта, хроническим гастродуоденитом, хроническими заболеваниями печени, желчевыводящих путей и поджелудочной железы проводится по данным анамнеза, осмотра, результатов лабораторного, эндоскопического, рентгенологического и ультразвукового исследований. Язвенную болезнь необходимо дифференцировать с симптоматическими язвами, патогенез которых связан с определёнными фоновыми заболеваниями или конкретными этиологическими факторами. Клиническая картина обострения этих язв стёрта, отсутствует сезонность и периодичность заболевания. Язвы желудка и 12-перстной кишки могут являться клиническими проявлениями болезни Крона и специфических заболеваний желудочно-кишечного тракта. Это может быть как при изолированном поражении желудка, так и в сочетании с любыми другими локализациями поражения при болезни Крона 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения 3.1 Консервативное лечение 3.1.1 Диетотерапия С целью ускорения заживления язв всем пациентам с ЯБ рекомендуется диетотерапия [51, 52, 59]. (УУР С; УДД – 5). Комментарии: Основные принципы диетического питания пациентов с язвенной болезнью включают частое (5-6 раз в сутки), дробного питания, механического термического и химического щажения. Из пищевого рациона необходимо исключить продукты, способные повышать секрецию пищеварительных ферментов и соляной кислоты и/или раздражающие слизистую оболочку: крепкие мясные и рыбные бульоны, жареную и копченую, соленую, маринованную пищу, продукты содержащие экстрактивные вещества (перец, горчица, приправы, специи, лук, ч<mark class=\"hit\">еснок)<\/mark>. Предпочтение необходимо отдавать продуктам, обладающим способностью связывать и нейтрализовать соляную кислоту (т.е. обладающим буферным действием): мясо и рыба (отварные или приготовленные на пару), яйца, молоко и молочные продукты. Разрешаются макаронные изделия, черствый белый хлеб, сухой бисквит и сухое печенье, молочные и вегетарианские супы, овощи (картофель, морковь, кабачки, цветная капуста), каши, кисели из сладких ягод, муссы, желе, сырые тертые и печеные яблоки, некрепкий чай. Предпочтительным способом приготовления пищи является варка, тушение, приготовление на пару. 3.1.2 Медикаментозная терапия Схемы терапии см. Приложение А3.4 Всем пациентам с обострением ЯБ с целью заживления язвенного дефекта рекомендуется проведение антисекреторной терапии ингибиторами протонного насоса (ИПН) [53, 54] (УУР - 1; УДД – А). Комментарии: Предпочтение при выборе среди препаратов для лечения язвенной болезни желудка и двенадцатиперстной кишки и гастроэзофагеальной рефлюксной болезни (антисекреторных препаратов) группе ИПН в сравнении с блокаторами Н -гистаминовых рецепторов объясняется более высокой эффективностью первых в устранении клинических 2 симптомов и достижении рубцевания язв по данным рандомизированных сравнительных исследований (включая мета-анализы) [54, 55]. Применяются o #эзомепразол** (таблетки, капсулы - по Инструкции разрешены с 12 лет)(дозировки: дети весом 15-24 кг по 20 мг х 2 раза в сутки; 25-34 кг – по 30 мг х 2 раза в сут; &gt; 35 кг по 40 мг х 2 раза в сут [34] или детям с 4 лет с массой тела &lt;30 кг - 20 мг/сут в 2 приема; с массой тела ≥30 кг – 40 мг/сут (максимальная суточная доза 40 мг) [60]; эзомепразол в форме пеллет, покрытых кишечнорастворимой оболочкой, и гранул для приготовления суспензии для приема внутрь – при язвенной болезни двенадцатиперстной кишки – разрешен к применению детям с 4 лет согласно инструкции; o #рабепразол (0,5 мг/кг/сут в 2 приема, максимальная суточная доза 20 мг) (противопоказан по Инструкции детям до 12 лет) [60]; o #омепразол** (капсулы разрешены к применению для детей с 4-х летнего возраста при язве двенадцатиперстной кишки; дозировка по Инструкции: детям с весом 15–30 кг - 10 мг (в сочетании с амоксициллином** 25 мг/кг и кларитромицином** 7,5 мг/кг, все препараты принимаются 2 раза в сутки в течение недели). Детям с с весом 31–40 кг - 20 мг, (в сочетании с амоксициллином** 750 мг и кларитромицином** 7,5 мг/кг, все препараты принимаются 2 раза в сутки в течение недели). Детям с весом &gt; 40 кг - 20 мг (в с","terms":[{"source":"mediq","term_id":"mediq:1cfb6cd6f5d1","canonical":"Чеснок","search_word":"Чеснок","host_word":"чеснок","inside_word":false,"mediq":{"name":"Чеснок","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:43bab856241e216f::case:dc9d2e66db922ce9","block_id":"block:43bab856241e216f","case_id":"case:dc9d2e66db922ce9","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В контексте сказано, что биологически активные добавки неэффективны и не рекомендованы к использованию для индукции и поддержания ремиссии при ЯК у детей.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"391_3","title":"Язвенный колит","link":"https://cr.minzdrav.gov.ru/view-cr/391_3","metadata":{"Название клинической рекомендации":"Язвенный колит","МКБ-10":"K51","Возрастная группа":"Дети","Разработчик":"Союз педиатров России, Общероссийская общественная организация \"Российская ассоциация детских хирургов\", Автономная некоммерческая организация \"Общество детских гастроэнтерологов, гепатологов и нутрициологов\"","Дата размещения":"15.01.2025","Статус применения КР":"Применяется"}},"context_html":"логическое обследование для исключения/подтверждения колита аллергической этиологии [163]. (УУР – С; УДД – 5) Комментарии: Воспаление толстой кишки у детей до 2лет (особенно младше 1 года) может являться проявлением аллергического колита или иммунодефицита, даже если это единственный симптом. В данном случае для исключения/подтверждения диагноза аллергического колита ребенку следует провести аллергологическое обследование (Исследование уровня общего иммуноглобулина Е в крови, Исследование уровня антител к антигенам растительного, животного и химического происхождения в крови (выбор антигенов и объем исследования – по клинической ситуации;. у маленьких детей проявления колита часто ассоциированы с аллергией к белкам коровьего молока) и/или диагностическая элиминационная диета (исключение определенных продуктов питания) [61]. При развитии симптоматики в раннем детском возрасте, следует исключить классические или скрытые иммунодефицитные состояния [62, 63, 64]. 26 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения Лечебные мероприятия при ЯК включают в себя назначение лекарственных препаратов, хирургическое лечение, психосоциальную поддержку и диетические рекомендации. Выбор вида консервативного или хирургического лечения определяется тяжестью атаки, протяженностью поражения толстой кишки, наличием внекишечных проявлений, длительностью анамнеза, эффективностью и безопасностью ранее проводившейся терапии, а также риском развития осложнений ЯК [65, 66]. Целью терапии является достижение клинической, эндоскопической и (в идеале) гистологической ремиссии [50, 67]. При достижении ремиссии неоперированный пациент должен оставаться на постоянной поддерживающей (противорецидивной) терапии. 3.1. Консервативное лечение 3.1.1 Диетотерапия  Нутритивный статус и рост детей с ЯК рекомендуется регулярно оценивать; при необходимости рекомендовано применять нутритивную поддержку с целью поддержания адекватного нутритивного статуса [30]. (УУР – С; УДД – 5) Комментарий: частота оценки роста и веса детей с ЯК – проводится при каждом поступлении в стационар или при каждом амбулаторном приеме  Рекомендован у пациентов с ЯК прием обычной пищи, при невозможности – отдавать предпочтение энтеральному питанию (питательные смеси или жидкости). Парентеральное питание применять при полной невозможности энтерального питания [30, 35]. (УУР – С; УДД – 5)  Специальная диета или <mark class=\"hit\">биологически активные добавки<\/mark> неэффективны и не рекомендованы к использованию для индукции и поддержания ремиссии при ЯК у детей, а в некоторых случаях могут способствовать дефициту питательных веществ [30]. (УУР – С; УДД – 5)  Рекомендовано назначение препаратов витамина D и его аналогов и препаратов кальция при гипокальциемии в рамках ВЗК (кальция глюконат** таблетки – согласно 27 инструкции, противопоказан до 3 лет, кальция глицерофосфат – согласно инструкции, противопоказан до 2 лет или комбинированные препараты, например, кальция карбонат+колекальциферол – согласно инструкции, противопоказан до 2 лет) пациентам в активной фазе болезни и получающим глюкокортикоиды на основании результатов исследования уровня 25-ОН витамина Д в крови с целью коррекции дефицита витамина D и кальция [35, 68, 69, 70, 164]. (УУР – С; УДД – 5) Комментарии: Возможны различные стратегии назначения препаратов витамина D и аналогов, например, ежедневный прием (&gt;2000 МЕ/день) или 50 000 МЕ колекальциферола** капли для приема внутрь (показан к применению у детей с 4-х недель жизни) перорально один раз в неделю на протяжении 2-3 месяцев. Для профилактики и лечения дефицита витамина D/ Определение суточной потребности ребенка в витамине D и способа его применения должны устанавливаться врачом индивидуально и каждый раз подвергаться коррекции во время периодических обследований, особенно в первые месяцы жизни. Необходимо контролировать концентрацию кальция в крови и моче. Имеется публикация об эффективности и безопасности применения однократной высокой дозы #колекальциферола** 300 000 - 500 000 МЕ [33]. Терапия остеопении и остеопороза осуществляется согласно соответствующим клиническим рекомендациям 3.1.2 Медикаментозная терапия 3.1.2.1 Терапия пероральными и ректальными препаратами аминосалициловой кислоты и аналогичными препаратами (5-АСК))  Рекомендовано применение препаратов группы аминосалициловой кислоты и аналогичных препаратов (употребляемые наименования: аминосалицилаты, 5-АСК) в качестве терапии первой линии для индукции и поддержания ремиссии у детей при легкой и среднетяжелой активности язвенного колита [8, 71]. (УУР – С; УДД – 5) Комментарии: месалазин** - в таблетках по инструкции – детям с 3 лет: начальная доза 30-50 мг/кг/сут, разделенная на несколько приемов, максимальная доза - 75 мг/кг/сут. Суммарная суточная доза не должна превышать максимальную суточную дозу для взрослых. Для профилактики рецидивов доза подбирается индивидуально. 28 Начальная доза составляет 15-30 мг/кг/сут, разделенная н","terms":[{"source":"marker","term_id":"marker:230c5158dbb2","canonical":"биологически активные добавки","search_word":"биологически активные добавки","host_word":"биологически активные добавки","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:d199c1bb619bf992::case:8937902cef187685","block_id":"block:d199c1bb619bf992","case_id":"case:8937902cef187685","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В контексте лечения НТ1 указано, что при повышении уровня тирозина в сыворотке крови это является строгим показанием для ограничения в диете натурального пищевого белка, а вместе с ним фенилаланина и тирозина; найденный термин «тирозин» прямо включен в запрещаемые/ограничиваемые аминокислоты.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"409_3","title":"Наследственная тирозинемия 1 типа","link":"https://cr.minzdrav.gov.ru/view-cr/409_3","metadata":{"Название клинической рекомендации":"Наследственная тирозинемия 1 типа","МКБ-10":"E70.2","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков","Дата размещения":"21.08.2024","Статус применения КР":"Применяется"}},"context_html":"нтарии: Острую НТ 1 следует дифференцировать с другими наследственными нарушениями обмена веществ, особенно при наличии сопутствующего септического состояния, резистентного к терапии антибиотиками широкого спектра действия. Вирусассоциированные заболевания (герпес-группы: цитомегаловирус, Эпштейна-Барр вирус, герпес 1, 2 и 6 типов), ТОRCH инфекции не исключают наличия НТ1 типа [1,4,11]. Диагностический поиск при гепатомегалии и гепатите необходимо проводить с галактоземией, фруктоземией, непереносимостью фруктозы, болезнью Ниманна-Пика, болезнью Вильсона, неонатальным гемохроматозом, гемофагоцитарным лимфогистиоцитозом, митохондриальной цитопатией, врожденными болезнями гликозилирования, дефицитом трансальдолазы, ацетаминофеновой (парацетамолом) интоксикацией, инфекциями (сепсисом, сальмонеллезом, туберкулезом, герпес-вирусной, в том числе, цитомегаловирусной инфекцией, вирусными гепатитами А и В), отравлением грибами, лекарственными средствами на растительной основе. Генерализованная аминоацидемия частый признак печеночной недостаточности, нарушения функции ассимиляции [1,4,6,7]. Поражение почек при НТ 1 следует дифференцировать с цистинозом, синдромом Lowe (окулоцереброренальная дистрофия), почечным канальцевым ацидозом, синдромом Фанкони. При рахитоподобных изменениях скелета рекомендовано исключать гипофосфатазию (низкий уровень щелочной фосфатазы и фосфора в сыворотке), дефицит витамина D (нутритивного и генетически обусловленного), синдром Фанкони [1,4,9]. Неврологические кризы рекомендовано дифференцировать от проявлений отека мозга и кровоизлияний, бактериального менингита, гипернатрийемического обезвоживания, острой перемежающейся порфирии [1,4,9]. При изолированной гипертирозинемии рекомендовано исключать нарушение в пищевом рационе (повышенное употребление пищевого белка), что сопровождается состоянием транзиторного тирозиноза, функциональной недостаточностью фермента FAH. Также рекомендовано исключать тирозинемии II и III типов, другие болезни печени с нарушением синтетической и детоксикационной функции. [1,2,8]. Посиндромный дифференциальный диагноз отражен в приложении А3.2. 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения 3.1 Консервативное лечение Основой лечения является применение патогенетической терапии в сочетании с низкобелковой диетой и назначением специализированных продуктов на основе смесей аминокислот, не содержащих <mark class=\"hit\">тирозин<\/mark> и фенилаланин. Для лечения НТ I всем пациентам рекомендована пожизненная патогенетическая терапия препаратом нитизинон** (NTBC, 2-(2-нитро-4-трифлюорометилбензоил)-1,3циклогексанедион) [2,8,9,10, 31]. Уровень достоверности доказательств – 5 (уровень убедительности рекомендаций С). Комментарии: Для большей эффективности лечения нитизинон** целесообразно использовать на стадии, предшествующей развитию гепатоцеллюлярной карциномы. Механизм действия препарата заключается в том, что он блокирует 4-гидроксифенилпируват диоксигеназу и препятствует образованию конечных токсических метаболитов, уровень тирозина в сыворотке крови при этом повышается, что является строгим показанием для ограничения в диете натурального пищевого белка, а вместе с ним и фенилаланина (как предшественника тирозина) и тирозина. Дефицит белка компенсируется путем назначения специализированной диеты с ограничением этих аминокислот. Доза нитизинона** подбирается индивидуально в зависимости от эффективности, которая оценивается по уровню сукцинилацетона в моче и крови, и уровню тирозина в сыворотке крови. Острая форма тирозинемии (НТ 1А) требует назначения нитизинона** в дозе 2 мг/кг, по мере роста и увеличения массы тела ребенка доза снижается до 1 мг/кг [40]. Поддерживающая терапевтическая доза при НТ 1А составляет 1 мг/кг/сутки, при НТ 1B начальная доза 1-1,5 мг/кг/сутки, если уровень тирозина менее 600-800 мкМоль/л, суточная доза дается в один-два приема внутрь. Период полувыведения составляет 54 часа, что позволяет рекомендовать однократный прием суточной дозы. Коррекция дозы нитизинона** проводится в зависимости от биохимических показателей и нарастания массы тела ребенка. Около 10% пациентов на терапию нитизиноном** не отвечают, что определяется результатами биохимического мониторинга (сукцинилацетона в моче, функциональные пробы печени, альфа-фетопротеин (АФП). Такие пациенты являются потенциальными претендентами на трансплантацию печени. При высоком уровне билирубина (&gt;100 мкмоль/л) и острой печеночной недостаточности в сочетании с гипераммониемией (&gt; 100 мкМоль/л) не исключается необходимость в экстренной трансплантации печени. Снижение уровня сукцинилацетона на фоне терапии нитизиноном** происходит в течение 24 часов, концентрация аминокислот (тирозина и фенилаланина) повышается в зависимости от количества пищевого натурального белка. АФП снижается медленно и зависит от начальных концентраций, не всегда достигает нормы. Необходимо увеличение дозы нитизинона** до 2 мг/кг/сутки при","terms":[{"source":"mediq","term_id":"mediq:6918d551f6d0","canonical":"Тирозин","search_word":"Тирозин","host_word":"тирозин","inside_word":false,"mediq":{"name":"Тирозин","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:32e8311a335ebfb1::case:2d9a0a5fd7f28cee","block_id":"block:32e8311a335ebfb1","case_id":"case:2d9a0a5fd7f28cee","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Протионамид указан в разделе побочных реакций/токсичности: при психозе его следует отменить, то есть это запрет/отмена при данном осложнении.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"507_3","title":"Туберкулез у детей","link":"https://cr.minzdrav.gov.ru/view-cr/507_3","metadata":{"Название клинической рекомендации":"Туберкулез у детей","МКБ-10":"A15, A16, A17, A18, A19","Возрастная группа":"Дети","Разработчик":"Российское Общество Фтизиатров, Национальная ассоциация некоммерческих организаций фтизиатров «Ассоциация фтизиатров»","Дата размещения":"18.09.2024","Статус применения КР":"Применяется"}},"context_html":"ериферическая нейропатия Циклосерин**, #линезолид**, изониазид**, стрептомицин**, канамицин**, #амикацин**, #капреомицин**, этионамид**, протионамид**, левофлоксацин**, #моксифлоксацин** 1. Консультация врача-невролога; 2. Симптоматическая терапия; 3. При неэффективности перечисленных мероприятий снизить дозу соответствующего препарата, при сохранении/нарастании симптомов – отменить его; после купирования симптомов возможно повторное назначение в сниженной дозе (кроме #линезолида**); 4. При появлении любых симптомов полинейропатии на фоне приема #линезолида** – отменить препарат; при легких симптомах после их исчезновения возможно возобновление приема в сниженной дозе (300 мг/сут), в остальных случаях #линезолид** не возобновляют Головная боль, сонливость Циклосерин**, изониазид**, #бедаквилин** 1.Перенести прием соот
