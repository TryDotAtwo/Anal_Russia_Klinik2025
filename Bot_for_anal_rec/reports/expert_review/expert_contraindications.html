тропные препараты (например, <mark class=\"hit\">пирацетам<\/mark>**) [45]. Уровень убедительности рекомендаций C (уровень достоверности доказательств - 5) ● Рекомендуется назначение антихолинэстеразных средств (ривастигмин**, галантамин**, донепезил) при развитии делирия у пациентов с деменцией [52,96]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). ● Не рекомендуется фармакологическое лечение делирия у пациентов с терминальными состояниями. [97] Уровень убедительности рекомендации А (уровень достоверности доказательств 1) 4. Медицинская реабилитация и санаторнокурортное лечение, медицинские показания и противопоказания к применению методов медицинской реабилитации, в том числе основанных на использовании природных лечебных факторов 4.1 Реабилитация после делирия ● В реабилитационные мероприятия рекомендовано включать когнитивный тренинг, стимуляцию доступной физической активности пациентов, психообразовательную работу с лицами, ухаживающими за больным. Данные методы показаны после устранения острых проявлений психотического состояния и не имеют противопоказаний. [55] Уровень убедительности рекомендации B (уровень достоверности доказательств 2) Комментарий: В процессе указанных реабилитационных воздействий важное значение имеет исключение факторов риска повторного возникновения делирия, т.е., в первую очередь, систематическая коррекция предрасполагающих к последнему воздействий и исключение провоцирующих влияний. 4.2 Уход за пациентом с делирием ● Рекомендуется проведение психообразовательной работы с лицами, осуществляющими уход за пациентами, перенесшими делирий, включающая в себя: - оценку динамики нарастания когнитивных нарушений пациента; - оценка нарушений режима дня пациента, в т.ч. сна-бодрствования; - оценка изменения уровня физической активности пациента и ее распределение в течение суток; - оценка колебаний эмоционального состояния пациента. Оценку вышеуказанных изменений рекомендуется проводить путем собеседования с пациентом, допускается использование опросников, а также путем динамического наблюдения за пациентом. После выявления установленных нарушений проведение мероприятий по их коррекции. [56, 84] Уровень убедительности рекомендации С (уровень достоверности доказательств 4) Комментарий: Работа лиц, осуществляющих уход за пациентами, по созданию наиболее комфортной среды пребывания пациента с максимальным приближением к знакомым, создающих сходство с домашней обстановкой, условиям: - проведение консультаций у врача ЛФК, врача-гериатра с целью подбора упражнений и меропр","terms":[{"source":"blacklist","term_id":"blacklist:4e56c26f1370","canonical":"Пирацетам","search_word":"Пирацетам","host_word":"пирацетам","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Пирацетам","aliases":["Ноотропил","Луцетам","Ноотобрил","Нооцетам","Пиратропил","Эскотропил","Pyracetam (Piracetam)","Piracetamum"],"description":"тысяча названий для одной и той же бесполезной молекулы, на которой каждый пытается заработать. Самый старый и самый главный ноотроп, назначают при любых проблемах, связанных с головой: инсульты, деменция, интоксикация алкоголем, абстиненция, никотиновая зависимость, шизофрения, депрессия, ипохондрия, головная боль, нарушение памяти, травма, кома, отравление барбитуратами и многое другое. С 72 года и до сих пор нет надёжных данных об эффективности. Примечателен тем, что из достоверных имеются сведения о провоцировании приступов у больных эпилепсией, благодаря чему из него внезапно сделали противоэпилептический препарат Кеппра. Cochrane Reviews 13 (почти всё отрицательно); FDA 0; RXlist 0; ВОЗ 0; ФК (-). См. обзор доказательной базы, а также Копипаста:Ноотропы."}},{"source":"mediq","term_id":"mediq:c8c0a3547a15","canonical":"Пирацетам","search_word":"Пирацетам","host_word":"пирацетам","inside_word":false,"mediq":{"name":"Пирацетам","kind":["NOOTROPS"],"type":"MANUAL_CHECKED","quality":"NOT_PROVED","atx":"N06BX03","atx_group":"N06BX Психостимуляторы и ноотропы другие","mnn":"пирацетам","description":"FDA [не одобрило](https://www.statnews.com/2019/11/25/brain-boosting-supplements-contain-unapproved-drug/) пирацетам к применению в США в качестве пищевой добавки из-за недостаточных данных о безопасности.\n \n <br/>\n \n Президиум Формулярного комитета РАМН в 2007 году [выпустил резолюцию](http://own.0x3.ru/index.php/s/7TYLfocAyXbajaN#pdfviewer), где назвал пирацетам устаревшим препаратом с недоказанной эффективностью.","criterions":[{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=piracetam&t=1","points":13},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/piracetam","points":1},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=piracetam&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":368}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:186ec3760628590f::case:84b6fc81f863ee51","block_id":"block:186ec3760628590f","case_id":"case:84b6fc81f863ee51","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"БАДы, содержащие омега-3 ПНЖК, прямо указаны как не имеющие утвержденных показаний и не могущие использоваться для замены рецептурных препаратов; для выделенного термина это запрет/неиспользование в терапии.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"748_2","title":"Неалкогольная жировая болезнь печени","link":"https://cr.minzdrav.gov.ru/view-cr/748_2","metadata":{"Название клинической рекомендации":"Неалкогольная жировая болезнь печени","МКБ-10":"K75.8, K76.0","Возрастная группа":"Взрослые","Разработчик":"Российская ассоциация эндокринологов, Российская Гастроэнтерологическая Ассоциация, Общероссийская общественная организация \"Российское научное медицинское общество терапевтов\", Общероссийская общественная организация «Российская ассоциация геронтологов и гериатров», Российское общество по изучению печени, Российское общество профилактики неинфекционных заболеваний, Национальное общество профилактической кардиологии","Дата размещения":"11.10.2024","Статус применения КР":"Применяется"}},"context_html":"ований, в которых оценивалась гистологическая картина печени. В открытом РКИ Е88Е1чГГ1АЬ комбинация #эзетимиба со ингибитором ГМГ-КоА-редуктазы уменьшала содержание жира в печени, оцененного методом МРТ-РОРР [269]. При применении комбинации #эзетимиба с ^ингибиторами ГМГ-КоАредуктазы также требуется контроль лабораторных показателей (АЛТ, АСТ). В случае повышения трансаминаз дальнейшее решение об отмене терапии (всей комбинации или только ингибиторы ГМГ-КоА-редуктазы) и (или) коррекции доз препаратов осуществляется в соответствии с инструкцией, актуальной для статинов. При развитии ЦП следует воздержаться от применения #эзетимиба при появлении признаков декомпенсации функции печени (класс В-С по Чайльд - Пью). • Рекомендовано пациентам с НАЖБП и гипертриглицеридемией/АССЗ назначение #омега-3 кислот этиловые эфиры в дозе 4 г/сут с целью уменьшения уровня ТГ и стеатоза печени [276]. Уровень убедительности рекомендаций В (уровень достоверности доказательств 1). Комментарии: Юмега-3 триглицериды, включая другие эфиры и кислоты (омега-3 ПНЖК) - препараты, применяемые для снижения уровня ТГ. В доклинических исследованиях была продемонстрирована способность #омега-3 триглицеридов, включая другие эфиры и кислоты уменьшать липогенез в печени и повышать чувствительность к инсулину [273]. В исследовании КЕПИСЕ-ГГ с участием 8179 пациентов было доказано положительное влияние эйкозапентаеновой кислоты (#омега-3 триглицериды, включая другие эфиры и кислоты) в сочетании со статином на «твердые» конечные точки - сердечно-сосудистые события [274]. В двойном слепом плацебо-контролируемом РКИ назначение эйкозапентаеновой кислоты (#омега-3 триглицериды, включая другие эфиры и кислоты) в дозе 2,4 г/сут у пациентов с НАЖБП хотя и не влияло на гистологические параметры НАСГ, но снижало уровень ТГ у пациентов по сравнению с плацебо без увеличения серьезных побочных эффектов [275]. В то же время в другом исследовании, в котором содержание жира в печени определялось с помощью магнитнорезонансной спектроскопии, позволяющей точнее оценить содержание жира в печени в целом, показано, что курс комбинацией #омега-3 кислот этиловые эфиры - комбинацией докозагексаеновой кислотой и эйкозапентаеновой кислоты в дозе 4 г/сут - уменьшал содержание жира в печени [276]. По данным метаанализов, #омега-3 триглицериды, включая другие эфиры и кислоты могут снизить содержание жира в печени, показатели печеночных ферментов и липидов крови [270-272]. Рекомендоваться может только лекарственный препарат #омега-3 кислот этиловые эфиры, так как <mark class=\"hit\">биологически активные добавки<\/mark>, содержащие #омега-3 ПНЖК, не имеют утвержденных клинических показаний, доказанной терапевтической эффективности, фармацевтической и биологической эквивалентности и не могут быть использованы для замены рецептурных препаратов [277]. Доза и длительность применения препарата регулируется КР «Нарушения липидного обмена» [83]. • Рекомендуется назначение #фенофибрата** в дозе 145-200 мг/сут пациентам с НАЖБП и гипертриглицеридемией/АССЗ с целью снижения сердечно-сосудистого риска и уровня трансаминаз [83, 278]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5). Комментарии: Фибраты используются в лечении дислипидемии, при этом только #фенофибрат** может использоваться в комбинации со статинами. Существуют теоретические предпосылки и данные экспериментальных работ, согласно которым #фенофибрат** может оказывать позитивное влияние на НАЖБП [279]. Крупных исследований по изучению влияния фибратов на НАЖБП не проводилось. В небольшом РКИ с парными биопсиями 48недельная терапия #фенофибратом** приводила к снижению доли пациентов с повышенным уровнем аминотрансфераз, глюкозы, ЩФ и ГГТ и уменьшению баллонной дегенерации без влияния на степень стеатоза, лобулярного воспаления, фиброза [278]. Исследования, изучавшие эффективность фибратов при дислипидемии в сочетании с НАЖБП, не показали увеличения побочных эффектов, а в отдельных, напротив, наблюдалось снижение трансаминаз [278-280]. При назначении #фенофибрата** в первый год терапии требуется контроль уровня трансаминаз и креатинина каждые 3 месяца, при совместном применении со статинами повышается риск рабдомиолиза. • Рекомендуется рассмотреть дополнительное назначение фосфолипидов (эссенциальных фосфолипидов (ЭФЛ)) в дозе 1800 мг/сут пациентам с НАЖБП и наличием коморбидностей (дислипидемией, ожирением, СД 2-го типа) в составе комплексной терапии для повышения эффективности фармакотерапии [281, 282]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 4). Комментарии: В настоящее время накоплено большое количество исследований, посвященных применению ЭФЛ в лечении НАЖБП. Большинство из них - небольшого размера, тем не менее составляют научную базу применения указанного класса препаратов. ЭФЛ в исследованиях главным образом применяются в составе комплексной терапии: в сочетании с гипогликемической, гиполипидемической терапией, совместно с УДХК** или пробиотиками. Это объясняется тем, что ЭФЛ не только обладают собственной фармакологической активностью, но и являются биоэнхансерами (биоп","terms":[{"source":"marker","term_id":"marker:230c5158dbb2","canonical":"биологически активные добавки","search_word":"биологически активные добавки","host_word":"биологически активные добавки","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:2ad5d3f5272df751::case:e59fb479420f5c54","block_id":"block:2ad5d3f5272df751","case_id":"case:e59fb479420f5c54","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В контексте конкретно римантадина сказано: «Не рекомендуются для лечения гриппа ... римантадин», то есть препарат прямо не рекомендован для лечения.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"749_1","title":"Грипп у взрослых","link":"https://cr.minzdrav.gov.ru/view-cr/749_1","metadata":{"Название клинической рекомендации":"Грипп у взрослых","МКБ-10":"J09, J10, J11","Возрастная группа":"Взрослые","Разработчик":"Общероссийская общественная организация \"Российское научное медицинское общество терапевтов\", Национальная ассоциация специалистов по инфекционным болезням имени академика В. И. Покровского (НАСИБ)","Дата размещения":"20.01.2023","Статус применения КР":"Применяется"}},"context_html":"Приложении А3. 24 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения Сроки начала лечения больных с предполагаемым или вероятным случаями гриппа не зависят от отсутствия или задержки получения результата диагностического тестирования на грипп1. На выбор тактики лечения оказывают влияние следующие факторы [50–52, 62, 63, 85, 86]: возраст пациента; характер сопутствующих заболеваний; клиническая форма болезни; характер течения болезни (динамики нарастания симптомов); тяжесть заболевания; наличие и характер осложнений. Информация, касающаяся доз, показаний к применению и способов применения лекарственных средств, содержащаяся в данных рекомендациях, может отличаться от информации, указанной в ИМП. Для получения полной информации о применении того или иного ЛС следует ознакомиться с ИМП. Персональная ответственность за интерпретацию и использование настоящих рекомендаций лежит на лечащем враче. Диагностическое тестирование на грипп ни в коем случае не должно задерживать начало лечения противовирусными препаратами для системного применения и выполнения процедур по борьбе с инфекцией. 3.1. Консервативное лечение • Рекомендуется начать лечение противовирусными препаратами прямого действия не позднее 48 часов (занамивир – в первые 36 часов) после манифестации болезни всем пациентам с симптомами гриппа для прекращения репликации вируса [87, 88, 90, 91, 92, 95]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: лечение необходимо начинать немедленно, не дожидаясь лабораторного подтверждения диагноза, независимо от сведений о вакцинации против гриппа и степени тяжести болезни. Наилучший лечебный эффект достигается в случаях начала применения противовирусных препаратов прямого действия в первые 12 часов от начала болезни. При отсутствии лечения в ранние сроки прием противовирусных 1 Письмо Федеральной службы по надзору в сфере защиты прав потребителей и благополучия человека Российской Федерации от 26.11.2009 № 01/17863-9–32 «О направлении документа ВОЗ «Клинические методы ведения больных, инфицированных пандемическим вирусом гриппа (H1N1)2009» 25 препаратов прямого действия может быть начат на любом этапе разгара болезни, когда предполагается или документально подтверждена возможность текущей репликации вируса гриппа. • Не рекомендуются для лечения гриппа производные адамантана и циклические амины (амантадин**, р<mark class=\"hit\">имантадин)<\/mark> [90, 93, 97, 98, 101]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: вследствие резистентности к данным препаратам большинства штаммов вируса гриппа. 3.1.1. Лечение легких и средне-тяжелых неосложненных форм гриппа в амбулаторных условиях • Рекомендуется использование противовирусных препаратов прямого действия всем пациентам с симптомами гриппа для прекращения репликации вируса: o Осельтамивир** [1, 52, 61, 90-115, 117]. Уровень убедительности рекомендаций A (уровень достоверности доказательств – 2). Комментарии: является селективным ингибитором нейраминидазы вирусов гриппа А и В. Входит в международные клинические рекомендации по лечению и профилактике гриппа. Пациентам, которые не относятся к группе повышенного риска развития тяжелого и/или осложненного течения гриппа и у которых имеет место лабораторно подтвержденный грипп или с большой вероятностью подозрительный случай гриппа, протекающий без осложнений, не следует назначать препараты из группы селективных ингибиторов нейраминидазы. Осельтамивир** назначают внутрь по 75 мг 2 раза в сутки в течение 5 дней. o Занамивир [1, 52, 61, 90, 91, 95, 96, 100, 105, 107–109, 111−124]. Уровень убедительности рекомендаций В (уровень достоверности доказательств – 1). Комментарии: является селективным ингибитором нейраминидазы вирусов гриппа А и В. Входит в международные клинические рекомендации по лечению и профилактике 1 Письмо Федеральной службы по надзору в сфере защиты прав потребителей и благополучия человека Российской Федерации от 26.11.2009 № 01/17863-9–32 «О направлении документа ВОЗ «Клинические методы ведения больных, инфицированных пандемическим вирусом гриппа (H1N1)2009» 26 гриппа. Пациентам, которые не относятся к группе повышенного риска развития тяжелого и/или осложненного течения гриппа и у которых имеет место лабораторно подтвержденный грипп или с большой вероятностью подозрительный случай гриппа, протекающий без осложнений, не следует назначать препараты из группы селективных ингибиторов нейраминидазы. Занамивир рекомендуется в случаях резистентности вируса A(H1N1) к осельтамивиру**, при отсутствии препарата, беременным и пациентам с тяжелой почечной недостаточностью. Назначают по 2 ингаляции (по 5 мг каждая) 2 раза в сутки в течение 5 дней. Резистентности к занамивиру не зарегистрировано. Занамивир в форме порошка для ингаляций не следует применять распылением с помощью аэрозольного ингалятора из-за присутствия лактозы, которая может поставить по","terms":[{"source":"mediq","term_id":"mediq:9477955ff8ae","canonical":"Римантадин","search_word":"Римантадин","host_word":"римантадин","inside_word":false,"mediq":{"name":"Римантадин","kind":["ANTIVIRAL"],"type":"MANUAL_CHECKED","quality":"NOT_PROVED","atx":"J05AC02","atx_group":"J05AC Циклические амины","mnn":"римантадин","description":"Несмотря на наличие исследований, данные об этом препарате противоречивы.\n \n <br/>\n \n \"Римантадин эффективен только против гриппа А. Из-за увеличения резистентных изолятов препарат не должен использоваться в США для профилактики гриппа или терапии кроме некоторых исключений.\"\n \n *[Pharmacology of antiviral drugs for influenza](https://www.uptodate.com/contents/pharmacology-of-antiviral-drugs-for-influenza?search=rimantadine&source=search_result&selectedTitle=1~15&usage_type=default&display_rank=1)*","criterions":[{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=rimantadine&t=1","points":5},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/rimantadine","points":1},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=rimantadine&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":36}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:c5b36d06468c7743::case:f903e0e841ea5085","block_id":"block:c5b36d06468c7743","case_id":"case:f903e0e841ea5085","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В контексте фразы «избегать сочетанного назначения ингибиторов фосфодиэстеразы с нитратами» слово «потенцирование» входит в обоснование запрета/избегания сочетания, то есть относится к противопоказанию для данного сочетания.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"762_1","title":"Трансплантация сердца, наличие трансплантированного сердца, отмирание и отторжение трансплантата сердца","link":"https://cr.minzdrav.gov.ru/view-cr/762_1","metadata":{"Название клинической рекомендации":"Трансплантация сердца, наличие трансплантированного сердца, отмирание и отторжение трансплантата сердца","МКБ-10":"T86.2, Z94.1","Возрастная группа":"Взрослые, дети","Разработчик":"Российское трансплантологическое общество","Дата размещения":"16.03.2023","Статус применения КР":"Применяется"}},"context_html":"осложнений (тромбоэмболии в анамнезе или у близких родственников) [380, 381, 382]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Рекомендовано мониторирование концентрации препаратов иммуносупрессивной терапии в крови у пациентов, получающих комбинированную иммуносупрессивную терапию, в связи с тем, что прогестагены и эстрогены (фиксированные сочетания) оказывают ингибирующее действие на CYP3A4 [380, 381, 382]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Барьерные методы контрацепции не обеспечивают адекватного уровня предохранения от нежелательной беременности. Вместе с тем, они рекомендованы всем пациентам после пересадки сердца, ведущим активную сексуальную жизнь, как средство профилактики заражения инфекциями, передающимися половым путем [380, 381, 382]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Внутриматочные контрацептивы не рекомендованы для использования у пациентов после трансплантации сердца, особенно у нерожавших женщин, в связи с возможным риском воспалительных и инфекционных осложнений и бесплодия [380, 381, 382]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Использование депонированной формы медроксипрогестерона** может сопровождаться уменьшением минеральной плотности костной ткани и в связи с этим не рекомендуется у пациентов после трансплантации сердца [380, 381, 382]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Оральные контрацептивы не рекомендуются пациентам после трансплантации сердца с артериальной гипертонией, БКАПС, эстроген-зависимыми опухолями или заболеваниями печени [380, 381, 382]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) 4.4.3 Рекомендации по лечению эректильной дисфункции у реципиентов сердца Эректильная дисфункция после трансплантации сердца может быть вызвана ятрогенными причинами. Пациентам с эректильной дисфункцией рекомендуется рассмотреть вопрос о замене лекарственных средств с учетом их эффективности и побочных действий [383]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Селективные ингибиторы циклогуанозинмонофосфат (цГМФ)-специфической фосфодиэстеразы-5 рекомендованы в качестве лекарственных средств для лечения эректильной дисфункции у пациентов после трансплантации сердца. При этом рекомендуется избегать сочетанного назначения ингибиторов фосфодиэстеразы с нитратами (<mark class=\"hit\">потенцирование<\/mark> гипотензивного действия) [384]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) 4.5 Рекомендации по вождению автомобиля и управлению транспортными средствами у пациентов после трансплантации сердца Вопросы возможности управления транспортным средством рекомендовано обсуждать с пациентами на раннем послеоперационном этапе [387-389]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Вопрос о возможности управления транспортным средством рекомендовано решать на основании неврологического осмотра пациента (исключаются тремор, оценивается устойчивость осанки, исследуется зрение) [387, 388]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) У пациентов с брадикардией допуск к управлению автомобилем рекомендуется при наличии искусственного водителя ритма [389]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) 5. Профилактика и диспансерное наблюдение, медицинские показания и противопоказания к применению методов профилактики Профилактика нежелательных событий и диспансерное наблюдение играют важную роль в обеспечении благоприятного отдаленного прогноза у реципиентов сердца. Основные причины смерти после трансплантации сердца - острое отторжение трансплантата, сердечная недостаточность, болезнь коронарных артерий пересаженного сердца, инфекции, почечная недостаточность, онкологические заболевания. Отторжение трансплантата и инфекции являются ведущими причинами смерти в течение первых трех лет после трансплантации сердца, в то время как злокачественные новообразования и БКАПС - в последующем периоде. Факторы риска нежелательных событий в течение первого года после трансплантации сердца включают дострансплантационные факторы, периоперационные факторы, факторы риска, связанные с особенностями донора и факторы послеоперационного периода. Исследования, проведенные под эгидой Российского трансплантологического общества, свидетельствуют о том, что наиболее значимыми факторами риска нежелательных событий в течение первого года после ОТТС являются наличие сопутствующих заболеваний у реципиента в дотрансплантационном периоде (почечная недостаточность, периферический атеросклероз), возраст донора, наличие гипертрофии миокарда левого желудочка или атеросклероза коронарных артерий донорского сердца, длительность ишемии сердечного трансплантата, повторная трансплантация сердца, необходимость в механической поддержке кровообращения в периоперационном периоде,","terms":[{"source":"marker","term_id":"marker:599df522628e","canonical":"потенцирование","search_word":"потенцирование","host_word":"потенцирование","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:ba2e69da796ff125::case:5a1fc11db9d6e46c","block_id":"block:ba2e69da796ff125","case_id":"case:5a1fc11db9d6e46c","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Коллаген упомянут в перечне веществ, противопоказанных к введению в сосудистое русло при интраоперационной реинфузии аутоэритроцитов; это прямое противопоказание для данного компонента.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"767_1","title":"Патологическое прикрепление плаценты (предлежание и врастание плаценты)","link":"https://cr.minzdrav.gov.ru/view-cr/767_1","metadata":{"Название клинической рекомендации":"Патологическое прикрепление плаценты (предлежание и врастание плаценты)","МКБ-10":"O43.0, O43.1, O43.2, O44.0, O44.1","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов, Корпоративная некоммерческая организация \"Ассоциация анестезиологов – реаниматологов\"","Дата размещения":"22.05.2023","Статус применения КР":"Применяется"}},"context_html":"вагинального катетера. Восстановление стенки матки отдельными викриловыми швами. Продолжительность баллонной тампонады с помощью вагинального и маточного катетеров составляет 10-14 ч. При врастании плаценты. 1. При обнаружении врастания плаценты на 1/3 толщины миометрия выполняется иссечение участка врастания с одновременным лигированием кровоточащих сосудов и прошиванием плацентарного ложа ∞-образным швом. В последующем выполняется отсепаровка пузырноматочной складки книзу и наложение гемостатического наружно-маточного надплацентарного сборочного шва. 2. При обнаружении врастания плаценты более, чем на 2/3 толщины миометрия, или при площади врастания более, чем 5 сантиметров в диаметре, выполняется отсечение участка матки с участком вросшей плаценты. Отсепаровка пузырно-маточной складки, наложение гемостатического наружно-маточного надплацентарного сборочного шва ниже предполагаемого отсечения стенки матки. В последующем проводится восстановление углов стенки матки, установка внутриматочного катетера, затем восстановление стенки матки, после чего маточный катетер наполяется физиологическим раствором. 3. В случае обнаружения плацентарной грыжи проводится высокий поперечный разрез на матке для извлечения плода, выполнение метропластики: выделение грыжевого мешка, отсепаровка пузырно-маточной складки, гемостаз паравезикальных сосудов, наложение гемостатического наружно-маточного надплацентарного сборочного шва ниже предполагаемого отсечения стенки матки. Установка внутриматочного катетера с использованием проводника через гистеротомический разрез, проводя его с помощью указательного пальца руки хирурга через цервикальный канал в осевую трубку вагинального катетера. В последующем также проводится восстановление стенки матки отдельными викриловыми швами. Продолжительность баллонной тампонады с помощью вагинального и маточного катетеров составляет 10-14 ч [140]. Приложение Б4. Технология интраоперационной реинфузии аутоэритроцитов. Для интраоперационной реинфузии аутоэритроцитов (ИРА) используются аппараты типа «Cell Saver», Cats для аутотрансфузий и наборы одноразовых магистралей к ним. Противопоказания к проведению интраоперационной реинфузии аутоэритроцитов в акушерстве. Абсолютные -наличие в брюшной полости гнойного содержимого; -наличие в брюшной полости кишечного содержимого; -наличие в излившейся крови веществ, противопоказанных к введению в сосудистое русло: водорода пероксид** (D08AX01), дистиллированная вода , гемостатические средства (B02) на основе <mark class=\"hit\">коллаген<\/mark>а и др.). Технология использования метода: Принцип процедуры заключается в аспирации из операционной раны излившейся крови, обработке ее в аппарате и последующей реинфузии полученной аутоэритроцитарной взвеси (Ht 60%) обратно в сосудистое русло пациентки. Заправка одноразовых магистралей проводится в операционной до начала операции. Стерильный отсос передается операционной сестре. Сбор излившейся в рану крови проводится вторым ассистентом. Отрицательное давление, создаваемое вакуум-аспиратором, не должно превышать 100 мм рт. ст. Кровь, аспирируемая из раны, смешивается с раствором антитромботических средств (B01A), проходит сквозь фильтр, задерживающий частицы тканей, сгустки крови и собирается в резервуар. Когда объем собранной крови станет адекватным объему резервуара, начинается первая фаза работы аппарата - заполнение промывочной чаши (колокола). Данная фаза состоит из нескольких этапов: 1. Разгон центрифуги до 5600 об/мин; 2. Перенос крови из резервуара в промывочный колокол с помощью перистальтического насоса, начало процесса центрифугирования; 3. Наполнение промывочного колокола продолжается до тех пор, пока эритроциты не заполнят весь объем колокола (объем колокола может быть 125 мл, 175 мл, 225 мл). Отделяющаяся в процессе центрифугирования плазма, удаляется вместе с антикоагулянтом в соответствующую емкость. После этого в автоматическом или ручном режиме начинается вторая фаза - отмывание эритроцитов в стерильном физиологическом растворе хлорида натрия. Отмывание продолжается до тех пор, пока заданный объем промывающего раствора (в акушерстве 1000-1500 мл) не будет полностью проведен через эритроциты. Все это время происходит центрифугирование. Заключительная фаза работы аппарата - опустошение колокола: 1. Центрифуга останавливается, а перистальтический насос начинает вращение в обратном направлении; 2. Отмытые аутоэритроциты перекачиваются из промывочного колокола в мешок для реинфузии; Далее процесс повторяется до тех пор, пока не будет обработана вся аспирированная из раны кровь. Продолжительность первого описанного цикла составляет -3-5 минут. Во время работы на дисплее аппарата четко отражены все необходимые параметры: скорость вращения центрифуги, скорость вращения насоса, количество перенесенного раствора. После каждого цикла работы высвечивается количество собранных и отмытых эритроцитов. Реинфузия аутоэритроцитов должна осуществляться с использованием лейкоцитарного фильтра максимум в течение 6 часов поле получения аутоэритроцитов Реинфу","terms":[{"source":"mediq","term_id":"mediq:533336c92923","canonical":"Коллаген","search_word":"Коллаген","host_word":"коллагена","inside_word":true,"mediq":{"name":"Коллаген","kind":["OTHER"],"type":"MNN_NOT_FOUND","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Мы не нашли действующее вещество у данного препарата, поэтому эффективность его не может быть доказанной.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:c6607f8d749d108d::case:a9732266bb554d1d","block_id":"block:c6607f8d749d108d","case_id":"case:a9732266bb554d1d","label":"contraindication","model":{"recommendation_strength":"null","evidence_level":"null","reason":"В тексте указано, что рефлексотерапия не рекомендуется при ДПКР экспертами некоторых стран из-за недоказанной эффективности.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"777_1","title":"Дискогенная пояснично-крестцовая радикулопатия","link":"https://cr.minzdrav.gov.ru/view-cr/777_1","metadata":{"Название клинической рекомендации":"Дискогенная пояснично-крестцовая радикулопатия","МКБ-10":"G55.1, M51.1","Возрастная группа":"Взрослые","Разработчик":"Межрегиональная общественная организация «Общество по изучению боли»","Дата размещения":"07.12.2023","Статус применения КР":"Применяется"}},"context_html":"и динамического укрепления мускулатуры, мобилизационные упражнения, а также общеукрепляющие упражнения. Лечебная физкультура оказывает положительный эффект на общее состояние здоровья пациентов, предотвращая повторяющиеся эпизоды боли, и лишена серьезных побочных эффектов, если выполняется под контролем специалиста с учетом функциональных возможностей пациента. Мануальная терапия при заболеваниях периферической нервной системы рекомендуется пациентам с подострой и хронической ДПКР (УДД – 1, УУР - А), так как её проведение может уменьшить боль и улучшить функциональное состояние пациентов [51-55]. Положительное влияние мануальной терапии на боль и функциональное состояние пациентов отмечено в сравнении с её имитацией в небольших исследованиях [52,55]. При острой ДПКР проведение мануальной терапии связано с риском увеличения размеров грыжи по данным МРТ [51]. Мануальная терапия рекомендуется экспертами США [41] и Дании [42], в сочетании с лечебной физкультурой в Великобритании [40], но не рекомендуется экспертами некоторых европейских стран [55]. Комментарии. Среди методов мануальной терапии наиболее безопасны мягкие мышечные техники, их применение должно учитывать состояние больного. Мануальная терапия может привести к усилению боли и ухудшению функций вследствие дополнительного воздействия на скелетно-мышечные структуры, но эти осложнения носят преходящий характер; серьезные осложнения (переломы, компрессия корешков конского хвоста, сосудистые осложнения) встречаются редко [51,52,55]. Психологические методы терапии, включающие когнитивно-поведенческую терапию и терапию осознанности («mindfulness») (клинико-психологическая адаптация, клинико-психологическое консультирование, клинико-психологическая коррекция, клинико-психологический тренинг), рекомендуются у пациентов с хронической ДПКР (УДД – 1, УУР - В), потому что они уменьшают боль и улучшают функциональное состояние пациентов с хронической болью в спине [56-60]. Психологические методы лечения необходимо комбинировать с лечебной физкультурой [40]. Комментарии. Психологические методы используются преимущественно в специализированных центрах по лечению пациентов с хронической болью в спине. Рефлексотерапия при заболеваниях периферической нервной системы рекомендуется при хронической ДПКР (УДД – 1, УУР - А), потому что может уменьшить боль и улучшить функциональное состояние пациентов. Рефлексотерапия не ассоциируется с серьезными нежелательными явлениями [53,61,62]. Экспертами 17 некоторых стран [40,42] рефлексотерапия не рекомендуется при ДПКР вследствие её недоказанной эффективности. Комментарии. Вероятно, р<mark class=\"hit\">ефлексотерапия <\/mark>эффективна у пациентов, которые ранее имели положительный опыт её применения при ДПКР или других заболеваниях. Массаж мышц поясницы и нижних конечностей (массаж нижней конечности медицинский, массаж нижней конечности и поясницы, массаж пояснично-крестцового отдела позвоночника, массаж спины медицинский) рекомендуется у пациентов с хронической ДПКР (УДД – 1, УУР - А), в некоторых исследованиях отмечено снижение интенсивности боли после массажа [63]. Комментарии. Массаж остается в нашей стране одним из наиболее распространенных методов лечения пациентов с болью в спине, многие пациенты связывают с массажем существенное улучшение своего состояния. Однако не рекомендуется экспертами различных стран при ведении пациентов с ДПКР вследствие отсутствия достаточных доказательств его эффективности [40-42]. Различные методы физиотерапевтического лечения. В некоторых исследованиях отмечена эффективность воздействия импульсным низкочастотным электромагнитным полем при хронической ДПКР, этот метод рекомендуется в рамках комбинированной терапии с целью снижения интенсивности боли и улучшения нарушенных функций (УДД – 2, УУР - В) [64, 65]. Вытяжение (скелетное, подводное, тракционное вытяжение позвоночника) не рекомендуется при ДПКР (УДД – 1, УУР - А), так как не получено доказательств его эффективности [45,66]. Ношение корсетов, бандажей, поясов и других специальных ортопедических приспособлений, фиксирующих пояснично-крестцовый отдел позвоночника, не рекомендуется пациентам с ДПКР (УДД – 5, УУР - С), так как эти методы не облегчают боль и не улучшают функциональную активность пациентов [45,53, 127]. Комментарии. Ношение корсетов, бандажей, поясов и других специальных ортопедических приспособлений и вытяжение также не рекомендуются экспертами различных стран по ведению пациентов с ДПКР [40-42]. Ношение корсетов, бандажей, поясов и других специальных приспособлений рекомендуется в случае наличия показаний к ортопедической коррекции, независимо от наличия ДПКР. 3.1.2 Лекарственная терапия Нестероидные противовоспалительные и противоревматические препараты (НПВП); АТХ код: М01А** (препараты, обладающие обезболивающим, 18 противовоспалительным и жаропонижающим действием) рекомендуются у пациентов с острой, подострой или обострением ДПКР (УДД – 1, УУР - А), так как они способны уменьшить боль и улучшить функциональное состояние пациентов [67-70]. Рекомендуется назначать НПВП в эффективных дозах, на минимально необходимое число дней для того, чтобы снизить риск возникновения","terms":[{"source":"marker","term_id":"marker:b5ff7866086a","canonical":"рефлексотерапия","search_word":"рефлексотерапия","host_word":"рефлексотерапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:1cc1c73d0f72cafe::case:1c33ebdaf3c13eba","block_id":"block:1cc1c73d0f72cafe","case_id":"case:1c33ebdaf3c13eba","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте указано: «рекомендуется избегать нефротоксичных препаратов (например, индометацин и др.)», то есть индометацин как пример препарата, которого следует избегать.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"78_2","title":"Нейробластома","link":"https://cr.minzdrav.gov.ru/view-cr/78_2","metadata":{"Название клинической рекомендации":"Нейробластома","МКБ-10":"C38.2, C47.0, C47.3, C47.4, C47.5, C47.6, C47.8, C47.9, C48.0, C74.1, C74.9, C76.0, C76.1, C76.2, C76.7, C76.8, D48.3","Возрастная группа":"Дети","Разработчик":"Национальное общество детских гематологов, онкологов","Дата размещения":"24.01.2025","Статус применения КР":"Применяется"}},"context_html":"ы, на фоне которой зарегистрировано развитие токсичности. Нарушения общего состояния 3 степени тяжести (30 - &lt;50) НЕ требует модификации дозы препарата, при условии эта токсичность считается переносимой ответственным клиницистом, а также родителями пациента. Болевой синдром Пациенты, испытывающие при введении динутуксимаба бета боль, несмотря на профилактику боли (как указано выше), должны получать дополнительно морфин или другие анальгетики по мере необходимости. Болевой синдром должен оцениваться в соответствии с международными критериями токсичности и с использованием методов самостоятельной оценки боли пациентами Гематологическая токсичность Все пациенты должны получать трансфузионную терапию для поддержания адекватного уровня гемоглобина и количества тромбоцитов. Если у пациента отмечается развитие нейтропении на фоне введения динутуксимаба бета, лечение не прекращается. Однако, если нейтропения не разрешилась к началу следующего курса лечения, следующий курс должен быть отложен до двух недель или до тех пор, пока уровень нейтрофилов не 110 повысится до 1 × 109/л. Доза динутуксимаба бета при проведении следующих курсов должна быть редуцирована на 50%. Гематологическая токсичность 4 степени тяжести, которая улучшается до значений не менее 2-й степени тяжести или базового уровня до начала терапии в течение одной недели после завершения лечения, НЕ будет нуждаться в модификации дозы динутуксимаба бета, при условии, что эта токсичность считается переносимой ответственным клиницистом, а также родителями пациента. Печеночная токсичность. Щелочная фосфатаза: при повышении уровня щелочной фосфатазы (ЩФ) инфузия динутуксимаба бета не должна прерываться, дозы не должны быть модифицированы, поскольку повышение уровня ЩФ отмечается достаточно часто и в последующем происходит самостоятельное снижение уровня ЩФ. В связи с этим повышение ЩФ не является проявлением печеночной токсичности. Все другие проявления печеночной токсичности, за исключением уровня билирубина, должны трактоваться также. Билирубин: Если отмечается повышение уровня билирубина более 3-х возрастных норм, иммунотерапия прерывается до тех пор, пока уровень билирубина не нормализуется. После нормализации уровня билирубина, терапия антителами возобновляется в дозе 100%. Нефротоксичность Адекватная почечная функция является обязательным условием для проведения иммунотерапии. Если отмечается нарушение почечной функции до 3 степени тяжести, рекомендуется избегать нефротоксичных препаратов (например, индо<mark class=\"hit\">метацин<\/mark> и др.). Кардиотоксичность Любые признаки сердечной патологии потребуют незамедлительного выполнения ЭКГ. При наличии признаков ишемии показано незамедлительное прекращение терапии. Пациенты с признаками бессимптомных предсердных нарушений, связанных с повышенной температурой, но не имеющие признаков ишемии миокарда или клинически значимой гипотензии, будут контролироваться, но могут продолжить терапию. Пациенты с 111 кардиотоксичностью 3 степени тяжести требуют отмены иммунотерапии и исключаются из настоящего протокола. Со стороны сердечно-сосудистой системы могут отмечаться изменения, связанные с перегрузкой жидкостью. Пациенты с клиническими проблемами, связанными с перегрузкой жидкости, должны получать фуросемид** при условии, что у них отмечается снижение систолического артериального давления не превышающее 40 ммрт.ст. от исходного. Введение динутуксимаба бета должно быть остановлено при стойком снижении систолического артериального давления ниже 80 мм рт. ст., которое по меньшей мере на 20 мм рт. ст. уменьшилось от исходного и не восстановилось после болюсного введения кристаллоидных растворов или раствора альбумина (например, 20 мл/кг 0,9 % хлорида натрия). Внутривенное введение вазопрессоров может использоваться при наличии клинических показаний. Лечение можно возобновить в 50% дозе динутуксимаба бета, после того, как артериальное давление повысилось до 80 мм рт. ст. Одышка Пациенты, у которых отмечается появление одышки и снижение насыщения кислородом менее 90%, должны получать кратковременную дотацию кислорода. Если насыщение кислородом крови не повышается более 90% без дотации кислородом, введение антител следует прекратить. Возобновить введение в 50% дозе можно в случае купирования токсичности. Тошнота, рвота и диарея Тошнота, рвота и диарея 3 степени тяжести НЕ требует модификации доз антителпри условии, что указанная токсичность считается переносимой ответственным клиницистом и родителями пациента. Кожная токсичность Токсичность со стороны кожных покровов 3 степени тяжести, которая остается стабильной или улучшается на фоне проводимой терапии (например, в/в дифенгидрамин**) 112 в течение 24 часов, НЕ требует модификации доз антител при условии, что указанная токсичность считается переносимой ответственным клиницистом и родителями пациента. Пациентам с токсическими поражениями кожи 4 степени тяжести иммунотерапия отменяется и пациенты исключаются из настоящего протокола. Однако, терапия #изотретионином должна быть продолжена. Нарушение зрения","terms":[{"source":"mediq","term_id":"mediq:9071eab50529","canonical":"Метацин","search_word":"Метацин","host_word":"индометацин","inside_word":true,"mediq":{"name":"Метацин","kind":["OTHER"],"type":"CHECKED","quality":"NOT_PROVED","atx":"A03A","atx_group":"A03A","mnn":"метоциния йодид","description":"","criterions":[{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/metocinium%20iodide","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=metocinium+iodide&t=1","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=metocinium+iodide&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":0}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:58a1753a43a5baf4::case:3ef354f732592c48","block_id":"block:58a1753a43a5baf4","case_id":"case:3ef354f732592c48","label":"contraindication","model":{"recommendation_strength":"A","evidence_level":"1","reason":"Хост-слово «антитромбина» относится к антикоагулянтному препарату, и в контексте прямо сказано: «Не рекомендовано рутинное применение антитромбина III».","evidence_quote":null,"confidence":null},"clinical":{"document_id":"791_1","title":"Послеродовые инфекционные осложнения","link":"https://cr.minzdrav.gov.ru/view-cr/791_1","metadata":{"Название клинической рекомендации":"Послеродовые инфекционные осложнения","МКБ-10":"O08.0, O75.3, O85, O86.0, O86.1, O86.4, O86.8, O90.0, O90.1, O90.2, O90.8, O90.9, O91.1, O99.5","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов, Корпоративная некоммерческая организация \"Ассоциация анестезиологов – реаниматологов\", Ассоциация акушерских анестезиологов-реаниматологов","Дата размещения":"19.07.2024","Статус применения КР":"Применяется"}},"context_html":"ности рекомендаций С (уровень достоверности доказательств – 5) Рекомендовано в случае отсутствия стабилизации гемодинамики у пациентов с септическим шоком после проведения инфузионной, вазопрессорной (C01CA: Адренергические и дофаминергические средства) и инотропной терапии (C01CX: Другие кардиотонические средства) внутривенное введение #гидрокортизона** [73,197–201]. Уровень убедительности рекомендаций A (уровень достоверности доказательств – 1) Комментарии. Рекомендовано внутривенное введение #гидрокортизона** в дозе не более 200 мг в сутки в дозировке 50 мг каждые 6 часов или в виде непрерывной инфузии. Начало терапии возможно при дозировке норэпинефрина** более 0,25 мкг/кг/мин на протяжении не менее чем 4 часов [198,199]. Применение глюкокортикоидов у пациентов с сепсисом, приводит к снижению риска смерти, а также значительному сокращению продолжительности пребывания в отделении интенсивной терапии и стационаре [202]. Рекомендована непрерывная внутривенная инфузия с целью предотвращения гипергликемии [202,203] и постепенное снижение глюкокортикоидов после прекращения вазопрессорной терапии [197]. 3.4.4 Трансфузионная терапия При снижении уровня гемоглобина ниже 70 г/л у пациентов с сепсисом и/ или септическим шоком рекомендована трансфузия эритроцитарной массы (B05AX01: Эритроциты) [73]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5) Комментарии. Трансфузия эритроцитарной массы рекомендована в случае отсутствия таких отягощающих состояний, как ишемия миокарда, тяжелая гипоксемия, острое кровотечение [73]. Выбор в качестве порога уровня гемоглобина 90 г/л не приводит к повышению 30-дневной [204], 90дневной выживаемости пациентов с сепсисом и/или септическим шоком [205]. Трансфузия свежезамороженной плазмы с целью коррекции нарушений свертывающей системы не рекомендована у пациентов с сепсисом и септическим шоком [73]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии. При отсутствии кровотечения или планируемых инвазивных вмешательств трансфузия свежезамороженной плазмы не рекомендована [112]. Рекомендована трансфузия тромбоцитов (B05AX02: Тромбоциты) при их количестве в периферической крови менее 10×10 /л и отсутствии кровотечения, а также при количестве менее 20×10 /л и наличии 9 9 высокого риска кровотечения у пациентов с сепсисом и септическим шоком [206,207]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Не рекомендовано рутинное применение <mark class=\"hit\">антитромбин<\/mark>а III (B01AB02 - Антитромбин III) для терапии пациентов с сепсисом и септическим шоком [208,209]. Уровень убедительности рекомендаций А (уровень достоверности доказательств – 1) Комментарий. Применение антитромбина не снижает смертность при сепсисе и септическом шоке, но повышает риск кровотечения [209]. 3.4.5 Респираторная терапия Рекомендовано начать диагностический поиск респираторных нарушений при SpO2 менее 95% у пациентов с сепсисом [210]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Для пациентов с дыхательной недостаточностью, вызванной сепсисом (без ОРДС), рекомендовано использовать низкий дыхательный объем по сравнению с вентиляцией с высоким дыхательным объемом [211] . Уровень убедительности рекомендаций А (уровень достоверности доказательств – 1) Комментарии: Имеются ограниченные данные о стратегиях вентиляции у пациентов с дыхательной недостаточностью, вызванной сепсисом, которые не соответствуют критериям ОРДС. Однако сепсис является независимым фактором риска развития ОРДС, и задержки в диагностике ОРДС могут привести к отсроченному использованию низких дыхательных объемов. Поэтому мы предлагаем использовать вентиляцию с низким дыхательным объемом у всех пациентов с сепсисом, которым проводится ИВЛ во избежание недостаточного или отложенного использования этого вмешательства. Кроме того, использование вентиляции с низким дыхательным объемом позволяет избежать риска повреждения легких, вызванного вентилятором, у пациентов с сепсисом, у которых был пропущен диагноз ОРДС. Рекомендовано начало ИВЛ при остром повреждении легких и остром респираторном дистресс-синдроме у пациентов с сепсисом и септическим шоком [73,212–214]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5) Комментарии: Абсолютными показаниями для начала ИВЛ являются: отсутствие самостоятельного дыхания и патологические ритмы дыхания, нарушение проходимости верхних дыхательных путей, снижение PaO /FiO менее 200 мм рт.ст., септический шок, нарушение гемодинамики с развитием жизнеугрожающих нарушений ритма, стойкой тахикардии и гипотензии. Наличие двух относительных показаний является показанием для начала ИВЛ: снижение PaO /FiO менее 300 мм рт. ст., развитие септической энцефалопатии и отека головного мозга с угнетением сознания и нарушением функции внешнего дыхания, гиперкапния или гипокапния (РaCO менее 25 мм рт.ст.), тахипноэ более 40 в минуту и прогрессирующее увеличение минутного объема вентиляции, снижение жизненной емкости легких менее 10","terms":[{"source":"mediq","term_id":"mediq:c8fd1c13c0d6","canonical":"Антитромбин","search_word":"Анти р [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:edde56ea6924922f::case:3ae688ede1b2d302","block_id":"block:edde56ea6924922f","case_id":"case:3ae688ede1b2d302","label":"contraindication","model":{"recommendation_strength":"A","evidence_level":"1","reason":"В тексте прямо сказано: «Не рекомендовано рутинное применение антитромбина III …», то есть для самого антитромбина это запрет/не рекомендовано. Указаны УУР A и УДД 1 для этой же строки.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"791_1","title":"Послеродовые инфекционные осложнения","link":"https://cr.minzdrav.gov.ru/view-cr/791_1","metadata":{"Название клинической рекомендации":"Послеродовые инфекционные осложнения","МКБ-10":"O08.0, O75.3, O85, O86.0, O86.1, O86.4, O86.8, O90.0, O90.1, O90.2, O90.8, O90.9, O91.1, O99.5","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов, Корпоративная некоммерческая организация \"Ассоциация анестезиологов – реаниматологов\", Ассоциация акушерских анестезиологов-реаниматологов","Дата размещения":"19.07.2024","Статус применения КР":"Применяется"}},"context_html":"ергические и дофаминергические средства) и инотропной терапии (C01CX: Другие кардиотонические средства) внутривенное введение #гидрокортизона** [73,197–201]. Уровень убедительности рекомендаций A (уровень достоверности доказательств – 1) Комментарии. Рекомендовано внутривенное введение #гидрокортизона** в дозе не более 200 мг в сутки в дозировке 50 мг каждые 6 часов или в виде непрерывной инфузии. Начало терапии возможно при дозировке норэпинефрина** более 0,25 мкг/кг/мин на протяжении не менее чем 4 часов [198,199]. Применение глюкокортикоидов у пациентов с сепсисом, приводит к снижению риска смерти, а также значительному сокращению продолжительности пребывания в отделении интенсивной терапии и стационаре [202]. Рекомендована непрерывная внутривенная инфузия с целью предотвращения гипергликемии [202,203] и постепенное снижение глюкокортикоидов после прекращения вазопрессорной терапии [197]. 3.4.4 Трансфузионная терапия При снижении уровня гемоглобина ниже 70 г/л у пациентов с сепсисом и/ или септическим шоком рекомендована трансфузия эритроцитарной массы (B05AX01: Эритроциты) [73]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5) Комментарии. Трансфузия эритроцитарной массы рекомендована в случае отсутствия таких отягощающих состояний, как ишемия миокарда, тяжелая гипоксемия, острое кровотечение [73]. Выбор в качестве порога уровня гемоглобина 90 г/л не приводит к повышению 30-дневной [204], 90дневной выживаемости пациентов с сепсисом и/или септическим шоком [205]. Трансфузия свежезамороженной плазмы с целью коррекции нарушений свертывающей системы не рекомендована у пациентов с сепсисом и септическим шоком [73]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии. При отсутствии кровотечения или планируемых инвазивных вмешательств трансфузия свежезамороженной плазмы не рекомендована [112]. Рекомендована трансфузия тромбоцитов (B05AX02: Тромбоциты) при их количестве в периферической крови менее 10×10 /л и отсутствии кровотечения, а также при количестве менее 20×10 /л и наличии 9 9 высокого риска кровотечения у пациентов с сепсисом и септическим шоком [206,207]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Не рекомендовано рутинное применение антитромбина III (B01AB02 - Антитромбин III) для терапии пациентов с сепсисом и септическим шоком [208,209]. Уровень убедительности рекомендаций А (уровень достоверности доказательств – 1) Комментарий. Применение <mark class=\"hit\">антитромбин<\/mark>а не снижает смертность при сепсисе и септическом шоке, но повышает риск кровотечения [209]. 3.4.5 Респираторная терапия Рекомендовано начать диагностический поиск респираторных нарушений при SpO2 менее 95% у пациентов с сепсисом [210]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Для пациентов с дыхательной недостаточностью, вызванной сепсисом (без ОРДС), рекомендовано использовать низкий дыхательный объем по сравнению с вентиляцией с высоким дыхательным объемом [211] . Уровень убедительности рекомендаций А (уровень достоверности доказательств – 1) Комментарии: Имеются ограниченные данные о стратегиях вентиляции у пациентов с дыхательной недостаточностью, вызванной сепсисом, которые не соответствуют критериям ОРДС. Однако сепсис является независимым фактором риска развития ОРДС, и задержки в диагностике ОРДС могут привести к отсроченному использованию низких дыхательных объемов. Поэтому мы предлагаем использовать вентиляцию с низким дыхательным объемом у всех пациентов с сепсисом, которым проводится ИВЛ во избежание недостаточного или отложенного использования этого вмешательства. Кроме того, использование вентиляции с низким дыхательным объемом позволяет избежать риска повреждения легких, вызванного вентилятором, у пациентов с сепсисом, у которых был пропущен диагноз ОРДС. Рекомендовано начало ИВЛ при остром повреждении легких и остром респираторном дистресс-синдроме у пациентов с сепсисом и септическим шоком [73,212–214]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5) Комментарии: Абсолютными показаниями для начала ИВЛ являются: отсутствие самостоятельного дыхания и патологические ритмы дыхания, нарушение проходимости верхних дыхательных путей, снижение PaO /FiO менее 200 мм рт.ст., септический шок, нарушение гемодинамики с развитием жизнеугрожающих нарушений ритма, стойкой тахикардии и гипотензии. Наличие двух относительных показаний является показанием для начала ИВЛ: снижение PaO /FiO менее 300 мм рт. ст., развитие септической энцефалопатии и отека головного мозга с угнетением сознания и нарушением функции внешнего дыхания, гиперкапния или гипокапния (РaCO менее 25 мм рт.ст.), тахипноэ более 40 в минуту и прогрессирующее увеличение минутного объема вентиляции, снижение жизненной емкости легких менее 10 мл/кг массы тела, снижение податливости менее 60 мл/см вод. ст., увеличение сопротивления дыхательных путей более 15 см вод. ст./л/с, усталость пациента, вовлечение вспомогательных дых","terms":[{"source":"mediq","term_id":"mediq:c8fd1c13c0d6","canonical":"Антитромбин","search_word":"Антитромбин","host_word":"антитромбина","inside_word":true,"mediq":{"name":"Антитромбин","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:c4c69ab2a4b09207::case:59fe456b50d1d67f","block_id":"block:c4c69ab2a4b09207","case_id":"case:59fe456b50d1d67f","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Совпадает с тем же местом текста, где метамизол натрия указан в перечне средств, которые не рекомендуется использовать для купирования ГБН у детей.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"810_1","title":"Головная боль напряжения","link":"https://cr.minzdrav.gov.ru/view-cr/810_1","metadata":{"Название клинической рекомендации":"Головная боль напряжения","МКБ-10":"G44, G44.2, G44.3, G44.8, G90.8","Возрастная группа":"Дети","Разработчик":"Всероссийское общество неврологов, Общероссийская общественная организация \"Союз реабилитологов России\"","Дата размещения":"15.11.2024","Статус применения КР":"Применяется"}},"context_html":"противопоказания к применению методов лечения Лечение ГБН включает фармакотерапию и немедикаментозные методы. Лечебная стратегия во многом зависит от частоты приступов ГБ, наличия коморбидных нарушений и степени их выраженности [2]. В лекарственной терапии ГБН применяются средства как для купирования головной боли, так и для ее профилактики. При эпизодической ГБН с частотой более двух приступов в неделю более предпочтительно профилактическое лечение, а не купирование приступов аналгетиками. При хронической ГБН обезболивающие препараты обладают сомнительной эффективностью и повышают риск развития лекарственно индуцированной головной боли, поэтому основное значение приобретает профилактическая терапия [3, 4]. 3.1 Консервативное лечение  Рекомендуется применение парацетамола** в разовой дозе 10-15 мг/кг у детей с нечастыми эпизодическими и частыми эпизодическими ГБН, но не превышающими частоту двух раз в неделю [2, 17]. Уровень убедительности рекомендаций В (уровень достоверности доказательств – 3). Комментарий. Парацетамол** назначается в самом начале приступа. Возможно повторное применение препарата через 6-8 часов.  Рекомендуется использовать ибупрофен** в разовой дозе 7,5 мг/кг массы тела у детей с нечастыми эпизодическими и частыми эпизодическими ГБН для купирования приступов умеренной и высокой интенсивности, но не превышающими частоту двух раз в неделю [17, 18]. Уровень убедительности рекомендаций В (уровень достоверности доказательств – 3). Комментарий. Ибупрофен** обычно назначается в начале приступа ГБ. Ибупрофен** по своим обезболивающему и жаропонижающему эффектам, а также по воздействию на желудочно-кишечный тракт и почки сопоставим с парацетамолом**, но не оказывает токсического действия на печень [19].  Рекомендуется использовать кетопрофен (M01AE03) (в форме лизиновой соли кетопрофена в гранулах для приготовления раствора для приема внутрь)** в разовой дозе 40 мг у детей старше 6 лет для купирования приступов умеренной и высокой интенсивности до трех раз в сутки [17]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Не рекомендуется при частых приступах ГБН у детей применение более двух (максимум трех) раз препаратов, обладающих обезболивающим дейстивем, в неделю в виду высокого риска формирования лекарственного абузуса [2, 4]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Не рекомендуется для купирования ГБН у детей использовать некоторые анальгетики (N02), содержащие м<mark class=\"hit\">етамизол <\/mark>натрия (N02BB02), в связи с высоким риском развития агранулоцитоза, препараты салициловой кислоты и ее производных (N02BA) из-за риска развития синдрома Рейе, а также комбинированные обезболивающие лекарственные средства (другие анальгетики и антипиретики), содержащие помимо простого анальгетика кофеин, фенобарбитал, эрготамин или кодеин в связи с высоким риском развития ЛИГБ [18]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Рекомендуется использовать профилактическую терапию у детей с частой эпизодической и хронической формами ГБН с целью уменьшения частоты дней с ГБ в месяц [2, 4, 20]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Рекомендуется для профилактической терапии у детей с частой эпизодической и хронической формами ГБН в случае выраженного отрицательного влияния головной боли на повседневную активность применять #амитриптилин** (1 мг/кг/массы тела в сутки) перорально курсом от 2 мес. при частых эпизодических до 4-6 мес. при хронических ГБН [17, 20, 21, 25]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4). Комментарий. Рекомендуемая начальная доза составляет 5-10 мг (или 0,25 мг/кг) перед сном. В зависимости от ответа на лечение дозу #амитриптилина** можно увеличивать каждые 2-3 недели на 0,25 мг/кг до максимальной дозы 1 мг/кг/сут. Дневная сонливость часто возникает при дозах выше 30-40 мг в день, даже если лекарство назначается перед сном. Другие побочные эффекты включают ортостатическую гипотензию и антихолинергические эффекты [20]. Поэтому перед назначением #амитриптилина** показана регистрация электрокардиограммы(A05.10.006).  Рекомендуется для профилактической терапии у детей с частой эпизодической и хронической формами ГБН при неэффективности #амитриптилина** назначение в течение 2-3 мес. фиксированной комбинации #магния+пиридоксин (магний (в виде лактата дигидрата и пидолата) из расчета магния пидолата по 200-300 мг в сутки в два приема перорально [30] (A12CC препараты магния, в лекарственной форме раствор для приема внутрь) или #вальпроевой кислоты (N03AG01)** перорально, с постепенным повышением дозы до 10-20 мг/кг/сут. [20, 30]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарий. Необходимо учитывать возможное развитие нежелательных эффектов со стороны эндокринной системы при применении препаратов #вальпроевой кислоты** у девочек в пре- и пубертатном периоде. 3.2 Немедикаментозные мето","terms":[{"source":"blacklist","term_id":"blacklist:f999e9e4fb26","canonical":"Анальгин","search_word":"Метамизол","host_word":"метамизол","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Анальгин","aliases":["Метамизол","Metamizole","Dipyrone"],"description":"имеет доказанную эффективность, но равно имеет и доказанную небезопасность (подробнее - тут). Вряд ли когда-нибудь выйдет из бана, поскольку имеет множество куда более безопасных альтернатив (ибупрофен, парацетамол, индометацин и пр.). Исследований хватает: Cochrane Reviews 2; Pubmed 200; FDA 0; RXlist 0; ВОЗ 0; ФК (-)."}},{"source":"blacklist","term_id":"blacklist:fc7c02eeb9a7","canonical":"Метамизол","search_word":"Метамизол","host_word":"метамизол","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Метамизол","aliases":[],"description":"см. Анальгин."}}]},{"id":"block:a09449a59a573fda::case:07eb2c946c0d5657","block_id":"block:a09449a59a573fda","case_id":"case:07eb2c946c0d5657","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте для детей прямо сказано: «следует воздержаться от применения препаратов метамизола натрия», а в стационаре использовать только при недоступности других анальгетиков. Для этого упоминания это запрет/нежелательность применения.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"813_1","title":"Травма гортани","link":"https://cr.minzdrav.gov.ru/view-cr/813_1","metadata":{"Название клинической рекомендации":"Травма гортани","МКБ-10":"R04.1, S10.0, S10.1, S11.0","Возрастная группа":"Взрослые, дети","Разработчик":"Национальная медицинская ассоциация оториноларингологов","Дата размещения":"19.11.2024","Статус применения КР":"Применяется"}},"context_html":"ндаций C (уровень достоверности доказательств – 5). Комментарии: целесообразно парентеральное введение кортикостероидов системного действия и диуретиков[7, 9, 22, 28]. Рекомендуется назначать ограничение голосовой нагрузки (не кричать, не шептать сроком не менее 2-х дней) пострадавшим с травмой гортани с целью уменьшения отека гортани и ускорения разрешения реактивных явлений [22, 28]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5). Комментарии: необходимо создать охранительный режим (голосовой режим), рекомендовать больному при травме гортани - полный голосовой покой сроком на 1 – 2 суток, затем ограничение любой голосовой нагрузки. Также необходимо прекратить прием острой, соленой, горячей, холодной пищи, спиртных напитков, курение. Рекомендуется назначать прием препаратов для лечения язвенной болезни желудка и двенадцатиперстной кишки и ГЭРБ (Код АТХ: A02BX) пациентам с раной или 20 воспалительными изменениями слизистой оболочки гортани или гортаноглотки с целью предотвращения воздействия желудочного содержимого на раневую поверхность или воспаленную слизистую оболочку гортани и гортаноглотки [7,5, 9, 22, 28]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5). Рекомендуется назначать анальгетики, нестероидные противовоспалительные и противоревматические препараты, пострадавшим с травмой гортани и глотки с целью уменьшения отека и болевого синдрома [7; 28; 34; 41]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5). Комментарии: С целью уменьшения выраженности боли используются препараты из группы другие анальгетики и антипиретики (АТХ: N02B) и группы нестероидные противовоспалительные и противоревматические препараты (АТХ: M01A) отдельно или в комбинациях [41; 42]. Рекомендуется применять комбинацию нестероидных противовоспалительных препаратов (НПВП) (АТХ: M01A) и анилидов (парацетамол**(ATX: N02BE01)), а также пиразолоны (метамизол натрия (АТХ: N02BB02)) для купирования болевого синдрома у взрослых и детей, в том числе в послеоперационном периоде (Таблицы 1, 2) [43, 44]. У детей применение НПВП (АТХ: M01A) ограничивается ибупрофеном**(ATX: M01AE01) с 3 мес. для суппозиториев ректальных и суспензии для приема внутрь, с 6 лет для таблеток и с 12 лет для капсул и кетопрофеном**(ATX: M01AE03) с 6 лет для гранул для приема внутрь и с 15 лет для форм для парентерального введения. В амбулаторной практике при лечении детей следует воздержаться от применения препаратов <mark class=\"hit\">метамизол<\/mark>а натрия (АТХ: N02BB02), а в стационарной практике использовать их только в случае недоступности других анальгетиков (Код АТХ: N02), разрешѐнных к применению у детей, по причине рисков развития серьезных нежелательных явлений. Таблица 1. Рекомендованные дозы и режимы применения анальгетической и противоотечной терапии у взрослых при травмах гортани. Препарат Разовая доза Интервал назначения Максимальная суточная доза Максимальная длительность назначения Парацетамол** (АТХ: N02BE01) 1 г в/в инфузия в течение 15 мин. 4ч 4 г 5-7 сут Диклофенак** 75 мл в/м 12 ч 150 мг 2 сут 21 (ATX: M01AB05) Кеторолак** (ATX: M01AB15) 30 мг в/в, в/м 6 ч 60-90 мг 2 сут Кетопрофен** (ATX: M01AE03) 100 мг в/в, в/м 12 ч 200 мг не более 2 сут Лорноксикам (ATX: M01AC05) 8 мг в/в, в/м 12 ч 16 мг 1-7 сут Декскетопрофен** (ATX: M01AE17) 50 мг в/в, в/м 8-12 ч 150 мг 2 сут Метамизол натрия (АТХ: N02BB02) 500-1000 мг в/в, в/м 8-12 ч 2 г 1-5 сут Таблица 2. Рекомендованные дозы и режимы применения анальгетической и противоотечной тера удь выйдет из бана, поскольку имеет множество куда более безопасных альтернатив (ибупрофен, парацетамол, индометацин и пр.). Исследований хватает: Cochrane Reviews 2; Pubmed 200; FDA 0; RXlist 0; ВОЗ 0; ФК (-)."}},{"source":"blacklist","term_id":"blacklist:fc7c02eeb9a7","canonical":"Метамизол","search_word":"Метамизол","host_word":"метамизола","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Метамизол","aliases":[],"description":"см. Анальгин."}}]},{"id":"block:d38ec568a17c19ea::case:456976b3542a5fd9","block_id":"block:d38ec568a17c19ea","case_id":"case:456976b3542a5fd9","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «метамизола» относится к метамизолу натрия, который в тексте прямо не рекомендуется у детей в амбулаторной практике и допускается лишь ограниченно в стационаре при недоступности других анальгетиков.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"815_1","title":"Травма носа","link":"https://cr.minzdrav.gov.ru/view-cr/815_1","metadata":{"Название клинической рекомендации":"Травма носа","МКБ-10":"S00.3, S01.2, S02.2, S02.2, S02.2","Возрастная группа":"Взрослые, дети","Разработчик":"Национальная медицинская ассоциация оториноларингологов","Дата размещения":"20.11.2024","Статус применения КР":"Применяется"}},"context_html":"9]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5)  Рекомендуется прием (осмотр, консультация) врача-невролога первичный всех пациентов с травмой носа для своевременной диагностики сопутствующей патологии и лечения [7, 29]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Рекомендуется регистрация электрокардиограммы (ЭКГ) пациентам с травмой носа и сопутствующим массивным кровотечением, сочетанной травмой носа для оценки состояния сердечно-сосудистой системы и планирования лечения [7, 33, 34, 35]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения 3.1 Консервативное лечение 17 Консервативное лечение направлено на уменьшение выраженности боли, отѐка, предупреждение развития бактериального воспаления в области повреждения, а также стимуляцию процессов репарации и ускорение восстановления функций носа [21, 26, 29, 45].  Рекомендуется всем пациентам с травмой носа назначение анальгетиков с целью симптоматической терапии болевого синдрома при отсутствии противопоказаний [21, 26]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: Сильная боль, а также нервно-психический стресс, связанный с травмой, играют роль в развитии или усугублении травматического шока [26]. С целью уменьшения выраженности боли используются препараты из группы другие анальгетики и антипиретики (АТХ: N02B) и группы нестероидные противовоспалительные и противоревматические препараты (АТХ: M01A) отдельно или в комбинациях [46, 47]. Рекомендуется применять комбинацию нестероидных противовоспалительных препаратов (НПВП) (АТХ: M01A нестероидные противовоспалительные и противоревматические препараты) и анилидов (парацетамол**(ATX: N02BE01)), а также пиразолоны (метамизол натрия (АТХ: N02BB02)) для купирования болевого синдрома у взрослых и детей, в том числе в послеоперационном периоде (Таблицы 2, 3) [46, 47]. У детей применение НПВП (АТХ: M01A нестероидные противовоспалительные и противоревматические препараты) ограничивается ибупрофеном**(ATX: M01AE01) с 3 мес., кетопрофеном**(ATX: M01AE03) с 15 лет, кетопрофеном**(ATX: M01AE03) в лекарственной форме гранулы для приготовления раствора для приема внутрь с 6 лет. В амбулаторной практике при лечении детей следует воздержаться от применения препаратов <mark class=\"hit\">метамизол<\/mark>а натрия (АТХ: N02B
