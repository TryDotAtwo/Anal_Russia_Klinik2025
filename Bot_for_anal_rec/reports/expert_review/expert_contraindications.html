обности к обучению, развитию социальной дезадаптации, нарушению когнитивного развития [93-94]. Особенности регистрации препаратов обусловили ограничение","terms":[{"source":"marker","term_id":"marker:6c2be83d36aa","canonical":"физиотерапия","search_word":"физиотерапия","host_word":"физиотерапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:b80d095fc7544b3b::case:74c1b9850e3e5392","block_id":"block:b80d095fc7544b3b","case_id":"case:74c1b9850e3e5392","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"«Зеленый чай» указан в перечне продуктов, которые при хронической спонтанной крапивнице ограничивают/исключают как гистаминолибераторы; это запрет/избегание для пациента.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"264_2","title":"Крапивница","link":"https://cr.minzdrav.gov.ru/view-cr/264_2","metadata":{"Название клинической рекомендации":"Крапивница","МКБ-10":"L50, L50.0, L50.1, L50.2, L50.3, L50.4, L50.5, L50.6, L50.8, L50.9, T78.3","Возрастная группа":"Взрослые, дети","Разработчик":"Российская ассоциация аллергологов и клинических иммунологов, Союз педиатров России, Общероссийская общественная организация \"Российское общество дерматовенерологов и косметологов\"","Дата размещения":"19.07.2023","Статус применения КР":"Применяется"}},"context_html":"торов: жара, холод, физические нагрузки, трение кожи. 2. Пациентам с хронической рецидивирующей и физической крапивницей показан бережный уход за кожей с использованием специализированных моющих средств, адаптированных для чувствительной кожи. 3. Пациентам с холинэргической крапивницей следует избегать интенсивной физической нагрузки. 4. Пациентам с замедленной крапивницей от давления следует избегать давления на кожу. 5. При контактной крапивнице следует избегать контакта с провоцирующими факторами. ОСОБЕННОСТИ ПИТАНИЯ БОЛЬНЫХ С ХРОНИЧЕСКОЙ СПОНТАННОЙ КРАПИВНИЦЕЙ 1. Базовое питание подбирается индивидуально с учетом переносимости продуктов. 2. Рекомендуется ведение дневника с обязательной ежедневной регистрацией симптомов крапивницы (индекс зуда, высыпаний, наличие и локализация ангиоотеков). 3. При пищевой аллергии назначается элиминационная диета с исключением выявленных пищевых аллергенов. 4. Пищевые аллергены как причина ХСК выявляются редко, чаще у детей. К ним относятся распространенные продукты питания - молоко, орехи, яйца, рыба, арахис, моллюски, пшеница и соя («большая восьмерка») В последние годы к этому списку добавили кунжут, сельдерей, люпин (бобы которого заменяют сою). 5. При отсутствии пищевой аллергии ограничиваются продукты с особыми свойствами (продукты с высоким содержанием гистамина; продукты, высвобождающие гистамин в организме – либераторы гистамина; некоторые другие). Диеты с ограничением указанных групп пищевых продуктов, которые не являются аллергенами носит название низкогистаминовой диеты или диеты без «псевдоаллергенов» 1. Пищевые продукты с высоким содержанием гистамина – 1. Нативные - томаты, шпинат; мясо (говядина, телятина, свинина); свиная печень; курица; рыба свежая и замороженная (тунец, лосось, скумбрия, сайра, щука из макрели); свежие морепродукты; 2. консервированные - ветчина свиная, говяжьи сосиски; ферментированные сыры ; ферментированные напитки; квашеная капуста; консервированный тунец; консервированные анчоусы (хамса); консервированная, копченая сельдь и икра; 3. паста из соевых бобов, паста из красного перца, майонез, йогурт, сыр, кетчуп, вино и пиво, которые содержат большое количество гистамина. 2. Пищевые продукты - гистаминолибераторы 1. клубника, шоколад, яичный белок; свинина; корица; папайя; бобовые (горох, соя, чечевица, фасоль, арахис) за счет присутствующего лецитина; 2. высвобождают гистамин продукты быстрого приготовления; 3. виноград, бананы, клубника и цитрусовые (лимоны, апельсины, мандарины), ананасы, помидоры, орехи, алкогольные напитки, включая вино, <mark class=\"hit\">зеленый чай<\/mark> и шоколад. 3. Другие. 1. Пищевые добавки (Е-100-Е-518): азо красители (Е102-124), консерванты бензоаты (Е210-219), желирующие агенты, разрыхлители, увлажнители, эмульгаторы, усилители запахов, антиоксиданты, отделяющие субстанции, подсластители, субстанции для выпечки, усилители вкуса,, модифицированные крахмалы, пеногасители, стабилизаторы, вкусовые приправы. Некоторые из них входят в состав жевательной резинки, леденцов и подобных изделий. 2. Натуральные салицилаты, тартразин; 3. Неидентифицированные ароматические субстанции в томатах, белом вине, травах. Список предпочтительных продуктов: Нежирное говяжье мясо, отварное.; супы крупяные, овощные (вегетарианские, на вторичном говяжьем бульоне); масло оливковое, подсолнечное; картофель отварной; каши (гречневая, геркулесовая, рисовая); натуральные йогурты без добавок, творог, простокваша, ряженка; белые сычужные сыры; огурцы свежие, петрушка, укроп; яблоки печеные; чай, сахар, безкофеиновый кофе; компот из сухофруктов, кроме изюма; цельнозерновой хлеб, хлебцы. Используются только свежие неконсервированные пищевые продукты или свежезамороженные. Приложение Г1-ГN. Шкалы оценки, вопросники и другие оценочные инструменты состояния пациента, приведенные в клинических рекомендациях Оценка активности заболевания Оценка активности спонтанной крапивницы представляет собой унифицированную балльную систему [58, 197]. UAS 7 (Urticaria Activity Score 7), или Индекс Активности Крапивницы для оценки тяжести заболевания и результатов лечения спонтанной крапивницы. UAS 7 предполагает суммарную оценку основных симптомов заболевания (количество высыпаний и интенсивность зуда) самим пациентом каждые 24 ч за 7 последовательных дней (Приложение Г1). Эта оценка удобна для пациента и врача и позволит объективно оценить состояние пациента и его индивидуальный ответ на проводимую терапию [19]. Эта балльная оценка активности не может быть использована для оценки активности физической крапивницы и изолированных ангиоотеков. Важным инструментом для оценки течения заболевания и эффективности лечения является тест контроля крапивницы (Urticaria Control Test). Он может быть использован для оценки контроля болезни за последние 4 недели у пациентов с хронической спонтанной и индуцированной крапивницей. Требуется ответить на 4 вопроса, касающиеся контроля симптомов болезни, влияние на качество жизни, эффективности лечения, общего контроля заболевания. Каждый ответ на вопрос оценивается в баллах от 0 до 4. Максимальная сумма балов при ответ","terms":[{"source":"mediq","term_id":"mediq:11138dac06fe","canonical":"Зеленый чай","search_word":"Зеленый чай","host_word":"зеленый чай","inside_word":false,"mediq":{"name":"Зеленый чай","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:25bbe19b45c4f879::case:1730585f8f2e406b","block_id":"block:25bbe19b45c4f879","case_id":"case:1730585f8f2e406b","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте диетотерапии чеснок перечислен среди продуктов, которые необходимо исключить из рациона при язвенной болезни; это прямое указание на избегание.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"277_2","title":"Язвенная болезнь","link":"https://cr.minzdrav.gov.ru/view-cr/277_2","metadata":{"Название клинической рекомендации":"Язвенная болезнь","МКБ-10":"K25, K26, K27.0, K27.4, K28.0, K28.4, K31.1, K31.2, K31.6, K31.9","Возрастная группа":"Взрослые","Разработчик":"Общероссийская общественная организация \"Российское общество хирургов\", Российская Гастроэнтерологическая Ассоциация, Ассоциация \"Эндоскопическое общество \"РЭндО\", Российское общество колоректальных хирургов, Межрегиональная Общественная Организация \"Научное сообщество по содействию клиническому изучению микробиома человека\"","Дата размещения":"13.01.2025","Статус применения КР":"Применяется"}},"context_html":"едует заподозрить, если у больных молодого возраста, злоупотребляющих алкоголем, многократные приступы рвоты заканчиваются появлением алой крови в рвотных массах. Наличие неопределенных желудочных жалоб, похудание и нарушение общего состояния больного (так называемый синдром «малых» признаков) заставляют заподозрить опухоль желудка как причину кровотечения. Рвотные массы в этих случаях чаще имеет характер кофейной гущи. Для кровотечения из варикозно-расширенных вен пищевода характерна многократная рвота темной кровью; дегтеобразный стул появляется обычно через 1-2 суток. Из перенесенных заболеваний важно отметить болезни печени и желчевыводящих путей (в первую очередь - цирроз печени), а также повторные тяжелые приступы острого панкреатита. 32 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения Лечение ЯБ должно быть комплексным и включать в себя не только назначение лекарственных препаратов, но и проведение широкого круга различных мероприятий: диетическое питание, прекращение курения и злоупотребления алкоголем, отказ от приема препаратов, обладающихульцерогенным действием, нормализацию режима труда и отдыха, санаторно-курортное лечение. Пациенты с неосложненным течением ЯБ подлежат консервативному лечению. В большинстве случаев оно проводится амбулаторно. Однако при выраженном болевом синдроме, высоком риске развития осложнений (например, большие и гигантские размеры язв), необходимости дообследования с целью верификации диагноза (например, при неясном характер язвенного поражения желудка), тяжелых сопутствующих заболеваниях целесообразна госпитализация пациентов. 3.1. Диетотерапия • Всем пациентам с ЯБ с целью ускорения заживления язв рекомендуется диетотерапия [34]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Комментарий. Основные принципы диетического питания пациентов с язвенной болезнью, выработанные много лет назад, сохраняют свою актуальность и в настоящее время. Остаются в силе рекомендации частого (5-6 раз в сутки), дробного питания, соответствующие правилу: “шесть маленьких приемов пищи лучше, чем три больших”, механического, термического и химического щажения. Из пищевого рациона необходимо исключить продукты, раздражающие слизистую оболочку желудка и возбуждающие секрецию соляной кислоты: крепкие мясные и рыбные бульоны, жареную и наперченную пищу, копчености и консервы, приправы и специи (лук, <mark class=\"hit\">чеснок<\/mark>, перец, горчицу), соления и маринады, газированные фруктовые воды, пиво, белое сухое вино, шампанское, кофе, цитрусовые. Следует отдавать предпочтение продуктам, обладающим выраженными буферными свойствами (т.е., способностью связывать и нейтрализовывать соляную кислоту). К ним относятся мясо и рыба (отварные или приготовленные на пару), яйца, молоко и молочные продукты. Разрешаются также макаронные изделия, черствый белый хлеб, сухой бисквит и сухое печенье, молочные и вегетарианские супы. Овощи (картофель, морковь, кабачки, 33 цветная капуста) можно готовить тушеными или в виде пюре и паровых суфле. В пищевой рацион можно включать каши, кисели из сладких сортов ягод, муссы, желе, сырые тертые и печеные яблоки, какао с молоком, некрепкий чай. Нужно помнить и о таких простых, но в то же время важных рекомендациях, как необходимость принимать пищу в спокойной обстановке, не спеша, сидя, тщательно прожевывать пищу. Это способствует лучшему пропитыванию пищи слюной, буферные возможности которой являются достаточно выраженными. 3.2. Консервативное лечение • Пациентам с обострением ЯБ с целью достижения заживления язв рекомендуется проведение антисекреторной терапии ингибиторами протонного насоса (ИПН) в течение 4-6 недель [2, 3]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Комментарий. В качестве базисной противоязвенной терапии в настоящее время могут рассматриваться только антациды, блокаторы Н 2-гистаминовых рецепторов (Н2блокаторы) и ИПН. В 1990 г. W. Burget и соавт. [35] опубликовали данные мета-анализа 300 работ, на основании которого пришли к заключению, что язвы желудка и ДПК рубцуются почти во всех случаях, если в течение суток удается поддерживать рН внутрижелудочного содержимого &gt;3 около 18 часов («правило Бурже» (Burget). Согласно одному из последних мета-анализов, Н 2-блокаторы и ИПН достоверно эффективнее плацебо в отношении достижения рубцевания язвенного дефекта (ОШ = 3,49, 95% ДИ: 3,28-3,72; p &lt;0,0001) и снижения риска повторного кровотечения при осложнённом течении заболевания (ОШ = 0,68, 95% ДИ: 0,60-0,78;p &lt;0,0001) [36]. Лишь препараты группы ИПН могут выполнить после их приема условия необходимой продолжительности повышения рН в желудке, требующейся для заживления гастродуоденальных язв. В настоящее время ИПН являются средством базисной терапии обострения ЯБ. Они назначаются с целью купирования болевого синдрома и диспепсических расстройств, а также для достижения рубцевания язвенного дефекта в возможн","terms":[{"source":"mediq","term_id":"mediq:1cfb6cd6f5d1","canonical":"Чеснок","search_word":"Чеснок","host_word":"чеснок","inside_word":false,"mediq":{"name":"Чеснок","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:5a16f4d7ce354538::case:6574f87598a2db71","block_id":"block:5a16f4d7ce354538","case_id":"case:6574f87598a2db71","label":"contraindication","model":{"recommendation_strength":"B","evidence_level":"1","reason":"Омега-3 в этом фрагменте прямо указаны как рутинно не рекомендованные к назначению беременной пациентке.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"288_2","title":"Нормальная беременность","link":"https://cr.minzdrav.gov.ru/view-cr/288_2","metadata":{"Название клинической рекомендации":"Нормальная беременность","МКБ-10":"Z32, Z33, Z34, Z35, Z36","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов","Дата размещения":"15.02.2024","Статус применения КР":"Применяется"}},"context_html":"и. Рекомендовано назначить беременной пациентке группы высокого риска гиповитаминоза пероральный прием колекальциферола** на протяжении всей беременности в дозе 500-1000 МЕ в день с целью профилактики дефицита витамина D для снижения риска акушерских осложнений [173, 174], [175], [176], [177], [178]. Уровень убедительности рекомендаций B (уровень достоверности доказательств - 1). Комментарии: К группе высокого риска гиповитаминоза витамина D относятся женщины: с темной кожей [179], витилиго [180], имеющие ограничения пребывания на солнце [181], с заболеваниями желудочно-кишечного тракта [182], с недостаточным питанием [183], ожирением [184], анемией [185], диабетом [186]. Согласно инструкции к лекарственному препарату доза 500 МЕ рекомендована в 1-2 триместре беременности, с 28 недель беременности возможно назначение 1000 МЕ колекальциферола** с целью профилактики дефицита и недостаточности витамина D. Колекальциферол** может быть назначен как монопрепарат или в составе поливитаминов и поливитаминов в комбинации с минеральными веществами. При наличии лабораторно подтвержденного дефицита витамина D необходима консультация врачаэндокринолога и коррекция дозы колекальциферола** в соответствии с проектом клинических рекомендаций Российской ассоциации эндокринологов «Дефицит витамина D» 2023 г. [187]. В группе низкого риска гиповитаминоза витамина D его назначение не снижает риск таких акушерских осложнений, как ПЭ, ЗРП и ГСД [188, 189]. Не рекомендовано рутинно назначать поливитамины и поливитамины в комбинации с минеральными веществами беременной пациентке группы низкого риска гиповитаминоза [190]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 1). Комментарий: Доказано положительное влияние отдельных витаминов и микроэлементов (фолиевая кислота**, колекальциферол**, препараты железа) на перинатальные исходы [191], [192], [193]. Пероральный прием поливитаминов или поливитаминов в комбинации с минеральными веществами на протяжении всей беременности (с учетом рекомендованных выше дозировок витаминов и микроэлементов) рекомендован беременным пациенткам группы высокого риска гиповитаминоза [194]. К группе высокого риска гиповитаминоза относятся женщины: с наличием заболеваний, нарушающих обмен витаминов [195], [196], с особенностью диеты (вегетарианская/веганская диета, редуцированная по калорийности диета) [197], с ожирением [198], с избыточными физическими перегрузками [199]. Не рекомендовано рутинно назначать беременной пациентке <mark class=\"hit\">Омега-3<\/mark> полиненасыщенные жирные кислоты (АТХ -Омега-3 триглицериды, включая другие эфиры и кислоты) [178], [200], [201], [202], [203], [204], [205], [206]. Уровень убедительности рекомендаций В (уровень достоверности доказательств - 1). Комментарий: Назначение Омега-3 триглицериды, включая другие эфиры и кислоты, не снижает риск ГСД, ПР, нарушения нейрокогнитивного развития детей, послеродовой депрессии, ПЭ, ЗРП. Беременной пациентке группы риска ПР и ЗРП, например, курящей беременной пациентке, может быть рекомендован прием Омега-3 триглицериды, включая другие эфиры и кислоты, так как это снижает риск спонтанных ПР и рождения маловесных детей [207]. Не рекомендовано рутинно назначать препараты железа беременной пациентке при нормальном уровне гемоглобина [208], [209], [210]. Уровень убедительности рекомендаций А (уровень достоверности доказательств -2). Комментарии: Нет доказательств пользы рутинного назначения препаратов железа для здоровья матери или ребенка [211]. При этом пациенткам группы риска развития латентного железодефицита и железодефицитной анемии (у которых невозможно устранить причину развития железодефицитного состояния, соблюдающим вегетарианскую или веганскую диету) рекомендовано назначать профилактические дозы лекарственных препаратов железа, пациенткам с железодефицитной анемией – лечебные дозы препаратов железа согласно клиническим рекомендациям «Железодефицитная анемия» 2021 г. [212]. Не рекомендовано рутинно назначать беременной пациентке ретинол** (витамин А) [213], [214]. Уровень убедительности рекомендаций А (уровень достоверности доказательств - 1). Комментарии: Нет доказательств пользы рутинного назначения витамина А. Прием витамина А не снижает риск материнской, перинатальной и неонатальной смертности, мертворождений, рождения детей с низкой массой тела [213]. Прием больших доз витамина А (&gt;10 000 МЕ) может оказывать тератогенный эффект [214], [215], [216], [217], [218], [219]. Не рекомендовано рутинно назначать беременной пациентке витамин Е [220], [221]. Уровень убедительности рекомендаций А (уровень достоверности доказательств - 1). Комментарии: Прием витамина Е не снижает риск таких акушерских и перинатальных осложнений, как ПЭ, ПР, ЗРП, антенатальная гибель плода и неонатальная смерть. Не рекомендовано рутинно назначать беременной пациентке аскорбиновую кислоту** (витамин С) [220], [222], [223]. Уровень убедительности рекомендаций A (уровень достоверности доказательств - 1). Комментарии: Рутинный прием аскорбиновой кислоты** не снижает риск таких акушерских и перинатальных о","terms":[{"source":"mediq","term_id":"mediq:864fba27a1d2","canonical":"Омега-3","search_word":"Омега-3","host_word":"Омега-3","inside_word":false,"mediq":{"name":"Омега-3","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на 00 МЕ в день с целью профилактики дефицита витамина D для снижения риска акушерских осложнений [173, 174], [175], [176], [177], [178]. Уровень убедительности рекомендаций B (уровень достоверности доказательств - 1). Комментарии: К группе высокого риска гиповитаминоза витамина D относятся женщины: с темной кожей [179], витилиго [180], имеющие ограничения пребывания на солнце [181], с заболеваниями желудочно-кишечного тракта [182], с недостаточным питанием [183], ожирением [184], анемией [185], диабетом [186]. Согласно инструкции к лекарственному препарату доза 500 МЕ рекомендована в 1-2 триместре беременности, с 28 недель беременности возможно назначение 1000 МЕ колекальциферола** с целью профилактики дефицита и недостаточности витамина D. Колекальциферол** может быть назначен как монопрепарат или в составе поливитаминов и поливитаминов в комбинации с минеральными веществами. При наличии лабораторно подтвержденного дефицита витамина D необходима консультация врачаэндокринолога и коррекция дозы колекальциферола** в соответствии с проектом клинических рекомендаций Российской ассоциации эндокринологов «Дефицит витамина D» 2023 г. [187]. В группе низкого риска гиповитаминоза витамина D его назначение не снижает риск таких акушерских осложнений, как ПЭ, ЗРП и ГСД [188, 189]. Не рекомендовано рутинно назначать поливитамины и поливитамины в комбинации с минеральными веществами беременной пациентке группы низкого риска гиповитаминоза [190]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 1). Комментарий: Доказано положительное влияние отдельных витаминов и микроэлементов (фолиевая кислота**, колекальциферол**, препараты железа) на перинатальные исходы [191], [192], [193]. Пероральный прием поливитаминов или поливитаминов в комбинации с минеральными веществами на протяжении всей беременности (с учетом рекомендованных выше дозировок витаминов и микроэлементов) рекомендован беременным пациенткам группы высокого риска гиповитаминоза [194]. К группе в ие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:5a16f4d7ce354538::case:fc156472271bdf16","block_id":"block:5a16f4d7ce354538","case_id":"case:fc156472271bdf16","label":"contraindication","model":{"recommendation_strength":"B","evidence_level":"1","reason":"Хост-слово «Омега-3» внутри совпадения относится к тому же запрету на рутинное назначение.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"288_2","title":"Нормальная беременность","link":"https://cr.minzdrav.gov.ru/view-cr/288_2","metadata":{"Название клинической рекомендации":"Нормальная беременность","МКБ-10":"Z32, Z33, Z34, Z35, Z36","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов","Дата размещения":"15.02.2024","Статус применения КР":"Применяется"}},"context_html":"и. Рекомендовано назначить беременной пациентке группы высокого риска гиповитаминоза пероральный прием колекальциферола** на протяжении всей беременности в дозе 500-1000 МЕ в день с целью профилактики дефицита витамина D для снижения риска акушерских о иентке Омега-3 полиненасыщенные жирные кислоты (АТХ -Омега-3 триглицериды, включая другие эфиры и кислоты) [178], [200], [201], [202], [203], [204], [205], [206]. Уровень убедительности рекомендаций В (уровень достоверности доказательств - 1). Комментарий: Назначение О<mark class=\"hit\">мега-3 <\/mark>триглицериды, включая другие эфиры и кислоты, не снижает риск ГСД, ПР, нарушения нейрокогнитивного развития детей, послеродовой депрессии, ПЭ, ЗРП. Беременной пациентке группы риска ПР и ЗРП, например, курящей беременной пациентке, может быть рекомендован прием Омега-3 триглицериды, включая другие эфиры и кислоты, так как это снижает риск спонтанных ПР и рождения маловесных детей [207]. Не рекомендовано рутинно назначать препараты железа беременной пациентке при нормальном уровне гемоглобина [208], [209], [210]. Уровень убедительности рекомендаций А (уровень достоверности доказательств -2). Комментарии: Нет доказательств пользы рутинного назначения препаратов железа для здоровья матери или ребенка [211]. При этом пациенткам группы риска развития латентного железодефицита и железодефицитной анемии (у которых невозможно устранить причину развития железодефицитного состояния, соблюдающим вегетарианскую или веганскую диету) рекомендовано назначать профилактические дозы лекарственных препаратов железа, пациенткам с железодефицитной анемией – лечебные дозы препаратов железа согласно клиническим рекомендациям «Железодефицитная анемия» 2021 г. [212]. Не рекомендовано рутинно назначать беременной пациентке ретинол** (витамин А) [213], [214]. Уровень убедительности рекомендаций А (уровень достоверности доказательств - 1). Комментарии: Нет доказательств пользы рутинного назначения витамина А. Прием витамина А не снижает риск материнской, перинатальной и неонатальной смертности, мертворождений, рождения детей с низкой массой тела [213]. Прием больших доз витамина А (&gt;10 000 МЕ) может оказывать тератогенный эффект [214], [215], [216], [217], [218], [219]. Не рекомендовано рутинно назначать беременной пациентке витамин Е [220], [221]. Уровень убедительности рекомендаций А (уровень достоверности доказательств - 1). Комментарии: Прием витамина Е не снижает риск таких акушерских и перинатальных осложнений, как ПЭ, ПР, ЗРП, антенатальная гибель плода и неонатальная смерть. Не рекомендовано рутинно назначать беременной пациентке аскорбиновую кислоту** (витамин С) [220], [222], [223]. Уровень убедительности рекомендаций A (уровень достоверности доказательств - 1). Комментарии: Рутинный прием аскорбиновой кислоты** не снижает риск таких акушерских и перинатальных осложнений, как ПЭ, ПР, ЗРП, антенатальная гибель плода и неонатальная смерть. 4. Медицинская реабилитация и санаторнокурортное лечение, медицинские показания и противопоказания к применению методов медицинской реаби","terms":[{"source":"mediq","term_id":"mediq:864fba27a1d2","canonical":"Омега-3","search_word":"Омега-3","host_word":"Омега-3","inside_word":false,"mediq":{"name":"Омега-3","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средств данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:b6c55a871d95bbe7::case:7c9f8df3ce13b0bc","block_id":"block:b6c55a871d95bbe7","case_id":"case:7c9f8df3ce13b0bc","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"L-триптофан указан в контексте нежелательного сочетания с солями лития: при комбинации возможно развитие серотонинового неврологического синдрома, то есть для этого host_word это запрет/нежелательное применение.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"301_3","title":"Депрессивный эпизод, Рекуррентное депрессивное расстройство","link":"https://cr.minzdrav.gov.ru/view-cr/301_3","metadata":{"Название клинической рекомендации":"Депрессивный эпизод, Рекуррентное депрессивное расстройство","МКБ-10":"F32, F33","Возрастная группа":"Взрослые","Разработчик":"Общественная организация \"Российское общество психиатров\"","Дата размещения":"26.08.2024","Статус применения КР":"Применяется"}},"context_html":"а, акатизия. Что касается применения #рисперидона** при аугментации антидепрессивной терапии, рекомендуемой стартовой дозой является 0,5 мг/сут, а диапазон доз составляет 0,25-3 мг/сут [197]. Следует учитывать возможность развития гиперпролактинемии и экстрапирамидных расстройств. Метаанализ 9 РКИ подтвердил эффективность #брекспипразола при резистентой депрессии при его назначении в начальной дозе 0,5-1 мг с возможным повышением до 3 мг (рекомендуемая средняя доза – 2 мг) [203]. Побочными эффектами #брекспипразола являются акатизия, инсомния, беспокойство, сонливость и увеличение веса. В нескольких РКИ было показано достоверное преимущество эффективности аугментации #зипрасидоном по сравнению с плацебо [204, 205]. Рекомендуемой начальной дозой является 20 мг с возможным повышением до 40-160 мг/сут. Среди побочных эффектов чаще всего возникают акатизия, увеличение веса и увеличение интервала QTc [212]. Данные об аугментирующей эффективности #амисульприда ограничены открытыми исследованиями, в которых препарат добавлялся к базовой антидепрессивной терапии в начальной дозе 50 мг с возможным еженедельным повышением на 25 мг до максимальной дозы 200 мг/сут [206], либо в фиксированной дозе 50 мг/сут [207]. Наиболее частым побочным эффектом при использовании #амисульприда является гиперпролактинемия. • Пациентам с резистентностью к антидепрессивной монотерапии с целью купирования симптоматики и достижения ремиссии рекомендована аугментация эффекта АД лития солями (#лития карбонатом) в дозе≥800мг (или в дозе, достаточной для достижения концентрации лития в сыворотке ≥0,5мкмоль/л). [213, 214]. Уровень убедительности рекомендаций – B (уровень достоверности доказательств – 1). Комментарии: даже небольшие дозы лития солей (концентрация лития в сыворотке 0,5-0,8 ммоль/л) в течение нескольких дней могут привести к улучшению в состоянии больного. Курс терапии не превышает 2-4 недель, однако в случае достижения эффекта терапию следует продолжить в течение нескольких месяцев. Считается, что лития соли могут изменять рецепторную чувствительность постсинаптической мембраны и усиливать действие серотонина. Нельзя исключить, что случаи эффективности были связаны с ошибочной диагностикой РДР и невыявлением у больных БАР II типа [215] или «скрытой биполярности» [216]. Комбинировать АД с лития солями нужно осторожно, поскольку повышенные дозировки могут привести к развитию нейротоксических реакций (миоклония, атаксия, возбуждение, спутанность), а при сочетании с аминокислотой L-<mark class=\"hit\">триптофан<\/mark>ом (биологически активная добавка) («ньюкаслский» или «серотониновый» коктейль) - к серотониновому неврологическому синдрому [189]. Кроме того, нежелательные явления при терапии лития солями включают кардиотоксичность, нефротоксичность, тиреотоксичность и прибавку веса. По причине узкого терапевтического диапазона требуется регулярный контроль концентрации лития в крови. • Пациентам с резистентностью к антидепрессивной монотерапии с целью купирования симптоматики и достижения ремиссии при наличии дополнительных симптоматических показаний (например, тревоги, фобиях, ипохондрических и психотических симптомах) рекомендована аугментация эффекта АПП, включая присоединение к АД: − сульпирида** [217, 218, 219] Уровень убедительности рекомендаций – B (уровень достоверности доказательств – 2). − или флупентиксола** [220, 221]. Уровень убедительности рекомендаций – C (уровень достоверности доказательств – 4). • Пациентам с резистентностью к антидепрессивной монотерапии с целью купирования симптоматики и достижения ремиссии рекомендована аугментация эффекта АД противоэпилептическими препаратами: #ламотриджином в начальной дозе 25 мг/сут с постепенным повышением до 200 мг/сут [222, 223]. Уровень убедительности рекомендаций – A (уровень достоверности доказательств – 1). − или #карбамазепином** в дозе 400-800мг/сут [224, 225]. Уровень убедительности рекомендаций – B (уровень достоверности доказательств – 2). • Пациентам с ДЭ со смешанными чертами, ранее не получавшим АД, у которых оказалась неэффективной монотерапия АВП, нормотимическая терапия или комбинация АВП и нормотимической терапии, для купирования симптоматики и достижения ремиссии, рекомендована комбинированная терапия АВП с АД, или оланзапина** с флуоксетином**, или нормотимической терапии с АД [29, 129, 150, 179, 180]. Уровень убедительности рекомендаций – C (уровень достоверности доказательств – 5). Комментарий: комбинация оланзапина** с флуоксетином** должна применяться с осторожностью у пациентов с избыточным весом, ожирением или метаболическим синдромом. Не показана комбинация оланзапина** или #рисперидона** с карбамазепином**, в связи с их интеркуррентным действием на уровне печеночных ферментов [179]. 3.4 Купирующая терапия ДЭ на четвертом этапе В случае неэффективности указанных мероприятий с целью преодоления резистентности переходят к четвертому этапу, который также состоит из нескольких опций. • Пациентам с терапевтической резистентностью, у которых терапия первого, второго и третьего этапов оказалась неэффективной, с целью преодол","terms":[{"source":"mediq","term_id":"mediq:e3dd1b01c964","canonical":"Триптофан","search_word":"Триптофан","host_word":"L-триптофаном","inside_word":true,"mediq":{"name":"Триптофан","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:d24094bfa60eaa89::case:a347a6b634c779c0","block_id":"block:d24094bfa60eaa89","case_id":"case:a347a6b634c779c0","label":"contraindication","model":{"recommendation_strength":"A","evidence_level":"1","reason":"В контексте фразы «Не рекомендован прием ... омега-3 триглицеридов ... в целях пролонгирования беременности» термин омега-3 прямо относится к не рекомендованному вмешательству.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"331_2","title":"Преждевременные роды","link":"https://cr.minzdrav.gov.ru/view-cr/331_2","metadata":{"Название клинической рекомендации":"Преждевременные роды","МКБ-10":"O42, O47.0, O60, O60.0, O60.1, O60.2, O60.3","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов","Дата размещения":"27.09.2024","Статус применения КР":"Применяется"}},"context_html":"неделями беременности и наличием в анамнезе спонтанных ПР (и/или ПРПО) или травм шейки матки (конизация, удаление обширной зоны трансформации, радикальные вмешательства (ампутация, трахелэктомия)[12] [161]. Уровень убедительности рекомендаций А (уровень достоверности доказательств - 1). Рекомендовано применение акушерского пессария (пессария силиконового цервикального перфорированного, пессария маточного, пессария акушерского разгружающего однократного применения, пессарий чашечный (перфорированный), тип SSP, пессарий акушерский тип А (без перфорации) и т.д.) при укорочении шейки матки менее 25 мм с целью профилактики ПР до 37 недель беременности [162, 163] Уровень убедительности рекомендаций В (уровень достоверности доказательств - 2). Комментарий: Установка акушерского пессария снижает частоту применения токолитической терапии и КС, не увеличивает вероятность ПРПО и не ухудшает перинатальные исходы для плода [162]. После 24 недель беременности применение акушерского пессария является методом выбора. Следует отметить, что в некоторых протоколах ведущих акушерских обществ пессарии в качестве метода профилактики ПР не упоминаются. Вместе с тем клинический опыт позволяет применение пессариев в определенной клинической нише. Необходимо также отметить, что в настоящее время отсутствуют исследования, сравнивающие различные типы акушерских пессариев в целях профилактики ПР, в проведенных исследованиях при этом применялись разные типы акушерских пессариев, в связи с чем могут использоваться различные акушерские пессарии, зарегистрированные в РФ в соответствии с руководством по эксплуатации конкретного медицинского изделия - пессарий силиконовый цервикальный перфорированный, пессарий маточный, пессарий акушерского разгружающего однократного , [13] применения, пессарий чашечный (перфорированный), тип SSP, пессарий акушерский тип А (без перфорации) и т.д [162, 163]. При бессимптомном укорочении шейки матки не рекомендован постельный режим, так как он не снижает риск ПР [164]. Уровень убедительности рекомендаций A (уровень достоверности доказательств - 1). Не рекомендовано ограничение физической активности при неосложненной беременности и ПР в анамнезе [165]. Уровень убедительности рекомендаций А (уровень достоверности доказательств - 1). Не рекомендовано половое воздержание при неосложненной беременности и ПР в анамнезе [166]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 4). Не рекомендован прием препаратов витамина D и его аналогов, <mark class=\"hit\">омега-3<\/mark> триглицеридов (АТХ Другие гиполипидемические средства) в целях пролонгирования беременности [167, 168]. Уровень убедительности рекомендаций А (уровень достоверности доказательств - 1). Для снижения риска ПР на этапе планирования беременности не рекомендовано рутинное применение поливитаминов, аскорбиновой кислоты** и альфа-токоферола ацетата (витамина Е) [169]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 2). [1] ACOG Committee Opinion No. 677: antenatal corticosteroid therapy for fetal maturation, 2017. [2] ACOG Committee Opinion No. 677: antenatal corticosteroid therapy for fetal maturation, 2017. [3] ACOG Committee Opinion No. 677: antenatal corticosteroid therapy for fetal maturation, 2017. [4] NICE Guidance, Preterm labour and birth, 2016. [5] ACOG, Practice Bulletin No. 171: Management of Preterm Labor, 2016. [6] Prevention of Group B Streptococcal Early-Onset Disease in Newborns (Number 797 (Replaces Committee Opinion No. 782), 2020 [7] ACOG, Practice Bulletin No. 171: Management of Preterm Labor, 2016. [8] NICE Guidance, Preterm labour and birth, 2016. [9] Preterm Labor and Birth Management: Recommendations from the European Association of Perinatal Medicine, 2017. [10] ISUOG Practice Guidelines: role of ultrasound in the prediction of spontaneous preterm birth, 2022 [11] ACOG Practice bulletin, № 234, Prediction and Prevention of Spontaneous Preterm Birth, 08.2021 [12] NICE Guidance, Preterm labour and birth, 2016. [13] Preterm Labor and Birth Management: Recommendations from the European Association of Perinatal Medicine, 2017. 6. Организация оказания медицинской помощи При ПР, включая ПРПО, при сроке беременности менее 34 недель при отсутствии противопоказаний для транспортировки, осуществляется госпитализация пациентки в медицинскую организацию 3а группы. При ПР, включая ПРПО, при сроке беременности 34 -36 недель, осуществляется госпитализация пациентки в акушерский стационар 3а группы, или, при отсутствии возможности, в акушерский стационар 2-й группы (имеющий отделение (палаты) реанимации и интенсивной терапии для новорожденных). 0 0 0 7. Дополнительная информация (в том числе факторы, влияющие на исход заболевания или состояния) Не применимо. Критерии оценки качества медицинской помощи № Критерии качества Оценка выполнения критерия 1 Проведено исследование уровня лейкоцитов в крови и уровня С-реактивного белка в сыворотке крови при преждевременном разрыве плодных оболочек Да/Нет 2 Назначена токолитическая тер","terms":[{"source":"mediq","term_id":"mediq:864fba27a1d2","canonical":"Омега-3","search_word":"Омега-3","host_word":"омега-3","inside_word":false,"mediq":{"name":"Омега-3","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:b78c7cdb5af0212c::case:c90f5d8a6c066671","block_id":"block:b78c7cdb5af0212c","case_id":"case:c90f5d8a6c066671","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Метамизол натрия прямо указан как крайне нежелательный у детей и запрещенный к применению; это запрет/нежелательность применения.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"352_3","title":"Острый обструктивный ларингит [круп], эпиглоттит, постинтубационный отек гортани","link":"https://cr.minzdrav.gov.ru/view-cr/352_3","metadata":{"Название клинической рекомендации":"Острый обструктивный ларингит [круп], эпиглоттит, постинтубационный отек гортани","МКБ-10":"J05.0, J05.1, J38.4, J38.6","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Национальная медицинская ассоциация оториноларингологов, Межрегиональная ассоциация по клинической микробиологии и антимикробной химиотерапии","Дата размещения":"14.01.2025","Статус применения КР":"Применяется"}},"context_html":"ет лающий характер, появляется шумное дыхание или шумный вдох. При нарастании степени сужения просвета гортани развивается инспираторная одышка, которую можно заметить по втяжению яремной ямки на вдохе. Симптомы крупа обычно развиваются вечером, ночью, нередко в предутренние часы. Круп легкой степени сопровождается периодическим грубым, лающим кашлем и осиплостью голоса; в покое шумное дыхание на вдохе отсутствует и нарастает только при беспокойстве ребенка или при движении. Может быть слабовыраженное втяжение ямок над ключицами и межреберных промежутков при дыхании. При среднетяжелом крупе лающий кашель учащается, шумное дыхание на вдохе сохраняется и в покое, отмечается выраженное втяжение ямок над ключицами и межреберных промежутков при дыхании в покое. Тяжелое течение крупа проявляется выраженной дыхательной недостаточностью: «тяжелое дыхание», резкая бледность и синева кожи, возможно нарушение сознания, судороги. В этой стадии болезни ребенку требуется экстренная помощь. 51 Если вы заподозрили круп у вашего ребенка на любой стадии: немедленно вызовите бригаду скорой (неотложной) помощи!! Обследования: в большинстве случаев, дополнительных обследований ребенку с крупом не требуется Лечение: круп, в большинстве случаев, носит доброкачественный характер, врач назначит лечение чаще всего кортикостероидными гормонами. В настоящее время это наиболее эффективный и безопасный способ вылечить круп. Никаких побочных действий кортикостероидные гормоны у ребенка с крупом не оказывают, т.к. применяются в умеренной дозе и кратковременно! При выраженных признаках крупа врач может госпитализировать ребенка в больницу. Снижение температуры: лихорадящего ребенка следует раскрыть, обтереть водой Т° 25-30°С. С целью снижения температуры у детей допустимо применение только 2-х препаратов – парацетамола** или ибупрофена**. Препараты, обладающие жаропонижающим действием у здоровых детей ≥3 месяцев оправданы при температуре выше 39 - 39,5°С. При менее выраженной лихорадке (38-38,5°С) средства, снижающие температуру, показаны детям до 3 месяцев, пациентам с хронической патологией, а также при связанном с температурой дискомфорте. Регулярный (курсовой) прием жаропонижающих нежелателен, повторную дозу вводят только после нового повышения температуры. Чередование этих двух препаратов или применение их в комбинации не приводит к усилению жаропонижающего эффекта. У детей с жаропонижающей целью не применяют ацетилсалициловую кислоту** и нимесулид. Крайне нежелательно использование <mark class=\"hit\">метамизол<\/mark>а натрия у детей в связи с высоким риском развития агранулоцитоза. Во многих странах мира метамизол натрия запрещен к применению уже более 50 лет назад. Антибиотики (J01 Антибактериальные препараты системного действия) – не действуют на вирусы (основную причину крупа). Вопрос о назначении антибиотиков рассматривается при подозрении на бактериальную инфекцию. Антибиотики (J01 Антибактериальные препараты системного действия) должен назначать врач. Бесконтрольный прием антибиотиков (J01 Антибактериальные препараты системного действия) может способствовать развитию устойчивых к ним микробов и вызывать осложнения. Как предупредить развитие ОРВИ, на фоне которых развивается круп: Заболевшего ребенка следует оставить дома (не водить в детский сад или школу). Первостепенное значение имеют меры, препятствующие распространению вирусов: 52 тщательное мытье рук после контакта с больным. Важно также ношение масок, мытье поверхностей в окружении больного, соблюдение режима проветривания. Ежегодная вакцинация против гриппа с возраста 6 мес снижает риск этой инфекции. Доказано также, что вакцинация детей от гриппа и пневмококковой инфекции уменьшает вероятность развития острого среднего отита у детей и осложненного течения ОРВИ. Надежных свидетельств о снижении респираторной заболеваемости под влиянием различных иммуностимуляторов нет. Не доказана также профилактическая эффективность растительных препаратов и витамина С, гомеопатических препаратов. Исход крупа при своевременной диагностике и адекватном лечении всегда благоприятный. В случае поздней диагностики при выраженном сужении гортани при невозможности реанимационных мероприятий возможна смерть от асфиксии. Эпиглоттит – это остро возникшее бактериальное воспаление надгортанника и окружающих тканей, которое может привести к быстрому жизнеугрожающему нарушению проходимости дыхательных путей. Эпиглоттит встречается редко, преимущественно у детей, но может встречаться даже у взрослых. Эпиглоттит вызывается гемофильной инфекцией (Haemophilus influenzae тип b) (&gt;90%). В странах, где введена массовая иммунизация против гемофильной инфекции, эпиглоттиты встречаются реже, у вакцинированных детей встречаются эпиглоттиты, вызванные другими возбудителями. В России также есть возможность вакцинировать ребенка от гемофильной инфекции. Эпиглоттит является тяжелой бактериальной инфекцией, заболевание обычно начинается остро с высокой температуры и нарушения общего состояния, характерны боль в горле, ребенок может сильно «сжимать зубы», может наблюдаться вытекание слюны изо рта, поза «треножника», приоткрытый рот, быстрое развити","terms":[{"source":"blacklist","term_id":"blacklist:f999e9e4fb26","canonical":"Анальгин","search_word":"Метамизол","host_word":"метамизола","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Анальгин","aliases":["Метамизол","Metamizole","Dipyrone"],"description":"имеет доказанную эффективность, но равно имеет и доказанную небезопасность (подробнее - тут). Вряд ли когда-нибудь выйдет из бана, поскольку имеет множество куда более безопасных альтернатив (ибупрофен, парацетамол, индометацин и пр.). Исследований хватает: Cochrane Reviews 2; Pubmed 200; FDA 0; RXlist 0; ВОЗ 0; ФК ( ":"359_3","title":"Бронхиальная астма","link":"https://cr.minzdrav.gov.ru/view-cr/359_3","metadata":{"Название клинической рекомендации":"Бронхиальная астма","МКБ-10":"J45, J45.0, J45.1, J45.8, J45.9, J46, Z57.2, Z57.3, Z57.4, Z57.5","Возрастная группа":"Взрослые, дети","Разработчик":"Российская ассоциация аллергологов и клинических иммунологов, Союз педиатров России, Ассоциация врачей и специалистов медицины труда, Российское респираторное общество","Дата размещения":"15.11.2024","Статус применения КР":"Применяется"}},"context_html":"ОегтМоркароШех/агтае с целью достижения контроля над симптомами БА [21,295,304-310]. Уровень убедительности рекомендаций -А (уровень достоверности доказательств -1) Комментарии: Пациентам с частично контролируемой БА на фоне адекватной противоастматической фармакотерапии может быть назначена АСИТ сублингвальными аллергенами клещей домашней пыли при показателях объема форсированного выдоха за 1 сек (ОФВ1) более 70% от должных величин и отсутствии тяжелых обострений БА за последние 12 месяцев. 3.5 Хирургическое лечение В подавляющем большинстве случаев проведение хирургического лечения БА не показано. • Взрослым пациентам с тяжелым течением БА и неэффективностью медикаментозной терапии, включая терапию 5 ступени, возможно рассмотреть проведение бронхиальной термопластики (БТ) при доступности ее проведения [311-316]. Уровень убедительности рекомендаций -С (уровень достоверности доказательств - 4) Комментарии: БТ была одобрена в 2010 г для клинического использования в США, с 2018 г доступна на территории РФ. БТ - метод эндоскопического лечения тяжелой БА, направленный на коррекцию ремоделирования бронхиальной стенки. Точкой приложения является гипертрофированный гладкомышечный слой бронхиальной стенки, на который воздействуют контролируемым радиочастотным тепловым излучением: поочередно в основные бронхи под контролем бронхоскопа (жесткого) вводится радиоволновой излучатель, который разрушает часть мышечных волокон бронха. В последующем уменьшается как общий объем мышечной массы, так и способность гчадкомышечных клеток к сокращению, а соответственно, снижается бронхоконстрикция. Бронхообструкция не может быть такой выраженной, как ранее, в результате приступы становятся более редкими и менее интенсивными. Процедура БТ обычно проводится в три сеанса суммарной длительностью около часа. При этом сохраняется спазмолитический ответ оставшейся гладкой мускулатуры бронхов на применяемые бронходилататоры [311—316]. Использование БТ не означает, что пациент может отказаться от лекарственной терапии. Показано, что пациенты, получавшие БТ, демонстрируют 81 клинически значимый ответ и статистически значимое улучшение контроля БА. Проведение БТ приводило к сокращению числа серьезных обострений на 45%, после БТ с использованием системных ГКС [313]. 3.6 Методы нетрадиционной и альтернативной медицины В связи с отсутствием доказательств положительного клинического влияния на течение БА и улучшение функции легких у пациентов с БА не рекомендуется применение таких методов как и<mark class=\"hit\">глоукалывание,<\/mark> китайская медицина, гомеопатия, фитотерапия, гипноз, техники релаксации, применение ионизаторов воздуха, физиотерапия [21,317]. • Рекомендуется пациентам с БА дыхательная гимнастика (например, дыхание по методу Бутенко) как вспомогательное средство снижения уровня восприятия симптомов, преимущественно у пациентов с сочетанием БА и гипервентиляционным синдромом [318-325]. Уровень убедительности рекомендаций -В (уровень достоверности доказательств -2) Комментарии: В двух исследованиях [320,321] показана возможность некоторого уменьшения симптомов и потребности в КДБА при выполнении дыхательной гимнастики по Бутейко, но без влияния на функцию лёгких и воспаление. Обучение дыхательной гимнастике следует проводить под контролем специалиста. 3.7 Особенности лечения БА у беременных и в период г р у д н о г о вскармливания Физиологические изменения, происходящие при беременности, могут вызвать как ухудшение, так и улучшение течения БА. Беременность может влиять на течение БА, а сама астма может влиять на беременность. В период беременности под влиянием гормональных и механических факторов дыхательная система претерпевает существенные изменения: происходит перестройка механики дыхания, изменяются вентиляционно-перфузионные отношения [326]. В первом триместре беременности возможно развитие гипервентиляции вследствие гиперпрогестеронемии, изменения газового состава крови - повышения содержания РаС02. Появление одышки на поздних сроках беременности во многом обусловлено развитием механического фактора, который является следствием увеличения объема матки. В результате данных изменений усугубляются нарушения функции внешнего дыхания, снижаются жизненная емкость легких, форсированная жизненная емкость легких, ОФВ1. По мере увеличения срока гестации повышается сопротивление сосудов малого круга кровообращения, что также способствует развитию одышки. В связи с 82 этим одышка вызывает определенные трудности при проведении дифференциальной диагностики между физиологическими изменениями функции внешнего дыхания на фоне беременности и проявлениями бронхообструкции [326]. Нередко у беременных без соматической патологии развивается отек слизистых оболочек носоглотки, трахеи и крупных бронхов. Данные проявления у беременных с БА также могут усугублять симптоматику заболевания. Ухудшению течения БА способствует низкая комплаентностъ: многие пациентки пытаются отказаться от приема ингаляционных глюкокортикостероидов (ИГКС) из-за боязни их возможного побочного действия. В таких случаях врачу следует объяснить женщине необходимость проведения базисной противовоспалительной терапии в связи с отрицат","terms":[{"source":"marker","term_id":"marker:f80481b6929b","canonical":"иглоукалывание","search_word":"иглоукалывание","host_word":"иглоукалывание","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklis оз, техники релаксации, применение ионизаторов воздуха, физиотерапия [21,317]. • Рекомендуется пациентам с БА дыхательная гимнастика (например, дыхание по методу Бутенко) как вспомогательное средство снижения уровня восприятия симптомов, преимущественно у пациентов с сочетанием БА и гипервентиляционным синдромом [318-325]. Уровень убедительности рекомендаций -В (уровень достоверности доказательств -2) Комментарии: В двух исследованиях [320,321] показана возможность некоторого уменьшения симптомов и потребности в КДБА при выполнении дыхательной гимнастики по Бутейко, но без влияния на функцию лёгких и воспаление. Обучение дыхательной гимнастике следует проводить под контролем специалиста. 3.7 Особенности лечения БА у беременных и в период г р у д н о г о вскармливания Физиологические изменения, происходящие при беременности, могут вызвать как ухудшение, так и улучшение течения БА. Беременность может влиять на течение БА, а сама астма может влиять на беременность. В период беременности под влиянием гормональных и механических факторов дыхательная система претерпевает существенные изменения: происходит перестройка механики дыхания, изменяются вентиляционно-перфузионные отношения [326]. В первом триместре беременности возможно развитие гипервентиляции вследствие гиперпрогестеронемии, изменения газового состава крови - повышения содержания РаС02. Появление одышки на поздних сроках беременности во многом обусловлено развитием механического фактора, который является следствием увеличения объема матки. В результате данных изменений усугубляются нарушения функции внешнего дыхания, снижаются жизненная емкость легких, форсированная жизненная емкость легких, ОФВ1. По мере увеличения срока гестации повышается сопротивление сосудов малого круга кровообращения, что также способствует развитию одышки. В связи с 82 этим одышка вызывает определенные трудности при проведении дифференциальной диагностики между физиологическими изменениями функции внешнего дыхания на фоне беременности и проявлениями бронхообструкции [326]. Нередко у беременных без соматической патологии развивается отек слизистых оболочек носоглотки, трахеи и крупных бронхов. Данные проявления у беременных с БА также могут усугублять симптоматику заболевания. Ухудшению течения БА способствует низкая комплаентностъ: многие пациентки пытаются отказаться от приема ингаляционных глюкокортикостероидов (ИГКС) из-за боязни их возможного побочного действия. В таких случаях врачу следует объяснить женщине необходимость проведения базисной противовоспалительной терапии в связи с отрицат","terms":[{"source":"marker","term_id":"marker:1317684c67c8","canonical":"гомеопат","search_word":"гомеопат","host_word":"гомеопатия","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:72baee191c24d760::case:9a8371eec3f01f1e","block_id":"block:72baee191c24d760","case_id":"case:9a8371eec3f01f1e","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Гомеопатия в данном фрагменте прямо указана как метод, применение которого не рекомендуется при БА.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"359_3","title":"Бронхиальная астма","link":"https://cr.minzdrav.gov.ru/view-cr/359_3","metadata":{"Название клинической рекомендации":"Бронхиальная астма","МКБ-10":"J45, J45.0, J45.1, J45.8, J45.9, J46, Z57.2, Z57.3, Z57.4, Z57.5","Возрастная группа":"Взрослые, дети","Разработчик":"Российская ассоциация аллергологов и клинических иммунологов, Союз педиатров России, Ассоциация врачей и специалистов медицины труда, Российское респираторное общество","Дата размещения":"15.11.2024","Статус применения КР":"Применяется"}},"context_html":"ОегтМоркароШех/агтае с целью достижения контроля над симптомами БА [21,295,304-310]. Уровень убедительности рекомендаций -А (уровень достоверности доказательств -1) Коммент
