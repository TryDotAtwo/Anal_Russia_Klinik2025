ти доказательств C (уровень достоверности рекомендации – 5). Рекомендуется во время кризов пациентам с установленным диагнозом ГА2 парентеральное введение декстрозы** для купирования гипогликемии и подавления липолизиса, натрия бензоат (биологически активная добавка) для купирования гипераммониемии [111]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: детальное описание приведено в 3.1.2 Рекомендации по лечению пациентов с FAOD в период метаболической декомпенсации 3.3 Рекомендации по применению отдельных лекарственных препаратов Кроме применения диетотерапии при нарушениях окисления жирных кислот также необходимо применение ряда лекарственных препаратов и витаминов, чтобы компенсировать дефицит незаменимых жирных кислот в организме, карнитина и жирорастворимых витаминов. 3.3.1 Рекомендации по применению отдельных лекарственных препаратов, содержащих левокарнитин Рекомендуется избегать назначения Левокарнитина в период криза при дефектах окисления длинноцепочечных жирных кислот, особенно в виде внутривенных инфузий для предотвращения развития рабдомиолиза, неврологических нарушений и аритмии [63, 142, 132]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: Левоакарнитин является основной терапией пациентов при первичной недостаточности карнитина. Также при низких значения карнитина в крови может использоваться при других формах FAOD с целью усиления связывания метаболитов жирных кислот и выведения их с мочой. Однако использование левокарнитина при FAOD является спорным, т.к. доказательства его эффективности при вторичном дефиците карнитина отсутствуют. При недостаточности TFP и LCHAD добавки с Левокарнитином могут индуцировать дальнейшую продукцию 3-гидроксиацилкарнитинов, способных вызывать необратимые невропатические симптомы и аритмию. Исследования на мышах с моделью дефицита VLCAD также показали, что нехватка карнитина вызывает его эндогенный биосинтез), который, однако, подавляется при экзогенном введении Лево<mark class=\"hit\">карнитин<\/mark>а. У многих пациентов с дефектами окисления жирных кислот, не получающих добавок Левокарнитина, концентрации свободного карнитина в плазме также варьируют от низких до нормальных, что позволяет говорить и об эндогенном биосинтезе карнитина у человека. Таким образом, добавки, содержащие Левокарнитин, должны назначаться с осторожностью, особенно, когда речь идет о недостаточности TFP и LCHAD. Существует консенсусное мнение, согласно которому следует отказаться, в частности, от внутривенного введения Левокарнитина при острых метаболических нарушениях, поскольку в таких ситуациях повышается продукция потенциально токсичных ацилкарнитинов, что приводило к внезапной смерти пациентов. 3.3.2 Рекомендации по применению незаменимых жирных кислот Пациенты с FAOD, находящиеся на низкожировой диете подвержены высокому риску дефицита жирорастворимых витаминов. Важно избегать дефицита незаменимых жирных кислот, и большая часть потребления длинноцепочечных жиров должна поступать из масел, богатых незаменимыми жирными кислотами. Для удовлетворения потребностей в незаменимых жирных кислотах может потребоваться добавление специальных масел, таких как ореховое или льняное масло (Приложение Г 13) [105]. Рекомендуется пациентам с недостаточностью МТР и LCHAD, назначать биологическую активную добавку в виде докозагексаеновой кислоты (DHA), играющей важную роль в формировании функций нервной и иммунной систем, а также зрительного анализатора, в дозировке 60 -65 мг/день детям с весом тела &lt;20 кг и в дозировке 130мг в день – детям с весом тела &gt;20 кг для поддержания функций нервной и иммунной системы [105, 137, 157]. Уровень убедительности доказательств B (уровень достоверности рекомендации – 3). Комментарии: Линолевая кислота и α-линоленовая кислота являются предшественниками для эндогенного синтеза более длинных жирных кислот, таких как эйкозапентаеновая кислота (EPA) и докозагексаеновая кислота (DHA), которые ицинским причинам некоторые люди (например, недоношенные дети) не могут вырабатывать достаточное количество карнитина, поэтому для них он является необходимым питательным веществом.\n\nТем не менее, инструкции лекарственных препаратов, помимо недостатка карнитина, содержат показания не имеющие доказательной основы:\n\n\"Некоторые спортсмены принимают карнитин для улучшения результатов упражнений. Тем не менее, двадцать лет исследований не обнаружили убедительных доказательств того, что добавки карнитина могут улучшить физические упражнения или физическую работоспособность у здоровых людей.\"\n\n[Национальный Центр Исследования Здоровья (NIH)](https://ods.od.nih.gov/factsheets/Carnitine-HealthProfessional/)\n\n\"Учитывая ограниченное количество доказательств очень низкого качества, мы не смогли сделать какие-либо выводы о влиянии L-карнитина на когнитивную функцию или о безопасности его применения здоровыми людьми.\"\n\n[Кокрановский обзор](https://www.cochrane.org/ru/CD009374/DEMENTIA_l-karnitin-dlya-uluchsheniya-kognitivnoy-funkcii-u-lyudey-bez-kognitivnyh-narusheniy)\n\n\"...как заключил [метаанализ](https://onlinelibrary.wiley.com/doi/abs/10.1002/da.22236), вышедший в научном журнале Depression and Anxiety в 2014 году, клинические испытания [в качестве терапии депрессии] для этого состояния малочисленны, в их результатах могут быть искажения, а механизм того, как L-карнитин может влиять на депрессивные симптомы, неясен.\"\n\n[Indicator](https://indicator.ru/medicine/multivitaminy.htm)","criterions":[{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/carnitine","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=carnitine&t=1","points":22},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.n ":"E71.3","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков, Общероссийская общественная организация содействия развитию неонатологии «Российское общество неонатологов»","Дата размещения":"21.08.2024","Статус применения КР":"Применяется"}},"context_html":"ельности доказательств C (уровень достоверности рекомендации – 5). Не рекомендуется пациентам с установленным диагнозом ГА2 назначение МСТ [104]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Рекомендуется во время кризов пациентам с установленным диагнозом ГА2 парентеральное введение декстрозы** для купирования гипогликемии и подавления липолизиса, натрия бензоат (биологически активная добавка) для купирования гипераммониемии [111]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: детальное описание приведено в 3.1.2 Рекомендации по лечению пациентов с FAOD в период метаболической декомпенсации 3.3 Рекомендации по применению отдельных лекарственных препаратов Кроме применения диетотерапии при нарушениях окисления жирных кислот также необходимо применение ряда лекарственных препаратов и витаминов, чтобы компенсировать дефицит незаменимых жирных кислот в организме, карнитина и жирорастворимых витаминов. 3.3.1 Рекомендации по применению отдельных лекарственных препаратов, содержащих левокарнитин Рекомендуется избегать назначения Левокарнитина в период криза при дефектах окисления длинноцепочечных жирных кислот, особенно в виде внутривенных инфузий для предотвращения развития рабдомиолиза, неврологических нарушений и аритмии [63, 142, 132]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: Левоакарнитин является основной терапией пациентов при первичной недостаточности карнитина. Также при низких значения карнитина в крови может использоваться при других формах FAOD с целью усиления связывания метаболитов жирных кислот и выведения их с мочой. Однако использование левокарнитина при FAOD является спорным, т.к. доказательства его эффективности при вторичном дефиците карнитина отсутствуют. При недостаточности TFP и LCHAD добавки с Левокарнитином могут индуцировать дальнейшую продукцию 3-гидроксиацилкарнитинов, способных вызывать необратимые невропатические симптомы и аритмию. Исследования на мышах с моделью дефицита VLCAD также показали, что нехватка карнитина вызывает его эндогенный биосинтез), который, однако, подавляется при экзогенном введении Левокарнитина. У многих пациентов с дефектами окисления жирных кислот, не получающих добавок Левокарнитина, концентрации свободного карнитина в плазме также варьируют от низких до нормальных, что позволяет говорить и об эндогенном биосинтезе карнитина у человека. Таким образом, добавки, содержащие Лево<mark class=\"hit\">карнитин<\/mark>, должны назначаться с осторожностью, особенно, когда речь идет о недостаточности TFP и LCHAD. Существует консенсусное мнение, согласно которому следует отказаться, в частности, от внутривенного введения Левокарнитина при острых метаболических нарушениях, поскольку в таких ситуациях повышается продукция потенциально токсичных ацилкарнитинов, что приводило к внезапной смерти пациентов. 3.3.2 Рекомендации по применению незаменимых жирных кислот Пациенты с FAOD, находящиеся на низкожировой диете подвержены высокому риску дефицита жирорастворимых витаминов. Важно избегать дефицита незаменимых жирных кислот, и большая часть потребления длинноцепочечных жиров должна поступать из масел, богатых незаменимыми жирными кислотами. Для удовлетворения потребностей в незаменимых жирных кислотах может потребоваться добавление специальных масел, таких как ореховое или льняное масло (Приложение Г 13) [105]. Рекомендуется пациентам с недостаточностью МТР и LCHAD, назначать биологическую активную добавку в виде докозагексаеновой кислоты (DHA), играющей важную роль в формировании функций нервной и иммунной систем, а также зрительного анализатора, в дозировке 60 -65 мг/день детям с весом тела &lt;20 кг и в дозировке 130мг в день – детям с весом тела &gt;20 кг для поддержания функций нервной и иммунной системы [105, 137, 157]. Уровень убедительности доказательств B (уровень достоверности рекомендации – 3). Комментарии: Линолевая кислота и α-линоленовая кислота являются предшественниками для эндогенного синтеза более длинных жирных кислот, таких как эйкозапентаеновая кислота (EPA) и докозагексаеновая кислота (DHA), которые имеют решающее значение для формирования функций нервной, иммунной систем и зрительного анализатора [105]. Обеспечить оптимальную концентрацию этих жирных кислот в плазме только с помощью применения пищевых масел сложно, поэтому пациентам требуется добавление их в чистом виде для достижения нормального уровня. Считается, что добавки DHA могут стабилизировать, и затормозить развитие пигментной дегенерации сетчатки при FAOD. Согласно проведенному исследованию [157], оптимальная диетотерапия, назначаемая на основании низких концентраций 3-гидроксиацилкарнитина и высоких концентраций DHA в плазме, позволяла сохранять функцию сетчатки и остроту зрения у детей с недостаточностью LCHAD или МТP. В межприступный период для пациентов с FAOD находящихся на диете с ограничением длинноцепочечных жиров рекомендовано добавлять натуральные растительные масла (кокосовое масло, масло","terms":[{"source":"mediq","term_id":"mediq:be29dac60cfe","canonical":"Карнитин","search_word":"Карнитин","host_word":"Левокарнитин","inside_word":true,"mediq":{"name":"Карнитин","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"A16AA","atx_group":"A16AA Аминокислоты и их производные","mnn":"карнитин","description":"Карнитин — витаминоподобное соединение, которое является производным аминокислот лизина и метионина, содержится почти во всех клетках организма. L-карнитин (активная форма карнитина) – кофактор многих биохимических реакций в организме человека. Карнитин играет важную роль в х повышается продукция потенциально токсичных ацилкарнитинов, что приводило к внезапной смерти пациентов. 3.3.2 Рекомендации по применению незаменимых жирных кислот Пациенты с FAOD, находящиеся на низкожировой диете подвержены высокому риску дефицита жирорастворимых витаминов. Важно избегать дефицита незаменимых жирных кислот, и большая часть потребления длинноцепочечных жиров должна поступать из масел, богатых незаменимыми жирными кислотами. Для удовлетворения потребностей в незаменимых жирных кислотах может потребоваться добавление специальных масел, таких как ореховое или льняное масло (Приложение Г 13) [105]. Рекомендуется пациентам с недостаточностью МТР и LCHAD, назначать биологическую активную добавку в виде докозагексаеновой кислоты (DHA), играющей важную роль в формировании функций нервной и иммунной систем, а также зрительного анализатора, в дозировке 60 -65 мг/день детям с весом тела &lt;20 кг и в дозировке 130мг в день – детям с весом тела &gt;20 кг для поддержания функций нервной и иммунной системы [105, 137, 157]. Уровень убедительности доказательств B (уровень достоверности рекомендации – 3). Комментарии: Линолевая кислота и α-линоленовая кислота являются предшественниками для эндогенного синтеза более длинных жирных кислот, таких как эйкозапентаеновая кислота (EPA) и докозагексаеновая кислота (DHA), которые имеют решающее значение для формирования функций нервной, иммунной систем и зрительного анализатора [105]. Обеспечить оптимальную концентрацию этих жирных кислот в плазме только с помощью применения пищевых масел сложно, поэтому пациентам требуется добавление их в чистом виде для достижения нормального уровня. Считается, что добавки DHA могут стабилизировать, и затормозить развитие пигментной дегенерации сетчатки при FAOD. Согласно проведенному исследованию [157], оптимальная диетотерапия, назначаемая на основании низких концентраций 3-гидроксиацилкарнитина и высоких концентраций DHA в плазме, позволяла сохранять функцию сетчатки и остроту зрения у детей с недостаточностью LCHAD или МТP. В межприступный период для пациентов с FAOD находящихся на диете с ограничением длинноцепочечных жиров рекомендовано добавлять натуральные растительные масла (кокосовое масло, масло грецкого ореха) для восполнения недостатка жирных кислот [105]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: Соотношение незаменимых жирных кислот в различных маслах приведено в Приложении А16. Рекомендовано назначение незаменимых жирных кислот пациентам с FAOD на","terms":[{"source":"mediq","term_id":"mediq:e4fa5cbe6194","canonical":"Левокарнитин","search_word":"Левокарнитин","host_word":"Левокарнитина","inside_word":true,"mediq":{"name":"Левокарнитин","kind":["OTHER"],"type":"MANUAL_CHECKED","quality":"NOT_PROVED","atx":"A16AA01","atx_group":"A16AA Аминокислоты и их производные","mnn":"левокарнитин","description":"Карнитин — витаминоподобное соединение, которое является производным аминокислот лизина и метионина, содержится почти во всех клетках организма. L-карнитин (активная форма карнитина) – кофактор многих биохимических реакций в организме человека. Карнитин играет важную роль в производстве энергии, он также переносит токсичные соединения, вырабатываемые митохондриями, чтобы предотвратить их накопление. Организм вырабатывает достаточно карнитина, чтобы удовлетворить потребности большинства людей. По генетическим или медицинским причинам некоторые люди (например, недоношенные дети) не могут вырабатывать достаточное количество карнитина, поэтому для них он является необходимым питательным веществом.\n \n Тем не менее, инструкции лекарственных препаратов, помимо недостатка карнитина, содержат показания не имеющие доказательной основы:\n \n \"Некоторые спортсмены принимают карнитин для улучшения результатов упражнений. Тем не менее, двадцать лет исследований не обнаружили убедительных доказательств того, что добавки карнитина могут улучшить физические упражнения или физическую работоспособность у здоровых людей.\"\n \n [Национальный Центр Исследования Здоровья (NIH)](https://ods.od.nih.gov/factsheets/Carnitine-HealthProfessional/)\n \n \"Учитывая ограниченное количество доказательств очень низкого качества, мы не смогли сделать какие-либо выводы о влиянии L-карнитина на когнитивную функцию или о безопасности его применения здоровыми людьми.\"\n \n [Кокрановский обзор](https://www.cochrane.org/ru/CD009374/DEMENTIA_l-karnitin-dlya-uluchsheniya-kognitivnoy-funkcii-u-lyudey-bez-kognitivnyh-narusheniy)\n \n \"...как заключил [метаанализ](https://onlinelibrary.wiley.com/doi/abs/10.1002/da.22236), вышедший в научном журнале Depression and Anxiety в 2014 году, клинические испытания [в качестве терапии депрессии] для этого состояния малочисленны, в их результатах могут быть искажения, а механизм того, как L-карнитин может влиять на депрессивные симптомы, неясен.\"\n \n [Indicator](https://indicator.ru/medicine/multivitaminy.htm)","criterions":[{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=levocarnitine&t=1","points":0},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/levocarnitine","points":3},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=levocarnitine&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":861}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:ad53f7cb306d93e0::case:6d80b835a8d1ce1c","block_id":"block:ad53f7cb306d93e0","case_id":"case:6d80b835a8d1ce1c","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «Левокарнитина» содержит карнитин, но относится к тому же запрещаемому в этом контексте левокарнитину; в тексте прямо сказано избегать его назначения в период к ческое, угрожающее жизни состояние, спровоцированное неблагоприятными факторами, обуславливающими усиленный распад жиров с образованием жирных кислот, нарушением их окисления и приводящее к образованию токсичных метаболитов. Что может спровоцировать метаболический криз: длительное голодание инфекция тяжелая физическая и эмоциональная нагрузка Признаки гипогликемии (снижение уровня сахара в крови): Слабость Дрожь Головокружение Липкий холодный пот. Первые симптомы метаболического криза: Чрезвычайная сонливость, изменение поведения, раздражительность, снижение аппетита. Часто криз провоцирует инфекция, поэтому первые проявления могут начинаться лихорадкой, тошнотой, диареей, рвотой. Затем следует снижение сахара в крови. Если своевременно не начать лечение у ребенка может появиться одышка, судороги и кома. В КАКИХ СЛУЧАЯХ НУЖНО НЕМЕДЛЕННО ОБРАТИТЬСЯ ЗА МЕДИЦИНСКОЙ ПОМОЩЬЮ Если вы заметили любой из этих симптомов у вашего р","terms":[{"source":"mediq","term_id":"mediq:be29dac60cfe","canonical":"Карнитин","search_word":"Карнитин","host_word":"карнитин","inside_word":false,"mediq":{"name":"Карнитин","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"A16AA","atx_group":"A16AA Аминокислоты и их производные","mnn":"карнитин","description":"Карнитин — витаминоподобное соединение, которое является производным аминокислот лизина и метионина, содержится почти во всех клетках организма. L-карнитин (активная форма карнитина) – кофактор многих биохимических реакций в организме человека. Карнитин играет важную роль в производстве энергии, он также переносит токсичные соединения, вырабатываемые митохондриями, чтобы предотвратить их накопление. Организм вырабатывает достаточно карнитина, чтобы удовлетворить потребности большинства людей. По генетическим или медицинским причинам некоторые люди (например, недоношенные дети) не могут вырабатывать достаточное количество карнитина, поэтому для них он является необходимым питательным веществом.\n\nТем не менее, инструкции лекарственных препаратов, помимо недостатка карнитина, содержат показания не имеющие доказательной основы:\n\n\"Некоторые спортсмены принимают карнитин для улучшения результатов упражнений. Тем не менее, двадцать лет исследований не обнаружили убедительных доказательств того, что добавки карнитина могут улучшить физические упражнения или физическую работоспособность у здоровых людей.\"\n\n[Национальный Центр Исследования Здоровья (NIH)](https://ods.od.nih.gov/factsheets/Carnitine-HealthProfessional/)\n\n\"Учитывая ограниченное количество доказательств очень низкого качества, мы не смогли сделать какие-либо выводы о влиянии L-карнитина на когнитивную функцию или о безопасности его применения здоровыми людьми.\"\n\n[Кокрановский обзор](https://www.cochrane.org/ru/CD009374/DEMENTIA_l-karnitin-dlya-uluchsheniya-kognitivnoy-funkcii-u-lyudey-bez-kognitivnyh-narusheniy)\n\n\"...как заключил [метаанализ](https://onlinelibrary.wiley.com/doi/abs/10.1002/da.22236), вышедший в научном журнале Depression and Anxiety в 2014 году, клинические испытания [в качестве терапии депрессии] для этого состояния малочисленны, в их результатах могут быть искажения, а механизм того, как L-карнитин может влиять на депрессивные симптомы, неясен.\"\n\n[Indicator](https://indicator.ru/medicine/multivitaminy.htm)","criterions":[{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/carnitine","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=carnitine&t=1","points":22},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=carnitine&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":869}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:20f20d4d235a9b65::case:7fb23754e12f77f1","block_id":"block:20f20d4d235a9b65","case_id":"case:7fb23754e12f77f1","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте для пациентов с ИТП указано «избегать ... чеснок», то есть чеснок прямо не рекомендуется/подлежит избеганию.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"699_2","title":"Иммунная тромбоцитопения","link":"https://cr.minzdrav.gov.ru/view-cr/699_2","metadata":{"Название клинической рекомендации":"Иммунная тромбоцитопения","МКБ-10":"D69.3","Возрастная группа":"Дети","Разработчик":"Национальное общество детских гематологов, онкологов","Дата размещения":"22.07.2024","Статус применения КР":"Применяется"}},"context_html":"у пациентов может не проявляться. Кроме количества тромбоцитов, риск кровотечений зависит от активности пациента и от некоторых других причин. Обычно для детей характерно внезапное начало болезни, которое может развиться через 2-3 недели после вирусной, бактериальной инфекции или после вакцинации. Зачастую заболевание может является самоограниченным процессом и разрешается в течение нескольких недель или месяцев. У подростков и взрослых пациентов чаще развивается хроническое заболевание, которое персистирует годами. Дать однозначный прогноз длительности заболевания при впервые установленном диагнозе практически невозможно. Однако известно, что около трети детей могут развить затяжную ИТП (длительностью более 3 месяцев), а 5-10% - тяжелое хроническое (длительностью более 1 года) или резистентное к терапии заболевание. При впервые установленном диагнозе пациентам с низким количеством тромбоцитов (как правило, ниже 20-30 х 10 /л) проводится терапия первой линии внутривенными иммуноглобулинами или глюкокортикостероидами и эти же лекарственные средства применяют при затяжном и хроническом течении ИТП, в случаях когда необходимо быстро поднять количество тромбоцитов до безопасного значения (более 50 х 10 /л). Дополнительно при тяжелой персистирующей и хронической ИТП, когда сохраняются тромбоцитопения ниже 20 х 10 /л и кровотечения, применяются препараты второй линии (иммуносупрессанты, стимуляторы тромбоцитообразования), или выполняют операцию (удаление селезенки). Выбор вида лечения проводится индивидуально для каждого пациента, с учетом особенностей течения заболевания. Врач объяснит преимущества и недостатки каждого вида лечения для Вашего ребенка. 9 9 9 9 9 9 9 9 Кроме того, пациентам с ИТП рекомендуется избегать приема аспирина и нестероидных противовоспалительных средств при количестве тромбоцитов менее 40-50 х 10 /л, избегать контактные виды спорта и другую активность, сопряженную с риском травматизма, рекомендуется использовать средства защиты (шлем, наколенники, налокотники), для маленьких детей – обеспечить мягкие игровые зоны. Для профилактики кровоточивости десен рекомендуется использование мягких зубных щеток и посещать профилактические осмотры стоматолога. Для детей с ИТП нет жестких диетических ограничений, рекомендуется соблюдать возрастную диету и не употреблять продукты, заведомо вызывающие у ребенка аллергические реакции. Рекомендуется достаточный прием воды и клетчатки для профилактики запоров, ограничить потребление малины, избегать уксус, <mark class=\"hit\">чеснок<\/mark>, консерванты и продукты, содержащие хинин. В всех случаях появления большого количества синяков или петехиальных элементов на коже; кровотечений из носа, десен, маточных кровотечений, обнаружении крови в моче или стуле; а также при рвоте, головной боли, слабости, обмороке, нарушении слуха или зрения и других жалобах необходимо незамедлительно обращаться за медицинской помощью! Родителям и старшим детям рекомендуется носить при себе медицинские документы с указанием диагноза и медикаментов, необходимых для оказание скорой помощи. 9 Приложение Г1-ГN. Шкалы оценки, вопросники и другие оценочные инструменты состояния пациента, приведенные в клинических рекомендациях Приложение Г1. Шкала оценки степени кровоточивости по ВОЗ и CTCAE Название на русском языке: общие терминологические критерии нежелательных явлений. Оригинальное название: Common Terminology Criteria for Adverse Events (CTCAE) Источник (официальный сайт разработчиков, публикация с валидацией): https://ctep.cancer.gov/protocoldevelopment/electronic_applications/docs/ctcae_v5_quick_reference_8 Тип: шкала оценки Назначение: оценка тяжести кровоточивости Содержание (шаблон), ключ (интерпретация): Степень кровоточивости Клинические проявления 0-я • Отсутствуют 1-я • Петехии (&lt; 100) • Небольшие гематомы, синяки (&lt; 10 см в диаметре) • Кровотечения со слизистых оболочек (нос, рот) • Носовое кровотечение(длительностью &lt; 1 часа, но без необходимости лечения) • Субконъюнктивальное кровоизлияние • Вагинальное кровотечение (необходимость не более 2-х прокладок в день) 2-я (без трансфузионной зависимости) • Гематомы, синяки (&gt;10 см в диаметре) • Носовое кровотечение(длительностью &gt; 1 часа или необходимость тампонады) • Ретинальное кровоизлияние без нарушения зрения • Вагинальное кровотечение (необходимость более 2-х прокладок в день) • Кровь в стуле, мелена, кровавая рвота, кровохарканье, гематурия • Кровотечения из мест пункций • Кровоизлияния в мышцы и суставы 3-я (с трансфузионной зависимостью) • Носовое кровотечение • Кровотечения со слизистых оболочек (нос, рот) • Вагинальное кровотечение • Кровь в стуле, мелена, кровавая рвота, кровохарканье, гематурия • Кровотечения из мест пункций • Кровоизлияния в мышцы и суставы 4-я (угроза жизни, постоянные потенциальные функциональные повреждения) • Кровоизлияние в ЦНС • Ретинальное кровоизлияние с нарушением зрения • Кровоизлияние в другие органы с функциональными нарушениями (суставы, мышцы, почки, легкие и др.) • Фатальное кровоизлияние (по CTCAE 5-я степень)","terms":[{"source":"mediq","term_id":"mediq:1cfb6cd6f5d1","canonical":"Чеснок","search_word":"Чеснок","host_word":"чеснок","inside_word":false,"mediq":{"name":"Чеснок","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:3d7dc60543dddd14::case:6f29ba03d3d405d7","block_id":"block:3d7dc60543dddd14","case_id":"case:6f29ba03d3d405d7","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «ламинарной» входит в фразу «не рекомендуется использование ламинарной фиксации», то есть сам метод прямо не рекомендован.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"704_2","title":"Болезнь Шёйермана","link":"https://cr.minzdrav.gov.ru/view-cr/704_2","metadata":{"Название клинической рекомендации":"Болезнь Шёйермана","МКБ-10":"M40.0, M40.1, M40.2, M42.0, Q76.4, Q77.8","Возрастная группа":"Взрослые, дети","Разработчик":"Ассоциация нейрохирургов России, Ассоциация травматологов-ортопедов России, Общероссийская общественная организация \"Союз реабилитологов России\", Российская ассоциация хирургов-вертебрологов","Дата размещения":"17.12.2024","Статус применения КР":"Применяется"}},"context_html":" Рекомендуется у всех пациентов при отсутствии показаний к хирургическому лечению (см. раздел 3.2 Хирургическое лечение) применять наложение корсета при патологии (грудного, поясничного) отдела позвоночника как с целью самостоятельного лечения, так и с целью сдерживания прогресса деформации позвоночника до оптимального, с точки зрения хирургического лечения, завершения формирования скелета [15]. Уровень убедительности рекомендаций В (уровень достоверности доказательств – 3).  Рекомендуется у всех пациентов проводить, независимо от применения корсетов и планирования хирургического лечения, комплексное немедикаментозное консервативное лечение с целью предупреждения дальнейшего прогрессирования деформации, укрепления мышечного корсета, улучшения функции внешнего дыхания и состояния сердечно-сосудистой системы [12]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Рекомендуется у всех пациентов контролировать наблюдение и лечение у других врачей-специалистов с целью достижения компенсации в соматическом статусе [12]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). 3.2 Хирургическое лечение  Рекомендуется проводить хирургическое лечение у всех пациентов при следующих условиях:  неэффективности консервативной терапии, бурном прогрессировании деформации позвоночника и наличии исходно грубых деформаций;  применения дифференцированной хирургической тактики с минимальным захватом задних отделов позвоночника у детей с незрелой костной тканью (первых лет жизни);  применения разрешенных в Российской Федерации металлоконструкций; 12  предоперационного планирования;  наличия специализированного ортопедического отделения, имеющего необходимые кадровые и материально-технические ресурсы [15]. Уровень убедительности рекомендаций B (уровень достоверности доказательств – 3).  Не рекомендуется проводить хирургическое лечение детям и подросткам при отсутствии условий для проведения: - многоэтапных и ревизионных вмешательств; - динамического наблюдения за пациентами и контроля их реабилитации [7]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Рекомендуется использование транспедикулярной фиксации (A16.04.042 коррекция деформации позвоночника) у пациентов, которым выполняется хирургическое лечение, в целях достижения наилучшего клинического результата [13]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Не рекомендуется использование <mark class=\"hit\">ламинар<\/mark>ной фиксации (при возможности использования транспедикулярной фиксации) у пациентов, которым выполняется хирургическое лечение, в целях достижения наилучшего клинического результата [13]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5).  Рекомендуется хирургическое лечение у пациентов с диагностированной болезнью Шёйермана, имеющих одно или несколько из перечисленных показаний: угол деформации 70-75° и более; выраженный болевой синдром; неврологический дефицит, компримирование сердечно-легочного комплекса и его функций по причине деформации; неудовлетворительная субъективная оценка своего внешнего вида пациентом, по поводу которой он обращается за лечением [14]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4).  Рекомендуется у всех пациентов выбирать хирургическое вмешательство (за исключением торакоскопических), проводимое из заднего доступа, а не из двух доступов (переднего и заднего), за исключением наличия объективных показаний/противопоказаний, требующих иного доступа (доступов) [15], [16]. Уровень убедительности рекомендаций B (уровень достоверности доказательств – 2). Комментарии: Вмешательства, проводимые из заднего доступа, характеризуются аналогичными рентгенологическими показателями (в том числе потерей коррекции в ходе долговременного наблюдения), что и выполняемые из двух доступов (переднего и заднего), 13 однако имеют более благоприятные показатели интраоперационной потери крови, длительности вмешательства, а также частоты развития синдрома смежного сегмента [16]. По данным [15] подобные вмешательства имеют более низкую частоту осложнений.  Рекомендуется у всех пациентов, которым проводится хирургическое лечение, в целях профилактики синдрома дистального смежного сегмента выбирать в качестве дистального уровня фиксации тот позвонок, который соответствует линии отвеса, проходящей через задний край крестца до операции при положении стоя (sagittal stable vertebra) [17]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 4).  Рекомендуется у всех пациентов при наличии соответствующего технического оснащения и квалификации специалистов проводить коррекцию деформации методом торакоскопического переднего релиза (A16.04.008.001 иссечение межпозвоночного диска с использованием видеоэндоскопических технологий)  с дорсальной фиксацией в целях достижения наилучшего клинического результата [18], [19]. Уровень убедительности рекомендаций C (уровень достоверности","terms":[{"source":"mediq","term_id":"mediq:5074c1828af1","canonical":"Ламинар","search_word":"Ламинар","host_word":"ламинарной","inside_word":true,"mediq":{"name":"Ламинар","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:9f77882599645ab1::case:807aa76591d26639","block_id":"block:9f77882599645ab1","case_id":"case:807aa76591d26639","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Хост-слово «пирацетама» входит в список препаратов, которые могут ухудшать состояние при болезни Паркинсона; здесь оно упомянуто как нежелательное средство, усиливающее симптомы, а не как рекомендуемое лечение.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"716_1","title":"Болезнь Паркинсона, вторичный паркинсонизм и другие заболевания, проявляющиеся синдромом паркинсонизма","link":"https://cr.minzdrav.gov.ru/view-cr/716_1","metadata":{"Название клинической рекомендации":"Болезнь Паркинсона, вторичный паркинсонизм и другие заболевания, проявляющиеся синдромом паркинсонизма","МКБ-10":"G20, G21.1, G21.2, G21.3, G21.4, G23.1, G23.2, G23.3, G23.8","Возрастная группа":"Взрослые","Разработчик":"Ассоциация нейрохирургов России, Всероссийское общество неврологов, Некоммерческое Партнерство \"Национальное общество по изучению болезни Паркинсона и расстройств движений\", Общероссийская общественная организация \"Союз реабилитологов России\", Межрегиональная общественная организация «Общество специалистов по функциональной и стереотаксической нейрохирургии»","Дата размещения":"02.02.2022","Статус применения КР":"Применяется"}},"context_html":"чению периода «включения» в дневной период, когда пациенту надо активно действовать; с другой стороны, период «выключения» также увеличится, но передвинется на вечернее время и станет более предсказуемым. Лечение флуктуаций типа «включения– выключения» усложняется, когда период «включения» сопровождается дискинезиями. В этих случаях однозначно удовлетворительного решения может не быть, и сам пациент 232 должен решить, смириться ли ему с гиперкинезами во время «включения» или страдать от длительного периода «выключения». Обычно пациенты выбирают первое. Но иногда полностью избавиться от моторных флуктуаций не удается. Тогда остается приспособиться к ним: все необходимые вам дела вы делаете в часы, когда чувствуете себя лучше, остальные часы проводите за занятием, не требующим движений: чтением, просмотром телепередач, прослушиванием радио. В отечественной клинической практике у пациентов с болезнью Паркинсона часто применяют лекарственные средства, эффективность которых при этом заболевании убедительно не доказана. Часто это так называемые «сосудистые препараты», нередко вводимые внутривенно капельно. Их назначение часто обосновывается наивными и архаичными представлениями о связи болезни Паркинсона с «плохими сосудами головного мозга», которые у большинства пациентов, даже преклонного возраста, существенно не страдают. Положительный опыт их применения, если он и существует, объясняется не чем иным, как эффектом плацебо. Эффект плацебо достигается верой пациента во врача, неправильно донесенной или неточно воспринятой информацией, силой традиций, а иногда и отчаянием пациента в методах классической медицины. Специалисты, занимающиеся лечением болезни Паркинсона, прекрасно знают, что значительная часть больных хорошо реагирует на плацебо, но этот эффект никогда не бывает стойким. Важнее всего, чтобы неэффективные препараты и другие методы лечения не препятствовали проведению адекватной терапии заболевания, промедление с которым может иметь неблагоприятные долговременные последствия. В целом, пациенты с болезнью Паркинсона должны соблюдать осторожность при применении любых лекарственных средств, некоторые из которых несут опасность ухудшения их состояния. Прежде всего это относится к антипсихотическим средствам. То же можно сказать и о ряде препаратов, широко применяющихся в неврологической и терапевтической практике, но способных блокировать дофаминовые рецепторы и усиливать симптомы паркинсонизма: циннаризин (включая комбинированные препараты циннаризина и <mark class=\"hit\">пирацетам<\/mark>а**), метоклопрамид**, прометазин. Препараты железа, назначаемые при железодефицитной анемии, могут снижать эффективность препаратов допа и ее производных и нередко требуют увеличения ее дозы. Будьте осторожны с препаратами, которые вызывают седативный эффект, включая снотворные, особенно если они обладают длительным действием (например, бромдигидрохлорфенилбензодиазепин**). При их применении сообщайте лечащему врачу о выраженности седативного эффекта, возможном усилении симптомов в дневное время. 233 С другой стороны, такие «ноотропные» препараты, как пирацетам**, способны у некоторых пациентов вызвать возбуждение. Наконец, следует иметь в виду, что при оперативных вмешательствах, проводимых по поводу сопутствующих заболеваний, для наркоза нередко используют препараты для общей анестезии – препараты с сильнейшим седативным эффектом, способные вызывать искусственную кому, необходимую для проведения хирургического вмешательства. У пожилых людей они могут спровоцировать спутанность сознания. Некоторые хирургические операции могут быть проведены под действием менее опасных препаратов, при некоторых состояниях можно обойтись без хирургического вмешательства. Спросите лечащего врача об альтернативных способах лечения, прежде чем выбрать хирургическое вмешательство. Список препаратов, способных вызвать ухудшение у пациентов с болезнью Паркинсона, весьма обширен, поэтому имеет смысл перед началом регулярного приема нового препарата, даже если он выписан по поводу иного заболевания, посоветоваться с неврологом. Быстрый прогресс в изучении патогенеза болезни Паркинсона, а также развитие новейших медицинских технологий (в частности, методика подсаживания стволовых клеток, способных занять место гибнущих клеток, или генетическая терапия) позволяют надеяться, что в ближайшее десятилетие будет найден способ существенно замедлить прогрессирование этого заболевания. 10. Правила визита к врачу Для извлечения максимальной пользы от визита к врачу попробуйте придерживаться следующих несложных рекомендаций. • Большинство врачей приветствует, если вы познакомитесь с информацией, касающейся вашего заболевания. Это поможет вам участвовать в принятии решений по поводу терапии, вы сможете более точно сформулировать свои жалобы. • Заранее составьте список вопросов к врачу, которые у вас возникли. • Не откладывайте надолго визит к врачу, который вас наблюдает, особенно если чувствуете ухудшение или осложнения лечения. • На каждый визит берите с собой все лекарственные препараты, ко","terms":[{"source":"blacklist","term_id":"blacklist:4e56c26f1370","canonical":"Пирацетам","search_word":"Пирацетам","host_word":"пирацетама","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Пирацетам","aliases":["Ноотропил","Луцетам","Ноотобрил","Нооцетам","Пиратропил","Эскотропил","Pyracetam (Piracetam)","Piracetamum"],"description":"тысяча названий для одной и той же бесполезной молекулы, на которой каждый пытается заработать. Самый старый и самый главный ноотроп, назначают при любых проблемах, связанных с головой: инсульты, деменция, интоксикация алкоголем, абстиненция, никотиновая зависимость, шизофрения, депрессия, ипохондрия, головная боль, нарушение памяти, травма, кома, отравление барбитуратами и многое другое. С 72 года и до сих пор нет надёжных данных об эффективности. Примечателен тем, что из достоверных имеются сведения о провоцировании приступов у больных эпилепсией, благодаря чему из него внезапно сделали противоэпилептический препарат Кеппра. Cochrane Reviews 13 (почти всё отрицательно); FDA 0; RXlist 0; ВОЗ 0; ФК (-). См. обзор доказательной базы, а также Копипаста:Ноотропы."}},{"source":"mediq","term_id":"mediq:c8c0a3547a15","canonical":"Пирацетам","search_word":"Пирацетам","host_word":"пирацетама","inside_word":true,"mediq":{"name":"Пирацетам","kind":["NOOTROPS"],"type":"MANUAL_CHECKED","quality":"NOT_PROVED","atx":"N06BX03","atx_group":"N06BX Психостимуляторы и ноо слые","Разработчик":"Ассоциация нейрохирургов России, Всероссийское общество неврологов, Некоммерческое Партнерство \"Национальное общество по изучению болезни Паркинсона и расстройств движений\", Общероссийская общественная организация \"Союз реабилитологов России\", Межрегиональная общественная организация «Общество специалистов по функциональной и стереотаксической нейрохирургии»","Дата размещения":"02.02.2022","Статус применения КР":"Применяется"}},"context_html":"выбирают первое. Но иногда полностью избавиться от моторных флуктуаций не удается. Тогда остается приспособиться к ним: все необходимые вам дела вы делаете в часы, когда чувствуете себя лучше, остальные часы проводите за занятием, не требующим движений: чтением, просмотром телепередач, прослушиванием радио. В отечественной клинической практике у пациентов с болезнью Паркинсона часто применяют лекарственные средства, эффективность которых при этом заболевании убедительно не доказана. Часто это так называемые «сосудистые препараты», нередко вводимые внутривенно капельно. Их назначение часто обосновывается наивными и архаичными представлениями о связи болезни Паркинсона с «плохими сосудами головного мозга», которые у большинства пациентов, даже преклонного возраста, существенно не страдают. Положительный опыт их применения, если он и существует, объясняется не чем иным, как эффектом плацебо. Эффект плацебо достигается верой пациента во врача, неправильно донесенной или неточно воспринятой информацией, силой традиций, а иногда и отчаянием пациента в методах классической медицины. Специалисты, занимающиеся лечением болезни Паркинсона, прекрасно знают, что значительная часть больных хорошо реагирует на плацебо, но этот эффект никогда не бывает стойким. Важнее всего, чтобы неэффективные препараты и другие методы лечения не препятствовали проведению адекватной терапии заболевания, промедление с которым может иметь неблагоприятные долговременные последствия. В целом, пациенты с болезнью Паркинсона должны соблюдать осторожность при применении любых лекарственных средств, некоторые из которых несут опасность ухудшения их состояния. Прежде всего это относится к антипсихотическим средствам. То же можно сказать и о ряде препаратов, широко применяющихся в неврологической и терапевтической практике, но способных блокировать дофаминовые рецепторы и усиливать симптомы паркинсонизма: циннаризин (включая комбинированные препараты циннаризина и пирацетама**), метоклопрамид**, прометазин. Препараты железа, назначаемые при железодефицитной анемии, могут снижать эффективность препаратов допа и ее производных и нередко требуют увеличения ее дозы. Будьте осторожны с препаратами, которые вызывают седативный эффект, включая снотворные, особенно если они обладают длительным действием (например, бромдигидрохлорфенилбензодиазепин**). При их применении сообщайте лечащему врачу о выраженности седативного эффекта, возможном усилении симптомов в дневное время. 233 С другой стороны, такие «ноотропные» препараты, как п<mark class=\"hit\">ирацетам*<\/mark>*, способны у некоторых пациентов вызвать возбуждение. Наконец, следует иметь в виду, что при оперативных вмешательствах, проводимых по поводу сопутствующих заболеваний, для наркоза нередко используют препараты для общей анестезии – препараты с сильнейшим седативным эффектом, способные вызывать искусственную кому, необходимую для проведения хирургического вмешательства. У пожилых людей они могут спровоцировать спутанность сознания. Некоторые хирургические операции могут быть проведены под действием менее опасных препаратов, при некоторых состояниях можно обойтись без хирургического вмешательства. Спросите лечащего врача об альтернативных способах лечения, прежде чем выбрать хирургическое вмешательство. Список препаратов, способных вызвать ухудшение у пациентов с болезнью Паркинсона, весьма обширен, поэтому имеет смысл перед началом регулярного приема нового препарата, даже если он выписан по поводу иного заболевания, посоветоваться с неврологом. Быс ubmed.ncbi.nlm.nih.gov/?term=piracetam&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":368}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:5860d96440f9830b::case:dfc6a34ec0fa3646","block_id":"block:5860d96440f9830b","case_id":"case:dfc6a34ec0fa3646","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «ноотропные» находится в фразе «не рекомендуется назначать ... ноотропные препараты», то есть это прямой запрет/не рекомендуется.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"742_1","title":"Делирий, не обусловленный алкоголем и другими психоактивными веществами, у лиц пожилого и старческого возраста","link":"https://cr.minzdrav.gov.ru/view-cr/742_1","metadata":{"Название клинической рекомендации":"Делирий, не обусловленный алкоголем и другими психоактивными веществами, у лиц пожилого и старческого возраста","МКБ-10":"F05","Возрастная группа":"Взрослые","Разработчик":"Общественная организация \"Российское общество психиатров\", ФГБУ «НМИЦ ПН им. В.М. Бехтерева» Минздрава России","Дата размещения":"16.08.2022","Статус применения КР":"Применяется"}},"context_html":"зе жизни и здоровью пациента и медицинского персонала на фоне психомоторного возбуждения, антипсихотическая терапия рекомендована к использованию в минимальной эффективной дозировке в максимально короткие сроки, и наиболее целесообразна при гиперактивном варианте делирия. Терапию делирия рекомендуется начинать с антипсихотических средств атипичного ряда. У пациентов с делирием при психомоторном возбуждении рекомендовано использование #зипрасидона в виде лиофилизата для приготовления раствора для внутримышечных инъекций (нач. дозировка - 10 мг, макс. 40 мг) или #рисперидон** (нач. доза - 0.5 мг) с повторным приемом не ранее 2-4 часов от первой дозы [44; 83] Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5) ● При невозможности купирования делирия препаратами атипичного ряда, рекомендуется в качестве препарата выбора галоперидол** (внутрь в виде таблеток или капель, начальная разовая дозировка - 0,5 мг, суточная дозировка - 1-10 мг, разделенная на 2-3 приема, в случае сохранения возбуждения, дозировку можно увеличивать с интервалом от 2 до 4 часов до достижения максимальной дозы - 10 мг) [83] Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5) ● После регресса проявлений делирия рекомендовано снижение дозы антипсихотического средства вплоть до полной его отмены. В случае возобновления при этом психотической симптоматики следует возобновить антипсихотическую терапию, по возможности – на уровне более низких доз. Повторная попытка прекращения психотропной терапии при стабильности психического и соматического состояния должна быть апробирована через 3 месяца [45,46,47,48,49]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5) ● Применение производных бензодиазепина также не рекомендовано для применения у пациентов с делирием, поскольку они могут ухудшать клиническую картину заболевания [43, 50,51]. Уровень убедительности рекомендаций В (уровень достоверности доказательств 2) Комментарий: пожилые пациенты более подвержены риску гиперседации и миорелаксации, вызванных приемом производных бензодиазепина. ● Использование производных бензодиазепина рекомендовано пациентам пожилого возраста в том случае, если делирий вызван эпилептическим приступом.[95] Уровень убедительности рекомендаций C (уровень достоверности доказательств - 4) ● В случае гиперактивного варианта делирия, либо периода гиперактивности при его смешанном варианте, не рекомендуется назначать другие психостимуляторы и <mark class=\"hit\">ноотроп<\/mark>ные препараты (например, пирацетам**) [45]. Уровень убедительности рекомендаций C (уровень достоверности доказательств - 5) ● Рекомендуется назначение антихолинэстеразных средств (ривастигмин**, галантамин**, донепезил) при развитии делирия у пациентов с деменцией [52,96]. Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). ● Не рекомендуется фармакологическое лечение делирия у пациентов с терминальными состояниями. [97] Уровень убедительности рекомендации А (уровень достоверности доказательств 1) 4. Медицинская реабилитация и санаторнокурортное лечение, медицинские показания и противопоказания к применению методов медицинской реабилитации, в том числе основанных на использовании природных лечебных факторов 4.1 Реабилитация после делирия ● В реабилитационные мероприятия рекомендовано включать когнитивный тренинг, стимуляцию доступной физической активности пациентов, психообразовательную работу с лицами, ухаживающими за больным. Данные методы показаны после устранения острых проявлений психотического состояния и не имеют противопоказаний. [55] Уровень убедительности рекомендации B (уровень достоверности доказательств 2) Комментарий: В процессе указанных реабилитационных воздействий важное значение имеет исключение факторов риска повторного возникновения делирия, т.е., в первую очередь, систематическая коррекция предрасполагающих к последнему воздействий и исключение провоцирующих влияний. 4.2 Уход за пациентом с делирием ● Рекомендуется проведение психообразовательной работы с лицами, осуществляющими уход за пациентами, перенесшими делирий, включающая в себя: - оценку динамики нарастания когнитивных нарушений пациента; - оценка нарушений режима дня пациента, в т.ч. сна-бодрствования; - оценка изменения уровня физической активности пациента и ее распределение в течение суток; - оценка колебаний эмоционального состояния пациента. Оценку вышеуказанных изменений рекомендуется проводить путем собеседования с пациентом, допускается использование опросников, а также путем динамического наблюдения за пациентом. После выявления установленных нарушений проведение мероприятий по их коррекции. [56, 84] Уровень убедительности рекомендации С (уровень достоверности доказательств 4) Комментарий: Работа лиц, осуществляющих уход за пациентами, по созданию наиболее комфортной среды пребывания пациента с максимальным приближением к знакомым, создающих сходство с домашней обстановкой, условиям: - проведение консультаций у врача ЛФК, врача-гериатра с целью подбора упражнений и меропр","terms":[{"source":"mediq","term_id":"mediq:df3ec7903a9b","canonical":"Ноотроп","search_word":"Ноотроп","host_word":"ноотропные","inside_word":true,"mediq":{"name":"Ноотроп","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:5860d96440f9830b::case:af9721df5a79c26c","block_id":"block:5860d96440f9830b","case_id":"case:af9721df5a79c26c","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"«Пирацетам» указан как пример в предложении «не рекомендуется назначать ... ноотропные препараты (например, пирацетам)», значит для самого препарата это противопоказательное/не рекомендованное упоминание.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"742_1","title":"Делирий, не обусловленный алкоголем и другими психоактивными веществами, у лиц пожилого и старческого возраста","link":"https://cr.minzdrav.gov.ru/view-cr/742_1","metadata":{"Название клинической рекомендации":"Делирий, не обусловленный алкоголем и другими психоактивными веществами, у лиц пожилого и старческого возраста","МКБ-10":"F05","Возрастная группа":"Взрослые","Разработчик":"Общественная организация \"Российское общество психиатров\", ФГБУ «НМИЦ ПН им. В.М. Бехтерева» Минздрава России","Дата размещения":"16.08.2022","Статус применения КР":"Применяется"}},"context_html":"зе жизни и здоровью пациента и медицинского персонала на фоне психомоторного возбуждения, антипсихотическая терапия рекомендована к использованию в минимальной эффективной дозировке в максимально короткие сроки, и наиболее целесообразна при гиперактивном варианте делирия. Терапию делирия рекомендуется начинать с антипсихотических средств атипичного ряда. У пациентов с делирием при психомоторном возбуждении рекомендовано использование #зипрасидона в виде лиофилизата для приготовления раствора для вн
