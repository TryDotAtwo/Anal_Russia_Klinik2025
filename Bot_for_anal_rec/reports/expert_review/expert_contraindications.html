40 мг не более 3 сут Метамизол натрия (АТХ: N02BB02) с 15 лет – 5001000 мг в/в, в/м; 8-12 ч с15 лет - 2 г 1-5 сут 19 2-14 лет – 50-100 мг /кг в/м в/в; 3 мес - 1 год – 50100мг/10кг в/м 3 сут  Рекомендуется введение вакцин для профилактики столбняка (Код АТХ: J07AM) пациентам при травмах носа с нарушением целости кожных покровов и слизистых оболочек, полученных при ударе о землю либо попадании частиц почвы на раневую поверхность [29]. Уровень убедительности рекомендаций С (уровень достоверности доказател","terms":[{"source":"blacklist","term_id":"blacklist:f999e9e4fb26","canonical":"Анальгин","search_word":"Метамизол","host_word":"метамизола","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Анальгин","aliases":["Метамизол","Metamizole","Dipyrone"],"description":"имеет доказанную эффективность, но равно имеет и доказанную небезопасность (подробнее - тут). Вряд ли когда-нибудь выйдет из бана, поскольку имеет множество куда более безопасных альтернатив (ибупрофен, парацетамол, индометацин и пр.). Исследований хватает: Cochrane Reviews 2; Pubmed 200; FDA 0; RXlist 0; ВОЗ 0; ФК (-)."}},{"source":"blacklist","term_id":"blacklist:fc7c02eeb9a7","canonical":"Метамизол","search_word":"Метамизол","host_word":"метамизола","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Метамизол","aliases":[],"description":"см. Анальгин."}}]},{"id":"block:b5669e7d07c3b514::case:cb3c7aad323767e8","block_id":"block:b5669e7d07c3b514","case_id":"case:cb3c7aad323767e8","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"3","reason":"Хост-слово «индометацин» в тексте прямо указано как не рекомендуемое для уменьшения количества амниотической жидкости при многоводии; это противопоказательный/не рекомендованный контекст.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"820_1","title":"Аномалии объема амниотической жидкости (многоводие, маловодие)","link":"https://cr.minzdrav.gov.ru/view-cr/820_1","metadata":{"Название клинической рекомендации":"Аномалии объема амниотической жидкости (многоводие, маловодие)","МКБ-10":"O40, O41, O41.0, O41.8, O41.9","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов","Дата размещения":"25.11.2024","Статус применения КР":"Применяется"}},"context_html":"ии, поскольку при МРТ визуализация менее ограничена 5 Миотоническая дистрофия – наиболее частая наследственная форма мышечной дистрофии у взрослых; заболевание характеризуется прогрессирующим типом течения, аутосомно-доминантным наследованием и мультисистемным поражением (скелетные мышцы, миокард, эндокринная система, орган зрения и др.) (2019, Клиническая неврология, Миотоническая дистрофия: генетика и полиморфизм клинических проявлений). 20 отсутствием амниотической жидкости в сравнении с УЗИ. Проведение МРТ является целесообразным для определения тактики ведения беременности. Визуализация в режимах T1 и T2 предпочтительнее визуализации T3, поскольку последняя может повысить температуру амниотической жидкости (68). Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). 21 3. Лечение, включая медикаментозную и немедикаментозную терапии, диетотерапию, обезболивание, медицинские показания и противопоказания к применению методов лечения Маловодие и многоводие легкой и умеренной степени не требует лечения (34). Возможными вариантами коррекции выраженного, как маловодия, так и многоводия, являются инвазивные процедуры – амниоинфузия и амниоредукция, соответственно. 3.1. Медикаментозная терапия Не рекомендуется лечить маловодие во время беременности, несмотря на некоторые доказательства увеличения объема амниотической жидкости того в результате материнской гидратации, поскольку клинические преимущества этого метода еще не установлены (69). Уровень убедительности рекомендаций В (уровень достоверности доказательств - 2). Комментарий: Оральная гидратация одним-двумя литрами воды может быть альтернативой амниоинфузии для временного увеличения ИАЖ на срок до 48 часов, особенно у пациенток с гиповолемией. Этот подход проще и безопаснее, чем внутривенное введение жидкостей или амниоинфузия. Гидратация водой, по-видимому, снижает осмоляpность материнской плазмы и концентрацию натрия и потенциально улучшает маточно-плацентарную перфузию. Не рекомендуется использовать #индометацин (M01A - нестероидные противовоспалительные и противоревматические препараты) исключительно с целью уменьшения количества амниотической жидкости при многоводии (71,72) Уровень убедительности рекомендаций С (уровень достоверности доказательств - 3). Комментарий: Известно, что #индометацин, препарат, рекомендованный для проведения острого токолиза6, снижает выработку мочи у плода (73). Однако было показано, что у недоношенных детей, рожденных от матерей, принимавших #индо<mark class=\"hit\">метацин<\/mark> (in utero), наблюдалось снижение диуреза и повышение концентрации креатинина в сыворотке, которые в некоторых cлучаях персистировали в течение нескольких недель (71,74). Кроме того, исследования показывают, что лечение #индометацином ассоциировано с 6 Алгоритм и показания для проведения острого токолиза, описаны в КР РОАГ «Преждевременные роды» 22 повышенным риском других неонатальных заболеваний, включая внутрижелудочковое кровоизлияние, перивентрикулярную лейкомаляцию и некротизирующий энтероколит (72,75). Рекомендовано рассмотреть назначение #индометацина, как сдерживающего фактора при быстро нарастающем многоводии, требующим проведения серийных амниоредукций в сроках беременности менее 32 недель (76). Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Комментарий: Назначение возможно только по решению врачебной комиссии и при получении информированного согласия пациентки на применение препарата off-label. Оптимальная доза неизвестна, Moise предложил 25 мг каждые 6 часов per os, под тщательным контролем. Ультразвуковая оценка ИАЖ должна проводиться один или два раза в неделю. Если развивается маловодие, #индометацин следует немедленно прекратить, с продолжением контроля ИАЖ. Также в первые 24 часа следует рассмотреть проведение эхокардиографии плода, признаки значимого сужения артериального протока или появления регургитации на трехстворчатом клапане требуют немедленного прекращения приема #индометацина (77). 3.2. Иное лечение Амниоинфузия — это процедура, при которой в полость матки вводится натрия хлорид** или натрия лактата раствор сложный [Калия хлорид+Кальция хлорид+Натрия хлорид+Натрия лактат]**для замены амниотической жидкости. Данная процедура может быть выполнена с целью: профилактического лечения маловодия, для коррекции нарушений (преимущественно замедления) сердечного ритма плода из-за сдавления пуповины во время родов, а также коррекции проявлений ПРПО в сроках беременности 26 недель и более (78–80). Не рекомендовано проведение амниоинфузий в слeдующих ситуациях: хориоамнионит, облегчение наружного поворота плода на головку при тазовом предлежании, ПРПО в сроках беременности до 26 недель, профилактика синдрома аспирации меконием, лечение ангидрамниона во II триместре (с целью улучшения визуализации при ультразвуковом исследовании плода) (81–84). Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5). Комментарии: Амниоинфузия может быть рассмотрена при ангидрамнионе после взвешивания п","terms":[{"source":"mediq","term_id":"mediq:9071eab50529","canonical":"Метацин","search_word":"Метацин","host_word":"индометацин","inside_word":true,"mediq":{"name":"Метацин","kind":["OTHER"],"type":"CHECKED","quality":"NOT_PROVED","atx":"A03A","atx_group":"A03A","mnn":"метоциния йодид","description":"","criterions":[{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/metocinium%20iodide","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=metocinium+iodide&t=1","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=metocinium+iodide&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":0}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:a5f21baaf19ec65d::case:744a017690d1d6b4","block_id":"block:a5f21baaf19ec65d","case_id":"case:744a017690d1d6b4","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"4","reason":"КСФ в этом месте упомянута в запрете: не рекомендуется устранение КСФ у пациентов с асимптомной КСФ небольшого диаметра.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"829_1","title":"Аномалия развития коронарных сосудов","link":"https://cr.minzdrav.gov.ru/view-cr/829_1","metadata":{"Название клинической рекомендации":"Аномалия развития коронарных сосудов","МКБ-10":"Q24.5","Возрастная группа":"Дети","Разработчик":"Ассоциация сердечно-сосудистых хирургов России, Всероссийская общественная организация \"Ассоциация детских кардиологов России\", Общероссийская общественная организация содействия развитию лучевой диагностики и терапии \"Российское общество рентгенологов и радиологов\" , Национальная ассоциация экспертов по санаторно-курортному лечению","Дата размещения":"27.11.2024","Статус применения КР":"Применяется"}},"context_html":"искусственного кровообращения может быть оправдано у пациентов, находящихся в критическом состоянии по основному пороку и имеющих неблагоприятную анатомию венечной системы с отсутствием или слабым развитием межкоронарных анастомозов и большой площадью рубцового поражения левого желудочка. У пациентов с диагностированным аномальным отхождением ЛКА от ЛС в ряде клинических ситуаций рекомендуется выполнение трансплантации сердца как безальтернативного варианта коррекции порока с целью спасения жизни пациента [51,56,57]. (УУР С, УДД 5) Комментарии: У пациентов с массивным инфарктом миокарда либо аневризмой ЛЖ, особенно в тех случаях, когда предполагаемая реваскуляризация миокарда не приведет к полной ликвидации патоморфологических изменений в сердце, то есть при документально подтвержденном отсутствии жизнеспособного миокарда (по данным ПЭТ и ОФЭКТ), показана трансплантация сердца. К сожалению, данная рекомендация трудно применима в отношении больных детей раннего возраста в нашей стране, ввиду отсутствия законодательной базы по трансплантологии у детей в России, а донором может быть лишь взрослый пациент. В редких ситуациях возможно выполнение пересадки ребенку от взрослого донора (зависит от росто-весовых показателей донора). У ряда пациентов с диагностированным аномальным отхождением ЛКА от ЛС при хирургической коррекции коронарной аномалии рекомендуется использование введение стволовых клеток [51,56,57,92]. (УУР С, УДД 4) Комментарии: Применение методики имплантации стволовых клеток (фетальных кардиомиобластов, ангиогенного фактора CD133+) при синдроме Бланд-Уайт-Гарланда в коронарное русло и интрамиокардиально может быть использовано, как во время основной коррекции порока, так и в отдаленные сроки после операции в случаях сохраняющейся сниженной контрактильной способности левого желудочка. Пациентам с диагностированными КСФ больших размеров рекомендуется устранение КСФ, вне зависимости от симптоматики, с использованием открытой хирургической или же эндоваскулярной методик после анализа их анатомии и возможности окклюзии [511,13,15,44,49,50]. (УУР С, УДД 5) Комментарии: Успешный результат хирургического закрытия фистулы во многом предопределен дооперационным определением ее точной локализации и возможности адекватной хирургической экспозиции. При недооценке анатомических особенностей фистулы и ее затрудненной экспозиции, особенно дистального сегмента, возможна недостаточно адекватная коррекция с дальнейшей реканализацией фистулы. Рекомендуется устранение КСФ пациентам с диагностированными <mark class=\"hit\">КСФ<\/mark> большого, среднего и малого размера в сочетании с симптомами ишемии миокарда, жизнеугрожающими нарушениями ритма, необъяснимой дисфункцией желудочка, гипертензией в полости левого предсердия или же сопутствующей кардиальной патологией [5-11,13,15,44,49,50]. (УУР С, УДД 5) Не рекомендуется устранение КСФ у пациентов с асимптомной КСФ небольшого диаметра [50]. (УУР С, УДД 4) 3.3 Эндоваскулярные вмешательства Рекомендуется пациентам с диагностированными КСФ выполнение эндоваскулярных вмешательств только в специализированных кардиохирургических центрах, обладающих опытом подобных вмешательств с целью устранения выявленной фистулы [132-134]. (УУР С, УДД 4) Комментарии: Многочисленные публикации свидетельствуют об успешном частичном или полном закрытии КСФ эндоваскулярным методом с помощью спиралей для эмболизации сосудов*** или окклюдера кардиологического***. Основными показаниями для эмболизации КСФ являются: 1) диаметр фистулы более 3 мм, 2) проксимальное расположение свищевого хода, 3) единичная КСФ, 4) прямой фистулярный ход, 5) отсутствие сопутствующей внутрисердечной патологии [132-134]. 3.4 Иное лечение Нет 4. Медицинская реабилитация и санаторнокурортное лечение, медицинские показания и противопоказания к применению методов медицинской реабилитации, в том числе основанных на использовании природных лечебных факторов Рекомендуется в течение 6 месяцев после выполнения хирургической коррекции аномалий КА в условиях искусственного кровообращения пациенту с осложнённым течением послеоперационного периода (НК, инфекционные осложнения, повторные хирургические вмешательства в течение одной госпитализации) пройти реабилитацию в условиях специализированного лечебного учреждения кардиологического профиля [93-95,115,135]. (УУР С, УДД 5) Комментарии: После коррекции аномалий КА могут встречаться следующие состояния: - формирование стеноза устья и ствола реимплантированной ЛКА после прямой имплантации ЛКА в Ао при коррекции СБУГ; - прогрессирование ишемии миокарда, сопровождающееся снижением контрактильной функции; - формирование надклапанного стеноза ЛА после операции прямой реимплантации ЛКА в Ао; - развитие дисфункции шунтов (окклюзии, стенозы) при шунтировании аномально отходящей ЛКА при коррекции СБУГ; - реканализация внутрилегочного тоннеля с формированием коронарно-легочных фистул при операциях гемодинамической коррекции типа Hamilton и Takeuchi; - стеноз внутрилегочного тоннеля при операциях гемодинамической коррекции типа Hamilton и Takeuchi; - прогрессиров","terms":[{"source":"mediq","term_id":"mediq:1cb0e9c14bef","canonical":"КСФ","search_word":"КСФ","host_word":"КСФ","inside_word":false,"mediq":{"name":"КСФ","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:49e35b8bdcc01cb6::case:32e477fa84c37b5b","block_id":"block:49e35b8bdcc01cb6","case_id":"case:32e477fa84c37b5b","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"4","reason":"Хост-слово «КСФ» стоит в фразе «Не рекомендуется устранение КСФ у пациентов с асимптомной КСФ небольшого диаметра», то есть для этой ситуации вмешательство прямо не рекомендовано.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"829_1","title":"Аномалия развития коронарных сосудов","link":"https://cr.minzdrav.gov.ru/view-cr/829_1","metadata":{"Название клинической рекомендации":"Аномалия развития коронарных сосудов","МКБ-10":"Q24.5","Возрастная группа":"Дети","Разработчик":"Ассоциация сердечно-сосудистых хирургов России, Всероссийская общественная организация \"Ассоциация детских кардиологов России\", Общероссийская общественная организация содействия развитию лучевой диагностики и терапии \"Российское общество рентгенологов и радиологов\" , Национальная ассоциация экспертов по санаторно-курортному лечению","Дата размещения":"27.11.2024","Статус применения КР":"Применяется"}},"context_html":"нием ЛКА от ЛС в ряде клинических ситуаций рекомендуется выполнение трансплантации сердца как безальтернативного варианта коррекции порока с целью спасения жизни пациента [51,56,57]. (УУР С, УДД 5) Комментарии: У пациентов с массивным инфарктом миокарда либо аневризмой ЛЖ, особенно в тех случаях, когда предполагаемая реваскуляризация миокарда не приведет к полной ликвидации патоморфологических изменений в сердце, то есть при документально подтвержденном отсутствии жизнеспособного миокарда (по данным ПЭТ и ОФЭКТ), показана трансплантация сердца. К сожалению, данная рекомендация трудно применима в отношении больных детей раннего возраста в нашей стране, ввиду отсутствия законодательной базы по трансплантологии у детей в России, а донором может быть лишь взрослый пациент. В редких ситуациях возможно выполнение пересадки ребенку от взрослого донора (зависит от росто-весовых показателей донора). У ряда пациентов с диагностированным аномальным отхождением ЛКА от ЛС при хирургической коррекции коронарной аномалии рекомендуется использование введение стволовых клеток [51,56,57,92]. (УУР С, УДД 4) Комментарии: Применение методики имплантации стволовых клеток (фетальных кардиомиобластов, ангиогенного фактора CD133+) при синдроме Бланд-Уайт-Гарланда в коронарное русло и интрамиокардиально может быть использовано, как во время основной коррекции порока, так и в отдаленные сроки после операции в случаях сохраняющейся сниженной контрактильной способности левого желудочка. Пациентам с диагностированными КСФ больших размеров рекомендуется устранение КСФ, вне зависимости от симптоматики, с использованием открытой хирургической или же эндоваскулярной методик после анализа их анатомии и возможности окклюзии [511,13,15,44,49,50]. (УУР С, УДД 5) Комментарии: Успешный результат хирургического закрытия фистулы во многом предопределен дооперационным определением ее точной локализации и возможности адекватной хирургической экспозиции. При недооценке анатомических особенностей фистулы и ее затрудненной экспозиции, особенно дистального сегмента, возможна недостаточно адекватная коррекция с дальнейшей реканализацией фистулы. Рекомендуется устранение КСФ пациентам с диагностированными КСФ большого, среднего и малого размера в сочетании с симптомами ишемии миокарда, жизнеугрожающими нарушениями ритма, необъяснимой дисфункцией желудочка, гипертензией в полости левого предсердия или же сопутствующей кардиальной патологией [5-11,13,15,44,49,50]. (УУР С, УДД 5) Не рекомендуется устранение КСФ у пациентов с асимптомной <mark class=\"hit\">КСФ<\/mark> небольшого диаметра [50]. (УУР С, УДД 4) 3.3 Эндоваскулярные вмешательства Рекомендуется пациентам с диагностированными КСФ выполнение эндоваскулярных вмешательств только в специализированных кардиохирургических центрах, обладающих опытом подобных вмешательств с целью устранения выявленной фистулы [132-134]. (УУР С, УДД 4) Комментарии: Многочисленные публикации свидетельствуют об успешном частичном или полном закрытии КСФ эндоваскулярным методом с помощью спиралей для эмболизации сосудов*** или окклюдера кардиологического***. Основными показаниями для эмболизации КСФ являются: 1) диаметр фистулы более 3 мм, 2) проксимальное расположение свищевого хода, 3) единичная КСФ, 4) прямой фистулярный ход, 5) отсутствие сопутствующей внутрисердечной патологии [132-134]. 3.4 Иное лечение Нет 4. Медицинская реабилитация и санаторнокурортное лечение, медицинские показания и противопоказания к применению методов медицинской реабилитации, в том числе основанных на использовании природных лечебных факторов Рекомендуется в течение 6 месяцев после выполнения хирургической коррекции аномалий КА в условиях искусственного кровообращения пациенту с осложнённым течением послеоперационного периода (НК, инфекционные осложнения, повторные хирургические вмешательства в течение одной госпитализации) пройти реабилитацию в условиях специализированного лечебного учреждения кардиологического профиля [93-95,115,135]. (УУР С, УДД 5) Комментарии: После коррекции аномалий КА могут встречаться следующие состояния: - формирование стеноза устья и ствола реимплантированной ЛКА после прямой имплантации ЛКА в Ао при коррекции СБУГ; - прогрессирование ишемии миокарда, сопровождающееся снижением контрактильной функции; - формирование надклапанного стеноза ЛА после операции прямой реимплантации ЛКА в Ао; - развитие дисфункции шунтов (окклюзии, стенозы) при шунтировании аномально отходящей ЛКА при коррекции СБУГ; - реканализация внутрилегочного тоннеля с формированием коронарно-легочных фистул при операциях гемодинамической коррекции типа Hamilton и Takeuchi; - стеноз внутрилегочного тоннеля при операциях гемодинамической коррекции типа Hamilton и Takeuchi; - прогрессирование регургитации на МК; - развитие протез-зависимых осложнений при имплантации протеза в митральную позицию (протез митрального клапана механический двустворчатый***) при коррекции СБУГ (эндокардит, тромбоз, системные эмболии, парапротезная регургитация или окклюзия, связанная с развитием паннуса); - развитие нарушений ритма сердца,","terms":[{"source":"mediq","term_id":"mediq:1cb0e9c14bef","canonical":"КСФ","search_word":"КСФ","host_word":"КСФ","inside_word":false,"mediq":{"name":"КСФ","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:2b122f458ae24489::case:366131af8469cc9c","block_id":"block:2b122f458ae24489","case_id":"case:366131af8469cc9c","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В тексте прямо указано: «Не рекомендуются … мануальная терапия, растяжка в первые 3 суток с момента травмы», то есть это запрещаемое/не рекомендуемое вмешательство.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"832_1","title":"Закрытые повреждения мягких тканей конечностей","link":"https://cr.minzdrav.gov.ru/view-cr/832_1","metadata":{"Название клинической рекомендации":"Закрытые повреждения мягких тканей конечностей","МКБ-10":"S40.0, S46.7, S46.8, S46.9, S50.0, S50.1, S56.7, S56.8, S60.0, S60.1, S60.2, S66.6, S66.7, S66.8, S66.9, S70.0, S70.1, S73.1, S76.1, S76.3, S76.4, S76.7, S79.7, S79.8, S80.0, S80.1, S80.7, S80.8, S80.9, S86.0, S86.1, S86.2, S86.3, S86.7, S86.8, S86.9, S90.0, S90.1, S90.2, S90.3, S93.2, S93.4, S93.6, S96.1, S96.7, S96.9, T06.4, T11.5, T13.5, T14.6, T93.3, T93.5","Возрастная группа":"Взрослые, дети","Разработчик":"Ассоциация травматологов-ортопедов России","Дата размещения":"28.11.2024","Статус применения КР":"Применяется"}},"context_html":"ские препараты» [48]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5) Комментарии: Рациональными обезболивающими препаратами при ушибах и растяжениях являются НПВП, такие как:  Ибупрофен** в дозировке 200-400 мг до 3-4 р/день (максимальная суточная доза — 1200 мг). Применение до 7 суток является безопасным, пролонгированное применение нежелательно [48].  Местные НПВП из группы M02 &quot;Препараты для местного применения при мышечных и суставных болях&quot; эффективны в качестве симптоматического лечения свежих повреждений мягких тканей, таких как растяжение связок, сухожилий и мышц [18,19, 20]. Возможно применение препаратов в виде мази, геля, спрея, содержащих: o Диклофенак; o Ибупрофен**; o Кетопрофен; o Пироксикам [41, 78].  Ненаркотические анальгетики: парацетамол** в дозировке 500-1000 мг до 4 р/д. Обезболивающий и жаропонижающий эффект парацетамола** идентичен НПВП, при этом не оказывается влияния на процесс воспаления. При использовании в течение более 3 суток имеет лучший профиль побочных эффектов. [33, 48, 28]. Применять с осторожностью у пациентов с патологией печени.  Рекомендуются пациентам детского возраста с ушибом мягких тканей, повреждением мышц или сухожилий с целью обезболивания ненаркотические анальгетики из группы N02 «Анальгетики» и НПВП из группы M01A «Нестероидные противовоспалительные и противоревматические препараты» [48, 83]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5) 19 Комментарии: Режимы дозирования обезболивающих препаратов для детей (в соответствии с инструкциями по медицинскому применению) представлены в Приложении А3.2  Не рекомендуется взрослым и пациентам детского возраста с ушибом мягких тканей, повреждением мышц или сухожилий использование кортикостероидов системного действия (АТХ: H02) [45]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5)  Не рекомендуется взрослым и пациентам детского возраста с ушибом мягких тканей, повреждением мышц или сухожилий использование местных анестетиков (АТХ: N01B) ввиду их гистотоксичности [50, 39]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5)  Не рекомендуются взрослым пациентам с ушибом мягких тканей, повреждением мышц или сухожилий:  тепловые процедуры — баня, сауна, горячая ванна, а также, местное нагревание [16], в том числе, контрастного душа [7],  чрезмерное употребление алкоголя [52],  тяжёлые физические нагрузки [59, 6],  массаж [59],  <mark class=\"hit\">мануальная терапия<\/mark>, растяжка в первые 3 суток с момента травмы [64]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5) 3.2. Оперативное лечение  Рекомендуется взрослым пациентам с разрывами мышц с целью восстановления анатомической целостности шов повреждённой мышцы (восстановление мышцы и сухожилия) при разрыве более 50% её поперечного сечения [3, 37]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5) Комментарий: Целесообразно выполнение П-образных, Z-образных, либо блокирующих швов рассасывающимся шовным материалом.  Рекомендуется взрослым пациентам и пациентам детского возраста с разрывами сухожилия с целью восстановления его анатомической целостности шов повреждённого сухожилия (восстановление мышцы и сухожилия и/или наложение шва сухожилия) при полном его разрыве и рефиксация при его отрыве [67, 84]. 20 Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5) Комментарий: Техника оперативного вмешательства, используемый шовный материал и инструментарий зависят от локализации разрыва, сроков оперативного вмешательства, технической оснащённости медицинского учреждения.  Рекомендуется взрослым и пациентам детского возраста с целью защиты анатомических структур иммобилизация сегмента и смежных суставов в положении покоя повреждённой мышцы в течение 4 недель с момента оперативного вмешательства [56]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5) Комментарий: При повреждениях мышц верхней конечности целесообразна иммобилизация косыночной повязкой, либо фиксирующим плечевым бандажом. Длительность иммобилизации зависит от тяжести повреждения и его локализации. Пациентам с полным разрывом четырехглавой мышцы бедра или икроножной мышцы рекомендуется исключение нагрузки в течение 4 недель, через 2 недели после операции разрешается осторожное растяжение прооперированной мышцы в пределах, не вызывающих болевых ощущений. Через четыре недели после операции разрешается дозированная нагрузка и мобилизация конечности. Через 6 недель после операции необходимость в ограничении нагрузки отпадает [66].  Не рекомендуется оперативное лечение взрослым пациентам с разрывами связок голеностопного сустава [1, 2, 15]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 2) Комментарий: Оперативное лечение разрывов наружных коллатеральных связок голеностопного сустава не имеет преимуществ перед консервативным ни в функциональных результатах, ни","terms":[{"source":"marker","term_id":"marker:61f406947d13","canonical":"мануальная терапия","search_word":"мануальная терапия","host_word":"мануальная терапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:18f3d92c51afd3f5::case:efb4c8a08ff9cbec","block_id":"block:18f3d92c51afd3f5","case_id":"case:efb4c8a08ff9cbec","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Рефлексотерапия прямо указана как не используемая на этапе реабилитации: «рефлексотерапия не используется».","evidence_quote":null,"confidence":null},"clinical":{"document_id":"838_1","title":"Вирусные пневмонии","link":"https://cr.minzdrav.gov.ru/view-cr/838_1","metadata":{"Название клинической рекомендации":"Вирусные пневмонии","МКБ-10":"J12, J12.0, J12.1, J12.2, J12.3, J12.8, J12.9","Возрастная группа":"Взрослые","Разработчик":"Общероссийская общественная организация \"Российское научное медицинское общество терапевтов\", Национальная ассоциация специалистов по инфекционным болезням имени академика В. И. Покровского (НАСИБ), Межрегиональная ассоциация специалистов респираторной медицины (МАСРМ)","Дата размещения":"12.12.2024","Статус применения КР":"Применяется"}},"context_html":"ерности доказательств – 5). Комментарии: Быстрота прогрессирования ОРДС диктует необходимость осуществить заблаговременный контакт с центром, располагающим возможностями проведения ЭКМО. ЭКМО проводится в отделениях, имеющих опыт использования данной технологии: стационары, в которых есть специалисты, в т.ч. хирурги, перфузиологи, владеющие техникой канюлизации, настройкой ЭКМО. Потенциальные показания к ЭКМО: o Рефрактерная персистирующая* гипоксемия: PO2/FiO2 &lt; 50 мм рт. ст. (несмотря на FiO2 &gt; 0,8 + PEEP (≤ 20 см H2O) при Pplat = 32 см H2O + прональная позиция +/- ингаляционный NO); o Давление плато ≥ 35 см H2O (несмотря на снижение PEEP до 5 см H2O и снижение Vt до минимального значения (4 мл/кг) и pH ≥ 7,15). * Характер персистирования зависит от динамики процесса (несколько часов для быстропрогрессирующих состояний и до 48 часов в случае стабилизации). Противопоказания к ЭКМО: o Тяжелые сопутствующие заболевания, с предсказанной продолжительностью жизни больного не более 5 лет; o Полиорганная недостаточность и SAPS II &gt; 90 баллов или SOFA &gt;15 баллов; o Немедикаментозная кома (вследствие инсульта); o Отсутствие возможности обеспечить венозный или артериальный доступ; o Индекс массы тела &gt; 40 кг/м2. ● Рекомендуется пациентам с ОРДС тяжёлой степени и рефрактерной гипоксемией назначение экзогенного сурфактанта (R07AA Легочные 35 сурфактанты) с целью устранения его дефицита [13, 60, 65, 66, 69, 74, 75, 100, 101]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4). 3.2. Хирургическое лечение Не проводится 4. Медицинская реабилитация и санаторно-курортное лечение, медицинские показания и противопоказания к применению методов медицинской реабилитации, в том числе основанных на использовании природных лечебных факторов ● Рекомендуется начальный этап реабилитации проводить уже в остром периоде заболевания [1-4,7,76-88]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4). Комментарии: начальный этап реабилитации, как правило, проходит в стационарных условиях и связан с началом острой фазы заболевания. При необходимости мероприятия начального этапа осуществляются в условиях ОРИТ. Мероприятия на данном этапе направлены на предупреждение развития дыхательной недостаточности, восстановление и поддержание естественного дыхания, улучшение дренажной функции легких, активацию дыхательной мускулатуры, нормализацию газообмена и других функций легочной ткани, а также предупреждение ранних осложнений. На этом этапе <mark class=\"hit\">рефлексотерапия<\/mark> не используется ● Рекомендуется развивающий этап реабилитации начинать после окончания острого периода пневмонии и проводить как в стационарных, так и в амбулаторных условиях [1-4,7,76-88]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4). Комментарии: развивающий этап реабилитации направлен на восстановление нормальной легочной вентиляции, предупреждение снижения функций внешнего дыхания, развитие дыхательной мускулатуры, предупреждение развития застойных явлений, пневмофиброза и других признаков развития хронических легочных заболеваний 36 ● Рекомендуется в дальнейшем проводить тренирующий этап реабилитации для восстановления функций внешнего дыхания, укрепления дыхательной мускулатуры, повышения функционального состояния респираторной системы, профилактики заболеваний органов дыхания, а также повышения общей резистентности к инфекционным и другим неблагоприятным факторам [14,7,76-88]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4). ● Рекомендуется пациентам с синдромом вирусной и поствирусной астении вне зависимости от степени тяжести, формы инфекционного процесса и периода болезни назначение адаптогенных препаратов с противоастенической целью [89-93]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5). Комментарии: оксиэтиламмония метилфеноксиацетат обладает одновременно иммуномодулирующим и адаптогенным свойствами. Перорально в первый день 3 таблетки (600 мг) в сутки, в последующие 7 дней по 1 таблетке (200 мг). Всего на курс 10 таблеток (суммарная доза 2000 мг), длительность курса 8 дней. ● Рекомендуется комплексный характер восстановительных мероприятий с участием различных специалистов и с применением разнообразных методов воздействия, исходя из преобладающих симптомов и синдромов [1-4,7,76-88]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 4). ● Рекомендуется соблюдать последовательность и преемственность проводимых мероприятий, обеспечивающих непрерывность на различных этапах реабилитации и диспансеризации [1-4,7,76-88]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 4). ● Рекомендуется адекватность реабилитационных и восстановительных мероприятий и воздействий адаптационным и резервным возможностям пациента [1-4,7,76-88]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 4). 37 Комментарии: Важны постепенность возрастания дозированных физических и умственных нагрузо","terms":[{"source":"marker","term_id":"marker:b5ff7866086a","canonical":"рефлексотерапия","search_word":"рефлексотерапия","host_word":"рефлексотерапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:cd5dfa33d2711a27::case:c7c4e21ec7f65a97","block_id":"block:cd5dfa33d2711a27","case_id":"case:c7c4e21ec7f65a97","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Хост-слово «чеснок» находится в разделе «Запрещаются» в перечне продуктов при лямблиозе, то есть прямо не рекомендуется к употреблению.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"839_1","title":"Лямблиоз у детей и взрослых","link":"https://cr.minzdrav.gov.ru/view-cr/839_1","metadata":{"Название клинической рекомендации":"Лямблиоз у детей и взрослых","МКБ-10":"A07.1","Возрастная группа":"Взрослые, дети","Разработчик":"Национальная ассоциация специалистов по инфекционным болезням имени академика В. И. Покровского (НАСИБ)","Дата размещения":"11.12.2024","Статус применения КР":"Применяется"}},"context_html":"ть специальные мыльницы, индивидуальные, а лучше разовые полотенца или салфетки. Знание и соблюдение мер профилактики поможет предотвратить заражение лямблиями и развитие лямблиоза. 48 Рекомендации по питанию при манифестном лямблиозе 1. Общие принципы. При лямблиозе рекомендуется 5-6-разовое питание, так как частый прием небольших порций пищи способствует лучшему отделению желчи, губительно действующей на лямблии. Пища должна быть преимущественно белковой, прием легкоусвояемых углеводов ограничивается. Диета должна быть низколактозной. Показано кислое питье, кисломолочные продукты, так как кислая среда тормозит размножение лямблий. В рационе должно содержаться большое количество пищевых волокон, как в составе продуктов, так и за счет добавления отрубей. 2. Разрешаются Легко эмульгирующиеся масла: сливочное, растительное (оливковое, подсолнечное, кукурузное). Супы вегетарианские с овощами, крупами, лапшой, фруктовые. Не наваристые мясные супы с овощами. Мясо нежирных сортов (говядина, телятина, кролик) в виде паровых котлет, фрикаделек, кнелей, суфле. Колбасы: диетическая, докторская. Сосиски говяжьи. Рыба нежирных сортов: треска, судак, сазан, навага. Молочные продукты – творог свежий, лучше обезжиренный, домашнего приготовления. Кефир, простокваша, ацидофильное молоко, биойогурты. Сметана – только для заправки блюд. Яйца – преимущественно для изготовления блюд. Белковый омлет, отдельно (всмятку) не более 1 шт. в сутки. Овощи и зелень – свежие, в сыром виде (морковь, капуста, огурцы, помидоры). В отварном виде (картофельное пюре, протертая свекла, зеленый горошек, цветная и др. сорта капусты, кабачки, тыква, зелень). Лук только отварной. Допускаются квашеные и соленые маринады. Фрукты: сладкие, спелые. Фруктовые блюда. Муссы, желе, подливы. Курага, чернослив, изюм (без косточек). Кислые морсы из клюквы и брусники, свежевыжатые соки. Сладости – мед, пастила, мармелад, печенье из не сдобного теста. Закуски – салаты, винегреты, заливная рыба на желатине, вымоченная сельдь (изредка). Каши – гречневая, овсяная, рисовая, пшеничная и др. 3. Запрещаются Тугоплавкое сало, смалец, комбижир, маргарин. 49 Супы: на крепком мясном, рыбном, грибном бульоне, жирные щи и борщи. Мясо жирных сортов - свинина, окорока, жирные колбасы, свиные сардельки, сосиски, мясные консервы. Рыба жирных сортов – форель, семга, осетровые и др. Сливки, жирные подливы и соусы, острые сыры. Крутые и сырые яйца, яичница-глазунья. Бобы, горох, фасоль, чечевица, щавель, богатые эфирными маслами <mark class=\"hit\">чеснок<\/mark>, редька, редис. Неспелые сырые фрукты, орехи, миндаль. Шоколад, конфеты, торты, пирожные, мороженое, кремы, газированные напитки. Острые приправы (перец, горчица, уксус, хрен, майонез). Копчености, грибы. 50 Приложение Г1 - ГN. Шкалы оценки, вопросники и другие оценочные инструменты состояния пациента, приведенные в клинических рекомендациях. Нет.","terms":[{"source":"mediq","term_id":"mediq:1cfb6cd6f5d1","canonical":"Чеснок","search_word":"Чеснок","host_word":"чеснок","inside_word":false,"mediq":{"name":"Чеснок","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"de }
