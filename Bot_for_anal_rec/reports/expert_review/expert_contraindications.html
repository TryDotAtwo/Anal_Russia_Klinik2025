вания применяется #мелфалан** в дозе 140-200 51 мг/м2. При СКФ &gt; 50 мл/мин и возрасте пациентов младше 65 лет мелфалан применяют в дозе 200 мг/м2 , при СКФ &lt; 30 мл/мин — в дозе 140 мг/м2. Пациентам в возрасте 65—70 лет или при СКФ 30—50 мл/мин решение о дозе мелфалана принимают индивидуально[63] Этап поддерживающей терапии • Больным AL-A поддерживающая терапия не рекомендуется [125]. Уровень убедительности рекомендаций С (уровень достоверности доказательств − 4). Комментарий: в настоящее время не доказано преимущество поддерживающей терапии #бортезомибом** или #леналидомидом** у больных с впервые диагностированным и рецидивирующим AL-A [125]. Однако при сочетании AL-A и ММ <mark class=\"hit\">поддерживающая терапия<\/mark> после ауто-ТГСК проводится в соответствии с клиническими рекомендациями по лечению ММ [82]. Лечение IgM первичного амилоидоза • Больным IgM AL амилоидозом с лимфоидным клоном рекомендуется терапия #ритуксимабом** в сочетании с #бортезомибом**, #бендамустином**, #дексаметазоном** или #преднизолоном** – RitVd, RitBe, а также #бендамустина** в сочетании с #преднизолоном**– BeP (описание режимов – см. приложение А3.2) [126 -130]. Уровень убедительности рекомендаций С (уровень достоверности доказательств − 5). Комментарий: в настоящее время недостаточно доказательств, обосновывающих выбор терапии при IgM AL амилоидозе. Глубокий гематологический ответ (ПР и ОхЧР) отмечается редко, лишь у 14-22% [138, 128]. • Больным IgM AL амилоидозом с плазматическим клоном рекомендована терапия #мелфаланом** и #дексаметазоном**, бортезомибсодержащими программами - Md, Vd, VCd, VMd (описание режимов – см. приложение А3.2) [ 113, 115, 116, 117. Уровень убедительности рекомендаций С (уровень достоверности доказательств − 4). . 3.2.3. POEMS синдром Индукционная терапия POEMS синдрома • Пациентам с впервые диагностированным POEMS синдромом рекомендуется терапия с применением или #бортезомиба** и #дексаметазона** (Vd) (описание режимов – см. приложение А3.3) [4, 78, 131, 132]. 52 Уровень убедительности рекомендаций С (уровень достоверности доказательств − 4). Комментарий: при применении #бортезомиба** и #дексаметазона** 69 пациентам с POEMS синдромом в 46% случаев был достигнут полный гематологический ответ, у 27% пациентов - ОхЧО. Снижение содержания VEGF до нормальных значений наблюдалось в 44% случаев. Клинический ответ наблюдался у 84% пациентов. Только у 2-х (из 69 пациентов) наблюдали усиление выраженности периферической полинейропатии. При медиане наблюдения 22 мес 31% пациентам потребовалась вторая линия терапии. Двухлетняя общая выживаемость составила 96%. В этом исследовании #бортезомиб** вводили подкожно в дозе 1,3 мг/м2 1 раз в неделю, #дексаметазон** 40 мг в неделю (4 недели – 1 цикл) в течение 9 циклов [131]. Таким образом, применение #бортезомиба** не сопровождалось усугублением периферической полинейропатии за счет нейротоксичности препарата. Тем не менее другие исследователи предпочитают избегать назначения #бортезомиба** в первой линии терапии, но считают возможным его применение при редициве в режиме 1 раз в неделю подкожно под тщательным мониторингом неврологического статуса [131]. • Пациентам с впервые диагностированным POEMS синдромом рекомендована терапия с п","terms":[{"source":"marker","term_id":"marker:1696a95c5213","canonical":"поддерживающая терапия","search_word":"поддерживающая терапия","host_word":"поддерживающая терапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:d8109d5428609ab8::case:6d1d7ee56ae83466","block_id":"block:d8109d5428609ab8","case_id":"case:6d1d7ee56ae83466","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Коллаген указан в перечне веществ, наличие которых в излившейся крови является противопоказанием к проведению интраоперационной реинфузии аутоэритроцитов.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"119_2","title":"Послеродовое кровотечение","link":"https://cr.minzdrav.gov.ru/view-cr/119_2","metadata":{"Название клинической рекомендации":"Послеродовое кровотечение","МКБ-10":"O67, O72, O72.0, O72.1, O72.2, O72.3","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов, Корпоративная некоммерческая организация \"Ассоциация анестезиологов – реаниматологов\", Ассоциация акушерских анестезиологов-реаниматологов , Национальная ассоциация специалистов менеджмента крови пациента","Дата размещения":"25.02.2022","Статус применения КР":"Применяется"}},"context_html":"влении до контакта с дном матки; 3. Зашивание раны на матке без прошивания баллона; 4. Удерживая баллон, помощник удаляет проводник, соединяет баллон с трубкой резервуара, открывает клемму и заполняет баллон (300-400мл) ; 5. По окончанию операции транспортировка пациентки в ОРИТ с закрытой клеммой; 6. Открытие клеммы, контроль уровня жидкости в баллоне, при увеличение уровня на 2 деления на такую же высоту опустить резервуар, повторять действие пока высота не достигнет 10-15см.; 7. Удаление баллона через 2-3 часа или достижении высоты 10-15 см от уровня матки. I этап (до начала операции): 1. Введение вагинального катетера; 2. Позиционирование относительно проводной оси и свода влагалища (минус 1см); 3. Подсоединение подготовленного шприца без заполнения манжеты. II этап (во время операции кесарева сечения, сразу после рождения последа): 1. Заполнение манжеты вагинального модуля теплым физиологическим раствором (150-180 мл). III этап (во время операции кесарева сечения): 1. Установка маточного катктера по вышеописанной методике. IV этап (после операции кесарева сечения): 1. Наблюдение за количеством выделений из половых путей и уровнем жидкости в резервуаре; 2. Через 4-24 часа (в зависимости от тяжести ситуации и уверенности в гемостазе) выведение жидкости из манжеты вагинального модуля, снижение уровня резервуара, опорожнение и удаление маточного и влагалищного катетера. Послеродовые разрывы влагалища и гематомы Влагалищный катетер применяют при невозможности полной остановки кровотечения как временная или дополнительная мера после применения хирургических мероприятий (зашивание ран, прошивание ложа гематомы). В зависимости от тяжести послеродового повреждения влагалища его тампонирование проводят в течение до 24–36 ч. Во время нахождения заполненного баллона во влагалище необходим контроль за количеством выделений из половых путей и постоянная катетеризация мочевого пузыря. Приложение Б8. Технология интраоперационной реинфузии аутоэритроцитов Для интраоперационной реинфузии аутоэритроцитов (ИРА) используются аппараты типа «Cell Saver», Cats для аутотрансфузий и наборы одноразовых магистралей к ним. Противопоказания к проведению интраоперационной реинфузии аутоэритроцитов в акушерстве. Абсолютные: -наличие в брюшной полости гнойного содержимого; -наличие в брюшной полости кишечного содержимого; -наличие в излившейся крови веществ, противопоказанных к введению в сосудистое русло (перекись водорода, дистиллированная вода, гемостатические препараты на основе <mark class=\"hit\">коллаген<\/mark>а и др.). Технология использования метода: Принцип процедуры заключается в аспирации из операционной раны излившейся крови, обработке ее в аппарате и последующей реинфузии полученной аутоэритроцитарной взвеси (Ht 60%) обратно в сосудистое русло пациентки. Заправка одноразовых магистралей проводится в операционной до начала операции. Стерильный отсос передается операционной сестре. Сбор излившейся в рану крови проводится вторым ассистентом. Отрицательное давление, создаваемое вакуум-аспиратором, не должно превышать 100 мм рт. ст. Кровь, аспирируемая из раны, смешивается с раствором антикоагулянта (АТХ: антитромботические средства), проходит сквозь фильтр, задерживающий частицы тканей, сгустки крови и собирается в резервуар. Когда объем собранной крови станет адекватным объему резервуара, начинается первая фаза работы аппарата - заполнение промывочной чаши (колокола). Данная фаза состоит из нескольких этапов: 1. Разгон центрифуги до 5600 об/мин; 2. Перенос крови из резервуара в промывочный колокол с помощью перистальтического насоса, начало процесса центрифугирования; 3. Наполнение промывочного колокола продолжается до тех пор, пока эритроциты не заполнят весь объем колокола (объем колокола может быть 125 мл, 175 мл, 225 мл). Отделяющаяся в процессе центрифугирования плазма, удаляется вместе с антикоагулянтом (АТХ: антитромботические средства) в соответствующую емкость. После этого в автоматическом или ручном режиме начинается вторая фаза - отмывание эритроцитов в стерильном физиологическом растворе хлорида натрия. Отмывание продолжается до тех пор, пока заданный объем промывающего раствора (в акушерстве 1000-1500 мл) не будет полностью проведен через эритроциты. Все это время происходит центрифугирование. Заключительная фаза работы аппарата - опустошение колокола: 1. Центрифуга останавливается, а перистальтический насос начинает вращение в обратном направлении; 2. Отмытые аутоэритроциты перекачиваются из промывочного колокола в мешок для реинфузии; Далее процесс повторяется до тех пор, пока не будет обработана вся аспирированная из раны кровь. Продолжительность первого описанного цикла составляет -3-5 минут. Во время работы на дисплее аппарата четко отражены все необходимые параметры: скорость вращения центрифуги, скорость вращения насоса, количество перенесенного раствора. После каждого цикла работы высвечивается количество собранных и отмытых эритроцитов. Реинфузия аутоэритроцитов должна осуществляться с использованием лейкоцитарного фильтра максимум в те","terms":[{"source":"mediq","term_id":"mediq:533336c92923","canonical":"Коллаген","search_word":"Коллаген","host_word":"коллагена","inside_word":true,"mediq":{"name":"Коллаген","kind":["OTHER"],"type":"MNN_NOT_FOUND","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Мы не нашли действующее вещество у данного препарата, поэтому эффективность его не может быть доказанной.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:0dcaa6dc52666b8f::case:bdac2c03cb35b880","block_id":"block:0dcaa6dc52666b8f","case_id":"case:bdac2c03cb35b880","label":"contraindication","model":{"recommendation_strength":"B","evidence_level":"2","reason":"В контексте профилактики РПЖ сказано, что нет доказательств пользы применения антиоксидантов; для данного выделенного слова это означает отсутствие рекомендации/не рекомендуется использовать для профилактики.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"12_3","title":"Рак предстательной железы","link":"https://cr.minzdrav.gov.ru/view-cr/12_3","metadata":{"Название клинической рекомендации":"Рак предстательной железы","МКБ-10":"C61","Возрастная группа":"Взрослые","Разработчик":"Ассоциация онкологов России, Общероссийская общественная организация \"Российское общество урологов\", Общероссийская общественная организация \"Российское общество онкоурологов\", Общероссийская общественная организация «Российское общество клинической онкологии»","Дата размещения":"28.01.2021","Статус применения КР":"Применяется"}},"context_html":"синдрома у пациентов РПЖ [368]. Уровень убедительности рекомендаций - В (уровень достоверности доказательств - 2). 4.4. III этап реабилитации при хирургическом лечении Рекомендуется выполнение и постепенное расширение комплекса ЛФК с включением аэробной нагрузки, что улучшает результаты комбинированного лечения злокачественных новообразований и качество жизни [369]. Уровень убедительности рекомендаций – A (уровень достоверности доказательств – 2). Рекомендован массаж медицинский для улучшения качества жизни, уменьшения болевого синдрома, слабости [370]. Уровень убедительности рекомендаций – A (уровень достоверности доказательств – 1). Рекомендуется сочетать массаж медицинский и аккупунктуру для коррекции болевого синдрома, тошноты, рвоты и депрессии в послеоперационном периоде у онкологических пациентов [371]. Уровень убедительности рекомендаций – В (уровень достоверности доказательств – 2). 4.5. Реабилитация при лучевой терапии Рекомендуется выполнение комплекса ЛФК (аэробной нагрузки в сочетании с силовой) на фоне лучевой терапии, что позволяет проводить профилактику слабости и улучшает качество жизни на фоне лучевой терапии [372]. Уровень убедительности рекомендаций – B (уровень достоверности доказательств – 1). Рекомендуется проведение комплекса ЛФК, что увеличивает плотность костной ткани и выносливость пациента на фоне лучевой терапии [373]. Уровень убедительности рекомендаций – B (уровень достоверности доказательств – 2). Рекомендуется через 3 дня после начала лучевой терапии подключить низкоинтенсивную лазеротерапию на 3 дня в неделю для профилактики лучевого дерматита [374]. Уровень убедительности рекомендаций – C (уровень достоверности доказательств – 5). 5. Профилактика и диспансерное наблюдение, медицинские показания и противопоказания к применению методов профилактики Профилактика РПЖ Методы эффективной профилактики РПЖ на сегодняшний день отсутствуют. Заболеваемость мужчин РПЖ ежегодно увеличивается, значительно чаще возникает у мужчин старше 60 лет. Агрессивность РПЖ может быть обусловлена конкретными генетическими признаками, но для разработки скрининговых программ определения генетических мутаций, влияющих на возникновение агрессивного РПЖ, требуется проведение крупных рандомизированных клинических исследований. Ряд экзогенных факторов, по данным литературы, оказывает влияние на риск возникновения РПЖ у мужчин, подробнее об этом указано в разделе «Этиология РПЖ». На сегодняшний день не существует доказательств пользы применения витаминов, <mark class=\"hit\">антиоксидант<\/mark>ов и иных лекарственных препаратов для профилактики РПЖ. Диспансерное наблюдение Диспансерное наблюдение направлено на своевременное выявление рецидива заболевания, в связи с чем при возникновении симптомов рецидива, метастазирования заболевания проводится диагностика в объеме, необходимом для достижения целей диспансерного наблюдения, в соответствии с рекомендациями, представленными в разделе «Диагностика заболевания, состояния (группы заболеваний, состояний)». Минимальный объем обследования включает ПРИ, контроль уровня ПСА, гемоглобина, креатинина, щелочной фосфатазы, а также тестостерона. После радикальной простатэктомии определение уровня ПСА рекомендуется каждые 3 месяца в течение 1 года, каждые 6 месяцев в течение 2 и 3 года, далее ежегодно [349, 375–378]. Уровень убедительности рекомендаций – C (уровень достоверности доказательств – 5). Комментарии: повышение уровня ПСА после радикальной простатэктомии &gt;0,2 нг/мл свидетельствует о рецидиве заболевания [375–377]. Три последовательных повышения уровня ПСА после минимального значения, достигнутого после лучевой терапии (надира), определяют как рецидив заболевания [379]. Пальпируемый опухолевый узел и повышение уровня ПСА свидетельствуют о развитии местного рецидива. Необходимо отметить, что возникновение местного рецидива может возникнуть без повышения уровня ПСА [380]. Не рекомендуется рутинно использовать лучевые методы диагностики (КТ, сцинтиграфия костей скелета) при отсутствии данных о наличии биохимического рецидива. Биопсия рецидивной опухоли под контролем ТРУЗИ рекомендуется при планировании второй линии радикального лечения [379–381]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 4). У пациентов с РПЖ с отдаленными метастазами рекомендовано выполнять контрольное обследование каждые 3–6 месяцев [81, 98]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5). Комментарии: минимальный объем обследования включает ПРИ, контроль уровня ПСА, гемоглобина, креатинина, щелочной фосфатазы, а также тестостерона. При необходимости рекомендовано выполнять КТ органов брюшной полости и забрюшинного пространства, сцинтиграфию костей скелета, ПЭТ-КТ. Стратегия динамического наблюдения может быть изменена индивидуально для каждого пациента в зависимости от распространенности опухолевого процесса и клинических проявлений болезни. 6. Организация оказания медицинской помощи Медицинская помощь, за исключением медицинской помощи в рамках клинической апроба","terms":[{"source":"marker","term_id":"marker:afa8f8c00725","canonical":"антиоксидант","search_word":"антиоксидант","host_word":"антиоксидантов","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}},{"source":"mediq","term_id":"mediq:0df453e20b94","canonical":"Антиоксидант","search_word":"Антиоксидант","host_word":"антиоксидантов","inside_word":true,"mediq":{"name":"Антиоксидант","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:e8bf8c2b6640c243::case:5ae78b5cca7a8be9","block_id":"block:e8bf8c2b6640c243","case_id":"case:5ae78b5cca7a8be9","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"То же самое клиническое указание: метамизол натрия прямо включён в перечень средств, которые не рекомендуются для купирования эпизодов ГБН.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"162_3","title":"Головная боль напряжения (ГБН)","link":"https://cr.minzdrav.gov.ru/view-cr/162_3","metadata":{"Название клинической рекомендации":"Головная боль напряжения (ГБН)","МКБ-10":"G44, G44.2, G44.3, G44.4, G44.8, G90.8","Возрастная группа":"Взрослые","Разработчик":"Всероссийское общество неврологов, Общероссийская общественная организация \"Союз реабилитологов России\", Межрегиональная общественная организация \"Российское общество по изучению головной боли\"","Дата размещения":"28.10.2024","Статус применения КР":"Применяется"}},"context_html":"бучения психологическому и мышечному расслаблению; 5. обсуждение роли факторов риска учащения (хронизации) ГБН: лекарственного абузуса, мышечного напряжения, эмоциональных факторов; пациентам с ХГБН, злоупотребляющим лекарственными препаратами с обезболивающим действием, следует разъяснить необходимость отказа от приема этих препаратов; 6. разъяснение целей лечения, механизмов действия профилактических препаратов и пользы от использования немедикаментозных методов. 3.2 Купирование эпизодов головной боли 23 Для купирования эпизодов ГБН следует применять препараты с обезболивающим действием (таб.6). Таблица 6. Лекарственные средства для купирования приступа ГБН Вещество Разовая доза, мг Уровень убедительности рекомендаций Нежелательные явления Ибупрофен** 400 А НПВП-гастропатия, риск кровотечения Кетопрофен** 25 А То же Ацетилсалициловая кислота** 500-1000 А То же Напроксен 550 В То же #Диклофенак** 12,5-25 мг В То же Парацетамол** 1000 С Менее выражены, чем у НПВП Другие анальгетики и антипиретики, содержащие кофеин B См. комментарии*  Рекомендуется для купирования эпизодов ГБН как препарат выбора ибупрофен ** 400 мг [17]. Уровень убедительности рекомендаций – А (уровень достоверности доказательств – 1).  Рекомендуется для купирования эпизодов ГБН как препарат выбора кетопрофен** 25 мг [18] Уровень убедительности рекомендаций – А (уровень достоверности доказательств – 1).  Рекомендуется для купирования эпизодов ГБН как препарат выбора ацетилсалициловая кислота** 500 - 1000 мг [19] Уровень убедительности рекомендаций – А (уровень достоверности доказательств – 1).  Рекомендуется для купирования эпизодов ГБН как препарат выбора напроксен 550 мг [20]. Уровень убедительности рекомендаций – В (уровень достоверности доказательств – 2). Комментарии: также часто применяется доза 500 мг однократно.  Рекомендуется для купирования эпизодов ГБН как препарат выбора #диклофенак** 12,5-25 мг в виде порошка для приготовления раствора для приема внутрь [21]. 24 Уровень убедительности рекомендаций – В (уровень достоверности доказательств – 2).  Рекомендуется для купирования эпизодов ГБН парацетамол**в дозе 1000 мг [22].  Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 1).  Рекомендуются для купирования эпизодов ГБН другие анальгетики и антипиретики, содержащие кофеин [20, 23, 24]. Уровень убедительности рекомендаций – В (уровень достоверности доказательств – 2).  Не рекомендуются для купирования эпизодов ГБН любые препараты, содержащие <mark class=\"hit\">метамизол<\/mark> натрия, в связи с высоким риском развития агранулоцитоза, агонисты серотониновых 5HT1-рецепторов (триптаны), опиоидные анальгетики, миорелаксанты, а также другие анальгетики и антипиретики, содержащие кодеин или барбитураты, в связи с высоким риском развития ЛИГБ [6, 8, 10, 36]. Уровень убедительности рекомендаций – С (уровень достоверности доказательств – 5). Комментарии: комбинация с кофеином повышает эффективность препаратов, содержащих ибупрофен [26] и парацетамол [20, 23 - 25], но, возможно, также увеличивает риск развития ЛИГБ у пациентов с ГБ. Поэтому комбинированные препараты, содержащие кофеин, имеют уровень рекомендаций B. При назначении пациентам с ГБ лекарственных препаратов, обладающих обезболивающим действием, необходимо использовать следующие принципы: 1. выбор лекарственного препарата с обезболивающим действием должен быть сделан на основании их эффективности и возможных побочных эффектов; 2. НПВП более эффективны, чем ацетилсалициловая кислота**, которая, в свою очередь, более эффективна, чем парацетамол**; 3. более быстрый эффект достигается при применении растворимых форм лекарственных препаратов, обладающих обезболивающим действием (ибупрофена**, кетопрофена**, ацетилсалициловой кислоты**). 4. применение НПВП возможно у пациентов с ЭГБН при частоте эпизодов ГБ не более 2 раз в неделю (до 10 болевых дней в месяц); при увеличении частоты использования этих средств их эффект снижается, и возникает риск развития ЛИГБ; 25 5. при использовании НПВП необходимо учитывать возможные побочные явления, в первую очередь, воздействие на желудочно-кишечный тракт и риск кровотечений; 6. использование комбинированных средств, содержащих ацетилсалициловую кислоту+кофеин+парацетамол более эффективно, чем монотерапия, однако при использовании этих препаратов более 8 дней в месяц возникает риск развития ЛИГБ. 3.3 Профилактическое лечение Профилактическая терапия ГБН направлена на уменьшение частоты ГБ, уменьшение числа принимаемых обезболивающих препаратов и повышение качества жизни пациента.  Рекомендуется профилактическая терапия у пациентов с частой эпизодической и хронической формами ГБН с целью уменьшения частоты дней с ГБ в месяц профилактическое лечение пациентам с М, у которых наблюдается 3 и более тяжёлых дезадаптирующих приступа ГБ в месяц при адекватном купировании приступов М или ≥ 8 дней с ГБ в месяц, а также пациентам с пролонгированной аурой, даже при небольшой частоте приступов [2, 9, 20, 74] посредством A25.23.001 Назначения лекарственных","terms":[{"source":"blacklist","term_id":"blacklist:f999e9e4fb26","canonical":"Анальгин","search_word":"Метамизол","host_word":"метамизол","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Анальгин","aliases":["Метамизол","Metamizole","Dipyrone"],"description":"имеет доказанную эффективность, но равно имеет и доказанную небезопасность (подробнее - тут). Вряд ли когда-нибудь выйдет из бана, поскольку имеет множество куда более безопасных альтернатив (ибупрофен, парацетамол, индометацин и пр.). Исследований хватает: Cochrane Reviews 2; Pubmed 200; FDA 0; RXlist 0; ВОЗ 0; ФК (-)."}},{"source":"blacklist","term_id":"blacklist:fc7c02eeb9a7","canonical":"Метамизол","search_word":"Метамизол","host_word":"метамизол","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"Метамизол","aliases":[],"description":"см. Анальгин."}}]},{"id":"block:94ac60f61a4f2eb3::case:2f7f8d656ebad874","block_id":"block:94ac60f61a4f2eb3","case_id":"case:2f7f8d656ebad874","label":"contraindication","model":{"  В схемах лечения туберкулеза в период беременности не должны применяться следующие препараты: деламанид**, аминогликозиды, <mark class=\"hit\">протионамид<\/mark>** (этионамид**) [149] и тиоуреидоиминометилпиридиния перхлорат**. При необходимости оптимизации режима лечения туберкулеза в соответствии со сведениями о лекарственной чувствительности возбудителя, препараты, которые были противопоказаны во время беременности (включая аминогликозиды), будут назначены после родоразрешения. 160 План ведения родов составляется совместно врачом-фтизиатром и акушеромгинекологом, а у ВИЧ-инфицированных женщин – с врачом-инфекционистом. Родильница, больная активным туберкулезом, должна быть переведена в туберкулезный стационар для лечения и наблюдения в послеродовом периоде. В течение 12 суток после родов родильнице необходимо выполнить рентгенологическое исследование органов грудной клетки для определения дальнейшей лечебной тактики. Шкала установления диагноза «Туберкулез» Степ ень Диагноз Описание Жалобы Анамнез Объ екти вное обсл едов ание Иммун одиагн остик а Рентген ологичес кие признаки Микробиологические и молекулярногенетические исследования Гистологи ческое исследован ие микроск опическо е культур альное молекулярногенетические 0 отсутс твует + + + - - - - - - 1 вероятн ый + + + + - - - - - 2 установ ленный + + + + + - - - - 3 верифиц ированн ый + + + + + + + + + «+» - наличие признака, «-» - отсутствие признака ● 0 - Диагноз отсутствует; ● 1 - Диагноз считается вероятным - имеются клинические признаки, подозрительные на туберкулез, и положительная проба с аллергеном туберкулезным рекомбинантным или другие положительные результаты исследования уровня интерферона-гамма на антигены Mycobacterium tuberculosis complex в крови; ● 2 - Диагноз считается установленным - имеются клинико-рентгенологические признаки заболевания, но отсутствует бактериовыделение и гистологическое подтверждение диагноза; ● 3 - Диагноз считается верифицированным - наряду с клинико-лабораторными и ре ендованы к использованию; highlighted host_word «гомеопатических» относится именно к запрещаемой/не рекомендуемой терапии.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"25_2","title":"Острая респираторная вирусная инфекция (ОРВИ)","link":"https://cr.minzdrav.gov.ru/view-cr/25_2","metadata":{"Название клинической рекомендации":"Острая респираторная вирусная инфекция (ОРВИ)","МКБ-10":"J00, J02.9, J04.0, J04.1, J04.2, J06.0, J06.9","Возрастная группа":"Дети","Разработчик":"Союз педиатров России","Дата размещения":"13.09.2022","Статус применения КР":"Применяется"}},"context_html":"день, &gt;40 кг – 75 мг (5 мл), в течение 5 дней или Занамивир детям с 5 лет по 2 ингаляции (всего 10 мг) 2 раза в день, 5 дней [20, 21, 104]. (Уровень убедительности рекомендаций B; уровень достоверности доказательств - 1). Комментарии: для достижения оптимального эффекта лечение должно быть начато при появлении первых симптомов заболевания. На другие вирусы, не содержащие нейраминидазы, данные препараты не действуют. Осельтамивир** и занамивир показали небольшое сокращение времени до начала 12 улучшения самочувствия при гриппе у взрослых. При применении осельтамивира** в постмаркетиноговом периоде показано увеличение риска тошноты, рвоты, психических расстройств у взрослых и рвоты у детей. Осельтамивир** не оказал протективного действия в отношении снижения смертности среди пациентов с гриппом 2009A / H1N1 [104]. При применении занамивира возможен бронхоспазм и другие аллергические реакции [105] Показано также развитие резистентности вирусов гриппа к ингибиторам нейраминидазы [106] При принятии решения об использовании ингибиторов нейраминидазы следует соблюдать осторожность и учитывать баланс между пользой и вредом. Однозначные данные, подтверждающие противовирусную эффективность и безопасность применения у детей других лекарственных препаратов, в том числе иммуномодуляторов со стимулирующим действием, получивших широкое распространение в РФ, в настоящее время отсутствуют, сокращение времени до улучшения самочувствия, по данным большинства публикаций, в пределах одного дня, в связи с чем не следует их рутинно применять всем пациентам с ОРИ [22 - 52].  Рекомендовано рассмотреть назначение не позднее 1-2-го дня болезни топических форм интерферона-альфа** с терапевтической целью, однако, надежных доказательств противовирусной эффективности и безопасности для детей у этих препаратов нет [53- 66]. (Уровень убедительности рекомендаций B; уровень достоверности доказательств - 2). Комментарии: При ОРВИ иногда рекомендуются интерфероногены (Прочие противовирусные препараты), но следует помнить, что при их применении лихорадочный период сокращается менее чем на 1 сутки, т.е. их применение при большинстве ОРВИ с коротким фебрильным периодом не оправдано [23]. Результаты исследований эффективности использования иммуномодуляторов при респираторных инфекциях, как правило, показывают малодостоверный эффект. Препараты интерферонов, рекомендованные для лечения более тяжелых инфекций, например, вирусных гепатитов, при ОРВИ не используются и не рекомендованы. Эффективность <mark class=\"hit\">гомеопат<\/mark>ических средств для лечения ОРВИ у детей не доказана [67]. 13  Не рекомендуется использование противомикробных препаратов системного действия для лечения неосложненных ОРВИ и гриппа, в т.ч. если заболевание сопровождается в первые 10-14 дней болезни риносинуситом, конъюнктивитом, ларингитом, крупом, бронхитом, бронхообструктивным синдромом [4, 68, 69]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 1). Комментарии: Антибактериальная терапия в случае неосложненной вирусной инфекции не только не предотвращает бактериальную суперинфекцию, но способствует ее развитию из-за подавления нормальной пневмотропной флоры, «сдерживающей агрессию» стафилококков и кишечной флоры. Антибиотики могут быть показаны детям с хронической патологией, затрагивающей бронхолегочную систему (например, муковисцидоз), иммунодефицитом, у которых есть риск обострения бактериального процесса; выбор антибиотика у них обычно предопределен заранее характером флоры.  Не рекомендуется повышенное потребление жидкости на фоне ОРВИ. Польза обильного выпаивания сомнительна, а повышение секреции антидиуретического гормона в период болезни, напротив, способствует задержке жидкости [70]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 2).  Рекомендуется проводить элиминационную терапию, т.к. данная терапия эффективна и безопасна. Введение в нос натрия хлорида (0,9%) или стерильного раствора морской воды несколько раз в день обеспечивает удаление слизи и восстановление работы мерцательного эпителия [4, 71]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 1). Комментарии: Вводить натрия хлорид (0,9%) лучше в положении лежа на спине с запрокинутой назад головой для орошения свода носоглотки и аденоидов. У маленьких детей с обильным отделяемым эффективна аспирация слизи из носа специальным ручным отсосом с последующим введением натрия хлорида (0,9%). Положение в кроватке с поднятым головным концом способствует отхождению слизи из носа. У старших детей оправданы спреи с солевым изотоническим раствором натрия хлорида. 14  Рекомендуется назначение местных препаратов, обладающих сосудосуживающим действием интраназально (группа АТХ «деконгестанты и другие препараты для местного применения») коротким курсом не более 5 дней. Данные препараты не укорачивают длительность насморка, но могут облегчить симптомы заложенности носа, а также восстановить функцию слуховой трубы. У детей 0-6 лет применяют фенилэфрин 0,125%, ок","terms":[{"source":"marker","term_id":"marker:1317684c67c8","canonical":"гомеопат","search_word":"гомеопат","host_word":"гомеопатических","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:c2a0b83f394e2251::case:692f1ccdc7c1f71e","block_id":"block:c2a0b83f394e2251","case_id":"case:692f1ccdc7c1f71e","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Это тот же host_word «метамизола» в контексте фразы «Не рекомендуется использование метамизола натрия у детей»; явное отрицательное назначение. Уровень и достоверность взяты из той же рекомендации.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"25_2","title":"Острая респираторная вирусная инфекция (ОРВИ)","link":"https://cr.minzdrav.gov.ru/view-cr/25_2","metadata":{"Название клинической рекомендации":"Острая респираторная вирусная инфекция (ОРВИ)","МКБ-10":"J00, J02.9, J04.0, J04.1, J04.2, J06.0, J06.9","Возрастная группа":"Дети","Разработчик":"Союз педиатров России","Дата размещения":"13.09.2022","Статус применения КР":"Применяется"}},"context_html":"уппы «деконгестанты и другие препараты для местного применения» в соответствии с инструкциями. Использование системных препаратов, содержащих деконгестанты (например, псевдоэфедрин, фенилэфрин) крайне нежелательно, лекарственные средства данной группы не должны применяться у детей до достижения возраста 12 лет [74].  Для снижения температуры тела лихорадящего ребенка рекомендуется раскрыть, обтереть водой Т° 25-30°С. [75, 77]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 1).  С целью снижения температуры тела у детей рекомендуются к применению только два препарата – парацетамол** до 60 мг/кг/сут или ибупрофен** до 30 мг/кг/сут вследствие доказанной безопасности [5, 73, 75, 77]. (Уровень убедительности рекомендаций C; уровень достоверности доказательств - 5). Комментарии: Жаропонижающие препараты у здоровых детей ≥3 месяцев оправданы при температуре выше 39 - 39,5°С. При менее выраженной лихорадке (38-38,5°С) средства, снижающие температуру, показаны детям до 3 месяцев, пациентам с хронической патологией, а также при связанном с температурой дискомфорте. Регулярный (курсовой) прием жаропонижающих нежелателен, повторную дозу вводят только после нового повышения температуры [5, 14, 73]. Парацетамол** и ибупрофен** могут применяться внутрь или в форме 15 ректальных суппозиториев, существует также парацетамол для внутривенного введения. Если с лихорадкой справиться не удается, рассмотрите постепенный переход с одного жаропонижающего лекарственного препарата на другой, продолжив монотерапию. Чередование этих двух антипиретиков или применение комбинированных препаратов не имеет существенных преимуществ перед монотерапией одним из этих лекарственных средств [78]. Необходимо помнить, что самая главная проблема при лихорадке - вовремя распознать бактериальную инфекцию. Таким образом, диагностика тяжелой бактериальной инфекции гораздо важнее борьбы с лихорадкой. Применение жаропонижающих вместе с антибиотиками чревато маскировкой неэффективности последних.  У детей с жаропонижающей целью не рекомендуется применять ацетилсалициловую кислоту** в связи с высоким риском развития нежелательных реакций [75, 107]. (Уровень убедительности рекомендаций C; уровень достоверности доказательств - 5).  У детей с жаропонижающей целью не рекомендуется применять нимесулид в связи с вероятным риском развития нежелательных реакций [76]. (Уровень убедительности рекомендаций С; уровень достоверности доказательств - 4)  Не рекомендуется использование <mark class=\"hit\">метамизол<\/mark>а натрия у детей в связи с высоким риском развития агранулоцитоза [79, 80]. (Уровень убедительности рекомендаций C; уровень достоверности доказательств - 5). Комментарий: Во многих странах мира метамизол натрия запрещен к применению уже более 50 лет назад.  Рекомендуется рассмотреть назначение теплого питья или, после 4 лет, использование леденцов или пастилок, содержащих антисептические препараты для устранения кашля при фарингите, который связан с «першением в горле» из-за воспаления слизистой оболочки глотки или ее пересыхания при дыхании ртом [108, 16 109, 110]. (Уровень убедительности рекомендаций С; уровень достоверности доказательств - 5). Комментарии: имеются сообщения о возможности облегчения симптомов с помощью данных вмешательств, однако в настоящее время недостаточно доказательств для однозначных выводов.  Противокашлевые, отхаркивающие, муколитические препараты в том числе многочисленные патентованные препараты с различными растительными средствами, не рекомендуются для использования при ОРВИ ввиду неэффективности [81, 82]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 2). Комментарии: При сухом навязчивом кашле у ребенка с фарингитом или ларинготрахеитом иногда удается достигнуть хороший клинический эффект при использовании бутамирата, однако доказательная база по применению противокашлевых препаратов отсутствует [81].  Ингаляции паровые и аэрозольные не рекомендованы к использованию, т.к. не показали эффекта в рандомизированных исследованиях, а также не рекомендованы Всемирной организацией здравоохранения (ВОЗ) для лечения ОРВИ [83, 84]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 1).  Антигистаминные средства системного действия (1-го поколения), обладающие атропиноподобным действием, не рекомендованы для использования у детей: они обладают неблагоприятным терапевтическим профилем, имеют выраженные седативный и антихолинергический побочные эффекты, нарушают когнитивные функции (концентрацию внимания, память и способность к обучению). В рандомизированных исследованиях препараты данной группы не показали эффективности в уменьшении симптомов ринита [81, 85]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 1).  Не рекомендуется всем детям с ОРВИ назначать аскорбиновую кислоту так как при терапевтическом приеме после появления симптомов болезни высокие дозы аскорбиновой кислоты не показали явного улучшения в состоянии [86, 111]. 17 (Уровень убеди","terms":[{"source":"blacklist","term_id":"blacklist:f999e9e4fb26","canonical" block:140637b53ac326a7","case_id":"case:e29033ea10f94b74","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"В контексте фразы «не доказана ... эффективность ... гомеопатических препаратов» это упоминание гомеопатии как не рекомендованной/не имеющей доказанной эффективности профилактики ОРВИ.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"25_2","title":"Острая респираторная вирусная инфекция (ОРВИ)","link":"https://cr.minzdrav.gov.ru/view-cr/25_2","metadata":{"Название клинической рекомендации":"Острая респираторная вирусная инфекция (ОРВИ)","МКБ-10":"J00, J02.9, J04.0, J04.1, J04.2, J06.0, J06.9","Возрастная группа":"Дети","Разработчик":"Союз педиатров России","Дата размещения":"13.09.2022","Статус применения КР":"Применяется"}},"context_html":"ежима, соответствующая обработка фонендоскопов, отоскопов, использование одноразовых полотенец, в детских учреждениях – быстрая изоляция заболевших детей, соблюдение режима проветривания [87]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 3).  Профилактика большинства вирусных инфекций остается сегодня неспецифической, поскольку вакцин против всех респираторных вирусов пока нет. Вместе с тем рекомендуется ежегодная вакцинация против гриппа с возраста 6 мес, которая снижает заболеваемость [88, 89]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 2). Комментарии: Доказано, что вакцинация детей от гриппа и пневмококковой инфекции снижает риск развития острого среднего отита у детей, т.е. уменьшает вероятность осложненного течения ОРВИ [90, 91].  У детей первого года жизни из групп риска (недоношенность, бронхолегочная дисплазия для профилактики РС-вирусной инфекции в осенне-зимний сезон 18 рекомендована пассивная иммунизация паливизумабом**, препарат вводится внутримышечно в дозе 15 мг/кг ежемесячно 1 раз в месяц с ноября по март [92, 93]. (Уровень убедительности рекомендаций C; уровень достоверности доказательств - 5).  У детей до 2-х лет с гемодинамически значимыми врожденными пороками сердца для профилактики РС-вирусной инфекции в осенне-зимний сезон рекомендована пассивная иммунизация паливизумабом**, препарат вводится внутримышечно в дозе 15 мг/кг ежемесячно 1 раз в месяц с ноября по март [92, 93]. (Уровень убедительности рекомендаций C; уровень достоверности доказательств - 5). Комментарий: см. клинические рекомендации по оказанию медицинской помощи детям с бронхолегочной дисплазией, КР по иммунопрофилактике респираторносинцитиальной вирусной инфекции у детей.  Детям старше 6 мес с рецидивирующими инфекциями ЛОР-органов и дыхательных путей рекомендуется применение других иммуностимуляторов (системных бактериальных лизатов). Эти препараты, вероятно, могут сократить заболеваемость респираторными инфекциями, хотя доказательная база у них не велика [94, 95, 96]. (Уровень убедительности рекомендаций A; уровень достоверности доказательств - 1).  Не рекомендуется рутинное использование иммуномодуляторов с целью профилактики острых респираторно-вирусных инфекций, т.к. надежных свидетельств о снижении респираторной заболеваемости под влиянием различных иммуномодуляторов – нет [97]. Не доказана также профилактическая эффективность растительных препаратов [98, 99, 100] и аскорбиновой кислоты [86], <mark class=\"hit\">гомеопат<\/mark>ических препаратов [101]. (Уровень убедительности рекомендаций С; уровень достоверности доказательств - 5). 6. Организация оказания медицинской помощи Ребенок при ОРВИ обычно наблюдается в амбулаторно-поликлинических условиях врачом педиатром. Режим общий или полупостельный с быстрым переходом на общий после 19 снижения температуры. Повторный осмотр необходим при сохранении температуры более 3 дней или ухудшении состояния. Стационарное лечение (госпитализация) может потребоваться при развитии осложнений и длительной фебрильной лихорадке. Должны быть госпитализированы в стационар: - дети до 3-х месяцев с фебрильной лихорадкой в связи с высоким риском развития у них тяжелой бактериальной инфекции [102]. - дети любого возраста при наличии любого из следующих симптомов (основные опасные признаки): неспособность пить / сосать грудь; сонливость или отсутствие сознания; частота дыхания менее 30 в минуту или апноэ; симптомы респираторного дистресса; центральный цианоз; явления сердечной недостаточности; тяжелое обезвоживание [102]. - дети со сложными фебрильными судорогами (продолжительностью более 15 минут и/или повторяющиеся более одного раза в течение 24 часов) госпитализируются на весь период лихорадки. - дети с фебрильной лихорадкой и подозрением на тяжелую бактериальную инфекцию (НО может быть и гипотермия!), имеющие следующие сопутствующие симптомы: вялость, сонливость; отказ от еды и питья; геморрагическая сыпь на коже; рвота. - дети с явлениями дыхательной недостаточности, имеющие какие-либо из следующих симптомов: кряхтящее дыхание, раздувание крыльев носа при дыхании, кивательные движения (движения головы, синхронизированные со вдохом); частота дыхательных движений у ребенка до 2-х месяцев &gt; 60 в минуту, у ребенка в возрасте 2-11 месяцев &gt; 50 в минуту, у ребенка старше 1 года &gt; 40 в минуту; втяжение нижней части грудной клетки при дыхании; насыщение крови кислородом &lt; 92% при дыхании комнатным воздухом [102]. Средняя длительность нахождения в стационаре может составить 3-7 дней в зависимости от нозологической формы осложнения и тяжести состояния. Госпитализация детей с назофарингитом, ларингитом, трахеобронхитом без сопутствующих опасных признаков нецелесообразна. Фебрильная лихорадка при отсутствии других патологических симптомов у детей старше 3-х мес не является показанием для госпитализации в стационар. Дети с простыми фебрильными судорогами (продолжительностью до 15 минут, однократно в течение суток), завершившимися к моменту обращения в стационар,","terms":[{"source":"marker","term_id":"marker:1317684c67c8","canonical":"гомеопат","search_word":"гомеопат","host_word":"гомеопатических","inside_word":true,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:88c7a530931834fc::case:f21407135264a14c","block_id":"block:88c7a530931834fc","case_id":"case:f21407135264a14c","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте фразы «крайне нежелательно использование метамизола у детей» это прямо запрещаемое/не рекомендуемое применение.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"25_2","title":"Острая респираторная вирусная инфекция (ОРВИ)","link":"https://cr.minzdrav.gov.ru/view-cr/25_2","metadata":{"Название клинической рекомендации":"Острая респираторная вирусная инфекция (ОРВИ)","МКБ-10":"J00, J02.9, J04.0, J04.1, J04.2, J06.0, J06.9","Возрастная группа":"Дети","Разработчик":"Союз педиатров России","Дата размещения":"13.09.2022","Статус применения КР":"Применяется"}},"context_html":"ная инфекция) – наиболее часто встречающееся заболевание у детей. Причина заболевания – разнообразные вирусы. Заболевание чаще развивается осенью, зимой и ранней весной. Как заражаются инфекцией, вызывающей ОРВИ: чаще всего путем попадания на слизистую оболочку носа или конъюнктиву с рук, загрязненных при контакте с заболевшим (например, через рукопожатие) или с зараженными вирусом поверхностями (риновирус сохраняется на них до суток). Другой путь – воздушно-капельный – при вдыхании частичек слюны, выделяющихся при чихании, кашле или при тесном контакте с заболевшим. Период от заражения до начала болезни: в большинстве случаев – от 2-х до 7 дней. Выделение вирусов больным (заразность для окружающих) максимально на 3-и сутки после заражения, резко снижается к 5-му дню; неинтенсивное выделение вируса может сохраняться до 2 недель. Признаки ОРВИ: наиболее частым проявлением ОРВИ у детей является заложенность носа, а также выделения из носа: прозрачные и/или белого и/или желтого и/или зеленого цвета (появление выделений из носа желтого или зеленого цвета – не является признаком присоединения бактериальной инфекции!). Повышение температуры чаще длится не более 3 дней, затем температура тела снижается. При некоторых инфекциях (грипп и аденовирусная инфекция) температура выше 38ºC сохраняется более длительно (до 5-7 дней). При ОРВИ также могут быть: першение в горле, кашель, покраснение глаз, чихание. Обследования: в большинстве случаев, дополнительных обследований ребенку с ОРВИ не требуется Лечение: ОРВИ, в большинстве случаев, носит доброкачественный характер, разрешается в течение 10 дней и не всегда требует назначения медикаментов. Снижение температуры: лихорадящего ребенка следует раскрыть, обтереть водой Т° 25-30°С. С целью снижения температуры у детей допустимо применение только 2-х препаратов – парацетамола или ибупрофена. Жаропонижающие препараты у здоровых детей ≥3 месяцев оправданы при температуре выше 39 - 39,5°С. При менее выраженной лихорадке (38-38,5°С) средства, снижающие температуру, показаны детям до 3 месяцев, пациентам с хронической патологией, а также при связанном с температурой дискомфорте. Регулярный (курсовой) прием жаропонижающих нежелателен, повторную 40 дозу вводят только после нового повышения температуры. Чередование этих двух препаратов или применение их в комбинации не приводит к усилению жаропонижающего эффекта. У детей с жаропонижающей целью не применяют ацетилсалициловую кислоту** и нимесулид. Крайне нежелательно использование <mark class=\"hit\">метамизол<\/mark>а у детей в связи с высоким риском развития агранулоцитоза. Во многих странах мира метамизол запрещен к применению уже более 50 лет назад. Антибиотики – не действуют на вирусы (основную причину ОРВИ). Вопрос о назначении антибиотиков рассматривается при подозрении на бактериальную инфекцию. Антибиотики должен назначать врач. Бесконтрольный прием антибиотиков может способствовать развитию устойчивых к ним микробов и вызывать осложнения. Как предупредить развитие ОРВИ: Заболевшего ребенка следует оставить дома (не водить в детский сад или школу). Первостепенное значение имеют меры, препятствующие распространению вирусов: тщательное мытье рук после контакта с заболевшим м. Важно также ношение масок, мытье поверхностей в окружении заболевшего, соблюдение режима проветривания. Ежегодная вакцинация против гриппа с возраста 6 мес снижает риск этой инфекции. Доказано также, что вакцинация детей от гриппа и пневмококковой инфекции уменьшает вероятность развития острого среднего отита у детей и осложненного течения ОРВИ. Надежных свидетельств о снижении респираторной заболеваемости под влиянием различных иммуномодуляторов - нет. Не доказана также профилактическая эффективность растительных препаратов и витамина С, гомеопатических препаратов. Обратитесь к специалисту если: - ребенок длительное время отказывается от питья - вы видите изменения в поведении: раздражительность, необычная сонливость со снижением реакции на попытки контакта с ребенком - у ребенка имеется затруднение дыхания, шумное дыхание, учащение дыхания, втяжение межреберных промежутков, яремной ямки (места, расположенного спереди между шеей и грудью) - у ребенка судороги на фоне повышенной температуры - у ребенка бред на фоне повышенной температуры - повышенная температура тела (более 38,4-38,5ºC) сохраняется более 3 дней - заложенность носа сохраняется без улучшения более 10-14 дней, особенно если при этом вы видите «вторую волну» повышения температуры тела и/или ухудшение состояния 41 ребенка - у ребенка есть боль в ухе и/или выделения из уха - у ребенка кашель, длящийся более 10-14 дней без улучшения 42 Приложение Г. Расшифровка примечаний …** – лекарственный препарат, входящий в Перечень жизненно необходимых и важнейших лекарственных препаратов для медицинского применения на 2021 год (Распоряжение Правительства РФ от 12.10.2019 № 2406-р, от 23 ноября 2020 г. № 3073-р)","terms":[{"source":"blacklist","term_id":"blacklist:f99 ней весной. Как заражаются инфекцией, вызывающей ОРВИ: чаще всего путем попадания на слизистую оболочку носа или конъюнктиву с рук, загрязненных при контакте с заболевшим (например, через рукопожатие) или с зараженными вирусом поверхностями (риновирус сохраняется на них до суток). Другой путь – воздушно-капельный – при вдыхании частичек слюны, выделяющихся при чихании, кашле или при тесном контакте с заболевшим. Период от заражения до начала болезни: в большинстве случаев – от 2-х до 7 дней. Выделение вирусов больным (заразность для окружающих) максимально на 3-и сутки после заражения, резко снижается к 5-му дню; неинтенсивное выделение вируса может сохраняться до 2 недель. Признаки ОРВИ: наиболее частым проявлением ОРВИ у детей является заложенность носа, а также выделения из носа: прозрачные и/или белого и/или желтого и/или зеленого цвета (появление выделений из носа желтого или зеленого цвета – не является признаком присоединения бактериальной инфекции!). Повышение температуры чаще длится не более 3 дней, затем температура тела снижается. При некоторых инфекциях (грипп и аденовирусная инфекция) температура выше 38ºC сохраняется более длительно (до 5-7 дней). При ОРВИ также могут быть: першение в горле, кашель, покраснение глаз, чихание. Обследования: в большинстве случаев, дополнительных обследований ребенку с ОРВИ не требуется Лечение: ОРВИ, в большинстве случаев, носит доброкачественный характер, разрешается в течение 10 дней и не всегда требует назначения медикаментов. Снижение температуры: лихорадящего ребенка следует раскрыть, обтереть водой Т° 25-30°С. С целью снижения температуры у детей допустимо применение только 2-х препаратов – парацетамола или ибупрофена. Жаропонижающие препараты у здоровых детей ≥3 месяцев оправданы при температуре выше 39 - 39,5°С. При менее выраженной лихорадке (38-38,5°С) средства, снижающие температуру, показаны детям до 3 месяцев, пациентам с хронической патологией, а также при связанном с температурой дискомфорте. Регулярный (к l":null,"reason":"«Гомеопатия» прямо перечислена среди методов, применение которых не рекомендуется при АР.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"261_2","title":"Аллергический ринит","link":"https://cr.minzdrav.gov.ru/view-cr/261_2","metadata":{"Название клинической рекомендации":"Аллергический ринит","МКБ-10":"J30.1, J30.2, J30.3, J30.4","Возрастная группа":"Взрослые, дети","Разработчик":"Российская ассоциация аллергологов и клинических иммунологов, Союз педиатров России, Национальная медицинская ассоциация оториноларингологов","Дата размещения":"11.07.2024","Статус применения КР":"Применяется"}},"context_html":"ьев, злаковых трав, сорных трав, домашней пыли, клещей рода Dermatophagoides для подкожной АСИТ; • аллергоиды, полученные путем полимеризации аллергена формальдегидом или карбамелированием; • аллергены пыльцы деревьев, злаков, клещей домашней пыли, адсорбированные на суспензии фосфата кальция или гидроокиси алюминия, для подкожной АСИТ; • аллергены пыльцы березы, злаковых трав, амброзии, клещей домашней пыли для сублингвального применения. Протоколы/схемы АСИТ не являются универсальными – они уникальны для каждого метода и препарата. Различия в схемах обусловлены различиями в химических и терапевтических свойствах препарата. Как правило, протокол проведения АСИТ включает два этапа: 1 этап – этап достижения максимальной терапевтической дозы (наращивания); 2 этап – этап поддерживающей терапии (фаза основной терапии). Протоколы некоторых современных лечебных аллергенов не предусматривают фазу наращивания дозы, лечение начинается сразу с поддерживающей дозы аллергена [44]. В зависимости от длительности протокола АСИТ может быть: предсезонной, предсезонно-сезонной и круглогодичной. Наличие показаний и противопоказаний к АСИТ, выбор лечебного аллергена, назначение АСИТ проводит врач аллерголог-иммунолог в соответствии с инструкцией к выбранному лечебному аллергену и методическими рекомендациями по проведению АСИТ [2, 44]. Для оценки эффективности оценивают выраженность симптомов и потребность в медикаментах на исходном этапе обращения и после проведения АСИТ с помощью Шкалы оценки назальных симптомов ринита с учетом потребности в медикаментах [151]. 3.4 Хирургическое лечение 39 Хирургическое вмешательство при АР проводят при наличии у пациента сопутствующей патологии. Показание к хирургическому вмешательству у пациентов с АР с назальной обструкцией определяет оториноларинголог на основании результатов клинического (в том числе эндоскопического обследования полости носа и носоглотки) и рентгенологического обследования пациента [2, 4, 7, 152, 153]. Решение о необходимости хирургического вмешательства, предоперационной подготовке и послеоперационному ведению принимает врач-оториноларинголог, на основании клинических рекомендаций по ведению соответствующего заболевания/состояния. Не рекомендовано проведение планового хирургического лечения в сезон пыления причинно-значимых аллергенов. 3.5 Методы нетрадиционной и альтернативной медицины В связи с отсутствием доказательств положительного клинического влияния на течение АР не рекомендуется применение таких методов как <mark class=\"hit\">гомеопатия<\/mark>, фитотерапия, гипноз, техники релаксации, применение ионизаторов воздуха, физиотерапия [2, 4, 7]. • Рекомендуется пациентам с АР рассмотреть вопрос о целесообразности назначения иглоукалывания (акупунктуры) в комплексной терапии с целью уменьшения выраженности симптомов АР [7, 154, 155]. Уровень убедительности рекомендаций – А (уровень достоверности доказательств – 1) Комментарии: Систематический обзор и мета-анализ 13 рандомизированных клинических исследований, включающих 2365 пациентов, в том числе 1265 человек в группе активного лечения продемонстрировал снижение выраженности назальных симптомов и улучшение качества жизни на фоне данного вида терапии [7, 154, 155]. 3.6 Особенности лечения АР у детей АР наиболее распространен у детей школьного возраста. В детской практике предлагается придерживаться тех же подходов к лечению АР, что и у взрослых [2, 4, 7 35-37, 57, 97, 115, 125, 133, 156-160]; однако, при диагностике и терапии необходимо учитывать особенности физиологии и анатомии детского возраста. В выборе терапии необходимо руководствоваться принципами безопасности, действующим законодательством и утвержденными инструкциями к применению. Отдельное внимание следует уделять проведению элиминационных мероприятий (по показаниям - применению препаратов для увлажнения, очищения и защиты слизистой 40 оболочки носа (прочие назальные препараты, код АТХ R01AX10) - изотонических солевых растворов или барьерных средств на основе микрокристаллической целлюлозы - топических сорбентов), минимизируя медикаментозное воздействие [137]. В связи с отсутствием клинических испытаний у детей младших возрастных групп существуют определенные ограничения в назначении некоторых препаратов. Антигистаминные средства системного действия. У детей симптомы АР могут отразиться на когнитивной функции и учебе в школе, которые под влиянием антигистаминных средств системного действия с седативным эффектом (препаратов первого поколения) могут еще более ухудшиться. Спектр нежелательных явлений (НЯ) данных препаратов характеризуется негативным влиянием на когнитивную сферу – восприятие, внимание, образное мышление, память, аналитико-синтетические процессы, психомоторную деятельность, вероятностное прогнозирование, мелкую моторику, и в целом на качество жизни. Кроме того, такие НЯ как изменение структуры сна (угнетение REM-фазы сна), развитие обструктивных апноэ во сне и дневная сонливость, также могут привести к снижению способности к обучению, развитию социальной дезадаптации, нарушению когнитивного развития [93-94]. Особенности регистрации препаратов обусловили ограничение","terms":[{"source":"marker","term_id":"marker:1751b006fe4a","canonical":"гомеопатия","search_word":"гомеопатия","host_word":"гомеопатия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","at
