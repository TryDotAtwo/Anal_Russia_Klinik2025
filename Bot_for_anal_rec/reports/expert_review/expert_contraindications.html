лективные бета2-адреномиметики (АТХ R03AC), Антихолинергические средства (АТХ R03BB). Адренергические средства в комбинации с антихолинергическими средствами (АТХ R03AL) Большое значение имеет быстрота начала и продолжительность бронхолитического действия препарата, а также выраженность и длительность бронхопротективного действия. Терапия назначается индивидуально в зависимости от выраженности нарушения. Если у пациента выявляется гиперреактивность бронхов или обратимая бронхиальная обструкция, то лечение начинается с монотерапии одним из препаратов группы селективных бета2-адреномиметиков или антихолинергических[ средств. Предпочтение отдается препаратам длительного (пролонгированного) действия. При выраженной бронхиальной обструкции или при неэффективности применения монотерапии целесообразно назначение комбинации адренергических средств в комбинации с антихолинергическими средствами. Предпочтение отдается фиксированным комбинациям препаратов. У лиц с ранее выявленной ХОБЛ и получавших бронхолитическую терапию в виде монотерапии стоит ее усилить за счет перевода на фиксированную комбинацию. Рекомендуемая продолжительность лечения составляет 13 мес. с последующей повторной оценкой функционального состояния легких и клинических симптомов с целью выявления бронхолегочных нарушений или ХОБЛ, требующих дальнейшего продолжения бронхолитической терапии. • Не рекомендуется для лечения зависимости от табака и никотинсодержащих продуктов использовать средства аверсивной терапии (средства для полоскания рта, меняющие вкус дыма сигарет), а также методы лечения без доказанной эффективности (иглорефлексотерапия, гипноз, нормобарическая гипокситерапия, краниальная электростимуляция, фитотерапия, <mark class=\"hit\">гомеопатия<\/mark> и пр.) [32-37]. Уровень убедительности рекомендаций В (Уровень достоверности доказательств -3) • Не рекомендуется использовать бездымные табачные изделия и электронные сигареты в качестве стратегии лечения табачной зависимости, так как нет научно обоснованных 21 доказательств их влияния на здоровье [38, 39] Уровень убедительности рекомендаций В (Уровень достоверности доказательств -2) 4. Медицинская реабилитация и санаторно-курортное лечение, медицинские показания и противопоказания к применению методов медицинской реабилитации, в том числе основанных на использовании природных лечебных факторов Для данного заболевания реабилитация не требуется. 5. Профилактика и диспансерное наблюдение, медицинские показания и противопоказания к применению методов профилактики Диспансерное наблюдение для данного заболевания не требуется. Профилактика при данном заболевании должна быть направлена на предотвращение возобновления потребления табака/никотина и проводиться, как с самим пациентом, так и с его ближайшим окружением. После окончания курса лечения целесообразно проведение профилактической беседы, в том числе рассмотреть триггеры, которые ранее приводили к потреблению табака или никотина, с целью предотвращения рецидива или срыва. 6. Организация оказания медицинской помощи Лечащий врач обязан дать пациенту, обратившемуся за оказанием медицинской помощи в медицинскую организацию независимо от причины обращения, рекомендации о прекращении потребления табака или потребления никотинсодержащей продукции и предоставить необходимую информацию о медицинской помощи, которая может быть 4 оказана4. На амбулаторном уровне врачи всех специальностей должны опросить пациента об употреблении табачной и/или никотинсодержащей продукции, выявить наличие заболевания, установить диагноз и внести всю информацию в медицинскую документацию пациента. Пример листка-вкладыша в медицинскую документацию приведен в Приложении Г2. 4 Приказ Минздрава России от 26 февраля 2021 г. № 104н «Порядок оказания медицинской помощи взрослому населению по прекращению потребления табака или потребления никотинсодержащей продукции, лечению табачной (никотиновой) зависимости, последствий потребления табака или потребления никотинсодержащей продукции» 22 При выявлении заболевания врач должен провести короткую беседу (раздел 3.2.2). При слабой мотивации пациента врач должен проводить повторные короткие беседы при каждом визите пациента. При высокой степени мотивации к отказу от табака/никотина врач должен либо с","terms":[{"source":"marker","term_id":"marker:1751b006fe4a","canonical":"гомеопатия","search_word":"гомеопатия","host_word":"гомеопатия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:95548e63068d9a15::case:bc6bb02f8a49b352","block_id":"block:95548e63068d9a15","case_id":"case:bc6bb02f8a49b352","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте указано, что при некоторых заболеваниях применение ноотропов может спровоцировать ускоренный рост опухоли; это запрет/нежелательность применения для данного контекста.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"609_2","title":"Потеря слуха, вызванная шумом","link":"https://cr.minzdrav.gov.ru/view-cr/609_2","metadata":{"Название клинической рекомендации":"Потеря слуха, вызванная шумом","МКБ-10":"H83.3, Z57.0","Возрастная группа":"Взрослые","Разработчик":"Национальная медицинская ассоциация оториноларингологов, Ассоциация врачей и специалистов медицины труда, Национальная медицинская ассоциация сурдологов","Дата размещения":"15.03.2024","Статус применения КР":"Применяется"}},"context_html":"альная /нейрсенсорная тугоухость первой степени «А»), Заболевание профессиональное, установлено впервые (подтверждено или изменено). «Трудоспособен в 80 профессии при условии динамического наблюдения в центре профпатологии 1 раз в год». -МКБ-Х (Н83.3). Разработана ИПР слуха. 3. Потеря слуха, вызванная шумом (хроническая двусторонняя сенсоневральная /нейрсенсорная тугоухость первой степени «Б»). Заболевание профессиональное, установлено впервые (подтверждено или изменено). «Трудоспособен в профессии при условии динамического наблюдения в центре профпатологии 2 раза в год. Работник информирован о повышении риска нарушения здоровья при продолжении работы в условиях шума, превышающего ПДУ (80 дБА)». -МКБ-Х (Н83.3). Разработана ИПР слуха. 4. Потеря слуха, вызванная шумом (хроническая двусторонняя сенсоневральная /нейрсенсорная тугоухость второй (и выше) степени). Заболевание профессиональное, установлено впервые (подтверждено или изменено). Противопоказана работа в контакте с шумом, уровни которого превышают ПДУ (80 дБА). Показано направление на МСЭ. Дальнейшее наблюдение и лечение по месту жительства или прикрепления. Решение ВК оформляется в виде протокола с указанием впервые установленного (подтверждённого или измененного) заключительного диагноза профессионального заболевания органа слуха. Комиссия в обязательном порядке составляет мотивированное обоснование принятого решения. В протоколе ВК, независимо от принятого решения, указываются лечебно-профилактические мероприятия, необходимые для профилактики прогрессирования нарушений слуха, составляется ИПР слуха, даются трудовые рекомендации. При установлении заключительного диагноза профессионального заболевания органа слуха направляется извещение в территориальное учреждение Рспотребнадзора, работодателю, страховщику и в учреждение здравоохранения, направившее больного. Вопросы дальнейшей профпригодности и размеров материальной компенсации по профессиональному заболеванию решаются в рамках учреждений МСЭ. 81 Приложение В. Информация для пациента При первом обращении пациента с жалобой на шум в ушах, в голове или снижение слуха он должен быть информирован о важности проведения полноценного диагностического этапа, так как эти жалобы могут быть проявлением самых разных заболеваний. Упорное лечение без проведения мероприятий дифференциальной диагностики может быть ошибочным (так при лечении некоторых заболеваний, сопровождающихся шумом в ушах или снижением слуха (невринома слухового нерва), применение витаминов, <mark class=\"hit\">ноотроп<\/mark>ов, физиотерапии может спровоцировать ускоренный рост опухоли). Составляется план обследования с привлечением разных специалистов на основании сбора жалоб и анамнеза заболевания. После проведения комплексного аудиологического обследования, в случае выявления поражения определенного уровня слуховой системы, назначается дополнительные методы исследования для верификации диагноза. В соответствии с установленной нозологической формой предлагается план лечения и реабилитации. Применение методов визуализации (в первую очередь КТ и МРТ височных костей и головного мозга, позволяет исключить развитие заболеваний, требующих лечения у специалистов другого профиля (нейрохирурги, неврологи). Результаты обследования и консультаций смежных специалистов определяют показания к медикаментозному лечению развивающейся патологии слухового анализатора, проводится беседа о принятии индивидуальных мер снижения риска воздействия шума на организм. С пациентом также обсуждаются вопросы перспективы лечения, возможных побочных эффектов и важность выполнения ИПР слуха. 82 Приложение Г1-Г1Ч. Шкалы оценки, вопросники и другие оценочные инструменты состояния пациента, приведенные в клинических рекомендациях Оригинальное название: Приложение Г1. Метод определения группового избыточного риска потерь слуха от шума для обоснования мер профилактики Источники: 41-44 Тип Расчётный метод определения группового избыточного риска потерь слуха от шума по следующим исходным данным: - пол, - возраст, - стаж работы, - стажевая экспозиция шума (эквивалентный уровень уровня звука А). Назначение Определение группового избыточного риска потерь слуха от воздействия шума для обоснования конкретных мер первичной профилактики нарушений слуховой функции. Содержание (шаблон): Применение математических моделей прогнозирования действия производственных виброакустических факторов на здоровье работников на «шумоопасном» производстве позволяет оценить риск развития нарушений слуха от воздействия шума и своевременно осуществлять профилактические меры, направленные на сохранение и укрепление здоровья работников. Вероятность потери слуха, вызванной шумом, определяет атрибутивный или избыточный риск повреждения органа слуха, который численно равен разности абсолютных рисков в однородных популяционных группах лиц подверженных и неподверженных действию шума [41, 42]. Величина избыточного риска потерь слуха от шума в однородной популяционной группе (пол, возраст, стаж, стажевая экспозиция шума) по заданным показателям и кри","terms":[{"source":"mediq","term_id":"mediq:df3ec7903a9b","canonical":"Ноотроп","search_word":"Ноотроп","host_word":"ноотропов","inside_word":true,"mediq":{"name":"Ноотроп","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:13b6b3e6c6242d5d::case:81ae85e60c5328d9","block_id":"block:13b6b3e6c6242d5d","case_id":"case:81ae85e60c5328d9","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Мануальная терапия прямо указана как категорически не рекомендуемая пациентам с патологическими переломами тел позвонков на фоне остеопороза.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"614_2","title":"Патологические переломы, осложняющие остеопороз","link":"https://cr.minzdrav.gov.ru/view-cr/614_2","metadata":{"Название клинической рекомендации":"Патологические переломы, осложняющие остеопороз","МКБ-10":"M80.0, M80.1, M80.2, M80.3, M80.4, M80.5, M80.8, M80.9","Возрастная группа":"Взрослые","Разработчик":"Российская ассоциация эндокринологов, Ассоциация травматологов-ортопедов России, Ассоциация ревмоортопедов","Дата размещения":"11.05.2022","Статус применения КР":"Применяется"}},"context_html":"огу [174]. Уровень убедительности рекомендации С (уровень достоверности доказательств 5) Комментарии: для уменьшения психологических проблем, связанных с хроническим болевым синдромом, используются антидепрессанты [174], которые сами могут влиять на метаболизм костной ткани. Взаимосвязь «остеопороз» и «антидепрессанты» требует дальнейшего изучения [174].  При переломах тел позвонков, осложняющих течение остеопороза, постельный режим рекомендуется на срок не более 3 дней с последующей вертикализацией в корсете и отдыхом в постели в течение дня (для купирования боли) через каждые 2–3 часа [169, 171, 175]. Уровень убедительности рекомендации C (уровень достоверности доказательств 5)  При переломах тел позвонков на фоне остеопороза корсеты (ортезы) рекомендуются на длительный период для ношения в течение всего дня с целью разгрузки позвоночника, так как корсеты повышают внутрибрюшное давление или создают выпрямляющую силу за счет трехточечной фиксации [175, 171]. Уровень убедительности рекомендации А (уровень достоверности доказательств 2) Комментарии: корсет при переломах тел позвонков на фоне остеопороза уменьшает болевой синдром не только благодаря ограничению подвижности фиксируемого отдела позвоночника и блокирования переразгибания кзади, но и за счет повышения внутрибрюшного давления, что разгружает тела позвонков и, тем самым, не только уменьшает боль, но и позволяет предотвратить риск новых переломов, способствует раннему восстановлению физической активности [175, 176, 171]. 33 Ношение корсета в течение всего дня не приводит к атрофии мышц при условии ежедневной ходьбы не менее 1,5–2 ч в день и ежедневной ЛФК без осевой нагрузки [170, 175].  При выборе корсета рекомендуется принимать во внимание уровень перелома, степень компрессии, выраженность болевого синдрома, общую физическую активность и эмоциональное состояние пациента [175, 171]. Уровень убедительности рекомендации А (уровень достоверности доказательств 2)  При переломах тел поясничного отдела позвоночника рекомендуется пояснично-крестцовый корсет средней степени жесткости, при переломах грудного отдела позвоночника, кроме того, можно рекомендовать грудопоясничные ортезы (корсеты), которые обеспечивает выпрямление позвоночного столба и уменьшение выраженности кифоза за счет активации разгибателей спины [171]. Уровень убедительности рекомендации А (уровень достоверности доказательств 2)  Пациентам с патологическими переломами тел позвонков на фоне остеопороза категорически не рекомендуется <mark class=\"hit\">мануальная терапия<\/mark> [177]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Комментарии: мануальная терапия увеличивает риск новых переломов и ухудшения состояния, вплоть до появления неврологической симптоматики [177].  Для снижения риска развития хронического болевого синдрома у пациентов с переломами тел позвонков рекомендуется своевременное назначение препаратов базисной терапии остеопороза для коррекции нарушенного метаболизма костной ткани [178, 179, 180]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 4) Комментарии: Вероятность развития хронического болевого синдрома при переломах тел позвонков может быть снижена при своевременном назначении альфакальцидола + кальция карбоната с бифосфонатами или без них. Аналгезирующий эффект этой комбинации отмечался ранее [179, 180].  У пациентов с патологическими переломами тел позвонков для купирования боли и снижения риска повторных переломов рекомендуется #золедроновая кислота** 5 мг в год, которая имеет преимущество, в том числе и с учетом кратности введения, по сравнению с #алендроновой кислотой** и #ибандроновой кислотой [181]. Уровень убедительности рекомендации A (уровень достоверности доказательств 1) Комментарии: при низкоэнергетических переломах тел позвонков у пациентов с остеопорозом для профилактики новых переломов широко используются бифосфонаты [182, 34 181]. Сочетание низкого базового показателя Т-критерия и высокого уровня СTX-s в сыворотке крови расценивается как предиктор эффективности ибандроновой кислоты [182]. Однако наиболее эффективной в предотвращении новых переломов тел позвонков оказалась #золедроновая кислота**[181] по сравнению с #алендроновой кислотой** и #ибандроновой кислотой.  #Деносумаб** 60 мг 1 раз в 6 мес. рекомендуется при переломах тел позвонков на фоне остеопороза (независимо от пола) для профилактики повторных переломов, а также имеет преимущество у пациентов с нарушенной функцией почек и в том случае, если перелом произошел на фоне проводимой (длительно) терапии бифосфонатами [183, 186]. Уровень убедительности рекомендаций В (уровень достоверности доказательств 2) Комментарии: целесообразность использования моноклональных антител при наличии перелома тела позвонка для купирования боли и профилактики повторных переломов показана у пациентов, в том числе и с нарушенной функции почек, в рандомизированном плацебо-контролируемом исследовании [183,184]. В группе пациентов, получавших моноклональное антитело, новые переломы тел позвонков (184) отмечены в 2,3 % случаев, в группе плацебо — в 7,2 % (р&lt;0,001), т. е частота переломов на фоне лечения снизи","terms":[{"source":"marker","term_id":"marker:61f406947d13","canonical":"мануальная терапия","search_word":"мануальная терапия","host_word":"мануальная терапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:13b6b3e6c6242d5d::case:490de81057aafe1b","block_id":"block:13b6b3e6c6242d5d","case_id":"case:490de81057aafe1b","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"То же самое упоминание: мануальная терапия прямо запрещена/не рекомендуется при патологических переломах тел позвонков на фоне остеопороза.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"614_2","title":"Патологические переломы, осложняющие остеопороз","link":"https://cr.minzdrav.gov.ru/view-cr/614_2","metadata":{"Название клинической рекомендации":"Патологические переломы, осложняющие остеопороз","МКБ-10":"M80.0, M80.1, M80.2, M80.3, M80.4, M80.5, M80.8, M80.9","Возрастная группа":"Взрослые","Разработчик":"Российская ассоциация эндокринологов, Ассоциация травматологов-ортопедов России, Ассоциация ревмоортопедов","Дата размещения":"11.05.2022","Статус применения КР":"Применяется"}},"context_html":"огу [174]. Уровень убедительности рекомендации С (уровень достоверности доказательств 5) Комментарии: для уменьшения психологических проблем, связанных с хроническим болевым синдромом, используются антидепрессанты [174], которые сами могут влиять на метаболизм костной ткани. Взаимосвязь «остеопороз» и «антидепрессанты» требует дальнейшего изучения [174].  При переломах тел позвонков, осложняющих течение остеопороза, постельный режим рекомендуется на срок не более 3 дней с последующей вертикализацией в корсете и отдыхом в постели в течение дня (для купирования боли) через каждые 2–3 часа [169, 171, 175]. Уровень убедительности рекомендации C (уровень достоверности доказательств 5)  При переломах тел позвонков на фоне остеопороза корсеты (ортезы) рекомендуются на длительный период для ношения в течение всего дня с целью разгрузки позвоночника, так как корсеты повышают внутрибрюшное давление или создают выпрямляющую силу за счет трехточечной фиксации [175, 171]. Уровень убедительности рекомендации А (уровень достоверности доказательств 2) Комментарии: корсет при переломах тел позвонков на фоне остеопороза уменьшает болевой синдром не только благодаря ограничению подвижности фиксируемого отдела позвоночника и блокирования переразгибания кзади, но и за счет повышения внутрибрюшного давления, что разгружает тела позвонков и, тем самым, не только уменьшает боль, но и позволяет предотвратить риск новых переломов, способствует раннему восстановлению физической активности [175, 176, 171]. 33 Ношение корсета в течение всего дня не приводит к атрофии мышц при условии ежедневной ходьбы не менее 1,5–2 ч в день и ежедневной ЛФК без осевой нагрузки [170, 175].  При выборе корсета рекомендуется принимать во внимание уровень перелома, степень компрессии, выраженность болевого синдрома, общую физическую активность и эмоциональное состояние пациента [175, 171]. Уровень убедительности рекомендации А (уровень достоверности доказательств 2)  При переломах тел поясничного отдела позвоночника рекомендуется пояснично-крестцовый корсет средней степени жесткости, при переломах грудного отдела позвоночника, кроме того, можно рекомендовать грудопоясничные ортезы (корсеты), которые обеспечивает выпрямление позвоночного столба и уменьшение выраженности кифоза за счет активации разгибателей спины [171]. Уровень убедительности рекомендации А (уровень достоверности доказательств 2)  Пациентам с патологическими переломами тел позвонков на фоне остеопороза категорически не рекомендуется мануальная терапия [177]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 5) Комментарии: <mark class=\"hit\">мануальная терапия<\/mark> увеличивает риск новых переломов и ухудшения состояния, вплоть до появления неврологической симптоматики [177].  Для снижения риска развития хронического болевого синдрома у пациентов с переломами тел позвонков рекомендуется своевременное назначение препаратов базисной терапии остеопороза для коррекции нарушенного метаболизма костной ткани [178, 179, 180]. Уровень убедительности рекомендаций С (уровень достоверности доказательств 4) Комментарии: Вероятность развития хронического болевого синдрома при переломах тел позвонков может быть снижена при своевременном назначении альфакальцидола + кальция карбоната с бифосфонатами или без них. Аналгезирующий эффект этой комбинации отмечался ранее [179, 180].  У пациентов с патологическими переломами тел позвонков для купирования боли и снижения риска повторных переломов рекомендуется #золедроновая кислота** 5 мг в год, которая имеет преимущество, в том числе и с учетом кратности введения, по сравнению с #алендроновой кислотой** и #ибандроновой кислотой [181]. Уровень убедительности рекомендации A (уровень достоверности доказательств 1) Комментарии: при низкоэнергетических переломах тел позвонков у пациентов с остеопорозом для профилактики новых переломов широко используются бифосфонаты [182, 34 181]. Сочетание низкого базового показателя Т-критерия и высокого уровня СTX-s в сыворотке крови расценивается как предиктор эффективности ибандроновой кислоты [182]. Однако наиболее эффективной в предотвращении новых переломов тел позвонков оказалась #золедроновая кислота**[181] по сравнению с #алендроновой кислотой** и #ибандроновой кислотой.  #Деносумаб** 60 мг 1 раз в 6 мес. рекомендуется при переломах тел позвонков на фоне остеопороза (независимо от пола) для профилактики повторных переломов, а также имеет преимущество у пациентов с нарушенной функцией почек и в том случае, если перелом произошел на фоне проводимой (длительно) терапии бифосфонатами [183, 186]. Уровень убедительности рекомендаций В (уровень достоверности доказательств 2) Комментарии: целесообразность использования моноклональных антител при наличии перелома тела позвонка для купирования боли и профилактики повторных переломов показана у пациентов, в том числе и с нарушенной функции почек, в рандомизированном плацебо-контролируемом исследовании [183,184]. В группе пациентов, получавших моноклональное антитело, новые переломы тел позвонков (184) отмечены в 2,3 % случаев, в группе плацебо — в 7,2 % (р&lt;0,001), т. е частота переломов на фоне лечения снизи","terms":[{"source":"marker","term_id":"marker:61f406947d13","canonical":"мануальная терапия","search_word":"мануальная терапия","host_word":"мануальная терапия","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:c9545a6349309f07::case:8cd0db9bfc790c72","block_id":"block:c9545a6349309f07","case_id":"case:8cd0db9bfc790c72","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"Трифосаденин здесь прямо указан как препарат, к введению которого есть противопоказания: тяжелая бронхиальная астма и стенокардия. Для противопоказания отдельные УУР/УДД не даны.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"619_2","title":"Наджелудочковые тахикардии","link":"https://cr.minzdrav.gov.ru/view-cr/619_2","metadata":{"Название клинической рекомендации":"Наджелудочковые тахикардии","МКБ-10":"I47.1, I47.9","Возрастная группа":"Взрослые","Разработчик":"Ассоциация сердечно-сосудистых хирургов России, Общероссийская общественная организация «Российское кардиологическое общество», Всероссийское научное общество специалистов по клинической электрофизиологии, аритмологии и электростимуляции","Дата размещения":"12.11.2020","Статус применения КР":"Применяется"}},"context_html":"в анамнезе; - сведения о предшествующих способах восстановления СР и другом лечении (если пароксизм не первый); - продолжительность настоящего пароксизма. Алгоритм ургентного лечения НЖТ с узкими QRS-комплексами в отсутствии установленного диагноза представлен в Приложении Б-4. Наиболее известными являются такие вагусные приемы, как проба Вальсальвы, массаж каротидного синуса (только с одной стороны!), погружение лица в холодную воду и т. д., влияющие на AВ проводимость. Их лучше проводить в положении «лежа», с приподнятыми ногами. Продолжительность тестов обычно составляет 15–20 секунд [101, 102, 106]. Менее известными, но, возможно, более эффективными вагусными приемами являются надавливание пальцами на корень языка, надавливание кулаком на область солнечного сплетения. Малоэффективен рефлекс Ашнера (надавливание на глазные яблоки). Самый простой вагусный маневр – задержка дыхания на максимально глубоком вдохе. Преимуществами #трифосаденина, наряду с высокой эффективностью, является быстрое начало действия и короткий период полувыведения. Противопоказанием к введению #трифосаденина являются тяжелая бронхиальная астма и стенокардия. При введении препарата возможны кратковременные побочные действия: прилив крови к голове (лицу), бронхоспазм, АВ блокада, о которых пациента необходимо предупредить. Больным, получающим теофиллин, могут потребоваться более высокие дозы препарата. Дипиридамол потенцирует действие #трифосаденина. Карбамазепин** может усугублять вызываемую им АВ блокаду. Препарат способен провоцировать ФП, как правило, кратковременную, но она может оказаться жизнеопасной при синдроме предвозбуждения желудочков. 3.1.2. Неотложная терапия при тахикардиях неясного генеза с широкими (120 мс) QRS-комплексами При тахикардиях с широкими QRS-комплексами не всегда представляется возможным быстро идентифицировать их как наджелудочковые или желудочковые. Характер неотложной терапии при таких тахикардиях должен зависеть от их гемодинамической значимости. Алгоритм ургентного лечения НЖТ с широкими QRS-комплексами в отсутствии установленного диагноза представлен в Приложении Б-4. Гемодинамически нестабильным пациентам рекомендуется синхронизированная ЭИТ [97–99, 111]. ЕОК I B (УДД 4 УУР С) У гемодинамически стабильных пациентов в начале лечения рекомендуется проведение вагусных приемов [101, 102, 106]. ЕОК I B (УДД 1 УУР С) При неэффективности вагусных приемов и отсутствии признаков предвозбуждения желудочков на ЭКГ покоя рекомендуется внутривенное введение #трифосаденина [112, 113]. ЕОК IIa C (УДД 4 УУР C) При неэффективности вагусных приемов и #т<mark class=\"hit\">рифосаденина<\/mark> рекомендуется внутривенное введение #прокаинамида** [114]. ЕОК IIa B (УДД 2 УУР A) При неэффективности вагусных приемов и #трифосаденина рекомендуется внутривенное введение амиодарона** [114]. ЕОК IIb B (УДД 2 УУР A) При неэффективности ААТ для восстановления СР или контроля ЧСС рекомендуется использование синхронизированной ЭИТ [97–99, 111]. ЕОК I B (УДД 4 УУР С) #верапамил** не рекомендуется для ургентного лечения пациентов с тахикардиями с широкими QRS-комплексами или неизвестной этиологии [116–118]. ЕОК III B (УДД 4 УУР С) 3.1.3. Неотложная терапия при фокусной предсердной тахикардии Пациентам с нестабильной гемодинамикой рекомендуется синхронизированная ЭИТ [97–99]. ЕОК I B (УДД 4 УУР С) При стабильной гемодинамике рекомендуется внутривенное введение 10–30 мг #трифосаденина болюсом [82–84]. ЕОК IIa B (УДД 1 УУР В) При неэффективности #трифосаденина рекомендуется внутривенное введение бетаадреноблокаторов (#эсмолол или метопролол**) в отсутствие декомпенсированной ХСН [107109, 119–120]. ЕОК IIa C (УДД 4 УУР С) При неэффективности #трифосаденина рекомендуется внутривенное введение недигидропиридиновых блокаторов кальциевых каналов (#верапамил**) в отсутствие гипотензии или ХСН со сниженной фракцией выброса (ФВ) [82, 84]. ЕОК IIa C (УДД 4 УУР С) При отсутствии успеха предшествующего лечения рекомендуется внутривенное введение пропафенона** [121, 122]. ЕОК IIb C (УДД 5 УУР А) При отсутствии успеха предшествующего лечения рекомендуется внутривенное введение амиодарона** [123]. ЕОК IIb C (УДД 5 УУР C) При неэффективности ААТ для восстановления СР или контроля ЧСС рекомендуется использование синхронизированной ЭИТ [98, 99]. ЕОК I B (УДД 4 УУР С) Комментарии: Для восстановления СР или контроля ЧСС используются бетаадреноблокаторы или блокаторы кальциевых каналов. #Трифосаденин способен купировать ПТ с механизмом задержанной постдеполяризации, но часто тахикардия продолжается на фоне развивающейся АВ блокады. ААП IA, IC и III классов могут быть эффективны, увеличивая рефрактерность и подавляя автоматизм. Амиодарон** может быть использован для восстановления СР или контроля ЧСС, но замедление ЧСС нередко недостаточно у пациентов с выраженной ХСН. При нестабильной гемодинамике может быть выполнена ЭИТ, однако тахикардия часто рецидивирует. Алгоритм ургентного лечения фокусных ПТ представлен в Приложении Б-5. Внутривенное введение пропафенона** противопоказано пациентам с ишемической болезнью и другими органическими заболеваниями сердца. Он также увеличивает пр","terms":[{"source":"blacklist","term_id":"blacklist:480649743452","canonical":"Трифосаденин","search_word":"Трифосаденин","host_word":"трифосаденина","inside_word":true,"mediq": e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:a8add99505bb8a3d::case:977182fb24d7080e","block_id":"block:a8add99505bb8a3d","case_id":"case:977182fb24d7080e","label":"contraindication","model":{"recommendation_strength":"A","evidence_level":"1","reason":"В тексте прямо сказано: «не рекомендован рыбий жир ... для профилактики ПЭ», то есть для данного объекта это запрет/не рекомендуется.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"637_2","title":"Преэклампсия. Эклампсия. Отеки, протеинурия и гипертензивные расстройства во время беременности, в родах и послеродовом периоде.","link":"https://cr.minzdrav.gov.ru/view-cr/637_2","metadata":{"Название клинической рекомендации":"Преэклампсия. Эклампсия. Отеки, протеинурия и гипертензивные расстройства во время беременности, в родах и послеродовом периоде.","МКБ-10":"O10, O10.0, O10.1, O10.2, O10.3, O10.4, O10.9, O11, O12, O12.0, O12.1, O12.2, O13, O14, O14.0, O14.1, O14.2, O14.9, O15, O15.0, O15.2, O15.9, O16","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов","Дата размещения":"05.09.2024","Статус применения КР":"Применяется"}},"context_html":"аболевания.  Беременной пациентке группы высокого риска ПЭ рекомендовано назначить пероральный прием #ацетилсалициловой кислоты** с 12 недель беременности до 36 недель беременности по 150 мг/день [197, 198]. Уровень убедительности рекомендаций B (уровень достоверности доказательств - 2). Комментарий: Имеются надежные доказательства эффективности приема #ацетилсалициловой кислоты** у женщин высокого риска развития ПЭ и ассоциированных плацентарных расстройств, в основе которых лежит патологическая плацентация. Анализ приоритетных публикаций убедительно продемонстрировал преимущества вечернего приема (перед сном) низких доз #ацетилсалициловой кислоты** (150 мг), начатого до 16 недель и продолженного до 36 недель беременности с целью снижения риска тяжелой и ранней ПЭ, выявленной на основании результатов расширенного комбинированного скрининга 1-го триместра беременности[197, 198]. Вместе с тем, согласно результатам многоцентрового открытого рандомизированного (фаза 3) исследования, возможна отмена ацетилсалициловой кислоты беременным с высоким риском ПЭ по данным расширенного комбинированного скрининга I триместра, если при исследовании в 24-28 нед соотношение sFlt-1/PlGF не превышало 38 [218].  Беременной пациентке группы высокого риска ПЭ не рекомендованы препараты группы G03DA производные прегн-4-ена для профилактики ПЭ [61]. 44 Уровень убедительности рекомендаций С (уровень достоверности доказательств - 5).  Беременной пациентке группы высокого риска ПЭ не рекомендован магния сульфат** для профилактики ПЭ [61]. Уровень убедительности рекомендаций C (уровень достоверности доказательств - 5) м рт. ст. назначена двухтрехкомпонентная антигипертензивная терапия Да/Нет 7. Проведена госпитализация беременной пациентки при артериальном давлении ≥ 160/110 мм рт. ст. Да/Нет 8. При тяжелой преэклампсии и эклампсии выполнено внутривенное введение магния сульфата** как препарата первой линии для профилактики и лечения судорог Да/Нет 9. Проведена профилактика респираторного дистресс-синдрома плода перед родоразрешением в сроке с 24 до 336 недель беременности (за исключением случаев экстренного родор","terms":[{"source":"marker","term_id":"marker:230c5158dbb2","canonical":"биологически активные добавки","search_word":"биологически активные добавки","host_word":"биологически активные добавки","inside_word":false,"mediq":{"name":"","kind":[],"type":"","quality":"","atx":"","atx_group":"","mnn":"","description":"","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:fa6adf8792a36801::case:b0909a18c6dfb019","block_id":"block:fa6adf8792a36801","case_id":"case:b0909a18c6dfb019","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте прямо сказано: «Нет никакой доказательной базы в отношении гемостатического эффекта у ... менадиона натрия бисульфита», то есть препарат не рекомендуется для этой цели.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"642_2","title":"Внематочная (эктопическая) беременность","link":"https://cr.minzdrav.gov.ru/view-cr/642_2","metadata":{"Название клинической рекомендации":"Внематочная (эктопическая) беременность","МКБ-10":"O00, O08","Возрастная группа":"Взрослые","Разработчик":"Российское общество акушеров-гинекологов, Ассоциация акушерских анестезиологов-реаниматологов","Дата размещения":"28.11.2024","Статус применения КР":"Применяется"}},"context_html":"реднагрузки при тяжелом кровотечении [78]: вместо них следует рассмотреть динамическую оценку ответа на введение жидкости и неинвазивное измерение сердечного выброса [94]. При кровопотере более 30-40% ОЦК потребуется коррекция гипокальциемии [54]. Применение компонентов крови и принцип «контроля за гемостазом» Компоненты крови используются в соответствии с Приказом № N 797 &quot;Об утверждении Правил заготовки, хранения, транспортировки и клинического использования донорской крови и ее компонентов и о признании утратившими силу некоторых актов Правительства Российской Федерации&quot; от 22 июня 2019. При остановленном кровотечении гемотрансфузию проводят при уровне гемоглобина менее 70 г/л, но показания определяются индивидуально [95], [96], [97], [98]. Нет показаний для гемотрансфузии при гемоглобине более 100 г/л. В целом показания к переливанию эритроцитов складываются из характера основного заболевания, симптомов низкого транспорта кислорода и лабораторных параметров. Оптимальный вариант коррекции анемии: интраоперационная аппаратная реинфузия крови. Применение аппаратной реинфузии крови при операции снижается объем послеоперационной трансфузии и уменьшает время госпитализации [95], [98], [99], [100]. Принцип «контроль за коагуляцией» при кровопотере. Консервативный гемостаз при кровопотере должен включать (см.Приложение А3.6): 1. Антифибринолитики (по АТХ – Антифибринолитические средства) (транексамовая кислота**). 2. Компоненты крови (по АТХ – Кровь и препараты крови): свежезамороженная плазма, криопреципитат, тромбоцитарная масса и факторы свертывания крови (концентраты факторов). Особенности применения компонентов крови (по АТХ – Препараты крови) указаны в табл. 6, 7 [77], [82], [83], [84], [85], [86], [87], [95], [96], [98], [101]. К преимуществам факторов и концентратов факторов свертывания относятся [95], [96], [102], [103], [104]: — Возможность немедленного введения (опережение эффекта СЗП на 30-40 мин) — Для #эптакога альфа (активированного)** – более локальное действие в зоне повреждения (Доза подбирается индивидуально, рекомендуемая начальная доза составляет 90 мкг/кг) [38], [105], [106]. — Иммунологическая и инфекционная безопасность — Уменьшается количество препаратов заместительной терапии (СЗП, фактор свертывания крови VIII**, тромбоцитарная масса, эритроциты). — Снижение частоты посттрансфузионного повреждения легких (TRALI) — Вводятся антитромботические средства Нет никакой доказательной базы в отношении гемостатического эффекта у этамзилата**, <mark class=\"hit\">менадиона натрия бисульфит<\/mark>а** и кальция хлорида. Анестезиологическое обеспечение Как метод выбора при массивной кровопотере и геморрагическом шоке проводится общая анестезия с ИВЛ [79], [81], [80]. После окончания операции продленная ИВЛ показана: — При нестабильной гемодинамике с тенденцией к артериальной гипотонии (АД сист. меньше 90 мм рт. ст., необходимость введения вазопрессоров (по АТХ - Адренергические и дофаминергические средства)) – недостаточным восполнением ОЦК. — Продолжающемся кровотечении. — При уровне гемоглобина менее 70 г/л и необходимости продолжения гемотрансфузии. — Сатурации смешанной венозной крови менее 70%. — Сохраняющейся коагулопатии (МНО и АПТВ более чем в 1,5 раза больше нормы, фибриноген менее 1,0 г/л, количество тромбоцитов менее 50000 в мкл) и необходимости проведения заместительной терапии. Продолжительность ИВЛ зависит от темпов достижения критериев положительного эффекта при массивной кровопотере и геморрагическом шоке. Цели лечения и постгеморрагический период При эффективной остановке кровотечения и интенсивной терапии критерии положительного эффекта при массивной кровопотере и геморрагическом шоке достигаются в течение 3-4 ч: — Отсутствует геморрагический синдром любой локализации, характера и интенсивности. — АД систолическое более 90 мм рт. ст. без применения вазопрессоров (по АТХ Адренергические и дофаминергические средства), среднее АД более 65 мм рт. ст. — Уровень гемоглобина более 70 г/л. — Отсутствуют клинические и лабораторные признаки коагулопатии. — Темп диуреза более 0,5 мл/кг/ч. — Сатурация смешанной венозной крови более 70%. — Восстанавливается сознание и адекватное спонтанное дыхание. Если цели лечения кровопотери не достигаются в ближайшие 3-4 ч, сохраняется или вновь нарастает артериальная гипотония, анемия, олигурия, то, в первую очередь, необходимо исключить продолжающееся кровотечение: повторный осмотр, УЗИ брюшной полости (комплексное), органов малого таза комплексное (трансвагинальное и трансабдоминальное). В постгеморрагическом периоде настоятельно следует проводить следующих диагностических мероприятий в целях своевременной коррекции возможных осложнений [79], [81], [80]: — Клинический контроль кровотечения (артериальная гипотония, бледность, олигурия, нарушения микроциркуляции, дренажи и места вколов). — Лабораторный контроль – общий (клинический) анализ крови (гемоглобин, тромбоциты), коагулограмма (ориентировочное исследование системы гемостаза) (фибриноген, МНО, АПТВ), тромбоэластография/тромбоэластометрия. При останов","terms":[{"source":"mediq","term_id":"mediq:d053fdac9d85","canonical":"Менадиона натрия бисульфит","search_word":"Менадиона натрия бисульфит","host_word":"менадиона натрия бисульфит","inside_word":false,"mediq":{"name":"Менадиона натрия бисульфит","kind":["OTHER"],"type":"CHECKED","quality":"NOT_PROVED","atx":"B02BA02","atx_group":"B02BA Витамин K","mnn":"менадион","description":"","criterions":[{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=menadione&t=1","points":0},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/menadione","points":0},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=menadione&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":10}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:6c5464e532d991cf::case:f8778338558c8e2b","block_id":"block:6c5464e532d991cf","case_id":"case:f8778338558c8e2b","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В контексте сказано: «Применение гестагенов в лютеиновую фазу цикла малоэффективно ... и не должно использоваться», то есть лютеиновая фаза указана как неподходящий способ применения, а не как рекомендуемое лечение.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"645_2","title":"Аномальные маточные кровотечения","link":"https://cr.minzdrav.gov.ru/view-cr/645_2","metadata":{"Название клинической рекомендации":"Аномальные маточные кровотечения","МКБ-10":"N92, N93, N95","Возрастная группа":"Взрослые, дети","Разработчик":"Российское общество акушеров-гинекологов","Дата размещения":"24.09.2024","Статус применения КР":"Применяется"}},"context_html":"Комментарии: НПВП снижают уровень простагландинов путем ингибирования циклооксигеназы, что способствует сужению сосудов. Снижение кровопотери на НПВП составляет 30-40%. Лечение начинают с 1 дня менструации или за несколько дней до, продолжают до остановки кровотечения согласно инструкции по применению, при отсутствии противопоказаний. Рекомендуется использовать терапию препаратами железа у пациенток с АМК и железодефицитной анемией или латентным дефицитом железа, согласно клиническим рекомендациям по анемии [7], [8], [13], [14], [30]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Рекомендуется назначение левоноргестрела в форме внутриматочной терапевтической системы 52 мг ((ВМС-ЛНГ) – по АТХ – Пластиковые спирали с гестагенами) для снижения величины менструальной кровопотери у взрослых пациенток с ОМК, не заинтересованных в беременности [8], [13], [29], [31]. Для детей: Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Для взрослых: Уровень убедительности рекомендаций А (уровень достоверности доказательств – 1) Комментарии: Левоноргестрел в форме внутриматочной терапевтической системы ((ВМСЛНГ) – по АТХ – Пластиковые гестагенсодержащие ВМС) – наиболее эффективное лекарственное средство для уменьшения менструальной кровопотери, эффективность которого достигает 90% и может применяться в течение длительного времени [8], [13], [29]. Рекомендуется назначение комбинированных гормональных контрацептивов (по АТХ – Гестагены и эстрогены, фиксированные комбинации) для снижения величины менструальной кровопотери у взрослых пациенток с ОМК, нуждающихся в контрацепции [32]. Уровень убедительности рекомендаций B (уровень достоверности доказательств – 2) Комментарии: Монофазные комбинированные гормональные контрацептивы (по АТХ– гестагены и эстрогены, фиксированные комбинации) снижают объем менструальной кровопотери на 40-50%, тогда как комбинированные оральные контрацептивы (КОК) – по АТХ – гестагены и эстрогены, фиксированные комбинации, в состав которых входит эстрадиола валерат и диеногест с динамическим режимом дозирования – до 88% [33]. Рекомендуется назначение гестагенов перорально в пролонгированном циклическом режиме для снижения величины менструальной кровопотери у пациенток с ОМК [34]. Уровень убедительности рекомендаций С (уровень достоверности доказательств – 5) Комментарии: Эффективность 21-дневной схемы приема гестагенов (по АТХ - гестагены) сопоставимо с приемом КОК. Применение гестагенов в л<mark class=\"hit\">ютеино<\/mark>вую фазу цикла малоэффективно для снижения объема менструальной кровопотери и не должно использоваться в качестве метода лечения ОМК. Рекомендуется у взрослых пациенток проводить гормональный гемостаз как метод остановки острого АМК при отсутствии органической патологии органов малого таза [32]. Уровень убедительности рекомендаций B (уровень достоверности доказательств – 2) Комментарии: для проведения гормонального гемостаза в случаях острых АМК, а также для последующей противорецидивной терапии используют монофазные КОК - по АТХ – гестагены и эстрогены, фиксированные комбинации. КОК применяют в дозе не более 100 мкг/сут до остановки АМК по 1 таблетке с равными интервалами, с последующим снижением дозы до 1 таб/сут, продолжительность терапии 21 день от начала лечения. После остановки АМК рекомендовано продолжить прием КОК по контрацептивной схеме в течение последующих нескольких месяцев. Рекомендуется использование агонистов гонадотропин-рилизинг гормона (аГн-РГ – по АТХ – Аналоги гонадотропин-рилизинг гормона) у пациенток с АМК при неэффективности других медикаментозных препаратов и/или при наличии сочетанной патологии (миома матки, эндометриоз и др.) [34]. Уровень убедительности рекомендаций C (уровень достоверности доказательств – 5) Комментарии: аГн-РГ эффективно снижают менструальную кровопотерю, обратимо блокируют стероидогенез и вызывают атрофию эндометрия. Чаще используют при сочетанной патологии (миома матки, эндометриоз, гиперплазия эндометрия и др.). На фоне лечения уменьшается дисменорея и тазовая боль, связанные с эндометриозом. Пациенткам, получающим лечение аГн-РГ более 6 месяцев, должна быть назначена возвратная (add-back) терапия препаратами для непрерывного режима менопаузальной гормонотерапии (МГТ), если она не была начата ранее. При наличии АМК и органической патологии (миома матки, эндометриоз, полип эндометрия, гиперплазия эндометрия и др.) см. соответствующие клинические рекомендации. 3.2 Хирургическое лечение Рекомендуется проведение хирургического лечения у взрослых пациенток с АМК при неэффективности медикаментозной терапии, противопоказаниях к ней [14], [35]. Уровень убедительности рекомендаций А (уровень достоверности доказательств – 1) Комментарии: Выбор объема и доступа хирургического лечения зависит от этиологического фактора АМК, возраста, репродуктивных планов, сопутствующей экстрагенитальной патологии. Хирургическое лечение проводится согласно протоколу соответствующих клинических рекомендаций. Следует рассмотреть возможн","terms":[{"source":"mediq","term_id":"mediq:0f94e485f21e","canonical":"Лютеин","search_word":"Лютеин","host_word":"лютеиновую","inside_word":true,"mediq":{"name":"Лютеин","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"","atx_group":"","mnn":"","description":"Данное средство является биологически активной добавкой (БАД). БАДы [«не могут использоваться для лечения каких-либо заболеваний, так как не являются лекарственными средствами»](https://www.rospotrebnadzor.ru/about/info/news/news_details.php?ELEMENT_ID=11900).\n\nЭто связано с различными требованиями к государственной регистрации, т.к. [для БАД](http://www.consultant.ru/document/cons_doc_LAW_99273/19d606d6df827c2f33c31529247590d62c8be694) они существенно ниже, чем [для лекарственных препаратов](http://www.consultant.ru/document/cons_doc_LAW_99350/6d9c982585a1928071e3b1c9897ab4d2ec97e182). Поэтому принимать БАД как лекарство или вместо лекарства недопустимо, даже если они имеют в составе одно и то же действующее вещество. \n\nНельзя отрицать, что БАДы оказывают влияние на организм, тем не менее, мы не оцениваем наличие доказанной эффективности добавок, т.к. данные средства не являются лекарствами. Более того, лекарственные ингредиенты в пищевых добавках [«могут вызвать серьезные неблагоприятные последствия для здоровья из-за случайного неправильного использования, чрезмерного использования или взаимодействия с другими лекарствами, основными состояниями здоровья или другими фармацевтическими препаратами в составе добавки»](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2706496). Прием биодобавок [приводит в отделения неотложной помощи 23 тысячи американцев в год, еще 2 000 оказывается необходима госпитализация.](https://www.nejm.org/doi/full/10.1056/NEJMsa1504267)\n\nРоспотребнадзор [планирует запретить БАДы](https://iz.ru/865548/anna-ivushkina/dobavki-ne-nado-rospotrebnadzor-prizyvaet-zapretit-pokhozhie-na-lekarstva-bady), наименования которых аналогичны названиям лекарств или очень схожи с ними.","criterions":[]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:94b78e122089342a::case:dce66359c2ad8d9b","block_id":"block:94b78e122089342a","case_id":"case:dce66359c2ad8d9b","label":"contraindication","model":{"recommendation_strength":null,"evidence_level":null,"reason":"В тексте для пациента прямо указано: «Категорически нельзя пользоваться горчичниками», то есть highlighted term сам является запрещённым методом.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"655_2","title":"Хронический бронхит","link":"https://cr.minzdrav.gov.ru/view-cr/655_2","metadata":{"Название клинической рекомендации":"Хронический бронхит","МКБ-10":"J40, J41, J42","Возрастная группа":"Взрослые","Разработчик":"Российское респираторное общество","Дата размещения":"28.12.2024","Статус применения КР":"Применяется"}},"context_html":"ны сердечно-сосудистой системы (тахикардию, аритмию, повышение артериального давления), а также появление таких симптомов, как возбуждение или тремор. 3. Хронический кашель при хроническом бронхите. Рекомендации АССР (Атепсап Со11е§е оГ СЬе$1 РЬу81С1ап8) по клинической практике, основанные на доказательствах Название на русском языке: Хронический каш ель при хроническом бронхите • Оригинальное название: С Ьготс сои^Ь йие 4о сНгошс ЬгопсЬШз • И сто чн и к (п у б л и к ац и я с вал и д ац и ей ): 48 Вгашап 8.5. СЬгошс сои§Ь бие 1о сНгошс ЬгопсЬШз. АССР еу1с1епсе-Ьа$ес1 сНшса1 ргасбсе дшбеПпез. СЬез12006; 129(8ирр1 1): 1048-1155. Тип (подчеркнуть): • шкала оценки • индекс • вопросник • другое(уточнить) • Назначение: оценка респираторных симптомов • Содержание (шаблон): Вопросы Ответы «Вы кашляете, когда у вас нет простуды?» Да «Бывают ли месяцы в течение года, когда вы кашляете большинство дней? » Да «Вы кашляете в течение большинства дней на протяжении 3 месяцев в году?» Да «Сколько лет у вас длится кашель?» ^2 года Положительные ответы на все вопросы свидетельствует о ХБ. Приложение Б. Алгоритмы действий врача Приложение Б1. Схема диагностики хронического бронхита 49 Приложение. Схема диагностики хронического бронхита: Сбор ана бы пациент ощущал местное облегчение. Идеальная температура воды для охлаждения 15°C. Цель – охладить ожоговую рану, а не пациента. Необходимо уделять особое внимание риску гипотермии. Поэтому при обширных ожогах охлаждение не проводится. Неотложная помощь пострадавшему с электротравмой - быстрое прекращение действия электрического тока. После того, как была обеспечена безопасность места происшествия, в случае отсутствия у пострадавшего признаков жизни лица, оказывающие догоспитальную помощь, должны немедленно начать проведение сердечно-легочной реанимации. При химических поражениях кожи необходимо осторожно удалить одежду и порошковые химические вещества с поверхности тела. Чтобы оказывающий помощь сам не получил ожог возможно применение средств защиты (перчатки, защитная одежда, противогаз и т.д.). Нельзя тереть пораженный участок кожи салфетками марлевыми медицинскими стерильными, смоченными водой. Все химические ожоги следует промыть большим количеством проточной холодной воды не менее 10-15 минут, а если помощь начата с опозданием — не менее 1 часа. Исключением являются ожоги концентрированной серной кислотой и негашеной известью, т.к. при попадании воды происходит экзотермическая реакция, которая может привести к дополнительному термическому повреждению. Серную кислоту, перед промыванием, желательно просушить сухой тряпкой, а при ожогах известью сначала сухим путём удаляют ее остатки, а затем уже промывают кожу проточной водой или обрабатывают любым растительным маслом. Можно принять душ. Антидоты и нейтрализующие жидкости при химических ожогах не применяют! Пострадавшему с ожогом следует дать по таблетке нестероидного противовоспалительного препарата и антигистаминного препарата для системного применения, а при отсутствии рвоты, особенно при обширных ожогах, напоить. В 169 качестве «противошокой терапии» до приезда скорой помощи лучше всего давать пить минеральную воду без газа или воду с растворенной в ней содой и солью (на 1 л воды – 1 ч.л. соли и 0,5 ч.л. соды) в количестве 1-1,5 л в час. На этапе оказания медицинской помощи в бытовых и полевых условиях на период транспортировки пострадавших в лечебное учреждение, т.е. до момента оказания первой врачебной или специализированной помощи накладывается повязка первой медицинской помощи без каких-либо лекарственных веществ. Эта повязка не должна содержать жиры, белки, масла и красители (например, раствор Б<mark class=\"hit\">риллиантовый зеленый)<\/mark>, нельзя также обрабатывать раны присыпками, т.к. впоследствии они могут затруднить распознавание глубины поражения и туалет ран. Применение аэрозолей (например, Декспантенол), мазей, кремов и бальзамов в качестве первой помощи не рекомендуется. Не нужно также использовать средства народной медицины, в том числе лечить ожоги зубной пастой или мочой! При наличии ограниченных ожогов могут быть использованы: индивидуальный перевязочный пакет, салфетки марлевые медицинские стерильные или пленки. Ожоги кистей и стоп могут быть помещены в чистый полиэтиленовый пакет так, чтобы не ограничивать их подвижность. Этот «перевязочный» материал мягкий и герметичный, выполняет роль защитного барьера, кроме того он прозрачный, что позволяет осматривать место ожога, а также выполнять последующие перевязки практически безболезненно. При обширных ожогах подойдут стерильные или чистые простыни (предпочтительно хлопчатобумажные одноразовые простыни), которые используются в качестве контурной (силуэтной) повязки и накладываются без бинтования, занимающего слишком много времени, которое лучше потратить на противошоковую терапию и скорейшую эвакуацию в стационар. Повязки первой помощи накладываются без раздевания пострадавшего, особенно – в холодное время года, на одежду и обувь, если они не горят и не тлеют. Следует избегать использования влажных перевязочных материалов, так как по дороге в стационар потеря тепла телом может быть значительной. Наоборот, необходимо общее согревание пострадавшего. При химических ожогах следует использовать только сухие повязки без лекарственных препаратов, т.к. они могут усилить поражающее действие химического агента. 170 При возможности быстрой доставки пострадавших с ожогами на этап оказания первой врачебной и специализированной помощи необоснованно использование раневых покрытий, которые продаются в аптеке. В тоже время при отсроченной врачебной помощи (например, в походе, в случаях катастроф и массовых поражений) в качестве повязки первой медицинской помощи могут использоваться готовые раневые повязки, которые должны быть включены в аптечки первой медицинской помощи. После ожога нужно срочно вызвать скорую медицинскую помощь или при отсутствии такой возможности — обратится в ближайшую больницу, в случае, если: - Площадь ожога составляет больше 5% поверхности тела (1% поверхности тела примерно равен площади ладони пострадавшего). - Имеется подозрение на глубокий ожог III степени. Обожжены глаза, лицо, уши, кисти, стопы, область крупных суставо","terms":[{"source":"mediq","term_id":"mediq:b69d9015933a","canonical":"Бриллиантовый зеленый","search_word":"Бриллиантовый зеленый","host_word":"Бриллиантовый зеленый","inside_word":false,"mediq":{"name":"Бриллиантовый зеленый","kind":["OTHER"],"type":"CHECKED","quality":"NOT_PROVED","atx":"D08AX","atx_group":"D08AX Антисептики и дезинфицирующие препараты другие","mnn":"бриллиантовый зеленый","description":"","criterions":[{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/brilliant%20green","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=brilliant+green&t=1","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=brilliant+green&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":0}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:64e2ec18b2553f81::case:871a4e25449df60f","block_id":"block:64e2ec18b2553f81","case_id":"case:871a4e25449df60f","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «Левокарнитина» — та же запрещаемая терапия; контекст прямо говорит об избегании назначения левокарнитина.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"694_2","title":"Нарушения митохондриального β-окисления жирных кислот","link":"https://cr.minzdrav.gov.ru/view-cr/694_2","metadata":{"Название клинической рекомендации":"Нарушения митохондриального β-окисления жирных кислот","МКБ-10":"E71.3","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков, Общероссийская общественная организация содействия развитию неонатологии «Российское общество неонатологов»","Дата размещения":"21.08.2024","Статус применения КР":"Применяется"}},"context_html":"более позднем возрасте, обогащение рациона MCT (особенно перед физической нагрузкой) может играть важную роль, а необходимость в ограничении LCT может отсутствовать. Рекомендуется при наличии симптомов у пациентов с дефицитом VLCAD диета с пониженным содержанием LCFA и добавление MCT жиров для предотвращения рабдомиолиза и метболической декомпенсации [61, 66]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: при наличии симптомов содержание общих жиров 25-30% от общей калорийности, из них 20-25% за счет МСТ и 5-10% за счет LCT (Приложение А15) [61]. Поскольку клинические симптомы при долгосрочном наблюдении у пациентов с дефицитом VLCAD представлены преимущественно эпизодической мышечной болью и рабдомиолизом, что указывает на недостаток мышечной энергии, рацион необходимо обогащать MCT, которые должны составлять 20% от общей калорийности (Таблица 3). Пациентам с мышечной слабостью и болью при физических нагрузках помогает повышение потребления MCT (или углеводов) непосредственно перед более интенсивной физической нагрузкой (напр., в дозировке 0,25–0,5 г MCT/кг). 3.2.8 Рекомендации по лечению пациентов с ГА2 Рекомендуется пациентам с установленным диагнозом ГА2 соблюдение диеты с низким содержанием жиров (20-25% энергии), низким содержанием белка для снижения избыточного потребления изолейцина, лейцина, лизина, триптофана и валина [103, 111]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Не рекомендуется пациентам с установленным диагнозом ГА2 назначение МСТ [104]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Рекомендуется во время кризов пациентам с установленным диагнозом ГА2 парентеральное введение декстрозы** для купирования гипогликемии и подавления липолизиса, натрия бензоат (биологически активная добавка) для купирования гипераммониемии [111]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: детальное описание приведено в 3.1.2 Рекомендации по лечению пациентов с FAOD в период метаболической декомпенсации 3.3 Рекомендации по применению отдельных лекарственных препаратов Кроме применения диетотерапии при нарушениях окисления жирных кислот также необходимо применение ряда лекарственных препаратов и витаминов, чтобы компенсировать дефицит незаменимых жирных кислот в организме, карнитина и жирорастворимых витаминов. 3.3.1 Рекомендации по применению отдельных лекарственных препаратов, содержащих левокарнитин Рекомендуется избегать назначения Лево<mark class=\"hit\">карнитин<\/mark>а в период криза при дефектах окисления длинноцепочечных жирных кислот, особенно в виде внутривенных инфузий для предотвращения развития рабдомиолиза, неврологических нарушений и аритмии [63, 142, 132]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: Левоакарнитин является основной терапией пациентов при первичной недостаточности карнитина. Также при низких значения карнитина в крови может использоваться при других формах FAOD с целью усиления связывания метаболитов жирных кислот и выведения их с мочой. Однако использование левокарнитина при FAOD является спорным, т.к. доказательства его эффективности при вторичном дефиците карнитина отсутствуют. При недостаточности TFP и LCHAD добавки с Левокарнитином могут индуцировать дальнейшую продукцию 3-гидроксиацилкарнитинов, способных вызывать необратимые невропатические симптомы и аритмию. Исследования на мышах с моделью дефицита VLCAD также показали, что нехватка карнитина вызывает его эндогенный биосинтез), который, однако, подавляется при экзогенном введении Левокарнитина. У многих пациентов с дефектами окисления жирных кислот, не получающих добавок Левокарнитина, концентрации свободного карнитина в плазме также варьируют от низких до нормальных, что позволяет говорить и об эндогенном биосинтезе карнитина у человека. Таким образом, добавки, содержащие Левокарнитин, должны назначаться с осторожностью, особенно, когда речь идет о недостаточности TFP и LCHAD. Существует консенсусное мнение, согласно которому следует отказаться, в частности, от внутривенного введения Левокарнитина при острых метаболических нарушениях, поскольку в таких ситуациях повышается продукция потенциально токсичных ацилкарнитинов, что приводило к внезапной смерти пациентов. 3.3.2 Рекомендации по применению незаменимых жирных кислот Пациенты с FAOD, находящиеся на низкожировой диете подвержены высокому риску дефицита жирорастворимых витаминов. Важно избегать дефицита незаменимых жирных кислот, и большая часть потребления длинноцепочечных жиров должна поступать из масел, богатых незаменимыми жирными кислотами. Для удовлетворения потребностей в незаменимых жирных кислотах может потребоваться добавление специальных масел, таких как ореховое или льняное масло (Приложение Г 13) [105]. Рекомендуется пациентам с недостаточностью МТР и LCHAD, назначать биологическую активную добавку в виде докозагексаеновой кислоты (DHA), играющей важную роль в формировании функций нервной и иммунной систем, а также зрит","terms":[{"source":"mediq","term_id":"mediq:be29dac60cfe","canonical":"Карнитин","search_word":"Карнитин","host_word":"Левокарнитина","inside_word":true,"mediq":{"name":"Карнитин","kind":["BIO_ACTIVE_SUPPLEMENTS"],"type":"BIO_ACTIVE_SUPPLEMENTS","quality":"NOT_PROVED","atx":"A16AA","atx_group":"A16AA Аминокислоты и их производные","mnn":"карнитин","description":"Карнитин — витаминоподобное соединение, которое является производным аминокислот лизина и метионина, содержится почти во всех клетках организма. L-карнитин (активная форма карнитина) – кофактор многих биохимических реакций в организме человека. Карнитин играет важную роль в производстве энергии, он также переносит токсичные соединения, вырабатываемые митохондриями, чтобы предотвратить их накопление. Организм вырабатывает достаточно карнитина, чтобы удовлетворить потребности большинства людей. По генетическим или медицинским причинам некоторые люди (например, недоношенные дети) не могут вырабатывать достаточное количество карнитина, поэтому для них он является необходимым питательным веществом.\n\nТем не менее, инструкции лекарственных препаратов, помимо недостатка карнитина, содержат показания не имеющие доказательной основы:\n\n\"Некоторые спортсмены принимают карнитин для улучшения результатов упражнений. Тем не менее, двадцать лет исследований не обнаружили убедительных доказательств того, что добавки карнитина могут улучшить физические упражнения или физическую работоспособность у здоровых людей.\"\n\n[Национальный Центр Исследования Здоровья (NIH)](https://ods.od.nih.gov/factsheets/Carnitine-HealthProfessional/)\n\n\"Учитывая ограниченное количество доказательств очень низкого качества, мы не смогли сделать какие-либо выводы о влиянии L-карнитина на когнитивную функцию или о безопасности его применения здоровыми людьми.\"\n\n[Кокрановский обзор](https://www.cochrane.org/ru/CD009374/DEMENTIA_l-karnitin-dlya-uluchsheniya-kognitivnoy-funkcii-u-lyudey-bez-kognitivnyh-narusheniy)\n\n\"...как заключил [метаанализ](https://onlinelibrary.wiley.com/doi/abs/10.1002/da.22236), вышедший в научном журнале Depression and Anxiety в 2014 году, клинические испытания [в качестве терапии депрессии] для этого состояния малочисленны, в их результатах могут быть искажения, а механизм того, как L-карнитин может влиять на депрессивные симптомы, неясен.\"\n\n[Indicator](https://indicator.ru/medicine/multivitaminy.htm)","criterions":[{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/carnitine","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=carnitine&t=1","points":22},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=carnitine&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":869}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:2f4a93dfeb8fd634::case:070460348505ad06","block_id":"block:2f4a93dfeb8fd634","case_id":"case:070460348505ad06","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Хост-слово «левокарнитина» относится к Левокарнитину; в контексте прямо сказано «рекомендуется избегать назначения Левокарнитина» при дефектах окисления длинноцепочечных ЖК.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"694_2","title":"Нарушения митохондриального β-окисления жирных кислот","link":"https://cr.minzdrav.gov.ru/view-cr/694_2","metadata":{"Название клинической рекомендации":"Нарушения митохондриального β-окисления жирных кислот","МКБ-10":"E71.3","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков, Общероссийская общественная организация содействия развит ирорастворимых витаминов. Важно избегать дефицита незаменимых жирных кислот, и большая часть потребления длинноцепочечных жиров должна поступать из масел, богатых незаменимыми жирными кислотами. Для удовлетворения потребностей в незаменимых жирных кислотах может потребоваться добавление специальных масел, таких как ореховое или льняное масло (Приложение Г 13) [105]. Рекомендуется пациентам с недостаточностью МТР и LCHAD, назначать биологическую активную добавку в виде докозагексаеновой кислоты (DHA), играющей важную роль в формировании функций нервной и иммунной систем, а также зрительного анализатора, в дозировке 60 -65 мг/день детям с весом тела &lt;20 кг и в дозировке 130мг в день – детям с весом тела &gt;20 кг для поддержания функций нервной и иммунной системы [105, 137, 157]. Уровень убедительности доказательств B (уровень достоверности рекомендации – 3). Комментарии: Линолевая кислота и α-линоленовая кислота являются предшественниками для эндогенного синтеза более длинных жирных кислот, таких как эйкозапентаеновая кислота (EPA) и докозагексаеновая кислота (DHA), которые имеют решающее значение для формирования функций нервной, иммунной систем и зрительного ан","terms":[{"source":"mediq","term_id":"mediq:e4fa5cbe6194","canonical":"Левокарнитин","search_word":"Левокарнитин","host_word":"левокарнитина","inside_word":true,"mediq":{"name":"Левокарнитин","kind":["OTHER"],"type":"MANUAL_CHECKED","quality":"NOT_PROVED","atx":"A16AA01","atx_group":"A16AA Аминокислоты и их производные","mnn":"левокарнитин","description":"Карнитин — витаминоподобное соединение, которое является производным аминокислот лизина и метионина, содержится почти во всех клетках организма. L-карнитин (активная форма карнитина) – кофактор многих биохимических реакций в организме человека. Карнитин играет важную роль в производстве энергии, он также переносит токсичные соединения, вырабатываемые митохондриями, чтобы предотвратить их накопление. Организм вырабатывает достаточно карнитина, чтобы удовлетворить потребности большинства людей. По генетическим или медицинским причинам некоторые люди (например, недоношенные дети) не могут вырабатывать достаточное количество карнитина, поэтому для них он является необходимым питательным веществом.\n \n Тем не менее, инструкции лекарственных препаратов, помимо недостатка карнитина, содержат показания не имеющие доказательной основы:\n \n \"Некоторые спортсмены принимают карнитин для улучшения результатов упражнений. Тем не менее, двадцать лет исследований не обнаружили убедительных доказательств того, что добавки карнитина могут улучшить физические упражнения или физическую работоспособность у здоровых людей.\"\n \n [Национальный Центр Исследования Здоровья (NIH)](https://ods.od.nih.gov/factsheets/Carnitine-HealthProfessional/)\n \n \"Учитывая ограниченное количество доказательств очень низкого качества, мы не смогли сделать какие-либо выводы о влиянии L-карнитина на когнитивную функцию или о безопасности его применения здоровыми людьми.\"\n \n [Кокрановский обзор](https://www.cochrane.org/ru/CD009374/DEMENTIA_l-karnitin-dlya-uluchsheniya-kognitivnoy-funkcii-u-lyudey-bez-kognitivnyh-narusheniy)\n \n \"...как заключил [метаанализ](https://onlinelibrary.wiley.com/doi/abs/10.1002/da.22236), вышедший в научном журнале Depression and Anxiety в 2014 году, клинические испытания [в качестве терапии депрессии] для этого состояния малочисленны, в их результатах могут быть искажения, а механизм того, как L-карнитин может влиять на депрессивные симптомы, неясен.\"\n \n [Indicator](https://indicator.ru/medicine/multivitaminy.htm)","criterions":[{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=levocarnitine&t=1","points":0},{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/levocarnitine","points":3},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WH ва, мы не смогли сделать какие-либо выводы о влиянии L-карнитина на когнитивную функцию или о безопасности его применения здоровыми людьми.\"\n\n[Кокрановский обзор](https://www.cochrane.org/ru/CD009374/DEMENTIA_l-karnitin-dlya-uluchsheniya-kognitivnoy-funkcii-u-lyudey-bez-kognitivnyh-narusheniy)\n\n\"...как заключил [метаанализ](https://onlinelibrary.wiley.com/doi/abs/10.1002/da.22236), вышедший в научном журнале Depression and Anxiety в 2014 году, клинические испытания [в качестве терапии депрессии] для этого состояния малочисленны, в их результатах могут быть искажения, а механизм того, как L-карнитин может влиять на депрессивные симптомы, неясен.\"\n\n[Indicator](https://indicator.ru/medicine/multivitaminy.htm)","criterions":[{"criterion":"RXLIST","url":"https://www.rxlist.com/search/rxl/carnitine","points":0},{"criterion":"WHO_ADULT_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.02","points":0},{"criterion":"COCHRANE","url":"https://www.cochranelibrary.com/advanced-search?q=carnitine&t=1","points":22},{"criterion":"WHO_KIDS_LIST","url":"https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.03","points":0},{"criterion":"PUBMED","url":"https://pubmed.ncbi.nlm.nih.gov/?term=carnitine&filter=pubt.meta-analysis&filter=pubt.randomizedcontrolledtrial","points":869}]},"blacklist":{"name":"","aliases":[],"description":""}}]},{"id":"block:163f55b40bbd52f7::case:f5513bec7f67ce1e","block_id":"block:163f55b40bbd52f7","case_id":"case:f5513bec7f67ce1e","label":"contraindication","model":{"recommendation_strength":"C","evidence_level":"5","reason":"Левокарнитин прямо упомянут в разделе: рекомендуется избегать назначения в период криза при дефектах окисления длинноцепочечных жирных кислот.","evidence_quote":null,"confidence":null},"clinical":{"document_id":"694_2","title":"Нарушения митохондриального β-окисления жирных кислот","link":"https://cr.minzdrav.gov.ru/view-cr/694_2","metadata":{"Название клинической рекомендации":"Нарушения митохондриального β-окисления жирных кислот","МКБ-10":"E71.3","Возрастная группа":"Взрослые, дети","Разработчик":"Союз педиатров России, Ассоциация медицинских генетиков, Общероссийская общественная организация содействия развитию неонатологии «Российское общество неонатологов»","Дата размещения":"21.08.2024","Статус применения КР":"Применяется"}},"context_html":"3.2.8 Рекомендации по лечению пациентов с ГА2 Рекомендуется пациентам с установленным диагнозом ГА2 соблюдение диеты с низким содержанием жиров (20-25% энергии), низким содержанием белка для снижения избыточного потребления изолейцина, лейцина, лизина, триптофана и валина [103, 111]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Не рекомендуется пациентам с установленным диагнозом ГА2 назначение МСТ [104]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Рекомендуется во время кризов пациентам с установленным диагнозом ГА2 парентеральное введение декстрозы** для купирования гипогликемии и подавления липолизиса, натрия бензоат (биологически активная добавка) для купирования гипераммониемии [111]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: детальное описание приведено в 3.1.2 Рекомендации по лечению пациентов с FAOD в период метаболической декомпенсации 3.3 Рекомендации по применению отдельных лекарственных препаратов Кроме применения диетотерапии при нарушениях окисления жирных кислот также необходимо применение ряда лекарственных препаратов и витаминов, чтобы компенсировать дефицит незаменимых жирных кислот в организме, карнитина и жирорастворимых витаминов. 3.3.1 Рекомендации по применению отдельных лекарственных препаратов, содержащих левокарнитин Рекомендуется избегать назначения Левокарнитина в период криза при дефектах окисления длинноцепочечных жирных кислот, особенно в виде внутривенных инфузий для предотвращения развития рабдомиолиза, неврологических нарушений и аритмии [63, 142, 132]. Уровень убедительности доказательств C (уровень достоверности рекомендации – 5). Комментарии: Левоакарнитин является основной терапией пациентов при первичной недостаточности карнитина. Также при низких значения карнитина в крови может использоваться при других формах FAOD с целью усиления связывания метаболитов жирных кислот и выведения их с мочой. Однако использование левокарнитина при FAOD является спорным, т.к. доказательства его эффективности при вторичном дефиците карнитина отсутствуют. При недостаточности TFP и LCHAD добавки с Левокарнитином могут индуцировать дальнейшую продукцию 3-гидроксиацилкарнитинов, способных вызывать необратимые невропатические симптомы и аритмию. Исследования на мышах с моделью дефицита VLCAD также показали, что нехватка карнитина вызывает его эндогенный биосинтез), который, однако, подавляется при экзогенном введении <mark class=\"hit\">Левокарнитин<\/mark>а. У многих пациентов с дефектами окисления жирных кислот, не получающих добавок Левокарнитина, концентрации свободного карнитина в плазме также варьируют от низких до нормальных, что позволяет говорить и об эндогенном биосинтезе карнитина у человека. Таким образом, добавки, содержащие Левокарнитин, должны назначаться с осторожностью, особенно, когда речь идет о недостаточности TFP и LCHAD. Существует консенсусное мнение, согласно которому следует отказаться, в частности, от внутривенного введения Левокарнитина при острых метаболических нарушениях, поскольку в таких ситуациях повышается продукция потенциально токсичных ацилкарнитинов, что приводило к внезапной смерти пациентов. 3.3.2 Рекомендации по применению незаменимых жирных кислот Пациенты с FAOD, находящиеся на низкожировой диете подвержены высокому риску дефицита жирорастворимых витаминов. Важно избегать дефицита незаменимых жирных кислот, и большая часть потребления длинноцепочечных жиров должна поступать из масел, богатых незаменимыми жирными кислотами. Для удовлетворения потребностей в незаменимых жирных кислотах может потребов
