[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Anal_Russia_Klinik"
version = "0.3.0"
description = "Max-recall Russian clinical recommendation audit pipeline with manual filtering and LLM classification."
requires-python = ">=3.11"
dependencies = [
  "aiohttp",
  "g4f",
  "PyMuPDF",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
anal-russia-klinik = "anal_russia_klinik.cli:main"
bot-for-anal-rec = "bot_for_anal_rec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
